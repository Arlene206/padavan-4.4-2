name: DHCP server DECLINE and RELEASE field validation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/udhcp-server-message-policy.yml"
      - "trunk/user/busybox/busybox-1.24.x/networking/udhcp/dhcpd.c"
      - "trunk/user/busybox/busybox-1.24.x/networking/udhcp/udhcp_server_message_policy.h"
      - "trunk/user/busybox/busybox-1.24.x/networking/udhcp/tests/udhcp_server_message_policy.c"
      - "scripts/check_udhcp_server_message_policy.py"
  pull_request:
    paths:
      - ".github/workflows/udhcp-server-message-policy.yml"
      - "trunk/user/busybox/busybox-1.24.x/networking/udhcp/dhcpd.c"
      - "trunk/user/busybox/busybox-1.24.x/networking/udhcp/udhcp_server_message_policy.h"
      - "trunk/user/busybox/busybox-1.24.x/networking/udhcp/tests/udhcp_server_message_policy.c"
      - "scripts/check_udhcp_server_message_policy.py"

permissions:
  contents: read

jobs:
  dhcpd-message-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run GNU89 ASan/UBSan DECLINE/RELEASE regression
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -fno-omit-frame-pointer \
            -Itrunk/user/busybox/busybox-1.24.x/networking/udhcp \
            trunk/user/busybox/busybox-1.24.x/networking/udhcp/tests/udhcp_server_message_policy.c \
            -o /tmp/udhcp_server_message_policy_test
          ASAN_OPTIONS=detect_leaks=1:abort_on_error=1 \
            /tmp/udhcp_server_message_policy_test
      - name: Verify DHCP server request-field integration
        run: python3 scripts/check_udhcp_server_message_policy.py

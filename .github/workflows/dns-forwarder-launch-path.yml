name: DNS Forwarder launch path stability regression

on:
  push:
    paths:
      - ".github/workflows/dns-forwarder-launch-path.yml"
      - "trunk/user/rc/src/services.c"
      - "trunk/user/rc/src/rc.c"
      - "trunk/user/rc/src/rc.h"
      - "trunk/user/rc/src/init.c"
      - "trunk/user/shared/src/shutils.c"
      - "trunk/user/shared/src/shutils.h"
      - "trunk/user/shared/Makefile"
      - "trunk/user/shared/scripts/process_lifecycle.sh"
      - "trunk/user/dns-forwarder/Makefile"
      - "trunk/user/dns-forwarder/dns-forwarder.sh"
      - "trunk/user/dns-forwarder/tests/dns_forwarder_lifecycle.sh"
      - "trunk/configs/boards/busybox.config"
      - "scripts/check_dns_forwarder_launch.py"
      - "trunk/user/dns-forwarder/dns-forwarder-1.2.1/hev-event-loop.c"
      - "trunk/user/dns-forwarder/dns-forwarder-1.2.1/hev-event-source.c"
      - "trunk/user/dns-forwarder/dns-forwarder-1.2.1/hev-event-source-timeout.c"
      - "trunk/user/dns-forwarder/dns-forwarder-1.2.1/hev-event-source-signal.c"
      - "trunk/user/dns-forwarder/tests/hev_event_loop_lifecycle.c"
      - "trunk/user/dns-forwarder/dns-forwarder-1.2.1/hev-dns-forwarder-policy.h"
      - "trunk/user/dns-forwarder/dns-forwarder-1.2.1/hev-dns-forwarder.c"
      - "trunk/user/dns-forwarder/dns-forwarder-1.2.1/hev-main.c"
      - "trunk/user/dns-forwarder/tests/hev_dns_forwarder_policy.c"
      - "trunk/user/dns-forwarder/tests/hev_dns_forwarder_init_failure.c"
      - "trunk/user/dns-forwarder/tests/hev_dns_forwarder_init_test_hooks.h"
  pull_request:
    paths:
      - ".github/workflows/dns-forwarder-launch-path.yml"
      - "trunk/user/rc/src/services.c"
      - "trunk/user/rc/src/rc.c"
      - "trunk/user/rc/src/rc.h"
      - "trunk/user/rc/src/init.c"
      - "trunk/user/shared/src/shutils.c"
      - "trunk/user/shared/src/shutils.h"
      - "trunk/user/shared/Makefile"
      - "trunk/user/shared/scripts/process_lifecycle.sh"
      - "trunk/user/dns-forwarder/Makefile"
      - "trunk/user/dns-forwarder/dns-forwarder.sh"
      - "trunk/user/dns-forwarder/tests/dns_forwarder_lifecycle.sh"
      - "trunk/configs/boards/busybox.config"
      - "scripts/check_dns_forwarder_launch.py"
      - "trunk/user/dns-forwarder/dns-forwarder-1.2.1/hev-event-loop.c"
      - "trunk/user/dns-forwarder/dns-forwarder-1.2.1/hev-event-source.c"
      - "trunk/user/dns-forwarder/dns-forwarder-1.2.1/hev-event-source-timeout.c"
      - "trunk/user/dns-forwarder/dns-forwarder-1.2.1/hev-event-source-signal.c"
      - "trunk/user/dns-forwarder/tests/hev_event_loop_lifecycle.c"
      - "trunk/user/dns-forwarder/dns-forwarder-1.2.1/hev-dns-forwarder-policy.h"
      - "trunk/user/dns-forwarder/dns-forwarder-1.2.1/hev-dns-forwarder.c"
      - "trunk/user/dns-forwarder/dns-forwarder-1.2.1/hev-main.c"
      - "trunk/user/dns-forwarder/tests/hev_dns_forwarder_policy.c"
      - "trunk/user/dns-forwarder/tests/hev_dns_forwarder_init_failure.c"
      - "trunk/user/dns-forwarder/tests/hev_dns_forwarder_init_test_hooks.h"

permissions:
  contents: read

jobs:
  dns-forwarder-launch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify DNS Forwarder launch path and service contracts
        run: python3 scripts/check_dns_forwarder_launch.py
      - name: Compile and run DNS Forwarder upstream-port regression
        run: |
          core=trunk/user/dns-forwarder/dns-forwarder-1.2.1
          tests=trunk/user/dns-forwarder/tests
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined -I "$core" "$tests/hev_dns_forwarder_policy.c" -o /tmp/dns-forwarder-policy
          /tmp/dns-forwarder-policy
      - name: Compile and run DNS Forwarder constructor rollback regression
        run: |
          core=trunk/user/dns-forwarder/dns-forwarder-1.2.1
          tests=trunk/user/dns-forwarder/tests
          cc -std=gnu99 -Wall -Wextra -Werror -Wno-unused-parameter -Wno-cast-function-type -fsanitize=address,undefined -fno-omit-frame-pointer -DHEV_DNS_FORWARDER_TESTING -I "$core" \
            "$tests/hev_dns_forwarder_init_failure.c" \
            "$core/hev-dns-forwarder.c" "$core/hev-event-source.c" \
            "$core/hev-event-source-timeout.c" "$core/hev-ring-buffer.c" \
            "$core/hev-dns-session.c" "$core/hev-event-source-fds.c" \
            "$core/hev-slist.c" "$core/hev-event-loop.c" \
            "$core/hev-event-source-signal.c" "$core/hev-memory-allocator.c" \
            -o /tmp/dns-forwarder-init-failure
          ASAN_OPTIONS=detect_leaks=1 /tmp/dns-forwarder-init-failure
      - name: Compile and run DNS Forwarder event-loop regression
        run: |
          core=trunk/user/dns-forwarder/dns-forwarder-1.2.1
          tests=trunk/user/dns-forwarder/tests
          cc -std=gnu89 -Wall -Wextra -Werror -Wno-unused-parameter -Wno-cast-function-type -fsanitize=address,undefined -I "$core" "$tests/hev_event_loop_lifecycle.c" "$core/hev-event-loop.c" "$core/hev-event-source.c" "$core/hev-event-source-fds.c" "$core/hev-slist.c" "$core/hev-memory-allocator.c" -o /tmp/dns-forwarder-event-loop
          /tmp/dns-forwarder-event-loop
      - name: Exercise DNS Forwarder lifecycle failure and lock gates
        run: sh trunk/user/dns-forwarder/tests/dns_forwarder_lifecycle.sh

name: BusyBox udhcpc event script status stability regression

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/udhcpc-script-status-stability.yml"
      - "scripts/check_udhcpc_script_status.py"
      - "trunk/user/busybox/busybox-1.24.x/networking/udhcp/dhcpc.c"
      - "trunk/user/busybox/busybox-1.24.x/networking/udhcp/udhcpc_script_policy.h"
      - "trunk/user/busybox/busybox-1.24.x/networking/udhcp/tests/udhcpc_script_policy.c"
      - "trunk/user/busybox/busybox-1.24.x/libbb/vfork_daemon_rexec.c"
      - "trunk/user/busybox/busybox-1.24.x/include/libbb.h"
  pull_request:
    paths:
      - ".github/workflows/udhcpc-script-status-stability.yml"
      - "scripts/check_udhcpc_script_status.py"
      - "trunk/user/busybox/busybox-1.24.x/networking/udhcp/dhcpc.c"
      - "trunk/user/busybox/busybox-1.24.x/networking/udhcp/udhcpc_script_policy.h"
      - "trunk/user/busybox/busybox-1.24.x/networking/udhcp/tests/udhcpc_script_policy.c"
      - "trunk/user/busybox/busybox-1.24.x/libbb/vfork_daemon_rexec.c"
      - "trunk/user/busybox/busybox-1.24.x/include/libbb.h"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  udhcpc-script-status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run GNU89 udhcpc script-failure retry policy regression
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer \
            -I trunk/user/busybox/busybox-1.24.x/networking/udhcp \
            trunk/user/busybox/busybox-1.24.x/networking/udhcp/tests/udhcpc_script_policy.c \
            -o /tmp/udhcpc-script-policy
          ASAN_OPTIONS=detect_leaks=1 /tmp/udhcpc-script-policy
      - name: Verify event-script result, lease deadline and workflow caller contracts
        run: python3 scripts/check_udhcpc_script_status.py

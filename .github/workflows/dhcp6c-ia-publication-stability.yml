name: DHCPv6 IA publication and delegated-prefix retry regression

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dhcp6c-ia-publication-stability.yml"
      - "scripts/check_dhcp6c_ia_publication.py"
      - "trunk/user/busybox/busybox-1.24.x/networking/udhcp/dhcp6c_ia.c"
      - "trunk/user/busybox/busybox-1.24.x/networking/udhcp/dhcp6c.c"
      - "trunk/user/busybox/busybox-1.24.x/networking/udhcp/dhcp6c_socket.c"
      - "trunk/user/busybox/busybox-1.24.x/networking/udhcp/dhcp6c.h"
      - "trunk/user/busybox/busybox-1.24.x/networking/udhcp/dhcp6c_config.h"
      - "trunk/user/busybox/busybox-1.24.x/networking/udhcp/dhcp6c_ia_policy.h"
      - "trunk/user/busybox/busybox-1.24.x/networking/udhcp/dhcp6c_config.c"
      - "trunk/user/busybox/busybox-1.24.x/networking/udhcp/dhcp6c_iaid_policy.h"
      - "trunk/user/busybox/busybox-1.24.x/networking/udhcp/dhcp6c_pd_sla_policy.h"
      - "trunk/user/busybox/busybox-1.24.x/networking/udhcp/tests/dhcp6c_pd_sla_policy.c"
      - "trunk/user/busybox/busybox-1.24.x/networking/udhcp/dhcp6c_config_cleanup_policy.h"
      - "trunk/user/busybox/busybox-1.24.x/networking/udhcp/tests/dhcp6c_config_cleanup_policy.c"
      - "trunk/user/busybox/busybox-1.24.x/networking/udhcp/dhcp6c_common.c"
      - "trunk/user/busybox/busybox-1.24.x/networking/udhcp/dhcp6c_option_bounds_policy.h"
      - "trunk/user/busybox/busybox-1.24.x/networking/udhcp/tests/dhcp6c_option_bounds_policy.c"
      - "trunk/user/busybox/busybox-1.24.x/networking/udhcp/tests/dhcp6c_iaid_policy.c"
      - "trunk/user/busybox/busybox-1.24.x/networking/udhcp/tests/dhcp6c_ia_publication_policy.c"
      - "trunk/user/rc/src/net_wan6.c"
      - "trunk/user/rc/src/dhcp6c_callback_generation_policy.h"
      - "trunk/user/rc/src/tests/dhcp6c_callback_generation.c"
  pull_request:
    paths:
      - ".github/workflows/dhcp6c-ia-publication-stability.yml"
      - "scripts/check_dhcp6c_ia_publication.py"
      - "trunk/user/busybox/busybox-1.24.x/networking/udhcp/dhcp6c_ia.c"
      - "trunk/user/busybox/busybox-1.24.x/networking/udhcp/dhcp6c.c"
      - "trunk/user/busybox/busybox-1.24.x/networking/udhcp/dhcp6c_socket.c"
      - "trunk/user/busybox/busybox-1.24.x/networking/udhcp/dhcp6c.h"
      - "trunk/user/busybox/busybox-1.24.x/networking/udhcp/dhcp6c_ia_policy.h"
      - "trunk/user/busybox/busybox-1.24.x/networking/udhcp/dhcp6c_config.c"
      - "trunk/user/busybox/busybox-1.24.x/networking/udhcp/dhcp6c_iaid_policy.h"
      - "trunk/user/busybox/busybox-1.24.x/networking/udhcp/dhcp6c_pd_sla_policy.h"
      - "trunk/user/busybox/busybox-1.24.x/networking/udhcp/tests/dhcp6c_pd_sla_policy.c"
      - "trunk/user/busybox/busybox-1.24.x/networking/udhcp/dhcp6c_config_cleanup_policy.h"
      - "trunk/user/busybox/busybox-1.24.x/networking/udhcp/tests/dhcp6c_config_cleanup_policy.c"
      - "trunk/user/busybox/busybox-1.24.x/networking/udhcp/dhcp6c_common.c"
      - "trunk/user/busybox/busybox-1.24.x/networking/udhcp/dhcp6c_option_bounds_policy.h"
      - "trunk/user/busybox/busybox-1.24.x/networking/udhcp/tests/dhcp6c_option_bounds_policy.c"
      - "trunk/user/busybox/busybox-1.24.x/networking/udhcp/tests/dhcp6c_iaid_policy.c"
      - "trunk/user/busybox/busybox-1.24.x/networking/udhcp/tests/dhcp6c_ia_publication_policy.c"
      - "trunk/user/rc/src/net_wan6.c"
      - "trunk/user/rc/src/dhcp6c_callback_generation_policy.h"
      - "trunk/user/rc/src/tests/dhcp6c_callback_generation.c"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dhcp6c-ia-publication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run GNU89 DHCPv6 IA partial-publication retry regression
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -fno-omit-frame-pointer -I trunk/user/busybox/busybox-1.24.x/networking/udhcp/ \
            trunk/user/busybox/busybox-1.24.x/networking/udhcp/tests/dhcp6c_ia_publication_policy.c \
            -o /tmp/dhcp6c-ia-publication-policy
          ASAN_OPTIONS=detect_leaks=1 /tmp/dhcp6c-ia-publication-policy
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -fno-omit-frame-pointer -I trunk/user/busybox/busybox-1.24.x/networking/udhcp/ \
            trunk/user/busybox/busybox-1.24.x/networking/udhcp/tests/dhcp6c_iaid_policy.c \
            -o /tmp/dhcp6c-iaid-policy
          ASAN_OPTIONS=detect_leaks=1 /tmp/dhcp6c-iaid-policy
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -fno-omit-frame-pointer -I trunk/user/busybox/busybox-1.24.x/networking/udhcp/ \
            trunk/user/busybox/busybox-1.24.x/networking/udhcp/tests/dhcp6c_pd_sla_policy.c \
            -o /tmp/dhcp6c-pd-sla-policy
          ASAN_OPTIONS=detect_leaks=1 /tmp/dhcp6c-pd-sla-policy
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -I trunk/user/busybox/busybox-1.24.x/networking/udhcp/ trunk/user/busybox/busybox-1.24.x/networking/udhcp/tests/dhcp6c_config_cleanup_policy.c -o /tmp/dhcp6c-config-cleanup-policy
          ASAN_OPTIONS=detect_leaks=1 /tmp/dhcp6c-config-cleanup-policy
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -fno-omit-frame-pointer -I trunk/user/busybox/busybox-1.24.x/networking/udhcp/ \
            trunk/user/busybox/busybox-1.24.x/networking/udhcp/tests/dhcp6c_option_bounds_policy.c \
            -o /tmp/dhcp6c-option-bounds-policy
          ASAN_OPTIONS=detect_leaks=1 /tmp/dhcp6c-option-bounds-policy
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -fno-omit-frame-pointer -I trunk/user/rc/src \
            trunk/user/rc/src/tests/dhcp6c_callback_generation.c \
            -o /tmp/dhcp6c-callback-generation
          ASAN_OPTIONS=detect_leaks=1 /tmp/dhcp6c-callback-generation
      - name: Verify DHCPv6 IA kernel configuration retry and source workflow
        run: python3 scripts/check_dhcp6c_ia_publication.py

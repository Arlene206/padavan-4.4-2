name: NFS daemon start and reload lifecycle regression

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/nfsd-start-stability.yml"
      - "trunk/user/nfs-utils/nfsd.sh"
      - "trunk/user/nfs-utils/tests/nfsd_start_lifecycle.sh"
      - "trunk/user/rc/src/services_stor.c"
      - "trunk/user/rc/src/storage_nfs_export_policy.h"
      - "trunk/user/rc/src/tests/storage_nfs_export_policy.c"
  pull_request:
    paths:
      - ".github/workflows/nfsd-start-stability.yml"
      - "trunk/user/nfs-utils/nfsd.sh"
      - "trunk/user/nfs-utils/tests/nfsd_start_lifecycle.sh"
      - "trunk/user/rc/src/services_stor.c"
      - "trunk/user/rc/src/storage_nfs_export_policy.h"
      - "trunk/user/rc/src/tests/storage_nfs_export_policy.c"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nfsd-start-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check NFS shell syntax
        run: |
          sh -n trunk/user/nfs-utils/nfsd.sh
          sh -n trunk/user/nfs-utils/tests/nfsd_start_lifecycle.sh
      - name: Exercise NFS start and reload failures
        run: sh trunk/user/nfs-utils/tests/nfsd_start_lifecycle.sh
      - name: Compile and exercise NFS IPv4/IPv6 export ACL policy
        run: |
          cc -std=gnu89 -Wall -Wextra -Werror -DUSE_IPV6 -Itrunk/user/rc/src \
            trunk/user/rc/src/tests/storage_nfs_export_policy.c \
            -o /tmp/storage_nfs_export_policy
          /tmp/storage_nfs_export_policy
      - name: Verify RC command-status propagation and workflow path filters
        run: |
          python3 - <<'PY'
          from pathlib import Path

          script = Path("trunk/user/nfs-utils/nfsd.sh").read_text()
          service = Path("trunk/user/rc/src/services_stor.c").read_text()
          policy = Path("trunk/user/rc/src/storage_nfs_export_policy.h").read_text()
          policy_test = Path("trunk/user/rc/src/tests/storage_nfs_export_policy.c").read_text()
          workflow = Path(".github/workflows/nfsd-start-stability.yml").read_text()

          def function_body(source, signature):
              start = source.index(signature)
              brace = source.index("{", start)
              depth = 0
              for index in range(brace, len(source)):
                  if source[index] == "{":
                      depth += 1
                  elif source[index] == "}":
                      depth -= 1
                      if depth == 0:
                          return source[start:index + 1]
              raise AssertionError("unterminated function: " + signature)

          mount_status = function_body(script, "func_mount_status()")
          assert 'awk -v mountpoint="$expected_mountpoint"' in mount_status
          assert "$2 == mountpoint" in mount_status
          assert "$1 == expected_source && $3 == filesystem" in mount_status
          assert "entry_count == 1 && expected_count == 1" in mount_status
          assert 'case "$mount_result" in' in mount_status
          mount = function_body(script, "func_mount_if_needed()")
          assert 'func_mount_status "$mountpoint" "$filesystem" "$source"' in mount
          assert 'mount -t "$filesystem" "$source" "$mountpoint"' in mount
          assert "refusing conflicting or unreadable mount state" in mount
          assert "mount command did not publish the expected" in mount
          unmount = function_body(script, "func_unmount_if_mounted()")
          assert 'func_mount_status "$mountpoint" "$filesystem" "$source"' in unmount
          assert "refusing to unmount conflicting or unreadable mount state" in unmount
          assert 'umount "$mountpoint" 2>/dev/null || return 1' in unmount
          stop = function_body(script, "func_stop()")
          assert 'func_unmount_if_mounted /var/lib/nfs/rpc_pipefs rpc_pipefs rpc_pipefs' in stop
          assert 'func_unmount_if_mounted /proc/fs/nfsd nfsd nfsd' in stop

          start = function_body(script, "func_start()")
          for command in (
              "/sbin/rpcbind ||",
              "touch /etc/exports",
              "mkdir -p /var/lib/nfs/sm",
              "modprobe -q nfsd ||",
              "func_mount_if_needed /proc/fs/nfsd nfsd nfsd ||",
              "func_mount_if_needed /var/lib/nfs/rpc_pipefs rpc_pipefs rpc_pipefs ||",
              "/sbin/exportfs -r ||",
              "/sbin/rpc.nfsd -N4 -N4.1 1 ||",
              "/sbin/rpc.mountd ||",
          ):
              assert command in start, command
          assert start.index("/sbin/exportfs -r ||") < start.index("/sbin/rpc.nfsd -N4 -N4.1 1 ||")
          assert start.index("/sbin/rpc.nfsd -N4 -N4.1 1 ||") < start.index("/sbin/rpc.mountd ||")
          assert start.count("func_stop || logger") >= 5
          assert "NFS startup cleanup after nfsd control mount failure was incomplete" in start
          assert "NFS startup cleanup after rpc_pipefs mount failure was incomplete" in start
          assert "NFS startup cleanup after export publication failure was incomplete" in start
          assert "refusing to reset NFS state while only one server daemon is running" in start
          assert "rpc.nfsd returned success but nfsd is not running" in start
          assert "rpc.mountd returned success but the daemon is not running" in start

          reload = function_body(script, "func_reload()")
          for prerequisite in ("pidof rpcbind", "pidof nfsd", "pidof rpc.mountd", "[ ! -f /etc/exports ]"):
              assert prerequisite in reload
          assert "/sbin/exportfs -r ||" in reload and "return 1" in reload

          run_nfsd = function_body(service, "run_nfsd(void)")
          assert 'command_status = eval("/usr/bin/nfsd.sh", "start");' in run_nfsd
          assert "if (command_status != 0)" in run_nfsd
          assert 'NFS daemon start failed (status %d)' in run_nfsd

          reload_nfsd = function_body(service, "reload_nfsd(void)")
          assert 'command_status = eval("/usr/bin/nfsd.sh", "reload");' in reload_nfsd
          assert "if (command_status != 0)" in reload_nfsd
          assert 'NFS daemon reload failed (status %d)' in reload_nfsd

          export_writer = function_body(service, "write_nfsd_exports(void)")
          assert "STORAGE_NFS_EXPORT_DEFAULT_OPTIONS" in export_writer
          assert "#define STORAGE_NFS_EXPORT_DEFAULT_OPTIONS" in policy
          assert '"async,secure,no_root_squash,no_subtree_check"' in policy
          assert "insecure,no_root_squash" not in export_writer
          assert "async,insecure,no_root_squash,no_subtree_check" not in service
          assert 'strstr(STORAGE_NFS_EXPORT_DEFAULT_OPTIONS, "insecure") == NULL' in policy_test
          assert 'strstr(STORAGE_NFS_EXPORT_DEFAULT_OPTIONS, "no_root_squash") != NULL' in policy_test
          assert export_writer.index("if (check_if_file_exist(exports_link))") < export_writer.index('procpt = fopen(PROC_MOUNTS_FILE, "r")')
          assert "symlink(exports_link, staged_path)" in export_writer
          assert "storage_nfs_export_format_ipv4_acl" in export_writer
          assert "acl_ipv4_status < 0" in export_writer
          assert "acl_vpn_status < 0" in export_writer
          assert "ip2class(" not in export_writer
          assert 'invalid IPv4 LAN ACL' in export_writer
          assert 'invalid IPv4 VPN ACL' in export_writer
          assert "storage_nfs_export_format_ipv6_acl" in export_writer
          assert "acl_ipv6_status < 0" in export_writer
          assert "storage_nfs_export_format_ipv4_acl" in policy
          assert "inet_pton(AF_INET" in policy
          assert "host_mask & (host_mask + 1U)" in policy
          assert "prefix_length == 0U" in policy
          assert '"255.0.255.0"' in policy_test
          assert '"192.168.1.42;0.0.0.0/0"' in policy_test
          assert "acl_addr6_export" in export_writer
          assert 'fprintf(fp, " %s/%s(%s,%s)"' not in export_writer
          assert "inet_pton(AF_INET6" in policy
          assert "inet_ntop(AF_INET6" in policy
          assert "prefix_length < 48U" in policy
          assert '"64;rw,no_root_squash"' in policy_test
          assert '"2001:db8::1) 0.0.0.0/0(rw)"' in policy_test
          assert "Storage NFS source-port policy, inventory, IPv6 ACL and start gate: PASS" in policy_test

          push_filters = workflow.split("  push:", 1)[1].split("  pull_request:", 1)[0]
          pr_filters = workflow.split("  pull_request:", 1)[1].split("  workflow_dispatch:", 1)[0]
          for path in (
              ".github/workflows/nfsd-start-stability.yml",
              "trunk/user/nfs-utils/nfsd.sh",
              "trunk/user/nfs-utils/tests/nfsd_start_lifecycle.sh",
              "trunk/user/rc/src/services_stor.c",
              "trunk/user/rc/src/storage_nfs_export_policy.h",
              "trunk/user/rc/src/tests/storage_nfs_export_policy.c",
          ):
              assert push_filters.count(path) == 1
              assert pr_filters.count(path) == 1

          lifecycle_test = Path("trunk/user/nfs-utils/tests/nfsd_start_lifecycle.sh").read_text()
          assert "conflicting nfsd mount tuple" in lifecycle_test
          assert "conflicting rpc_pipefs mount tuple" in lifecycle_test
          assert "duplicate nfsd mountpoint entries" in lifecycle_test
          print("NFS start/reload command status, cleanup and RC caller contracts: PASS")
          PY

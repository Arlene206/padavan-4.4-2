name: watchdog signal lifecycle stability regression

on:
  push:
    paths:
      - ".github/workflows/watchdog-signal-stability.yml"
      - "trunk/user/rc/src/watchdog.c"
      - "trunk/user/rc/src/watchdog_ntp_policy.h"
      - "trunk/user/rc/src/tests/watchdog_ntp_policy.c"
      - "trunk/user/rc/src/common_ex.c"
      - "trunk/user/rc/src/service_lifecycle_policy.h"
      - "trunk/user/rc/src/tests/service_lifecycle_policy.c"
      - "trunk/user/shared/src/process_inventory.h"
      - "scripts/check_watchdog_ntp_lifecycle.py"
      - "trunk/user/rc/src/watchdog_signal_policy.h"
      - "trunk/user/rc/src/tests/watchdog_signal_policy.c"
      - "trunk/user/rc/src/rc.c"
      - "trunk/user/rc/src/rc.h"
      - "trunk/user/rc/src/services.c"
      - "trunk/user/rc/src/net_wifi.c"
      - "trunk/user/rc/src/Makefile"
      - "trunk/user/rc/Makefile"
  pull_request:
    paths:
      - ".github/workflows/watchdog-signal-stability.yml"
      - "trunk/user/rc/src/watchdog.c"
      - "trunk/user/rc/src/watchdog_ntp_policy.h"
      - "trunk/user/rc/src/tests/watchdog_ntp_policy.c"
      - "trunk/user/rc/src/common_ex.c"
      - "trunk/user/rc/src/service_lifecycle_policy.h"
      - "trunk/user/rc/src/tests/service_lifecycle_policy.c"
      - "trunk/user/shared/src/process_inventory.h"
      - "scripts/check_watchdog_ntp_lifecycle.py"
      - "trunk/user/rc/src/watchdog_signal_policy.h"
      - "trunk/user/rc/src/tests/watchdog_signal_policy.c"
      - "trunk/user/rc/src/rc.c"
      - "trunk/user/rc/src/rc.h"
      - "trunk/user/rc/src/services.c"
      - "trunk/user/rc/src/net_wifi.c"
      - "trunk/user/rc/src/Makefile"
      - "trunk/user/rc/Makefile"

permissions:
  contents: read

jobs:
  watchdog-signal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run GNU89 signal deferral policy regression
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -I trunk/user/rc/src \
            trunk/user/rc/src/tests/watchdog_signal_policy.c \
            -o /tmp/watchdog-signal-policy
          ASAN_OPTIONS=detect_leaks=1 /tmp/watchdog-signal-policy
      - name: Compile and run NTP stop-before-start and shared service lifecycle regressions
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer \
            -I trunk/user/rc/src \
            trunk/user/rc/src/tests/watchdog_ntp_policy.c \
            -o /tmp/watchdog-ntp-policy
          ASAN_OPTIONS=detect_leaks=1 /tmp/watchdog-ntp-policy
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer \
            -I trunk/user/rc/src -I trunk/user/shared/src \
            trunk/user/rc/src/tests/service_lifecycle_policy.c \
            -o /tmp/service-lifecycle-policy
          ASAN_OPTIONS=detect_leaks=1 /tmp/service-lifecycle-policy
      - name: Verify NTP stop-before-start integration and service lifecycle return path
        run: python3 scripts/check_watchdog_ntp_lifecycle.py
      - name: Verify deferred dispatch, signal masks and caller wiring
        run: |
          python3 - <<'PY'
          from pathlib import Path

          rc = Path("trunk/user/rc/src")
          watchdog = (rc / "watchdog.c").read_text()
          policy = (rc / "watchdog_signal_policy.h").read_text()
          test = (rc / "tests/watchdog_signal_policy.c").read_text()
          dispatcher = (rc / "rc.c").read_text()
          header = (rc / "rc.h").read_text()
          services = (rc / "services.c").read_text()
          wireless = (rc / "net_wifi.c").read_text()
          makefile = (rc / "Makefile").read_text()
          package_makefile = Path("trunk/user/rc/Makefile").read_text()
          workflow = Path(".github/workflows/watchdog-signal-stability.yml").read_text()

          def body(source, signature):
              start = source.index(signature)
              brace = source.index("{", start)
              depth = 0
              for pos in range(brace, len(source)):
                  if source[pos] == "{":
                      depth += 1
                  elif source[pos] == "}":
                      depth -= 1
                      if depth == 0:
                          return source[brace + 1:pos]
              raise AssertionError("unterminated function: " + signature)

          assert '#include "watchdog_signal_policy.h"' in watchdog
          handler = body(watchdog, "catch_sig_watchdog(int sig)")
          assert "watchdog_record_signal(&wd_pending_events, sig)" in handler
          for forbidden in ("watchdog_on_timer(", "watchdog_on_sighup(",
                            "watchdog_on_sigusr1(", "remove(", "wd_alarmtimer(",
                            "exit(", "nvram_", "notify_rc(", "doSystem(",
                            "system(", "eval(", "setenv_tz(", "storage_save_time("):
              assert forbidden not in handler, "signal handler still performs work: " + forbidden

          main = body(watchdog, "watchdog_main(int argc, char *argv[])")
          block = main.index("sigprocmask(SIG_BLOCK, &managed_signals, &original_mask)")
          install = main.index("sigaction(SIGHUP, &sa, NULL)")
          assert block < install
          assert "sa.sa_mask = managed_signals;" in main
          for signal_name in ("SIGALRM", "SIGHUP", "SIGUSR1", "SIGTERM"):
              assert f"sigaddset(&managed_signals, {signal_name})" in main
              assert f"sigaction({signal_name}, &sa, NULL)" in main
              assert f"sigdelset(&dispatch_mask, {signal_name})" in main
          assert "sigaction(SIGPIPE, &sa, NULL) < 0" in main
          assert "sigsuspend(&dispatch_mask)" in main
          assert "pause()" not in main
          assert "events = watchdog_take_pending_events(&wd_pending_events)" in main

          stop = main.index("if (events & WD_PENDING_TERMINATE)")
          refresh = main.index("if (events & WD_PENDING_TIME_REFRESH)", stop)
          wifi = main.index("if (events & WD_PENDING_WIFI_STATE)", refresh)
          timer = main.index("if (events & WD_PENDING_TIMER)", wifi)
          assert stop < refresh < wifi < timer
          unblock = main.index("sigprocmask(SIG_SETMASK, &dispatch_mask, NULL)")
          assert unblock < refresh
          reblock = main.index("sigprocmask(SIG_BLOCK, &managed_signals, NULL)", timer)
          assert timer < reblock
          assert "if (wd_alarmtimer(WD_NORMAL_PERIOD, 0) < 0)" in main
          cleanup = main.index("watchdog_cleanup:")
          assert "wd_alarmtimer(0, 0)" in main[cleanup:]
          assert "remove(WD_PID_FILE)" in main[cleanup:]
          assert main.index("remove(WD_PID_FILE)", cleanup) < main.index(
              "sigprocmask(SIG_SETMASK, &original_mask, NULL)", cleanup)

          alarm = body(watchdog, "wd_alarmtimer(unsigned long sec, unsigned long usec)")
          assert "return setitimer(ITIMER_REAL, &wd_itv, NULL);" in alarm

          timer_body = body(watchdog, "watchdog_on_timer(void)")
          timer_calls = ("svc_timecheck();", "httpd_process_check();",
                         "dnsmasq_process_check();", "inet_handler(is_ap_mode);",
                         "setkernel_tz();", "storage_save_time(10);")
          positions = [timer_body.index(call) for call in timer_calls]
          assert positions == sorted(positions)
          assert timer_body.count("wd_pending_events & WD_PENDING_TERMINATE") >= 6

          schedule = body(watchdog, "svc_timecheck(void)")
          update = schedule.index('doSystem("/usr/bin/update_dlink.sh %s", "update");')
          stop_guard = schedule.index("wd_pending_events & WD_PENDING_TERMINATE", update)
          delay = schedule.index("sleep(70);", stop_guard)
          assert update < stop_guard < delay

          for bit in ("WD_PENDING_TIMER", "WD_PENDING_TIME_REFRESH",
                      "WD_PENDING_WIFI_STATE", "WD_PENDING_TERMINATE"):
              assert bit in policy
          for marker in ("test_signal_events_are_recorded",
                         "test_repeated_standard_signals_coalesce",
                         "test_termination_is_sticky_and_coexists_with_work",
                         "test_snapshot_clears_only_the_consumed_batch"):
              assert marker in test

          time_notify = body(watchdog, "notify_watchdog_time(void)")
          wifi_notify = body(watchdog, "notify_watchdog_wifi(int is_5ghz)")
          assert "kill_pidfile_s(WD_PID_FILE, SIGHUP)" in time_notify
          assert time_notify.index('pids("watchdog")') < time_notify.index("kill_pidfile_s(")
          assert 'nvram_set_int_temp("wd_notify_id", wd_notify_id)' in wifi_notify
          assert "kill_pidfile_s(WD_PID_FILE, SIGUSR1)" in wifi_notify
          assert wifi_notify.index('nvram_set_int_temp("wd_notify_id", wd_notify_id)') < wifi_notify.index("kill_pidfile_s(")
          assert "notify_watchdog_time();" in dispatcher
          assert "RCN_RESTART_NTPC" in dispatcher and "RCN_RESTART_TIME" in dispatcher
          assert "notify_watchdog_wifi(0)" in wireless and "notify_watchdog_wifi(1)" in wireless
          assert "start_watchdog();" in body(services, "start_services_once(int is_ap_mode)")
          assert '"watchdog"' in body(services, "stop_misc(void)")
          assert '"watchdog"' in dispatcher and "watchdog_main" in dispatcher
          assert "int  watchdog_main(int argc, char *argv[]);" in header
          assert "void notify_watchdog_time(void);" in header
          assert "void notify_watchdog_wifi(int is_5ghz);" in header
          assert "watchdog.o" in makefile
          assert '$(LN) rc $(ROMFSDIR)/sbin/watchdog' in package_makefile

          paths = (
              ".github/workflows/watchdog-signal-stability.yml",
              "trunk/user/rc/src/watchdog.c",
              "trunk/user/rc/src/watchdog_signal_policy.h",
              "trunk/user/rc/src/tests/watchdog_signal_policy.c",
              "trunk/user/rc/src/rc.c",
              "trunk/user/rc/src/rc.h",
              "trunk/user/rc/src/services.c",
              "trunk/user/rc/src/net_wifi.c",
              "trunk/user/rc/src/Makefile",
              "trunk/user/rc/Makefile",
          )
          filters = workflow.split("jobs:", 1)[0]
          push_filters, pr_filters = filters.split("  pull_request:", 1)
          for path in paths:
              assert push_filters.count(path) == 1, f"push path missing/duplicated: {path}"
              assert pr_filters.count(path) == 1, f"pull_request path missing/duplicated: {path}"

          print("watchdog signal/context and caller contract: PASS")
          PY

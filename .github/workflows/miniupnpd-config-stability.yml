      - "trunk/user/rc/src/miniupnpd_lifecycle_lock.h"
      - "trunk/user/rc/src/tests/miniupnpd_lifecycle_lock.c"
      - "scripts/check_miniupnpd_lifecycle_lock.py"
  pull_request:
    paths:
      - ".github/workflows/miniupnpd-config-stability.yml"
      - "trunk/user/rc/src/services_ex.c"
      - "trunk/user/rc/src/ipv4_netmask_policy.h"
      - "trunk/user/rc/src/tests/upnp_restart_policy.c"
      - "trunk/user/rc/src/upnp_restart_policy.h"
      - "trunk/user/rc/src/service_wait_policy.h"
      - "trunk/user/rc/src/net_wan.c"
      - "trunk/user/rc/src/rc.h"
      - "trunk/user/rc/src/miniupnpd_config_file.h"

      - "scripts/check_miniupnpd_iptcrdr_handle_ownership.py"
      - "trunk/user/miniupnpd/miniupnpd-2.x/netfilter/iptcrdr_capacity_policy.h"
      - "trunk/user/miniupnpd/miniupnpd-2.x/tests/iptcrdr_portmapping_capacity_test.c"
      - "scripts/check_miniupnpd_iptcrdr_capacity.py"
      - "trunk/user/miniupnpd/miniupnpd-2.x/netfilter/iptcrdr_update_policy.h"
      - "trunk/user/miniupnpd/miniupnpd-2.x/tests/iptcrdr_update_policy_test.c"
      - "scripts/check_miniupnpd_iptcrdr_update.py"
      - "trunk/user/miniupnpd/miniupnpd-2.x/netfilter/miniupnpd_redirect_desc_policy.h"
      - "trunk/user/miniupnpd/miniupnpd-2.x/tests/miniupnpd_redirect_desc_policy_test.c"
      - "scripts/check_miniupnpd_redirect_desc.py"
      - "trunk/user/miniupnpd/miniupnpd-2.x/netfilter/iptcrdr_update_policy.h"
      - "trunk/user/miniupnpd/miniupnpd-2.x/tests/iptcrdr_update_policy_test.c"
      - "scripts/check_miniupnpd_iptcrdr_delete.py"
      - "scripts/test_miniupnpd_redirect_delete_integration.py"
      - "trunk/user/miniupnpd/miniupnpd-2.x/tests/iptcrdr_update_policy_test.c"
      - "scripts/check_miniupnpd_iptcrdr_peer_delete.py"
      - "trunk/user/miniupnpd/miniupnpd-2.x/miniupnpd_pinhole_policy.h"
      - "trunk/user/miniupnpd/miniupnpd-2.x/tests/iptpinhole_policy_test.c"
      - "trunk/user/miniupnpd/miniupnpd-2.x/upnpsoap_xml_policy.h"
      - "trunk/user/miniupnpd/miniupnpd-2.x/tests/upnpsoap_xml_policy_test.c"
      - "trunk/user/rc/src/miniupnpd_lifecycle_lock.h"
      - "trunk/user/rc/src/tests/miniupnpd_lifecycle_lock.c"
      - "scripts/check_miniupnpd_lifecycle_lock.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  miniupnpd-config-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and exercise atomic configuration publication
        run: |
          cc -std=gnu89 -Wall -Wextra -Werror -Itrunk/user/rc/src \
            trunk/user/rc/src/tests/miniupnpd_config_file.c \
            -o /tmp/miniupnpd_config_file
          /tmp/miniupnpd_config_file
      - name: Compile and run miniupnpd daemon lifecycle policy
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror -Itrunk/user/rc/src -Itrunk/user/shared/src \
            trunk/user/rc/src/tests/miniupnpd_daemon_policy_test.c \
            -o /tmp/miniupnpd_daemon_policy
          /tmp/miniupnpd_daemon_policy
      - name: Compile and run atomic MiniUPnP PID-file publication regression
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Itrunk/user/miniupnpd/miniupnpd-2.x \
            trunk/user/miniupnpd/miniupnpd-2.x/tests/miniupnpd_pidfile_policy_test.c \
            -o /tmp/miniupnpd_pidfile_policy_test
          ASAN_OPTIONS=detect_leaks=1 /tmp/miniupnpd_pidfile_policy_test
      - name: Compile and run MiniUPnP redirect cleanup status regression
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Itrunk/user/miniupnpd/miniupnpd-2.x \
            trunk/user/miniupnpd/miniupnpd-2.x/tests/miniupnpd_redirect_cleanup_policy_test.c \
            -o /tmp/miniupnpd_redirect_cleanup_policy_test
          ASAN_OPTIONS=detect_leaks=1 /tmp/miniupnpd_redirect_cleanup_policy_test
      - name: Compile and run MiniUPnP iptables allocation failure regression
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer \
            trunk/user/miniupnpd/miniupnpd-2.x/tests/iptcrdr_allocation_policy_test.c \
            -o /tmp/iptcrdr_allocation_policy_test
          ASAN_OPTIONS=detect_leaks=1 /tmp/iptcrdr_allocation_policy_test
      - name: Verify MiniUPnP iptables allocation guards
        run: python3 scripts/check_miniupnpd_iptcrdr_allocations.py
      - name: Verify MiniUPnP IPTC delete-handle ownership
        run: python3 scripts/check_miniupnpd_iptcrdr_handle_ownership.py
      - name: Compile and run MiniUPnP port-mapping capacity regression
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer \
            trunk/user/miniupnpd/miniupnpd-2.x/tests/iptcrdr_portmapping_capacity_test.c \
            -o /tmp/iptcrdr_portmapping_capacity_test
          ASAN_OPTIONS=detect_leaks=1 /tmp/iptcrdr_portmapping_capacity_test
      - name: Verify MiniUPnP port-mapping capacity growth
        run: python3 scripts/check_miniupnpd_iptcrdr_capacity.py
      - name: Compile and run MiniUPnP NAT/filter update rollback regression
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer \
            trunk/user/miniupnpd/miniupnpd-2.x/tests/iptcrdr_update_policy_test.c \
            -o /tmp/iptcrdr_update_policy_test
          ASAN_OPTIONS=detect_leaks=1 /tmp/iptcrdr_update_policy_test
      - name: Verify MiniUPnP NAT/filter update rollback
        run: python3 scripts/check_miniupnpd_iptcrdr_update.py
      - name: Compile and run MiniUPnP redirect metadata allocation policy
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer \
            trunk/user/miniupnpd/miniupnpd-2.x/tests/miniupnpd_redirect_desc_policy_test.c \
            -o /tmp/miniupnpd_redirect_desc_policy_test
          ASAN_OPTIONS=detect_leaks=1 /tmp/miniupnpd_redirect_desc_policy_test
      - name: Verify MiniUPnP redirect metadata allocation ordering
        run: python3 scripts/check_miniupnpd_redirect_desc.py
      - name: Compile and run MiniUPnP NAT/filter delete compensation regression
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer \
            trunk/user/miniupnpd/miniupnpd-2.x/tests/iptcrdr_update_policy_test.c \
            -o /tmp/iptcrdr_update_policy_test
          ASAN_OPTIONS=detect_leaks=1 /tmp/iptcrdr_update_policy_test
      - name: Verify MiniUPnP NAT/filter delete compensation
        run: python3 scripts/check_miniupnpd_iptcrdr_delete.py
      - name: Compile and exercise the production redirect-delete caller with injected backends
        run: python3 scripts/test_miniupnpd_redirect_delete_integration.py
      - name: Compile and run MiniUPnP peer SNAT/DSCP rollback regression
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer \
            trunk/user/miniupnpd/miniupnpd-2.x/tests/iptcrdr_update_policy_test.c \
            -o /tmp/iptcrdr_update_policy_test
          ASAN_OPTIONS=detect_leaks=1 /tmp/iptcrdr_update_policy_test
      - name: Verify MiniUPnP peer SNAT/DSCP compensation
        run: python3 scripts/check_miniupnpd_iptcrdr_peer_delete.py
      - name: Compile and run MiniUPnP SOAP numeric input policy
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Itrunk/user/miniupnpd/miniupnpd-2.x \
            trunk/user/miniupnpd/miniupnpd-2.x/tests/upnpsoap_input_policy_test.c \
            -o /tmp/upnpsoap_input_policy_test
          ASAN_OPTIONS=detect_leaks=1 /tmp/upnpsoap_input_policy_test
      - name: Compile and run IPv6 pinhole allocation and address policy regression
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Itrunk/user/miniupnpd/miniupnpd-2.x \
            trunk/user/miniupnpd/miniupnpd-2.x/tests/iptpinhole_policy_test.c \
            -o /tmp/iptpinhole_policy_test
          ASAN_OPTIONS=detect_leaks=1 /tmp/iptpinhole_policy_test
      - name: Compile and run MiniUPnP lease-file record serialization regression
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Itrunk/user/miniupnpd/miniupnpd-2.x \
            trunk/user/miniupnpd/miniupnpd-2.x/tests/miniupnpd_lease_file_policy_test.c \
            -o /tmp/miniupnpd_lease_file_policy_test
          ASAN_OPTIONS=detect_leaks=1 /tmp/miniupnpd_lease_file_policy_test
      - name: Verify MiniUPnP lease-file deletion and persistence handling
        run: python3 scripts/check_miniupnpd_lease_file_cleanup.py
      - name: Verify MiniUPnP lease replay unlink-failure guard
        run: python3 scripts/check_miniupnpd_lease_reload.py
      - name: Verify MiniUPnP rule-snapshot allocation fail-closed behavior
        run: python3 scripts/check_miniupnpd_rule_state_oom.py
      - name: Compile and run MiniUPnP SOAP XML escaping policy
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Itrunk/user/miniupnpd/miniupnpd-2.x \
            trunk/user/miniupnpd/miniupnpd-2.x/tests/upnpsoap_xml_policy_test.c \
            -o /tmp/upnpsoap_xml_policy_test
          ASAN_OPTIONS=detect_leaks=1 /tmp/upnpsoap_xml_policy_test
      - name: Verify UPnP writer error propagation and daemon start gate
        run: |
          python3 - <<'PY'
          from pathlib import Path

          service = Path("trunk/user/rc/src/services_ex.c").read_text()
          netmask_policy = Path("trunk/user/rc/src/ipv4_netmask_policy.h").read_text()
          helper = Path("trunk/user/rc/src/miniupnpd_config_file.h").read_text()
          test = Path("trunk/user/rc/src/tests/miniupnpd_config_file.c").read_text()
          policy = Path("trunk/user/rc/src/miniupnpd_daemon_policy.h").read_text()
          daemon_test = Path("trunk/user/rc/src/tests/miniupnpd_daemon_policy_test.c").read_text()
          daemon_source = Path("trunk/user/miniupnpd/miniupnpd-2.x/miniupnpd.c").read_text()
          daemonizer = Path("trunk/user/miniupnpd/miniupnpd-2.x/daemonize.c").read_text()
          pid_policy = Path("trunk/user/miniupnpd/miniupnpd-2.x/miniupnpd_pidfile_policy.h").read_text()
          pid_test = Path("trunk/user/miniupnpd/miniupnpd-2.x/tests/miniupnpd_pidfile_policy_test.c").read_text()
          soap_source = Path("trunk/user/miniupnpd/miniupnpd-2.x/upnpsoap.c").read_text()
          soap_policy = Path("trunk/user/miniupnpd/miniupnpd-2.x/upnpsoap_input_policy.h").read_text()
          soap_test = Path("trunk/user/miniupnpd/miniupnpd-2.x/tests/upnpsoap_input_policy_test.c").read_text()
          pinhole_backend = Path("trunk/user/miniupnpd/miniupnpd-2.x/netfilter/iptpinhole.c").read_text()
          pinhole_policy = Path("trunk/user/miniupnpd/miniupnpd-2.x/miniupnpd_pinhole_policy.h").read_text()
          pinhole_test = Path("trunk/user/miniupnpd/miniupnpd-2.x/tests/iptpinhole_policy_test.c").read_text()
          xml_policy = Path("trunk/user/miniupnpd/miniupnpd-2.x/upnpsoap_xml_policy.h").read_text()
          xml_test = Path("trunk/user/miniupnpd/miniupnpd-2.x/tests/upnpsoap_xml_policy_test.c").read_text()
          redirect_source = Path("trunk/user/miniupnpd/miniupnpd-2.x/upnpredirect.c").read_text()
          ipt_source = Path("trunk/user/miniupnpd/miniupnpd-2.x/netfilter/iptcrdr.c").read_text()
          cleanup_policy = Path("trunk/user/miniupnpd/miniupnpd-2.x/miniupnpd_redirect_cleanup_policy.h").read_text()
          cleanup_test = Path("trunk/user/miniupnpd/miniupnpd-2.x/tests/miniupnpd_redirect_cleanup_policy_test.c").read_text()
          lease_policy = Path("trunk/user/miniupnpd/miniupnpd-2.x/miniupnpd_lease_file_policy.h").read_text()
          lease_test = Path("trunk/user/miniupnpd/miniupnpd-2.x/tests/miniupnpd_lease_file_policy_test.c").read_text()
          miniupnpd_makefile = Path("trunk/user/miniupnpd/miniupnpd-2.x/Makefile.linux").read_text()
          workflow = Path(".github/workflows/miniupnpd-config-stability.yml").read_text()
          wan = Path("trunk/user/rc/src/net_wan.c").read_text()
          declarations = Path("trunk/user/rc/src/rc.h").read_text()

          def function_body(source, signature):
              start = source.index(signature)
              brace = source.index("{", start)
              depth = 0
              for index in range(brace, len(source)):
                  if source[index] == "{":
                      depth += 1
                  elif source[index] == "}":
                      depth -= 1
                      if depth == 0:
                          return source[start:index + 1]
              raise AssertionError("unterminated function: " + signature)

          assert '#include "upnpsoap_input_policy.h"' in soap_source
          add_port = function_body(soap_source, "AddPortMapping(struct upnphttp * h")
          add_any = function_body(soap_source, "AddAnyPortMapping(struct upnphttp * h")
          get_specific = function_body(soap_source, "GetSpecificPortMappingEntry(struct upnphttp * h")
          delete_port = function_body(soap_source, "DeletePortMapping(struct upnphttp * h")
          delete_range = function_body(soap_source, "DeletePortMappingRange(struct upnphttp * h")
          get_list = function_body(soap_source, "GetListOfPortMappings(struct upnphttp * h")
          add_pinhole = function_body(soap_source, "AddPinhole(struct upnphttp * h")
          pinhole_verify = function_body(soap_source, "PinholeVerification(struct upnphttp * h")
          update_pinhole = function_body(soap_source, "UpdatePinhole(struct upnphttp * h")
          delete_pinhole = function_body(soap_source, "DeletePinhole(struct upnphttp * h")
          check_pinhole = function_body(soap_source, "CheckPinholeWorking(struct upnphttp * h")
          get_pinhole_packets = function_body(soap_source, "GetPinholePackets(struct upnphttp * h")
          outbound_pinhole = function_body(soap_source, "GetOutboundPinholeTimeout(struct upnphttp * h")
          redirect_internal = function_body(redirect_source, "upnp_redirect_internal(const char * rhost")
          filter_failure = redirect_internal.split("if(add_filter_rule2(", 1)[1].split("\n\t}", 1)[0]
          assert "_upnp_delete_redir(eport, proto)" in filter_failure
          assert "rollback_status != 0" in filter_failure
          assert "failed to roll back partially installed UPnP mapping" in filter_failure
          cleanup_header = Path("trunk/user/miniupnpd/miniupnpd-2.x/netfilter/iptcrdr.h").read_text()
          cleanup_backend = function_body(ipt_source, "delete_redirect_and_filter_rules_ex(unsigned short eport, int proto, int *primary_removed)")
          delete_helper = function_body(ipt_source, "delete_rule_and_commit(unsigned int index, IPTC_HANDLE h,")
          insert_helper = function_body(ipt_source, "insert_rule_and_commit(unsigned int index, const struct ipt_entry *entry,")
          for cleanup_helper in (delete_helper, insert_helper):

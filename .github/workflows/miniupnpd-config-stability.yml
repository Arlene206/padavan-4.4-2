name: miniupnpd atomic configuration publication regression

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/miniupnpd-config-stability.yml"
      - "trunk/user/rc/src/services_ex.c"
      - "trunk/user/rc/src/miniupnpd_config_file.h"
      - "trunk/user/rc/src/tests/miniupnpd_config_file.c"
      - "trunk/user/rc/src/miniupnpd_daemon_policy.h"
      - "trunk/user/rc/src/tests/miniupnpd_daemon_policy_test.c"
      - "trunk/user/miniupnpd/miniupnpd-2.x/miniupnpd.c"
      - "trunk/user/miniupnpd/miniupnpd-2.x/daemonize.c"
  pull_request:
    paths:
      - ".github/workflows/miniupnpd-config-stability.yml"
      - "trunk/user/rc/src/services_ex.c"
      - "trunk/user/rc/src/miniupnpd_config_file.h"
      - "trunk/user/rc/src/tests/miniupnpd_config_file.c"
      - "trunk/user/rc/src/miniupnpd_daemon_policy.h"
      - "trunk/user/rc/src/tests/miniupnpd_daemon_policy_test.c"
      - "trunk/user/miniupnpd/miniupnpd-2.x/miniupnpd.c"
      - "trunk/user/miniupnpd/miniupnpd-2.x/daemonize.c"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  miniupnpd-config-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and exercise atomic configuration publication
        run: |
          cc -std=gnu89 -Wall -Wextra -Werror -Itrunk/user/rc/src \
            trunk/user/rc/src/tests/miniupnpd_config_file.c \
            -o /tmp/miniupnpd_config_file
          /tmp/miniupnpd_config_file
      - name: Compile and run miniupnpd daemon startup policy
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror -Itrunk/user/rc/src \
            trunk/user/rc/src/tests/miniupnpd_daemon_policy_test.c \
            -o /tmp/miniupnpd_daemon_policy
          /tmp/miniupnpd_daemon_policy
      - name: Verify UPnP writer error propagation and daemon start gate
        run: |
          python3 - <<'PY'
          from pathlib import Path

          service = Path("trunk/user/rc/src/services_ex.c").read_text()
          helper = Path("trunk/user/rc/src/miniupnpd_config_file.h").read_text()
          test = Path("trunk/user/rc/src/tests/miniupnpd_config_file.c").read_text()
          policy = Path("trunk/user/rc/src/miniupnpd_daemon_policy.h").read_text()
          daemon_test = Path("trunk/user/rc/src/tests/miniupnpd_daemon_policy_test.c").read_text()
          daemon_source = Path("trunk/user/miniupnpd/miniupnpd-2.x/miniupnpd.c").read_text()
          daemonizer = Path("trunk/user/miniupnpd/miniupnpd-2.x/daemonize.c").read_text()
          workflow = Path(".github/workflows/miniupnpd-config-stability.yml").read_text()

          def function_body(source, signature):
              start = source.index(signature)
              brace = source.index("{", start)
              depth = 0
              for index in range(brace, len(source)):
                  if source[index] == "{":
                      depth += 1
                  elif source[index] == "}":
                      depth -= 1
                      if depth == 0:
                          return source[start:index + 1]
              raise AssertionError("unterminated function: " + signature)

          writer = function_body(service, "miniupnpd_write_config(FILE *fp, void *opaque)")
          assert writer.count("if (fprintf(fp") == 2
          for token in (
              "ext_ifname=%s", "listening_ip=%s", "enable_upnp=%s",
              "enable_natpmp=%s", "secure_mode=%s", "lease_file=%s",
              "allow %d-%d %s %d-%d", "deny 0-65535 0.0.0.0/0 0-65535",
          ):
              assert token in writer, token

          start = function_body(service, "start_upnp(void)")
          assert "miniupnpd_config_publish(\"/etc/miniupnpd.conf\"" in start
          assert start.index("miniupnpd_config_publish") < start.index('eval("/usr/bin/miniupnpd")')
          assert "if (ret != 0)" in start
          assert "miniupnpd configuration publication failed" in start
          assert 'fopen("/etc/miniupnpd.conf", "w")' not in start
          assert "ret = miniupnpd_confirm_started(ret);" in start
          confirm = function_body(service, "miniupnpd_confirm_started(int launch_status)")
          assert "MINIUPNPD_START_WAIT_ATTEMPTS" in confirm
          assert "is_upnp_run()" in confirm
          assert "sleep(1)" in confirm
          assert confirm.index("sleep(1)") < confirm.index("is_upnp_run()")
          assert "miniupnpd_start_policy_status(launch_status, daemon_running)" in confirm
          assert "return daemon_running ? 0 : ESRCH;" in policy
          assert "miniupnpd_start_policy_status(0, 0) == ESRCH" in daemon_test
          assert "miniupnpd_start_policy_status(EIO, 1) == EIO" in daemon_test
          assert "miniupnpd daemon startup policy: PASS" in daemon_test
          assert "pid = daemonize();" in daemon_source
          assert "daemon(0, 0)" in daemon_source
          daemon_child = daemonizer.split("/* child process */", 1)[1].split("/* parent process */", 1)[0]
          daemon_parent = daemonizer.split("/* parent process */", 1)[1]
          assert "return pid;" in daemon_child
          assert "exit(0);" in daemon_parent
          main = function_body(daemon_source, "main(int argc, char * * argv)")
          assert main.index("if(init(argc, argv, &v) != 0)") < main.index("OpenAndConfHTTPSocket")
          assert "fclose(fp)" not in start

          assert "mkstemp(temporary_path)" in helper
          assert 'fdopen(fd, "w")' in helper
          assert "fflush(stream)" in helper
          assert "fsync(fileno(stream))" in helper
          assert "fclose(stream)" in helper
          assert "rename(temporary_path, path)" in helper
          assert "unlink(temporary_path)" in helper
          assert helper.index("fflush(stream)") < helper.index("rename(temporary_path, path)")
          assert helper.index("fsync(fileno(stream))") < helper.index("rename(temporary_path, path)")

          for token in (
              "context.result = EIO;", '\"last-good\\n\"',
              '\"complete-new-config\\n\"', "assert_only_target_remains",
              "assert_two_targets_remain", "status == EISDIR",
              '"directory-target"', "(st.st_mode & 0777) == 0600",
          ):
              assert token in test, token

          push_filters = workflow.split("  push:", 1)[1].split("  pull_request:", 1)[0]
          pr_filters = workflow.split("  pull_request:", 1)[1].split("  workflow_dispatch:", 1)[0]
          for path in (
              ".github/workflows/miniupnpd-config-stability.yml",
              "trunk/user/rc/src/services_ex.c",
              "trunk/user/rc/src/miniupnpd_config_file.h",
              "trunk/user/rc/src/tests/miniupnpd_config_file.c",
              "trunk/user/rc/src/miniupnpd_daemon_policy.h",
              "trunk/user/rc/src/tests/miniupnpd_daemon_policy_test.c",
              "trunk/user/miniupnpd/miniupnpd-2.x/miniupnpd.c",
              "trunk/user/miniupnpd/miniupnpd-2.x/daemonize.c",
          ):
              assert push_filters.count(path) == 1
              assert pr_filters.count(path) == 1

          print("miniupnpd config publication, daemon startup postcondition and source contracts: PASS")
          PY

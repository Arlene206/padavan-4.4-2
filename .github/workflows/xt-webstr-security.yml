name: Xtables webstr parser safety regression

on:
  push:
    paths:
      - "trunk/linux-4.4.x/net/netfilter/xt_webstr.c"
      - "trunk/linux-4.4.x/net/netfilter/xt_webstr_parser_policy.h"
      - "trunk/linux-4.4.x/net/netfilter/tests/xt_webstr_parser_policy.c"
      - "trunk/user/iptables/iptables-1.8.7/extensions/libxt_webstr.c"
      - ".github/workflows/xt-webstr-security.yml"
  pull_request:
    paths:
      - "trunk/linux-4.4.x/net/netfilter/xt_webstr.c"
      - "trunk/linux-4.4.x/net/netfilter/xt_webstr_parser_policy.h"
      - "trunk/linux-4.4.x/net/netfilter/tests/xt_webstr_parser_policy.c"
      - "trunk/user/iptables/iptables-1.8.7/extensions/libxt_webstr.c"
      - ".github/workflows/xt-webstr-security.yml"
  workflow_dispatch:

jobs:
  parser-bounds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run GNU89 address/undefined behavior regression
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror -g \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            trunk/linux-4.4.x/net/netfilter/tests/xt_webstr_parser_policy.c \
            -o "$RUNNER_TEMP/xt_webstr_parser_policy"
          ASAN_OPTIONS=detect_leaks=1 "$RUNNER_TEMP/xt_webstr_parser_policy"
      - name: Check kernel and userspace parser integration contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          source = Path("trunk/linux-4.4.x/net/netfilter/xt_webstr.c").read_text()
          matcher = source.split("static bool xt_webstr_match", 1)[1].split(
              "static struct xt_match", 1
          )[0]
          parser = source.split("static int get_http_info", 1)[1].split(
              "static char *search_linear", 1
          )[0]
          userspace = Path(
              "trunk/user/iptables/iptables-1.8.7/extensions/libxt_webstr.c"
          ).read_text()

          assert re.search(r"static\s+httpinfo_t\s+htinfo\s*;", source) is None
          assert "httpinfo_t *htinfo = NULL" in matcher
          assert "kmalloc(sizeof(*htinfo), GFP_ATOMIC)" in matcher
          assert "kfree(htinfo);" in matcher
          assert "kfree(allocated_data);" in matcher
          assert "skb_header_pointer(skb" in matcher
          assert "skb_copy_bits(skb" in matcher
          assert "skb_store_bits((struct sk_buff *)skb" in matcher
          assert "ipv6_skip_exthdr(skb" in matcher
          assert "nexthdr != IPPROTO_TCP" in matcher
          assert "tcph->doff < 5" in matcher
          assert "xt_webstr_tcp_header_is_valid" in matcher
          assert "info->len >= sizeof(info->string)" in matcher
          assert "xt_webstr_next_token" in source
          assert "memset(info, 0, sizeof(*info));" in parser
          assert "int hostlen = 0" in parser
          assert "xt_webstr_find_terminator" in source
          assert "xt_webstr_copy_length" in parser
          assert "xt_webstr_url_path_length" in parser
          assert "haystack_len < needle_len" in source
          assert "if (len >= sizeof(info->string))" in userspace
          assert "memcpy(info->string, s, len + 1)" in userspace
          print("xt_webstr per-packet state, IPv6 offsets and input bounds: OK")
          PY

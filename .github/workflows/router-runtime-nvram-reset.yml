name: Router runtime NVRAM reset failure regression

on:
  push:
    paths:
      - ".github/workflows/router-runtime-nvram-reset.yml"
      - "scripts/check_router_runtime_nvram_reset.py"
      - "trunk/user/rc/src/rc.c"
      - "trunk/user/rc/src/router_runtime_nvram_reset_policy.h"
      - "trunk/user/rc/src/tests/router_runtime_nvram_reset_policy.c"
  pull_request:
    paths:
      - ".github/workflows/router-runtime-nvram-reset.yml"
      - "scripts/check_router_runtime_nvram_reset.py"
      - "trunk/user/rc/src/rc.c"
      - "trunk/user/rc/src/router_runtime_nvram_reset_policy.h"
      - "trunk/user/rc/src/tests/router_runtime_nvram_reset_policy.c"

permissions:
  contents: read

concurrency:
  group: router-runtime-nvram-reset-${{ github.ref }}
  cancel-in-progress: true

jobs:
  router-runtime-nvram-reset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run GNU89 runtime NVRAM reset regression
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -fno-omit-frame-pointer -I trunk/user/rc/src \
            trunk/user/rc/src/tests/router_runtime_nvram_reset_policy.c \
            -o /tmp/router-runtime-nvram-reset-policy
          ASAN_OPTIONS=detect_leaks=1 /tmp/router-runtime-nvram-reset-policy
      - name: Verify checked RC startup wiring and reset coverage
        run: python3 scripts/check_router_runtime_nvram_reset.py

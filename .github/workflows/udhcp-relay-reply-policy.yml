name: DHCP relay BOOTREPLY opcode policy regression

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/udhcp-relay-reply-policy.yml"
      - "trunk/user/busybox/busybox-1.24.x/networking/udhcp/dhcprelay.c"
      - "trunk/user/busybox/busybox-1.24.x/networking/udhcp/udhcp_relay_reply_policy.h"
      - "trunk/user/busybox/busybox-1.24.x/networking/udhcp/tests/udhcp_relay_reply_policy.c"
      - "scripts/check_udhcp_relay_reply_policy.py"
  pull_request:
    paths:
      - ".github/workflows/udhcp-relay-reply-policy.yml"
      - "trunk/user/busybox/busybox-1.24.x/networking/udhcp/dhcprelay.c"
      - "trunk/user/busybox/busybox-1.24.x/networking/udhcp/udhcp_relay_reply_policy.h"
      - "trunk/user/busybox/busybox-1.24.x/networking/udhcp/tests/udhcp_relay_reply_policy.c"
      - "scripts/check_udhcp_relay_reply_policy.py"

permissions:
  contents: read

jobs:
  dhcprelay-reply-opcode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run GNU89 ASan/UBSan BOOTREPLY regression
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -fno-omit-frame-pointer \
            -Itrunk/user/busybox/busybox-1.24.x/networking/udhcp \
            trunk/user/busybox/busybox-1.24.x/networking/udhcp/tests/udhcp_relay_reply_policy.c \
            -o /tmp/udhcp_relay_reply_policy_test
          ASAN_OPTIONS=detect_leaks=1:abort_on_error=1 \
            /tmp/udhcp_relay_reply_policy_test
      - name: Verify BOOTREPLY gate precedes option parsing and XID lookup
        run: python3 scripts/check_udhcp_relay_reply_policy.py

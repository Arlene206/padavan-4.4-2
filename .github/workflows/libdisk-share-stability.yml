name: libdisk share-list output safety

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/libdisk-share-stability.yml"
      - "trunk/user/libdisk/src/disk_share.c"
      - "trunk/user/libdisk/src/disk_share.h"
      - "trunk/user/libdisk/src/disk_share_list_policy.h"
      - "trunk/user/libdisk/src/tests/disk_share_list_policy.c"
      - "trunk/user/rc/src/services_stor.c"
      - "scripts/check_libdisk_share_stability.py"
  pull_request:
    paths:
      - ".github/workflows/libdisk-share-stability.yml"
      - "trunk/user/libdisk/src/disk_share.c"
      - "trunk/user/libdisk/src/disk_share.h"
      - "trunk/user/libdisk/src/disk_share_list_policy.h"
      - "trunk/user/libdisk/src/tests/disk_share_list_policy.c"
      - "trunk/user/rc/src/services_stor.c"
      - "scripts/check_libdisk_share_stability.py"

permissions:
  contents: read

jobs:
  share-list-output-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: GNU89 address/undefined sanitizer regression
        run: |
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer \
            -I trunk/user/libdisk/src \
            trunk/user/libdisk/src/tests/disk_share_list_policy.c \
            -o /tmp/disk-share-list-policy
          ASAN_OPTIONS=detect_leaks=1 /tmp/disk-share-list-policy
      - name: Verify public APIs and Samba failure cleanup
        run: python3 scripts/check_libdisk_share_stability.py

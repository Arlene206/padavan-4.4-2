name: USB storage hotplug stability regression

on:
  push:
    paths:
      - ".github/workflows/storage-hotplug-stability.yml"
      - "trunk/user/rc/src/rc.c"
      - "trunk/user/rc/src/common_ex.c"
      - "trunk/user/rc/src/init.c"
      - "trunk/user/rc/src/rc.h"
      - "trunk/user/nfs-utils/nfsd.sh"
      - "trunk/user/rc/src/hotplug_stor.c"
      - "trunk/user/rc/src/storage_operation_lock.h"
      - "trunk/user/rc/src/storage_partition_probe.h"
      - "trunk/user/libdisk/src/disk_initial.c"
      - "trunk/user/libdisk/src/storage_swap_policy.h"
      - "trunk/user/scripts/files/sbin/automount.sh"
      - "trunk/user/scripts/files/sbin/spindown.sh"
      - "trunk/user/optware/opt-mount.sh"
      - "trunk/user/rc/src/tests/storage_operation_lock.c"
      - "trunk/user/rc/src/services_stor.c"
      - "trunk/user/rc/src/storage_optware_start_policy.h"
      - "trunk/user/rc/src/tests/storage_optware_start_policy.c"
      - "trunk/user/rc/src/storage_service_stop_policy.h"
      - "trunk/user/rc/src/tests/storage_service_stop_policy.c"
      - "trunk/user/shared/src/shutils.h"
      - "trunk/user/rc/src/storage_ejected_inventory_policy.h"
      - "trunk/user/rc/src/tests/storage_ejected_inventory_policy.c"
      - "trunk/user/scripts/tests/optware_lifecycle_lock.sh"
      - "trunk/user/scripts/tests/optware_lifecycle_teardown.sh"
      - "trunk/user/scripts/tests/optware_lifecycle_startup.sh"
      - "trunk/user/scripts/files/sbin/optware_lifecycle_lock.sh"
      - "trunk/user/optware/opt-umount.sh"
      - "trunk/user/optware/opt-start.sh"
      - "trunk/configs/boards/busybox.config"
      - "trunk/configure"
      - "trunk/user/busybox/Makefile"
      - "trunk/user/busybox/busybox-1.24.x/**"
  pull_request:
    paths:
      - ".github/workflows/storage-hotplug-stability.yml"
      - "trunk/user/rc/src/rc.c"
      - "trunk/user/rc/src/common_ex.c"
      - "trunk/user/rc/src/init.c"
      - "trunk/user/rc/src/rc.h"
      - "trunk/user/nfs-utils/nfsd.sh"
      - "trunk/user/rc/src/hotplug_stor.c"
      - "trunk/user/rc/src/storage_operation_lock.h"
      - "trunk/user/rc/src/storage_partition_probe.h"
      - "trunk/user/libdisk/src/disk_initial.c"
      - "trunk/user/libdisk/src/storage_swap_policy.h"
      - "trunk/user/scripts/files/sbin/automount.sh"
      - "trunk/user/scripts/files/sbin/spindown.sh"
      - "trunk/user/optware/opt-mount.sh"
      - "trunk/user/rc/src/tests/storage_operation_lock.c"
      - "trunk/user/rc/src/services_stor.c"
      - "trunk/user/rc/src/storage_optware_start_policy.h"
      - "trunk/user/rc/src/tests/storage_optware_start_policy.c"
      - "trunk/user/rc/src/storage_service_stop_policy.h"
      - "trunk/user/rc/src/tests/storage_service_stop_policy.c"
      - "trunk/user/shared/src/shutils.h"
      - "trunk/user/rc/src/storage_ejected_inventory_policy.h"
      - "trunk/user/rc/src/tests/storage_ejected_inventory_policy.c"
      - "trunk/user/scripts/tests/optware_lifecycle_lock.sh"
      - "trunk/user/scripts/tests/optware_lifecycle_teardown.sh"
      - "trunk/user/scripts/tests/optware_lifecycle_startup.sh"
      - "trunk/user/scripts/files/sbin/optware_lifecycle_lock.sh"
      - "trunk/user/optware/opt-umount.sh"
      - "trunk/user/optware/opt-start.sh"
      - "trunk/configs/boards/busybox.config"
      - "trunk/configure"
      - "trunk/user/busybox/Makefile"
      - "trunk/user/busybox/busybox-1.24.x/**"

jobs:
  storage-hotplug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check NFS service stop script syntax
        run: sh -n trunk/user/nfs-utils/nfsd.sh
      - name: Check Optware MTD startup script syntax
        run: sh -n trunk/user/optware/opt-mount.sh
      - name: Check Optware teardown and lifecycle helper syntax
        run: |
          set -eu
          sh -n trunk/user/optware/opt-umount.sh
          sh -n trunk/user/scripts/files/sbin/optware_lifecycle_lock.sh
      - name: Verify Optware startup and teardown lock regression
        run: |
          set -eu
          sh trunk/user/scripts/tests/optware_lifecycle_lock.sh
      - name: Verify Optware teardown status propagation regression
        run: |
          set -eu
          sh trunk/user/scripts/tests/optware_lifecycle_teardown.sh
      - name: Verify Optware startup supervision and rollback regression
        run: |
          set -eu
          sh trunk/user/scripts/tests/optware_lifecycle_startup.sh

      - name: Build firmware BusyBox 1.24.2 and run Optware lifecycle regressions under ash
        run: |
          set -eu
          busybox_dir=trunk/user/busybox/busybox-1.24.x
          busybox_bin="$PWD/$busybox_dir/busybox"

          # Use the same common configuration copied by trunk/configure.
          cp trunk/configs/boards/busybox.config "$busybox_dir/.config"
          # BusyBox 1.24.2 date uses legacy stime(), absent from current host glibc.
          # DATE is unrelated to these lifecycle tests; disable it only in this
          # disposable host config. The tracked firmware config retains CONFIG_DATE=y.
          sed -i 's/^CONFIG_DATE=y$/# CONFIG_DATE is not set/' "$busybox_dir/.config"
          # Mirror the firmware package's EXTRA_CFLAGS for the shared DUID header.
          # This direct host build bypasses package.mk and must provide the same include.
          sed -i '/^CONFIG_EXTRA_CFLAGS=/d; /^# CONFIG_EXTRA_CFLAGS is not set$/d' "$busybox_dir/.config"
          printf '%s\n' "CONFIG_EXTRA_CFLAGS=\"-I$PWD/trunk/user/shared/src\"" >> "$busybox_dir/.config"
          make -C "$busybox_dir" oldconfig </dev/null
          if ! grep -Fqx "CONFIG_EXTRA_CFLAGS=\"-I$PWD/trunk/user/shared/src\"" "$busybox_dir/.config"; then
            echo "Host BusyBox config lost the shared DUID header include path" >&2
            exit 1
          fi
          if grep -qx 'CONFIG_DATE=y' "$busybox_dir/.config"; then
            echo "Host-only BusyBox config unexpectedly re-enabled DATE" >&2
            exit 1
          fi

          for feature in CONFIG_ASH CONFIG_FEATURE_SH_IS_ASH CONFIG_AWK CONFIG_FLOCK \
                         CONFIG_CAT CONFIG_CHMOD CONFIG_DIRNAME CONFIG_GREP CONFIG_MKDIR \
                         CONFIG_RM CONFIG_SLEEP CONFIG_WC; do
            if ! grep -qx "$feature=y" "$busybox_dir/.config"; then
              echo "Required firmware BusyBox feature is disabled: $feature" >&2
              exit 1
            fi
          done

          make -C "$busybox_dir" -j2 busybox
          test -x "$busybox_bin"
          # Exercise required applets directly. Do not infer functionality
          # from the human-readable --list output.
          "$busybox_bin" ash -c 'test "$((2 + 2))" -eq 4'
          "$busybox_bin" awk 'BEGIN { exit 0 }'

          runtime_dir=$(mktemp -d)
          trap 'rm -rf "$runtime_dir"' EXIT
          mkdir -p "$runtime_dir/bin"
          : > "$runtime_dir/flock-smoke.lock"
          (
            exec 9>>"$runtime_dir/flock-smoke.lock"
            "$busybox_bin" flock -n 9
            "$busybox_bin" flock -u 9
          )
          for applet in awk cat chmod dirname flock grep mkdir rm sleep wc; do
            ln -s "$busybox_bin" "$runtime_dir/bin/$applet"
          done
          ln -s "$busybox_bin" "$runtime_dir/bin/sh"
          export PATH="$runtime_dir/bin:$PATH"
          export OPTWARE_TEST_SHELL="$runtime_dir/bin/sh"

          # mktemp is intentionally supplied by the runner: it is disabled in
          # firmware config. Tested shell and lifecycle applets resolve from
          # the BusyBox 1.24.2 applet directory above.
          "$busybox_bin" ash -n trunk/user/optware/opt-mount.sh
          "$busybox_bin" ash -n trunk/user/optware/opt-umount.sh
          "$busybox_bin" ash -n trunk/user/optware/opt-start.sh
          "$busybox_bin" ash -n trunk/user/scripts/files/sbin/optware_lifecycle_lock.sh

          "$busybox_bin" ash trunk/user/scripts/tests/optware_lifecycle_lock.sh
          "$busybox_bin" ash trunk/user/scripts/tests/optware_lifecycle_teardown.sh
          "$busybox_bin" ash trunk/user/scripts/tests/optware_lifecycle_startup.sh
      - name: Compile and run storage eject inventory regression
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror \
            -I trunk/user/rc/src \
            trunk/user/rc/src/tests/storage_ejected_inventory_policy.c \
            -o /tmp/storage-ejected-inventory
          /tmp/storage-ejected-inventory
          cc -std=gnu89 -Wall -Wextra -Werror \
            -I trunk/user/rc/src \
            -I trunk/user/shared/src \
            trunk/user/rc/src/tests/storage_operation_lock.c \
            trunk/user/shared/src/bin_sem_asus.c \
            -o /tmp/storage-operation-lock
          /tmp/storage-operation-lock
      - name: Compile and run deferred Optware child-result regression
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror \
            -I trunk/user/rc/src \
            trunk/user/rc/src/tests/storage_optware_start_policy.c \
            -o /tmp/storage-optware-start-policy
          /tmp/storage-optware-start-policy
      - name: Compile and run storage daemon stop postcondition regression
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer \
            -I trunk/user/rc/src \
            trunk/user/rc/src/tests/storage_service_stop_policy.c \
            -o /tmp/storage-service-stop-policy
          /tmp/storage-service-stop-policy
      - name: Verify whole storage caller graph, operation locks and failure propagation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          rc_dir = Path("trunk/user/rc/src")
          storage = (rc_dir / "services_stor.c").read_text()
          policy = (rc_dir / "storage_ejected_inventory_policy.h").read_text()
          optware_policy = (rc_dir / "storage_optware_start_policy.h").read_text()
          optware_policy_test = (rc_dir / "tests/storage_optware_start_policy.c").read_text()
          storage_stop_policy = (rc_dir / "storage_service_stop_policy.h").read_text()
          storage_stop_test = (rc_dir / "tests/storage_service_stop_policy.c").read_text()
          rc = (rc_dir / "rc.c").read_text()
          workflow = Path(".github/workflows/storage-hotplug-stability.yml").read_text()
          nfs_script = Path("trunk/user/nfs-utils/nfsd.sh").read_text()
          rc_header = (rc_dir / "rc.h").read_text()
          common_ex = (rc_dir / "common_ex.c").read_text()
          init_source = (rc_dir / "init.c").read_text()

          def function_body(text, signature):
              start = text.index(signature)
              brace = text.index("{", start)
              depth = 0
              for pos in range(brace, len(text)):
                  if text[pos] == "{":
                      depth += 1
                  elif text[pos] == "}":
                      depth -= 1
                      if depth == 0:
                          return text[brace + 1:pos]
              raise AssertionError(f"unterminated function: {signature}")

          stage = function_body(storage, "storage_stage_ejected_partitions(")
          assert "fopen(PROC_PARTITIONS_FILE" in stage
          assert "storage_ejected_parse_partition_line(" in stage
          assert "ferror(procpt)" in stage
          assert "fclose(procpt)" in stage
          assert "storage_ejected_inventory_complete(" in stage
          assert "free_storage_ejected_partitions(head)" in stage

          eject = function_body(storage, "umount_ejected_locked(void)")
          stage_call = "storage_stage_ejected_partitions(&partitions)"
          unmount_loop = "for (entry = head; entry; entry = entry->next)"
          assert eject.index(stage_call) < eject.index(unmount_loop)
          assert "fopen(PROC_PARTITIONS_FILE" not in eject
          assert "storage_ejected_partition_is_active(entry->device + 5," in eject
          assert "umount(entry->mountpoint)" in eject

          parse = function_body(policy, "storage_ejected_parse_partition_line(")
          assert "storage_ejected_line_is_complete(line)" in parse
          assert "storage_ejected_decimal_token(major)" in parse
          assert "storage_ejected_decimal_token(minor)" in parse
          assert "storage_ejected_decimal_token(blocks)" in parse

          notifications = function_body(rc, "handle_notifications(void)")
          unplug = 'else if (!strcmp(entry->d_name, "on_unplug_mass_storage"))'
          assert unplug in notifications
          unplug_body = notifications[notifications.index(unplug):]
          assert "action_result = umount_ejected();" in unplug_body
          assert "Notification %s failed; completion marker retained" in notifications
          assert "Wireless notification %s failed" not in notifications

          paths = (
              ".github/workflows/storage-hotplug-stability.yml",
              "trunk/user/rc/src/rc.c",
              "trunk/user/rc/src/common_ex.c",
              "trunk/user/rc/src/services_stor.c",
              "trunk/user/rc/src/storage_ejected_inventory_policy.h",
              "trunk/user/rc/src/tests/storage_ejected_inventory_policy.c",
          )
          filters = workflow.split("jobs:", 1)[0]
          push_filters, pr_filters = filters.split("  pull_request:", 1)
          for path in paths:
              assert push_filters.count(path) == 1
              assert pr_filters.count(path) == 1


          hotplug = (rc_dir / "hotplug_stor.c").read_text()
          probe = (rc_dir / "storage_partition_probe.h").read_text()
          libdisk_dir = Path("trunk/user/libdisk/src")
          libdisk = (libdisk_dir / "disk_initial.c").read_text()
          swap_policy = (libdisk_dir / "storage_swap_policy.h").read_text()
          automount = Path("trunk/user/scripts/files/sbin/automount.sh").read_text()
          spindown = Path("trunk/user/scripts/files/sbin/spindown.sh").read_text()
          opt_mount = Path("trunk/user/optware/opt-mount.sh").read_text()
          lock_policy = (rc_dir / "storage_operation_lock.h").read_text()
          lock_test = (rc_dir / "tests/storage_operation_lock.c").read_text()
          opt_start = Path("trunk/user/optware/opt-start.sh").read_text()
          opt_umount = Path("trunk/user/optware/opt-umount.sh").read_text()
          opt_lock = Path("trunk/user/scripts/files/sbin/optware_lifecycle_lock.sh").read_text()
          opt_lock_test = Path("trunk/user/scripts/tests/optware_lifecycle_lock.sh").read_text()
          opt_teardown_test = Path("trunk/user/scripts/tests/optware_lifecycle_teardown.sh").read_text()
          opt_startup_test = Path("trunk/user/scripts/tests/optware_lifecycle_startup.sh").read_text()
          shutils = Path("trunk/user/shared/src/shutils.h").read_text()
          busybox_package = Path("trunk/user/busybox/Makefile").read_text()
          busybox_config = Path("trunk/configs/boards/busybox.config").read_text()
          busybox_configure = Path("trunk/configure").read_text()
          busybox_dhcpc = Path("trunk/user/busybox/busybox-1.24.x/networking/udhcp/dhcpc.c").read_text()
          busybox_udhcpc_policy = Path("trunk/user/busybox/busybox-1.24.x/networking/udhcp/udhcpc_script_policy.h").read_text()
          busybox_dhcp6c_common = Path("trunk/user/busybox/busybox-1.24.x/networking/udhcp/dhcp6c_common.c").read_text()
          busybox_flags = Path("trunk/user/busybox/busybox-1.24.x/Makefile.flags").read_text()

          assert '#define STORAGE_OPERATION_LOCK_TAG "storage"' in lock_policy
          assert "storage_operation_lock_acquire(file_lock)" in lock_test

          for signature in ("mdev_sd_main(", "mdev_mmc_main("):
              body = function_body(hotplug, signature)
              assert body.index("file_lock(device_name)") < body.index("storage_operation_lock_acquire(file_lock)")
              assert body.count("file_unlock(storage_lock);") == 1
              assert body.rindex("file_unlock(storage_lock);") < body.rindex("file_unlock(isLock);")

          storage_locked = function_body(storage, "umount_ejected_locked(void)")
          wrapper = function_body(storage, "umount_ejected(void)")
          assert "storage_stage_ejected_partitions(&partitions)" in storage_locked
          assert "storage_operation_lock_acquire(file_lock)" in wrapper
          assert wrapper.index("storage_operation_lock_acquire(file_lock)") < wrapper.index("umount_ejected_locked()")
          assert "file_unlock(storage_lock);" in wrapper

          safe_remove = function_body(storage, "safe_remove_stor_device(")
          assert safe_remove.index("storage_operation_lock_acquire(file_lock)") < safe_remove.index("read_disk_data()")
          assert "umount_ejected_locked()" in safe_remove
          assert safe_remove.count("file_unlock(storage_lock);") == 3
          assert "umount_ejected();" not in safe_remove

          remove_all = function_body(storage, "safe_remove_all_stor_devices(")
          assert remove_all.index("storage_operation_lock_acquire(file_lock)") < remove_all.index("read_disk_data()")
          assert "if (path_status == 0)" in remove_all
          assert remove_all.index("if (path_status == 0)") < remove_all.index("fallback_status = umount_all_storage();")
          assert "refusing fallback unmount" in remove_all
          assert remove_all.count("file_unlock(storage_lock);") == 2

          # Deferred removable-storage startup preserves a tri-state inventory,
          # separates integrated app work from Optware work, and observes the
          # external worker's real exit result without blocking PID 1.
          inventory_gate = function_body(storage, "storage_has_mounted_devices(")
          assert "storage_mount_inventory_is_complete(mount_count)" in inventory_gate
          assert "return -1;" in inventory_gate
          assert "storage_mount_inventory_has_mounts(mount_count) ? 1 : 0" in inventory_gate
          deferred_start = function_body(storage, "try_start_stor_apps(void)")
          assert deferred_start.index("storage_operation_lock_acquire(file_lock)") < deferred_start.index("storage_has_mounted_devices(")
          inventory_check = deferred_start.index('mounted_devices = storage_has_mounted_devices("starting storage applications");')
          start_apps_call = deferred_start.index("start_stor_apps();")
          assert inventory_check < start_apps_call
          hotplug_flag_clear = deferred_start.index('nvram_set_int_temp("usb_hotplug_ms", 0)', start_apps_call)
          assert start_apps_call < hotplug_flag_clear
          storage_unlock = deferred_start.rindex("file_unlock(storage_lock);")
          optware_launch = deferred_start.index("storage_optware_start_async()")
          assert storage_unlock < optware_launch
          assert "STORAGE_OPTWARE_START_CHILD_SUCCESS" in deferred_start
          success_gate = deferred_start.index("if (child_result == STORAGE_OPTWARE_START_CHILD_SUCCESS)")
          assert deferred_start.index('nvram_set_int_temp("usb_opt_start", 0);', success_gate) > success_gate
          assert "STORAGE_OPTWARE_START_CHILD_FAILURE" in deferred_start
          assert "preserving pending state for retry" in deferred_start
          assert 'system("/usr/bin/opt-start.sh &")' not in deferred_start

          child_reader = function_body(storage, "storage_optware_start_result_read(void)")
          assert "read(storage_optware_result_fd" in child_reader
          assert "EAGAIN" in child_reader and "STORAGE_OPTWARE_START_CHILD_RUNNING" in child_reader
          assert "storage_optware_start_decode_result" in child_reader
          child_launcher = function_body(storage, "storage_optware_start_async(void)")
          assert "storage_optware_result_fd >= 0" in child_launcher
          assert "pipe(pipe_fd)" in child_launcher and "O_NONBLOCK" in child_launcher
          assert "FD_CLOEXEC" in child_launcher
          assert "child = fork();" in child_launcher
          assert 'system("/usr/bin/opt-start.sh")' in child_launcher
          assert "WIFEXITED(command_status)" in child_launcher
          assert "write(pipe_fd[1]" in child_launcher
          assert "kill(1, SIGALRM)" in child_launcher

          deferred_event = function_body(storage, "on_deferred_hotplug_dev(void)")
          assert 'nvram_match("usb_hotplug_ms", "1")' in deferred_event
          assert 'nvram_match("usb_opt_start", "1")' in deferred_event
          assert "storage_optware_result_fd >= 0" in deferred_event
          assert "if (storage_start_result != 0)" in deferred_event
          assert "alarm(5);" in deferred_event

          assert "STORAGE_OPTWARE_START_CHILD_RUNNING" in optware_policy
          assert "STORAGE_OPTWARE_START_CHILD_SUCCESS" in optware_policy
          assert "STORAGE_OPTWARE_START_CHILD_FAILURE" in optware_policy
          assert "bytes_read != 1" in optware_policy
          assert "decode_result(-1, 0)" in optware_policy_test
          assert "decode_result(1, 0)" in optware_policy_test
          assert "decode_result(1, 1)" in optware_policy_test
          assert "decode_result(0, 0)" in optware_policy_test

          assert "flock 9" in opt_lock and "flock -n 9" in opt_lock
          assert 'exec 9>>"$optware_lock_file"' in opt_lock
          assert "optware_lifecycle_lock_try_acquire" in opt_lock_test
          assert opt_start.index("optware_lifecycle_lock_acquire") < opt_start.index("mountpoint -q /opt")
          assert opt_start.index("mountpoint -q /opt") < opt_start.index("optware_lifecycle_start_services")
          assert opt_start.index("optware_lifecycle_start_services") < opt_start.rindex("optware_lifecycle_lock_release")

          start_gate = "if ! optware_lifecycle_start_services /opt/etc/init.d; then"
          start_gate_pos = opt_start.index(start_gate)
          start_abort_release = opt_start.index("optware_lifecycle_lock_release", start_gate_pos)
          start_abort_exit = opt_start.index("exit 1", start_abort_release)
          assert opt_start.index("optware_lifecycle_lock_acquire") < start_gate_pos
          assert start_gate_pos < start_abort_release < start_abort_exit
          assert start_abort_exit < opt_start.index("# install and update ipkg/opkg", start_gate_pos)
          assert "for i in `ls /opt/etc/init.d/S??* 2>/dev/null`" not in opt_start
          assert "${i} start" not in opt_start

          start_helper_pos = opt_lock.index("optware_lifecycle_start_services()")
          start_helper_end = opt_lock.index("# Stop every executable service", start_helper_pos)
          start_helper = opt_lock[start_helper_pos:start_helper_end]
          assert 'for _optware_service in "$_optware_service_dir"/S??*; do' in start_helper
          assert '"$_optware_service" start 9>&-' in start_helper
          assert 'set -- "$_optware_service" "$@"' in start_helper
          assert '"$_optware_rollback_service" stop 9>&-' in start_helper
          assert "return 1" in start_helper
          assert "S02 with space" in opt_startup_test
          assert "partial-start rollback" in opt_startup_test
          assert "startup hook inherited lifecycle lock fd 9" in opt_startup_test
          assert opt_umount.index("optware_lifecycle_lock_try_acquire") < opt_umount.index("mountpoint -q /opt")
          assert opt_umount.index("optware_lifecycle_stop_services") < opt_umount.index("optware_lifecycle_umount_opt")
          assert '"$_optware_service" stop 9>&-' in opt_lock
          assert opt_umount.index("optware_lifecycle_umount_opt") < opt_umount.rindex("optware_lifecycle_lock_release")

          assert "optware_lifecycle_stop_services()" in opt_lock
          stop_helper_pos = opt_lock.index("optware_lifecycle_stop_services()")
          stop_helper_end = opt_lock.index("# Retry one failed /opt unmount", stop_helper_pos)
          stop_helper = opt_lock[stop_helper_pos:stop_helper_end]
          assert 'for _optware_service in "$_optware_service_dir"/S??*; do' in stop_helper
          assert 'set -- "$_optware_service" "$@"' in stop_helper
          assert 'for _optware_service in "$@"; do' in stop_helper
          assert "ls -r " not in stop_helper
          assert "S02 fail with space" in opt_teardown_test

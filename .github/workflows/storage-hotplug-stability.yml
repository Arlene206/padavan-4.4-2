                      process_suffix = "torrent" if stop_name == "stop_torrent" else "aria"
                      assert "process_state = is_{}_run();".format(process_suffix) in locked_body
                      assert "process_state == PROCESS_PRESENCE_ABSENT" in locked_body
                      assert "process_state != PROCESS_PRESENCE_RUNNING" in locked_body
                      assert "refusing name-wide stop because daemon presence is unknown" in locked_body
                      assert "kill_services(svcs," in locked_body
              assert "if (" + locked_name + "(" in stop_apps
              assert "int " + signature + ";" in rc_header
          assert "int stop_ftpsamba(void);" in rc_header
          group_stop = function_body(storage, "stop_ftpsamba(void)")
          assert group_stop.index("storage_operation_lock_acquire(file_lock)") < group_stop.index("stop_ftp_locked()")
          assert group_stop.index("stop_ftp_locked()") < group_stop.index("stop_samba_locked(0)")
          assert group_stop.index("stop_samba_locked(0)") < group_stop.index("file_unlock(storage_lock);")
          assert group_stop.count("file_unlock(storage_lock);") == 1
          assert "storage_service_stop_status_merge" in group_stop
          assert "stop_ftp()" not in group_stop and "stop_samba(0)" not in group_stop
          assert "storage_service_stop_status_merge" in storage_stop_policy
          assert "group stop success" in storage_stop_test
          assert "second daemon failure" in storage_stop_test
          assert "preserve first daemon failure" in storage_stop_test
          assert "successful stop" in storage_stop_test
          assert "command failure" in storage_stop_test
          assert "daemon remains" in storage_stop_test
          assert "negative process query" in storage_stop_test
          assert "storage_service_process_presence_changed" in storage_stop_policy
          assert "PROCESS_PRESENCE_ABSENT" in ftp_policy
          assert "PROCESS_PRESENCE_UNKNOWN" in daemon_wait_policy and "EIO" in daemon_wait_policy
          assert "PROCESS_PRESENCE_UNKNOWN" in ftp_test and "EACCES" in ftp_test
          assert "service_daemon_wait_for_stable_presence" in ftp_test
          for restart_name, stop_name, start_name, operation in (
              ("restart_dms", "stop_dms", "run_dms", "DLNA"),
              ("restart_itunes", "stop_itunes", "run_itunes", "Firefly"),
              ("restart_torrent", "stop_torrent", "run_torrent", "Transmission"),
              ("restart_aria", "stop_aria", "run_aria", "Aria"),
          ):
              restart_body = function_body(storage, restart_name + "(")
              lock_acquire = restart_body.index("storage_operation_lock_acquire(file_lock)")
              stop_call = restart_body.index("stop_status = " + stop_name + "_locked()")
              stop_failure = restart_body.index("if (stop_status != 0)")
              mount_inventory = restart_body.index('mount_status = storage_has_mounted_devices("restarting ' + operation + '")')
              start_gate = restart_body.index("if (mount_status > 0)")
              start_call = restart_body.index(start_name + "(")
              unlock = restart_body.index("file_unlock(storage_lock);")
              assert lock_acquire < stop_call < stop_failure < mount_inventory < start_gate < start_call < unlock
              assert restart_body.index("goto out;", stop_failure) < mount_inventory
              assert "if (mount_status < 0)" in restart_body
              assert restart_body.count("file_unlock(storage_lock);") == 1
              if restart_name in ("restart_dms", "restart_itunes"):
                  unknown_gate = restart_body.index("if (mount_status < 0)")
                  assert restart_body.index("goto out;", unknown_gate) < start_gate
              else:
                  assert "else if (mount_status < 0)" in restart_body
                  assert restart_body.index("else if (mount_status < 0)") > start_call
          nfs_enabled_read = function_body(storage, "nfsd_enabled_config_read(int *enabled)")
          nfs_start_impl = function_body(storage, "run_nfsd_enabled_locked(int enabled)")
          run_nfsd_locked = function_body(storage, "run_nfsd_locked(void)")
          config_read_call = "nfsd_enabled_config_read(&enabled)"
          assert 'nvram_get_checked("nfsd_enable", &value)' in nfs_enabled_read
          assert "storage_nfs_enabled_status(api_result, saved_errno" in nfs_enabled_read
          assert config_read_call in run_nfsd_locked
          assert run_nfsd_locked.index(config_read_call) < run_nfsd_locked.index("if (config_status != 0)")
          assert "write_nfsd_exports()" not in run_nfsd_locked
          assert "return -1;" in run_nfsd_locked
          assert "run_nfsd_enabled_locked(enabled)" in run_nfsd_locked
          assert 'nvram_invmatch("nfsd_enable", "1")' not in run_nfsd_locked
          assert "if (!enabled)" in nfs_start_impl
          assert "write_nfsd_exports()" in nfs_start_impl
          assert "storage_nfs_export_may_start" in nfs_start_impl
          assert nfs_start_impl.index("storage_nfs_export_may_start") < nfs_start_impl.index('eval("/usr/bin/nfsd.sh", "start")')
          nfs_reload_impl = function_body(storage, "reload_nfsd_enabled_locked(int enabled)")
          reload_nfsd_locked = function_body(storage, "reload_nfsd_locked(void)")
          assert config_read_call in reload_nfsd_locked
          assert "reload_nfsd_enabled_locked(enabled)" in reload_nfsd_locked
          assert "write_nfsd_exports()" not in reload_nfsd_locked
          assert "if (!enabled)" in nfs_reload_impl
          assert "storage_nfs_export_may_start" in nfs_reload_impl
          assert nfs_reload_impl.index("storage_nfs_export_may_start") < nfs_reload_impl.index('eval("/usr/bin/nfsd.sh", "reload")')
          start_apps = function_body(storage, "start_stor_apps(void)")
          assert "run_nfsd_locked()" in start_apps and "run_nfsd()" not in start_apps
          restart_nfsd = function_body(storage, "int restart_nfsd(void)")
          lock_acquire = restart_nfsd.index("storage_operation_lock_acquire(file_lock)")
          config_read = restart_nfsd.index("nfsd_enabled_config_read(&nfsd_enabled)")
          config_error = restart_nfsd.index("if (config_status != 0)", config_read)
          mount_inventory = restart_nfsd.index("mount_count = count_stor_mountpoint()")
          stop_call = restart_nfsd.index("if (stop_nfsd_locked() != 0)")
          start_call = restart_nfsd.index("run_nfsd_enabled_locked(nfsd_enabled)")
          assert lock_acquire < config_read < config_error < mount_inventory < stop_call < start_call
          assert "file_unlock(storage_lock)" in restart_nfsd
          assert 'nvram_match("nfsd_enable", "1")' not in restart_nfsd
          # FTP and Samba public restarts must share the same cross-process
          # eject barrier used by mdev and safe removal, without nesting it
          # inside start_stor_apps()/stop_stor_apps() locked callers.
          ftp_restart = function_body(storage, "restart_ftpd(void)")
          assert ftp_restart.index("storage_operation_lock_acquire(file_lock)") < ftp_restart.index("stop_ftp_locked()")
          assert ftp_restart.index("stop_ftp_locked()") < ftp_restart.index("storage_has_mounted_devices")
          assert ftp_restart.index("storage_has_mounted_devices") < ftp_restart.index("run_ftp()")
          assert ftp_restart.index("run_ftp()") < ftp_restart.index("file_unlock(storage_lock);")
          assert ftp_restart.count("file_unlock(storage_lock);") == 1
          samba_restart = function_body(storage, "int restart_smbd(void)")
          assert samba_restart.index("storage_operation_lock_acquire(file_lock)") < samba_restart.index("stop_samba_locked(1)")
          assert samba_restart.index("stop_samba_locked(1)") < samba_restart.index("storage_has_mounted_devices")
          assert samba_restart.index("storage_has_mounted_devices") < samba_restart.index("run_samba()")
          assert samba_restart.index("run_samba()") < samba_restart.index("file_unlock(storage_lock);")
          assert samba_restart.index("start_wins()") < samba_restart.index("file_unlock(storage_lock);")
          assert samba_restart.count("file_unlock(storage_lock);") == 1
          assert 'action_result = restart_nfsd();' in rc and 'ret = stop_nfsd();' in rc
          assert 'ret = stop_ftpsamba();' in rc
          for applet_call in (
              'ret = stop_ftp();', 'ret = stop_samba(0);',
              'ret = stop_dms();', 'ret = stop_itunes();',
              'ret = stop_torrent();', 'ret = stop_aria();',
          ):
              assert applet_call in rc
          assert "storage_service_stop_status_merge" in storage_stop_policy
          # The CI ash binary is built from the same version/config used by firmware.
          assert "PKG_VERSION:=1.24" in busybox_package
          assert "SRC_DIR=./busybox-1.24.x" in busybox_package
          assert "# Busybox version: 1.24.2" in busybox_config
          # Keep the production DHCP retry call linked to its shared policy helper.
          assert '#include "udhcpc_script_policy.h"' in busybox_dhcpc
          assert busybox_dhcpc.count("udhcpc_script_failure_prepare_retry(") == 1
          assert "udhcp_script_failure_prepare_retry(" not in busybox_dhcpc
          assert "static inline void udhcpc_script_failure_prepare_retry(" in busybox_udhcpc_policy
          # DHCPv6 DUID is shared user-space policy; both firmware package and
          # the standalone host BusyBox build must provide its source include.
          assert '#include "dhcp6c_duid_file_policy.h"' in busybox_dhcp6c_common
          assert "#include <sys/uio.h>" in busybox_dhcp6c_common
          assert "EXTRA_CFLAGS += -I$(ROOTDIR)/user/shared/src" in busybox_package
          assert "CONFIG_EXTRA_CFLAGS" in busybox_flags
          host_busybox_step = workflow.split("- name: Build firmware BusyBox 1.24.2 and run Optware lifecycle regressions under ash", 1)[1].split("- name: Compile and run storage eject inventory regression", 1)[0]
          assert "CONFIG_EXTRA_CFLAGS" in host_busybox_step
          assert "trunk/user/shared/src" in host_busybox_step
          assert "grep -Fqx" in host_busybox_step
          assert host_busybox_step.index("CONFIG_EXTRA_CFLAGS") < host_busybox_step.index('make -C "$busybox_dir" -j2 busybox')
          assert "CONFIG_DATE=y" in busybox_config

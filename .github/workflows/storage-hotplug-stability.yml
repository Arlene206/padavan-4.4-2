concurrency:
  group: storage-hotplug-stability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  storage-hotplug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run storage hotplug share-name formatting regression
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -fno-omit-frame-pointer -I trunk/user/rc/src \
            trunk/user/rc/src/tests/storage_hotplug_name_policy.c \
            -o /tmp/storage-hotplug-name-policy
          ASAN_OPTIONS=detect_leaks=1 /tmp/storage-hotplug-name-policy
      - name: Compile and run storage hotplug notification failure regression
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -fno-omit-frame-pointer -I trunk/user/rc/src \
            trunk/user/rc/src/tests/storage_hotplug_notify_policy.c \
            -o /tmp/storage-hotplug-notify-policy
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 /tmp/storage-hotplug-notify-policy
      - name: Compile and run strict storage partition inventory regression
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -fno-omit-frame-pointer -I trunk/user/rc/src -I trunk/user/libdisk/src \
            trunk/user/rc/src/tests/storage_partition_probe.c \
            -o /tmp/storage-partition-probe
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 /tmp/storage-partition-probe
      - name: Verify HDD tuning failures are aggregated without skipping later devices
        run: |
          set -eu
          sh -n trunk/user/scripts/files/sbin/hddtune.sh
          sh -n trunk/user/scripts/tests/hddtune_status.sh
          sh trunk/user/scripts/tests/hddtune_status.sh
      - name: Check NFS service stop script syntax
        run: sh -n trunk/user/nfs-utils/nfsd.sh
      - name: Check Transmission and Aria launcher syntax and startup status propagation
        run: |
          set -eu
          sh -n trunk/user/transmission/transmission.sh
          sh -n trunk/user/aria2/aria.sh
          sh trunk/user/scripts/tests/storage_app_start_status.sh
      - name: Check Optware MTD startup script syntax
        run: sh -n trunk/user/optware/opt-mount.sh
      - name: Check Optware teardown and lifecycle helper syntax
        run: |
          set -eu
          sh -n trunk/user/optware/opt-umount.sh
          sh -n trunk/user/scripts/files/sbin/optware_lifecycle_lock.sh
      - name: Verify Optware startup and teardown lock regression
        run: |
          set -eu
          sh trunk/user/scripts/tests/optware_lifecycle_lock.sh
      - name: Verify Optware teardown status propagation regression
        run: |
          set -eu
          sh trunk/user/scripts/tests/optware_lifecycle_teardown.sh
      - name: Verify Optware startup supervision and rollback regression
        run: |
          set -eu
          sh trunk/user/scripts/tests/optware_lifecycle_startup.sh

      - name: Build firmware BusyBox 1.24.2 and run Optware lifecycle regressions under ash
        run: |
          set -eu
          busybox_dir=trunk/user/busybox/busybox-1.24.x
          busybox_bin="$PWD/$busybox_dir/busybox"

          # Use the same common configuration copied by trunk/configure.
          cp trunk/configs/boards/busybox.config "$busybox_dir/.config"
          # BusyBox 1.24.2 date uses legacy stime(), absent from current host glibc.
          # DATE is unrelated to these lifecycle tests; disable it only in this
          # disposable host config. The tracked firmware config retains CONFIG_DATE=y.
          sed -i 's/^CONFIG_DATE=y$/# CONFIG_DATE is not set/' "$busybox_dir/.config"
          # Mirror the firmware package's EXTRA_CFLAGS for the shared DUID header.
          # This direct host build bypasses package.mk and must provide the same include.
          sed -i '/^CONFIG_EXTRA_CFLAGS=/d; /^# CONFIG_EXTRA_CFLAGS is not set$/d' "$busybox_dir/.config"
          printf '%s\n' "CONFIG_EXTRA_CFLAGS=\"-I$PWD/trunk/user/shared/src\"" >> "$busybox_dir/.config"
          make -C "$busybox_dir" oldconfig </dev/null
          if ! grep -Fqx "CONFIG_EXTRA_CFLAGS=\"-I$PWD/trunk/user/shared/src\"" "$busybox_dir/.config"; then
            echo "Host BusyBox config lost the shared DUID header include path" >&2
            exit 1
          fi
          if grep -qx 'CONFIG_DATE=y' "$busybox_dir/.config"; then
            echo "Host-only BusyBox config unexpectedly re-enabled DATE" >&2
            exit 1
          fi

          for feature in CONFIG_ASH CONFIG_FEATURE_SH_IS_ASH CONFIG_AWK CONFIG_FLOCK \
                         CONFIG_CAT CONFIG_CHMOD CONFIG_DIRNAME CONFIG_GREP CONFIG_MKDIR \
                         CONFIG_RM CONFIG_SLEEP CONFIG_WC; do
            if ! grep -qx "$feature=y" "$busybox_dir/.config"; then
              echo "Required firmware BusyBox feature is disabled: $feature" >&2
              exit 1
            fi
          done

          make -C "$busybox_dir" -j2 busybox
          test -x "$busybox_bin"
          # Exercise required applets directly. Do not infer functionality
          # from the human-readable --list output.
          "$busybox_bin" ash -c 'test "$((2 + 2))" -eq 4'
          "$busybox_bin" awk 'BEGIN { exit 0 }'

          runtime_dir=$(mktemp -d)
          trap 'rm -rf "$runtime_dir"' EXIT
          mkdir -p "$runtime_dir/bin"
          : > "$runtime_dir/flock-smoke.lock"
          (
            exec 9>>"$runtime_dir/flock-smoke.lock"
            "$busybox_bin" flock -n 9
            "$busybox_bin" flock -u 9
          )
          for applet in awk cat chmod dirname flock grep mkdir rm sleep wc; do
            ln -s "$busybox_bin" "$runtime_dir/bin/$applet"
          done
          ln -s "$busybox_bin" "$runtime_dir/bin/sh"
          export PATH="$runtime_dir/bin:$PATH"
          export OPTWARE_TEST_SHELL="$runtime_dir/bin/sh"

          # mktemp is intentionally supplied by the runner: it is disabled in
          # firmware config. Tested shell and lifecycle applets resolve from
          # the BusyBox 1.24.2 applet directory above.
          "$busybox_bin" ash -n trunk/user/optware/opt-mount.sh
          "$busybox_bin" ash -n trunk/user/optware/opt-umount.sh
          "$busybox_bin" ash -n trunk/user/optware/opt-start.sh
          "$busybox_bin" ash -n trunk/user/scripts/files/sbin/optware_lifecycle_lock.sh

          "$busybox_bin" ash trunk/user/scripts/tests/optware_lifecycle_lock.sh
          "$busybox_bin" ash trunk/user/scripts/tests/optware_lifecycle_teardown.sh
          "$busybox_bin" ash trunk/user/scripts/tests/optware_lifecycle_startup.sh
          BUSYBOX_BIN="$busybox_bin" sh trunk/user/scripts/tests/storage_app_start_status.sh
          "$busybox_bin" ash -n trunk/user/smartdns/smartdns.sh
          "$busybox_bin" ash -n trunk/user/smartdns/smartdns_process_lifecycle.sh
          "$busybox_bin" ash trunk/user/smartdns/tests/smartdns_process_lifecycle.sh
      - name: Check MTD storage save script syntax
        run: sh -n trunk/user/scripts/files/sbin/mtd_storage.sh
      - name: Verify MTD storage save retry after flash failure
        run: |
          set -eu
          sh trunk/user/scripts/tests/mtd_storage_save_retry.sh
          busybox_bin="$PWD/trunk/user/busybox/busybox-1.24.x/busybox"
          test -x "$busybox_bin"
          BUSYBOX_BIN="$busybox_bin" sh trunk/user/scripts/tests/mtd_storage_save_retry.sh
      - name: Verify MTD storage restore staging and rollback
        run: sh trunk/user/scripts/tests/mtd_storage_restore_transaction.sh
      - name: Verify MTD storage load rejects incomplete archives transactionally
        run: |
          set -eu
          sh trunk/user/scripts/tests/mtd_storage_load_transaction.sh
          busybox_bin="$PWD/trunk/user/busybox/busybox-1.24.x/busybox"
          test -x "$busybox_bin"
          BUSYBOX_BIN="$busybox_bin" sh trunk/user/scripts/tests/mtd_storage_load_transaction.sh
      - name: Verify MTD storage erase/reset failure postconditions
        run: |
          set -eu
          sh trunk/user/scripts/tests/mtd_storage_erase_reset.sh
          busybox_bin="$PWD/trunk/user/busybox/busybox-1.24.x/busybox"
          test -x "$busybox_bin"
          BUSYBOX_BIN="$busybox_bin" sh trunk/user/scripts/tests/mtd_storage_erase_reset.sh
      - name: Verify MTD storage backup rejects failed or invalid archives
        run: |
          set -eu
          sh trunk/user/scripts/tests/mtd_storage_backup_failure.sh
          busybox_bin="$PWD/trunk/user/busybox/busybox-1.24.x/busybox"
          test -x "$busybox_bin"
          BUSYBOX_BIN="$busybox_bin" sh trunk/user/scripts/tests/mtd_storage_backup_failure.sh
      - name: Compile and run storage persistence gate regression
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror \
            -I trunk/user/rc/src \
            trunk/user/rc/src/tests/storage_persistence_policy.c \
            -o /tmp/storage-persistence-policy
          /tmp/storage-persistence-policy
      - name: Compile and run storage eject inventory regression
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror \
            -I trunk/user/rc/src \
            trunk/user/rc/src/tests/storage_ejected_inventory_policy.c \
            -o /tmp/storage-ejected-inventory
          /tmp/storage-ejected-inventory
          cc -std=gnu89 -Wall -Wextra -Werror \
            -I trunk/user/libdisk/src \
            trunk/user/rc/src/tests/storage_swap_policy.c \
            -o /tmp/storage-swap-policy
          /tmp/storage-swap-policy
          cc -std=gnu89 -Wall -Wextra -Werror \
            -I trunk/user/libdisk/src \
            trunk/user/libdisk/src/tests/disk_inventory_policy.c \
            -o /tmp/disk-inventory-policy
          /tmp/disk-inventory-policy
          cc -std=gnu89 -Wall -Wextra -Werror \
            -I trunk/user/rc/src \
            -I trunk/user/shared/src \
            trunk/user/rc/src/tests/storage_operation_lock.c \
            trunk/user/shared/src/bin_sem_asus.c \
            -o /tmp/storage-operation-lock
          /tmp/storage-operation-lock
      - name: Compile and run storage mount-link errno policy regression
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer \
            -I trunk/user/rc/src \
            trunk/user/rc/src/tests/storage_nfs_export_policy.c \
            -o /tmp/storage-nfs-export-policy
          /tmp/storage-nfs-export-policy
      - name: Compile and run checked USB event-marker pair regression
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -fno-omit-frame-pointer -I trunk/user/rc/src \
            trunk/user/rc/src/tests/usb_hotplug_event_policy.c \
            -o /tmp/usb-hotplug-event-policy
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 /tmp/usb-hotplug-event-policy
      - name: Compile and run checked deferred-storage dispatch policy regression
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -fno-omit-frame-pointer -I trunk/user/rc/src \
            trunk/user/rc/src/tests/storage_deferred_start_policy.c \
            -o /tmp/storage-deferred-start-policy
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 /tmp/storage-deferred-start-policy
      - name: Compile and run deferred Optware child-result regression
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror \
            -I trunk/user/rc/src \
            trunk/user/rc/src/tests/storage_optware_start_policy.c \
            -o /tmp/storage-optware-start-policy
          /tmp/storage-optware-start-policy
      - name: Compile and run FTP tri-state daemon presence regression
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer \
            -I trunk/user/rc/src -I trunk/user/shared/src \
            trunk/user/rc/src/tests/ftp_daemon_policy.c \
            -o /tmp/ftp-daemon-policy
          ASAN_OPTIONS=detect_leaks=1 /tmp/ftp-daemon-policy
      - name: Compile and run storage daemon stop postcondition regression
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer \
            -I trunk/user/rc/src \
            trunk/user/rc/src/tests/storage_service_stop_policy.c \
            -o /tmp/storage-service-stop-policy
          /tmp/storage-service-stop-policy
      - name: Compile and run RC service launch status regression
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror \
            -I trunk/user/shared/src -I trunk/user/rc/src \
            trunk/user/rc/src/tests/service_start_status.c \
            -o /tmp/service-start-status
          /tmp/service-start-status
      - name: Verify filesystem module-load lock failure and race handling
        run: |
          set -eu
          sh -n trunk/user/scripts/files/sbin/automount.sh
          sh trunk/user/scripts/tests/storage_module_load_lock.sh
      - name: Verify automount mount-owner inventory fails closed
        run: |
          set -eu
          sh -n trunk/user/scripts/files/sbin/automount.sh
          sh trunk/user/scripts/tests/storage_mountpoint_inventory.sh
      - name: Verify whole storage caller graph, operation locks and failure propagation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          rc_dir = Path("trunk/user/rc/src")

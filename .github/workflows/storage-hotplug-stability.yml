              if restart_name in ("restart_dms", "restart_itunes"):
                  unknown_gate = restart_body.index("if (mount_status < 0)")
                  assert restart_body.index("goto out;", unknown_gate) < start_gate
              else:
                  assert "else if (mount_status < 0)" in restart_body
                  assert restart_body.index("else if (mount_status < 0)") > start_call
          run_nfsd_locked = function_body(storage, "run_nfsd_locked(void)")
          assert 'eval("/usr/bin/nfsd.sh", "start")' in run_nfsd_locked
          start_apps = function_body(storage, "start_stor_apps(void)")
          assert "run_nfsd_locked()" in start_apps and "run_nfsd()" not in start_apps
          restart_nfsd = function_body(storage, "int restart_nfsd(void)")
          assert restart_nfsd.index("storage_operation_lock_acquire(file_lock)") < restart_nfsd.index("count_stor_mountpoint()")
          assert 'if (stop_nfsd_locked() != 0)' in restart_nfsd
          assert restart_nfsd.index('if (stop_nfsd_locked() != 0)') < restart_nfsd.index('run_nfsd_locked()')
          assert "file_unlock(storage_lock)" in restart_nfsd
          # FTP and Samba public restarts must share the same cross-process
          # eject barrier used by mdev and safe removal, without nesting it
          # inside start_stor_apps()/stop_stor_apps() locked callers.
          ftp_restart = function_body(storage, "restart_ftpd(void)")
          assert ftp_restart.index("storage_operation_lock_acquire(file_lock)") < ftp_restart.index("stop_ftp()")
          assert ftp_restart.index("stop_ftp()") < ftp_restart.index("storage_has_mounted_devices")
          assert ftp_restart.index("storage_has_mounted_devices") < ftp_restart.index("run_ftp()")
          assert ftp_restart.index("run_ftp()") < ftp_restart.index("file_unlock(storage_lock);")
          assert ftp_restart.count("file_unlock(storage_lock);") == 1
          samba_restart = function_body(storage, "int restart_smbd(void)")
          assert samba_restart.index("storage_operation_lock_acquire(file_lock)") < samba_restart.index("stop_samba(1)")
          assert samba_restart.index("stop_samba(1)") < samba_restart.index("storage_has_mounted_devices")
          assert samba_restart.index("storage_has_mounted_devices") < samba_restart.index("run_samba()")
          assert samba_restart.index("run_samba()") < samba_restart.index("file_unlock(storage_lock);")
          assert samba_restart.index("start_wins()") < samba_restart.index("file_unlock(storage_lock);")
          assert samba_restart.count("file_unlock(storage_lock);") == 1
          assert 'action_result = restart_nfsd();' in rc and 'ret = stop_nfsd();' in rc
          # The CI ash binary is built from the same version/config used by firmware.
          assert "PKG_VERSION:=1.24" in busybox_package
          assert "SRC_DIR=./busybox-1.24.x" in busybox_package
          assert "# Busybox version: 1.24.2" in busybox_config
          # Keep the production DHCP retry call linked to its shared policy helper.
          assert '#include "udhcpc_script_policy.h"' in busybox_dhcpc
          assert busybox_dhcpc.count("udhcpc_script_failure_prepare_retry(") == 1
          assert "udhcp_script_failure_prepare_retry(" not in busybox_dhcpc
          assert "static inline void udhcpc_script_failure_prepare_retry(" in busybox_udhcpc_policy
          # DHCPv6 DUID is shared user-space policy; both firmware package and
          # the standalone host BusyBox build must provide its source include.
          assert '#include "dhcp6c_duid_file_policy.h"' in busybox_dhcp6c_common
          assert "EXTRA_CFLAGS += -I$(ROOTDIR)/user/shared/src" in busybox_package
          assert "CONFIG_EXTRA_CFLAGS" in busybox_flags
          host_busybox_step = workflow.split("- name: Build firmware BusyBox 1.24.2 and run Optware lifecycle regressions under ash", 1)[1].split("- name: Compile and run storage eject inventory regression", 1)[0]
          assert "CONFIG_EXTRA_CFLAGS" in host_busybox_step
          assert "trunk/user/shared/src" in host_busybox_step
          assert "grep -Fqx" in host_busybox_step
          assert host_busybox_step.index("CONFIG_EXTRA_CFLAGS") < host_busybox_step.index('make -C "$busybox_dir" -j2 busybox')
          assert "CONFIG_DATE=y" in busybox_config
          for feature in ("CONFIG_ASH", "CONFIG_FEATURE_SH_IS_ASH", "CONFIG_AWK", "CONFIG_FLOCK"):
              assert f"{feature}=y" in busybox_config
          assert 'busybox_id="1.24.x"' in busybox_configure
          assert 'busybox_cf="$ROOTDIR/configs/boards/busybox.config"' in busybox_configure
          assert 'cp -fL "$busybox_cf" "$busybox_tf"' in busybox_configure
          for feature in ("CONFIG_ASH", "CONFIG_FEATURE_SH_IS_ASH", "CONFIG_AWK", "CONFIG_FLOCK"):
              assert f'func_disable_busybox_param "{feature}"' not in busybox_configure

          # Child service fixtures must execute under the tested ash binary too.
          for opt_test in (opt_teardown_test, opt_startup_test):
              assert "OPTWARE_TEST_SHELL" in opt_test
              assert "write_mock" in opt_test
              assert "printf '#!%s" in opt_test
              assert 'cat > "$tmpdir/' not in opt_test

          busybox_paths = (
              "trunk/configs/boards/busybox.config",
              "trunk/configure",
              "trunk/user/busybox/Makefile",
              "trunk/user/busybox/busybox-1.24.x/**",
          )
          for path in busybox_paths:
              assert push_filters.count(path) == 1
              assert pr_filters.count(path) == 1

          print("USB storage hotplug full caller graph, lock ordering and teardown contracts: PASS")
          PY

      - "trunk/configure"
      - "trunk/user/busybox/Makefile"
      - "trunk/user/busybox/busybox-1.24.x/**"
  pull_request:
    paths:
      - "trunk/user/rc/src/net.c"
      - "trunk/user/rc/src/services.c"
      - "trunk/user/rc/src/optional_daemon_policy.h"
      - "trunk/user/rc/src/services_usb.c"
      - "trunk/user/rc/src/service_start_status.h"

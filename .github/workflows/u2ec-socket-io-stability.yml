name: U2EC bounded TCP framing and socket stability regression

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/u2ec-socket-io-stability.yml"
      - "trunk/user/u2ec/src/usbsock.c"
      - "trunk/user/u2ec/src/testusb.c"
      - "trunk/user/u2ec/src/u2ec_socket_io_policy.h"
      - "trunk/user/u2ec/src/u2ec_discovery_snapshot_policy.h"
      - "trunk/user/u2ec/src/tests/u2ec_socket_io_policy_test.c"
      - "trunk/user/u2ec/src/Makefile"
      - "scripts/check_u2ec_socket_io.py"
  pull_request:
    paths:
      - ".github/workflows/u2ec-socket-io-stability.yml"
      - "trunk/user/u2ec/src/usbsock.c"
      - "trunk/user/u2ec/src/testusb.c"
      - "trunk/user/u2ec/src/u2ec_socket_io_policy.h"
      - "trunk/user/u2ec/src/u2ec_discovery_snapshot_policy.h"
      - "trunk/user/u2ec/src/tests/u2ec_socket_io_policy_test.c"
      - "trunk/user/u2ec/src/Makefile"
      - "scripts/check_u2ec_socket_io.py"

permissions:
  contents: read

jobs:
  u2ec-socket-io:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run GNU89 socket policy regression
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Itrunk/user/u2ec/src \
            trunk/user/u2ec/src/tests/u2ec_socket_io_policy_test.c \
            -o /tmp/u2ec_socket_io_policy_test
          ASAN_OPTIONS=detect_leaks=1 /tmp/u2ec_socket_io_policy_test
      - name: Verify U2EC production socket framing contract
        run: python3 scripts/check_u2ec_socket_io.py

name: wsdd2 bounded LLMNR question regression

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/wsdd2-llmnr-question-regression.yml"
      - "trunk/user/wsdd2/src/llmnr.c"
      - "trunk/user/wsdd2/src/llmnr_question_policy.h"
      - "trunk/user/wsdd2/src/tests/llmnr_question_policy_test.c"
      - "scripts/test_wsdd2_llmnr_question.sh"
      - "scripts/check_wsdd2_llmnr_question.py"
  pull_request:
    paths:
      - ".github/workflows/wsdd2-llmnr-question-regression.yml"
      - "trunk/user/wsdd2/src/llmnr.c"
      - "trunk/user/wsdd2/src/llmnr_question_policy.h"
      - "trunk/user/wsdd2/src/tests/llmnr_question_policy_test.c"
      - "scripts/test_wsdd2_llmnr_question.sh"
      - "scripts/check_wsdd2_llmnr_question.py"

permissions:
  contents: read

jobs:
  question:
    name: LLMNR malformed question bounds and parser policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run GNU99 ASan/UBSan parser regression and source contract
        run: sh scripts/test_wsdd2_llmnr_question.sh

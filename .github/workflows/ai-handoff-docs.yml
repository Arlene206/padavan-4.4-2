name: AI handoff documentation contract

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-handoff-records:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate live handoff/roadmap and batched log archive integrity
        run: python3 scripts/check_ai_handoff_docs.py

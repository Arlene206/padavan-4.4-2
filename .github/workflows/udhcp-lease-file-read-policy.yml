name: DHCP lease-file framing validation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/udhcp-lease-file-read-policy.yml"
      - "trunk/user/busybox/busybox-1.24.x/networking/udhcp/files.c"
      - "trunk/user/busybox/busybox-1.24.x/networking/udhcp/udhcp_lease_file_read_policy.h"
      - "trunk/user/busybox/busybox-1.24.x/networking/udhcp/tests/udhcp_lease_file_read_policy.c"
      - "scripts/check_udhcp_lease_file_read_policy.py"
  pull_request:
    paths:
      - ".github/workflows/udhcp-lease-file-read-policy.yml"
      - "trunk/user/busybox/busybox-1.24.x/networking/udhcp/files.c"
      - "trunk/user/busybox/busybox-1.24.x/networking/udhcp/udhcp_lease_file_read_policy.h"
      - "trunk/user/busybox/busybox-1.24.x/networking/udhcp/tests/udhcp_lease_file_read_policy.c"
      - "scripts/check_udhcp_lease_file_read_policy.py"

permissions:
  contents: read

jobs:
  lease-file-read-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run GNU89 ASan/UBSan framing regression
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -fno-omit-frame-pointer \
            -Itrunk/user/busybox/busybox-1.24.x/networking/udhcp \
            trunk/user/busybox/busybox-1.24.x/networking/udhcp/tests/udhcp_lease_file_read_policy.c \
            -o /tmp/udhcp_lease_file_read_policy_test
          ASAN_OPTIONS=detect_leaks=1:abort_on_error=1 \
            /tmp/udhcp_lease_file_read_policy_test
      - name: Verify truncated/read-error integration
        run: python3 scripts/check_udhcp_lease_file_read_policy.py

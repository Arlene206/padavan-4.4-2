name: RC timezone environment NVRAM failure regression

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/timezone-env-stability.yml"
      - "scripts/check_timezone_env.py"
      - "trunk/user/rc/src/rc.c"
      - "trunk/user/rc/src/init.c"
      - "trunk/user/rc/src/timezone_env_policy.h"
      - "trunk/user/rc/src/tests/timezone_env_policy.c"
  pull_request:
    paths:
      - ".github/workflows/timezone-env-stability.yml"
      - "scripts/check_timezone_env.py"
      - "trunk/user/rc/src/rc.c"
      - "trunk/user/rc/src/init.c"
      - "trunk/user/rc/src/timezone_env_policy.h"
      - "trunk/user/rc/src/tests/timezone_env_policy.c"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: timezone-env-stability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  timezone-env:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run GNU89 checked-timezone policy regression
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -fno-omit-frame-pointer -I trunk/user/rc/src \
            trunk/user/rc/src/tests/timezone_env_policy.c \
            -o "$RUNNER_TEMP/timezone_env_policy"
          ASAN_OPTIONS=detect_leaks=1 "$RUNNER_TEMP/timezone_env_policy"
      - name: Verify RC process and PID1 recovery shell timezone publication use checked NVRAM
        run: python3 scripts/check_timezone_env.py

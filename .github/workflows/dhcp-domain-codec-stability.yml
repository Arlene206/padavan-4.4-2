name: DHCP domain compression decoder stability regression

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dhcp-domain-codec-stability.yml"
      - "trunk/user/busybox/busybox-1.24.x/networking/udhcp/domain_codec.c"
  pull_request:
    paths:
      - ".github/workflows/dhcp-domain-codec-stability.yml"
      - "trunk/user/busybox/busybox-1.24.x/networking/udhcp/domain_codec.c"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  domain-codec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run RFC1035 domain decoder sanitizer regression
        run: |
          set -eu
          cc -std=gnu89 -D_GNU_SOURCE -DDNS_COMPR_TESTING -Wall -Wextra -Werror \
            -Wno-unused-parameter -fsanitize=address,undefined \
            -fno-omit-frame-pointer \
            trunk/user/busybox/busybox-1.24.x/networking/udhcp/domain_codec.c \
            -o /tmp/domain-codec-regression
          ASAN_OPTIONS=detect_leaks=1 /tmp/domain-codec-regression

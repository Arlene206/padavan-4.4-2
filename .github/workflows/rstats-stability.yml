name: rstats persistence and signal lifecycle stability regression

on:
  push:
    paths:
      - ".github/workflows/rstats-stability.yml"
      - "trunk/user/rc/src/rstats.c"
      - "trunk/user/rc/src/rstats_file_policy.h"
      - "trunk/user/rc/src/rstats_signal_policy.h"
      - "trunk/user/rc/src/tests/rstats_policy_test.c"
      - "trunk/user/rc/src/rc.c"
      - "trunk/user/rc/src/rc.h"
      - "trunk/user/rc/src/Makefile"
      - "trunk/user/rc/Makefile"
  pull_request:
    paths:
      - ".github/workflows/rstats-stability.yml"
      - "trunk/user/rc/src/rstats.c"
      - "trunk/user/rc/src/rstats_file_policy.h"
      - "trunk/user/rc/src/rstats_signal_policy.h"
      - "trunk/user/rc/src/tests/rstats_policy_test.c"
      - "trunk/user/rc/src/rc.c"
      - "trunk/user/rc/src/rc.h"
      - "trunk/user/rc/src/Makefile"
      - "trunk/user/rc/Makefile"

permissions:
  contents: read

jobs:
  rstats-stability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run GNU89 persistence and signal policy regression
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -I trunk/user/rc/src \
            trunk/user/rc/src/tests/rstats_policy_test.c \
            -o /tmp/rstats-policy
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 /tmp/rstats-policy
      - name: Verify deferred dispatch, atomic storage and applet wiring
        run: |
          set -eu
          python3 - <<'PY'
          from pathlib import Path

          src = Path("trunk/user/rc/src")
          rstats = (src / "rstats.c").read_text()
          file_policy = (src / "rstats_file_policy.h").read_text()
          signal_policy = (src / "rstats_signal_policy.h").read_text()
          test = (src / "tests/rstats_policy_test.c").read_text()
          dispatcher = (src / "rc.c").read_text()
          header = (src / "rc.h").read_text()
          services = (src / "services.c").read_text()
          makefile = (src / "Makefile").read_text()
          package_makefile = Path("trunk/user/rc/Makefile").read_text()
          workflow = Path(".github/workflows/rstats-stability.yml").read_text()

          def body(source, signature):
              start = source.index(signature)
              brace = source.index("{", start)
              depth = 0
              quote = None
              escaped = False
              line_comment = False
              block_comment = False
              pos = brace
              while pos < len(source):
                  char = source[pos]
                  following = source[pos + 1] if pos + 1 < len(source) else ""
                  if line_comment:
                      if char == "\n":
                          line_comment = False
                      pos += 1
                      continue
                  if block_comment:
                      if char == "*" and following == "/":
                          block_comment = False
                          pos += 2
                      else:
                          pos += 1
                      continue
                  if quote:
                      if escaped:
                          escaped = False
                      elif char == "\\":
                          escaped = True
                      elif char == quote:
                          quote = None
                      pos += 1
                      continue
                  if char in ("'", '"'):
                      quote = char
                      pos += 1
                      continue
                  if char == "/" and following == "/":
                      line_comment = True
                      pos += 2
                      continue
                  if char == "/" and following == "*":
                      block_comment = True
                      pos += 2
                      continue
                  if char == "{":
                      depth += 1
                  elif char == "}":
                      depth -= 1
                      if depth == 0:
                          return source[brace + 1:pos]
                  pos += 1
              raise AssertionError("unterminated function: " + signature)

          handler = body(rstats, "catch_sig_rstats(int sig)")
          assert "rstats_record_signal(&rstats_pending_events, sig)" in handler
          for forbidden in ("save_history_raw(", "free_rstats(", "exit(",
                            "fopen(", "printf(", "perror(", "setenv_tz(",
                            "malloc(", "free("):
              assert forbidden not in handler, "unsafe signal-handler work: " + forbidden

          main = body(rstats, "rstats_main(int argc, char *argv[])")
          block = main.index("sigprocmask(SIG_BLOCK, &managed_signals, &original_mask)")
          install = main.index("sigaction(SIGHUP, &sa, NULL)")
          assert block < install
          assert "sa.sa_mask = managed_signals;" in main
          for signal_name in ("SIGHUP", "SIGUSR1", "SIGUSR2", "SIGTERM"):
              assert f"sigaddset(&managed_signals, {signal_name})" in main
              assert f"sigdelset(&wait_mask, {signal_name})" in main
          assert "pselect(0, NULL, NULL, NULL, &timeout, &wait_mask)" in main
          snapshot = main.index("rstats_take_pending_events(&rstats_pending_events)")
          terminate = main.index("if (events & RSTATS_PENDING_TERMINATE)", snapshot)
          refresh = main.index("if (events & RSTATS_PENDING_TIME_REFRESH)", terminate)
          speed = main.index("if (events & RSTATS_PENDING_SPEED_EXPORT)", refresh)
          history = main.index("if (events & RSTATS_PENDING_HISTORY_EXPORT)", speed)
          assert snapshot < terminate < refresh < speed < history
          normal_save = main.index("save_history_raw(0)")
          cleanup = main.index("free_rstats()", normal_save)
          assert main.index("while (!stopping)") < normal_save < cleanup
          assert "gothup" not in rstats and "gotusr1" not in rstats and "gotusr2" not in rstats

          writer = body(rstats, "f_write(const char *path, const void *buffer, int len)")
          assert "rstats_file_write_atomic(path, buffer, (size_t) len)" in writer
          raw_save = body(rstats, "save_history_raw(long ticks)")
          assert "f_write(h_path, &g_history[i], sizeof(history_t)) != 0" in raw_save
          assert 'perror("rstats: failed to publish history")' in raw_save
          speed_export = body(rstats, "save_speed_json(long next_time)")
          history_export = body(rstats, "save_history_json(long next_time)")
          assert "rstats_file_open_stream(RSTATS_JS_SPEED, fn_tmp, sizeof(fn_tmp))" in speed_export
          assert "rstats_file_publish_stream(fp, fn_tmp, RSTATS_JS_SPEED)" in speed_export
          assert "rstats_file_open_stream(RSTATS_JS_HISTORY, fn_tmp, sizeof(fn_tmp))" in history_export
          assert "rstats_file_publish_stream(fp, fn_tmp, RSTATS_JS_HISTORY)" in history_export
          assert "failed to publish speed history" in speed_export
          assert "failed to publish history view" in history_export

          for token in ("mkstemp", "fdopen", "fchmod", "EINTR", "fsync", "fclose",
                        "rename", "unlink", "lstat", "S_ISREG"):
              assert token in file_policy, "missing atomic-file guarantee: " + token
          for token in ("fflush(stream)", "ferror(stream)", "fclose(stream)",
                        "rename(temporary, target)"):
              assert token in file_policy, "missing stream-publication check: " + token
          for token in ("RSTATS_PENDING_TIME_REFRESH", "RSTATS_PENDING_SPEED_EXPORT",
                        "RSTATS_PENDING_HISTORY_EXPORT", "RSTATS_PENDING_TERMINATE",
                        "rstats_take_pending_events"):
              assert token in signal_policy
          for token in ("test_mkstemp", "rstats_file_open_stream", "partial-data", "fail_fsync",
                        "fail_close", "fail_rename", "/dev/full",
                        "rstats persistence and signal policy: PASS"):
              assert token in test

          assert '{ "rstats",' in dispatcher and "rstats_main" in dispatcher
          assert "int  rstats_main(int argc, char *argv[]);" in header
          assert "rstats.o" in makefile
          assert '$(LN) rc $(ROMFSDIR)/sbin/rstats' in package_makefile
          assert "start_rstats(void)" in services and "eval(\"/sbin/rstats\")" in services
          assert "stop_rstats(void)" in services and '"rstats"' in services

          filters = workflow.split("jobs:", 1)[0]
          push_filters, pr_filters = filters.split("  pull_request:", 1)
          watched = (
              ".github/workflows/rstats-stability.yml",
              "trunk/user/rc/src/rstats.c",
              "trunk/user/rc/src/rstats_file_policy.h",
              "trunk/user/rc/src/rstats_signal_policy.h",
              "trunk/user/rc/src/tests/rstats_policy_test.c",
              "trunk/user/rc/src/rc.c",
              "trunk/user/rc/src/rc.h",
              "trunk/user/rc/src/Makefile",
              "trunk/user/rc/Makefile",
          )
          for path in watched:
              entry = f'"{path}"'
              assert push_filters.count(entry) == 1, "push path missing/duplicated: " + path
              assert pr_filters.count(entry) == 1, "pull_request path missing/duplicated: " + path

          print("RStats persistence, signal dispatch and applet contracts: PASS")
          PY

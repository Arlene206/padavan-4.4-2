name: rstats persistence and signal lifecycle stability regression

on:
  push:
    paths:
      - ".github/workflows/rstats-stability.yml"
      - "trunk/user/rc/src/rstats.c"
      - "trunk/user/rc/src/rstats_file_policy.h"
      - "trunk/user/rc/src/rstats_signal_policy.h"
      - "trunk/user/rc/src/rstats_time_policy.h"
      - "trunk/user/rc/src/rstats_persistence_policy.h"
      - "trunk/user/rc/src/tests/rstats_policy_test.c"
      - "trunk/user/rc/src/rc.c"
      - "trunk/user/rc/src/rc.h"
      - "trunk/user/rc/src/Makefile"
      - "trunk/user/rc/Makefile"
  pull_request:
    paths:
      - ".github/workflows/rstats-stability.yml"
      - "trunk/user/rc/src/rstats.c"
      - "trunk/user/rc/src/rstats_file_policy.h"
      - "trunk/user/rc/src/rstats_signal_policy.h"
      - "trunk/user/rc/src/rstats_time_policy.h"
      - "trunk/user/rc/src/rstats_persistence_policy.h"
      - "trunk/user/rc/src/tests/rstats_policy_test.c"
      - "trunk/user/rc/src/rc.c"
      - "trunk/user/rc/src/rc.h"
      - "trunk/user/rc/src/Makefile"
      - "trunk/user/rc/Makefile"

permissions:
  contents: read

jobs:
  rstats-stability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run GNU89 persistence and signal policy regression
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -I trunk/user/rc/src \
            trunk/user/rc/src/tests/rstats_policy_test.c \
            -o /tmp/rstats-policy
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 /tmp/rstats-policy
      - name: Verify deferred dispatch, atomic storage and applet wiring
        run: |
          set -eu
          python3 - <<'PY'
          from pathlib import Path

          src = Path("trunk/user/rc/src")
          rstats = (src / "rstats.c").read_text()
          file_policy = (src / "rstats_file_policy.h").read_text()
          signal_policy = (src / "rstats_signal_policy.h").read_text()
          time_policy = (src / "rstats_time_policy.h").read_text()
          test = (src / "tests/rstats_policy_test.c").read_text()
          dispatcher = (src / "rc.c").read_text()
          header = (src / "rc.h").read_text()
          services = (src / "services.c").read_text()
          makefile = (src / "Makefile").read_text()
          package_makefile = Path("trunk/user/rc/Makefile").read_text()
          workflow = Path(".github/workflows/rstats-stability.yml").read_text()

          def body(source, signature):
              start = source.index(signature)
              brace = source.index("{", start)
              depth = 0
              quote = None
              escaped = False
              line_comment = False
              block_comment = False
              pos = brace
              while pos < len(source):
                  char = source[pos]
                  following = source[pos + 1] if pos + 1 < len(source) else ""
                  if line_comment:
                      if char == "\n":
                          line_comment = False
                      pos += 1
                      continue
                  if block_comment:
                      if char == "*" and following == "/":
                          block_comment = False
                          pos += 2
                      else:
                          pos += 1
                      continue
                  if quote:
                      if escaped:
                          escaped = False
                      elif char == "\\":
                          escaped = True
                      elif char == quote:
                          quote = None
                      pos += 1
                      continue
                  if char in ("'", '"'):
                      quote = char
                      pos += 1
                      continue
                  if char == "/" and following == "/":
                      line_comment = True
                      pos += 2
                      continue
                  if char == "/" and following == "*":
                      block_comment = True
                      pos += 2
                      continue
                  if char == "{":
                      depth += 1
                  elif char == "}":
                      depth -= 1
                      if depth == 0:
                          return source[brace + 1:pos]
                  pos += 1
              raise AssertionError("unterminated function: " + signature)

          handler = body(rstats, "catch_sig_rstats(int sig)")
          assert "rstats_record_signal(&rstats_pending_events, sig)" in handler
          for forbidden in ("save_history_raw(", "free_rstats(", "exit(",
                            "fopen(", "printf(", "perror(", "setenv_tz(",
                            "malloc(", "free("):
              assert forbidden not in handler, "unsafe signal-handler work: " + forbidden

          time_valid = body(rstats, "is_system_time_valid(struct tm *tms)")
          assert "rstats_time_has_valid_year(tms, SYS_START_YEAR)" in time_valid
          assert "tms->tm_year" not in time_valid
          assert "tms == NULL" in time_policy
          assert "tms->tm_year > (start_year - 1900)" in time_policy
          assert '"rstats_time_policy.h"' in rstats

          main = body(rstats, "rstats_main(int argc, char *argv[])")
          block = main.index("sigprocmask(SIG_BLOCK, &managed_signals, &original_mask)")
          install = main.index("sigaction(SIGHUP, &sa, NULL)")
          assert block < install
          assert "sa.sa_mask = managed_signals;" in main
          for signal_name in ("SIGHUP", "SIGUSR1", "SIGUSR2", "SIGTERM"):
              assert f"sigaddset(&managed_signals, {signal_name})" in main
              assert f"sigdelset(&wait_mask, {signal_name})" in main
          assert "pselect(0, NULL, NULL, NULL, &timeout, &wait_mask)" in main
          snapshot = main.index("rstats_take_pending_events(&rstats_pending_events)")
          terminate = main.index("if (events & RSTATS_PENDING_TERMINATE)", snapshot)
          refresh = main.index("if (events & RSTATS_PENDING_TIME_REFRESH)", terminate)
          speed = main.index("if (events & RSTATS_PENDING_SPEED_EXPORT)", refresh)
          history = main.index("if (events & RSTATS_PENDING_HISTORY_EXPORT)", speed)
          assert snapshot < terminate < refresh < speed < history
          normal_save = main.index("save_history_raw(0)")
          cleanup = main.index("free_rstats()", normal_save)
          assert main.index("while (!stopping)") < normal_save < cleanup
          assert "gothup" not in rstats and "gotusr1" not in rstats and "gotusr2" not in rstats

          reader = body(rstats, "f_read(const char *path, void *buffer, int max)")
          assert "rstats_file_open_readonly(path)" in reader
          assert "rstats_file_read_exact(fd, buffer, (size_t)max)" in reader
          assert "saved_errno = errno;" in reader
          assert "close_result = close(fd);" in reader
          assert "close_errno = errno;" in reader
          assert "rstats_file_read_close_result(" in reader
          assert reader.index("saved_errno = errno;") < reader.index(
              "close_result = close(fd);") < reader.index(
              "return rstats_file_read_close_result(")
          assert "rstats_file_read_close_result(" in file_policy
          assert "if (read_result < 0)" in file_policy
          assert "if (close_result != 0)" in file_policy
          assert "test_read_close_results" in test
          assert "test_read_close_results();" in test

          writer = body(rstats, "f_write(const char *path, const void *buffer, int len)")
          assert "rstats_file_write_atomic(path, buffer, (size_t) len)" in writer
          persistence_policy = (src / "rstats_persistence_policy.h").read_text()
          assert "rstats_storage_save_result(" in persistence_policy
          assert "rstats_history_file_write_status(" in persistence_policy
          assert "test_history_file_write_status_results" in test
          assert "test_history_file_write_status_results();" in test
          assert "test_periodic_storage_save_retries_after_failure" in test
          assert "test_periodic_storage_save_retries_after_failure();" in test
          history_load = body(rstats, "load_history_raw(void)")
          assert "nvram_get_checked(\"rstats_stored\", &rstats_stored_text)" in history_load
          assert "rstats_nvram_history_load_status(" in history_load
          assert "nvram_match(\"rstats_stored\", \"0\")" not in history_load
          assert "cannot trust history load setting" in history_load
          assert "rstats_history_ring_indices_valid(hist.dailyp, MAX_NDAILY," in history_load
          assert "hist.monthlyp, MAX_NMONTHLY)" in history_load
          assert "discarding raw history with invalid ring indices" in history_load
          assert history_load.index("rstats_history_ring_indices_valid(") < history_load.index(
              "memcpy(&g_history[i]")
          assert history_load.index("nvram_get_checked(\"rstats_stored\", &rstats_stored_text)") < history_load.index(
              "rstats_nvram_history_load_status(") < history_load.index("if (!load_history)")
          assert "rstats_nvram_history_load_status(" in persistence_policy
          assert "test_nvram_history_load_status" in test
          assert "test_nvram_history_load_status();" in test
          assert "rstats_history_ring_indices_valid(" in persistence_policy
          assert "test_history_ring_indices" in test
          assert "test_history_ring_indices();" in test

          raw_save = body(rstats, "save_history_raw(long ticks)")
          assert "nvram_get_checked(\"rstats_stored\", &rstats_stored_text)" in raw_save
          assert "rstats_nvram_storage_mode(" in raw_save
          assert "nvram_get_int(\"rstats_stored\")" not in raw_save
          assert "cannot trust history storage mode" in raw_save
          assert raw_save.index("nvram_get_checked(\"rstats_stored\", &rstats_stored_text)") < raw_save.index(
              "rstats_nvram_storage_mode(")
          assert raw_save.index("rstats_nvram_storage_mode(") < raw_save.index(
              "if (rstats_stored_status != 0)") < raw_save.index("f_write(h_path")
          assert "rstats_nvram_storage_mode(" in persistence_policy
          assert "test_nvram_storage_mode_results" in test
          assert "test_nvram_storage_mode_results();" in test
          assert "storage_status = write_storage_to_mtd();" in raw_save
          assert "storage_errno = errno;" in raw_save
          assert "rstats_storage_save_result(" in raw_save
          assert "automatic storage commit failed; will retry" in raw_save
          assert raw_save.index("write_storage_to_mtd();") < raw_save.index(
              "rstats_storage_save_result(") < raw_save.index("automatic storage commit failed")
          assert "g_store_cntr = 0;" not in raw_save
          assert "rstats_history_file_write_status(" in raw_save
          assert "history_write_result, history_write_errno" in raw_save
          assert "history_write_status = file_status" in raw_save
          assert "failed to publish raw history" in raw_save
          assert "postponing flash commit until all raw history files are saved" in raw_save
          assert raw_save.index("if (history_write_status != 0)") < raw_save.index(
              "write_storage_to_mtd();")
          speed_export = body(rstats, "save_speed_json(long next_time)")
          history_export = body(rstats, "save_history_json(long next_time)")
          assert "rstats_file_open_stream(RSTATS_JS_SPEED, fn_tmp, sizeof(fn_tmp))" in speed_export
          assert "rstats_file_publish_stream(fp, fn_tmp, RSTATS_JS_SPEED)" in speed_export
          assert "rstats_file_open_stream(RSTATS_JS_HISTORY, fn_tmp, sizeof(fn_tmp))" in history_export
          assert "rstats_file_publish_stream(fp, fn_tmp, RSTATS_JS_HISTORY)" in history_export
          assert "failed to publish speed history" in speed_export
          assert "nvram_get_checked(RSTATS_NVKEY_24, &nvram_netdev)" in speed_export
          assert "rstats_nvram_read_status(" in speed_export
          assert "nvram_safe_get(RSTATS_NVKEY_24)" not in speed_export
          assert "netdev_length >= sizeof(netdev_text)" in speed_export
          assert "memcpy(netdev_text, nvram_netdev, netdev_length + 1U)" in speed_export
          fallback_persist_gate = speed_export.index("if (netdev_read_status == 0) {")
          fallback_write = speed_export.index("nvram_set(RSTATS_NVKEY_24, netdev)")
          assert fallback_persist_gate < fallback_write
          assert "rstats_nvram_write_status(" in speed_export
          assert "cannot trust selected speed interface" in speed_export
          assert "cannot persist fallback speed interface" in speed_export
          assert "test_nvram_selector_status_results" in test
          assert "rstats_nvram_read_status(-1, EACCES)" in test
          assert "rstats_nvram_write_status(-1, ENOSPC)" in test
          assert "failed to publish history view" in history_export
          history_read = history_export.index(
              "nvram_get_checked(RSTATS_NVKEY_DM, &nvram_netdev)")
          history_copy = history_export.index("rstats_nvram_copy_selector(")
          history_unknown_gate = history_export.index("if (netdev_read_status != 0)")
          history_output_open = history_export.index(
              "rstats_file_open_stream(RSTATS_JS_HISTORY, fn_tmp, sizeof(fn_tmp))")
          assert history_read < history_copy < history_unknown_gate < history_output_open
          assert "nvram_safe_get(RSTATS_NVKEY_DM)" not in history_export
          assert "cannot trust selected history interface" in history_export
          assert "rstats_nvram_copy_selector" in persistence_policy
          assert "test_history_selector_copy_results" in test
          assert "test_history_selector_copy_results();" in test
          assert "ENAMETOOLONG" in test and "EACCES" in test

          for token in ("RSTATS_FILE_MAX_INTERRUPTS", "rstats_file_retry_interrupted",
                        "rstats_file_open_readonly_with", "rstats_file_read_exact_with",
                        "rstats_file_read_exact", "read_fn", "total < length",
                        "errno == EINTR"):
              assert token in file_policy, "missing complete-read guarantee: " + token
          for token in ("mkstemp", "fdopen", "fchmod", "EINTR", "fsync", "fclose",
                        "rename", "unlink", "lstat", "S_ISREG"):
              assert token in file_policy, "missing atomic-file guarantee: " + token
          for token in ("fflush(stream)", "ferror(stream)", "fclose(stream)",
                        "rename(temporary, target)"):
              assert token in file_policy, "missing stream-publication check: " + token
          for token in ("RSTATS_PENDING_TIME_REFRESH", "RSTATS_PENDING_SPEED_EXPORT",
                        "RSTATS_PENDING_HISTORY_EXPORT", "RSTATS_PENDING_TERMINATE",
                        "rstats_take_pending_events"):
              assert token in signal_policy
          for token in ("test_null_safe_system_time_policy", "rstats_time_has_valid_year(NULL, 2020)",
                        "test_mkstemp", "rstats_file_open_stream", "partial-data",
                        "test_bounded_open_eintr",
                        "test_exact_read_retries_eintr_and_short_reads",
                        "test_atomic_write_and_fsync_retries",
                        "test_new_file_modes_follow_umask", "scripted_read",
                        "fail_fsync", "fail_close", "fail_rename", "/dev/full",
                        "rstats persistence and signal policy: PASS"):
              assert token in test

          for token in ("rstats_file_creation_mode", "umask(0)", "umask(mask)",
                        "0666 & ~mask"):
              assert token in file_policy
          assert file_policy.count("mode = rstats_file_creation_mode();") == 2

          assert '{ "rstats",' in dispatcher and "rstats_main" in dispatcher
          assert "int  rstats_main(int argc, char *argv[]);" in header
          assert "rstats.o" in makefile
          assert '$(LN) rc $(ROMFSDIR)/sbin/rstats' in package_makefile
          assert "start_rstats(void)" in services and "eval(\"/sbin/rstats\")" in services
          assert "stop_rstats(void)" in services and '"rstats"' in services

          filters = workflow.split("jobs:", 1)[0]
          push_filters, pr_filters = filters.split("  pull_request:", 1)
          watched = (
              ".github/workflows/rstats-stability.yml",
              "trunk/user/rc/src/rstats.c",
              "trunk/user/rc/src/rstats_file_policy.h",
              "trunk/user/rc/src/rstats_signal_policy.h",
              "trunk/user/rc/src/rstats_time_policy.h",
              "trunk/user/rc/src/rstats_persistence_policy.h",
              "trunk/user/rc/src/tests/rstats_policy_test.c",
              "trunk/user/rc/src/rc.c",
              "trunk/user/rc/src/rc.h",
              "trunk/user/rc/src/Makefile",
              "trunk/user/rc/Makefile",
          )
          for path in watched:
              entry = f'"{path}"'
              assert push_filters.count(entry) == 1, "push path missing/duplicated: " + path
              assert pr_filters.count(entry) == 1, "pull_request path missing/duplicated: " + path

          print("RStats persistence, signal dispatch and applet contracts: PASS")
          PY

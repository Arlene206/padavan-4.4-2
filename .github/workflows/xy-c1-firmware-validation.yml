  workflow_dispatch:

permissions:
  contents: read

# Give every commit its own run; newer pushes must not cancel an exact-SHA firmware build.
# BusyBox init is production code: its PID1 child-reaping changes require an XY-C1 rebuild.
concurrency:
  group: xy-c1-firmware-validation-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  firmware:
    name: Cross-build XY-C1 firmware
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: XY-C1-mipsel-linux-musl

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.23.x'
          check-latest: true
          cache: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bison flex gperf help2man libtool-bin texinfo python3-docutils autopoint gettext ccache \
            autoconf automake liblzma-dev libltdl-dev liblzo2-dev

          # Older vendored release tarballs hard-code versioned Autotools
          # helpers. ubuntu-latest may provide only a newer versioned name.
          for tool in aclocal automake; do
            tool_path="$(command -v "$tool")"
            for version in 1.8 1.16; do
              versioned_tool="${tool}-${version}"
              versioned_path="$(command -v "$versioned_tool" 2>/dev/null || true)"
              # command -v can report a dangling versioned symlink as present.
              # Test executability and repair the shim when the target is broken.
              if [ -z "$versioned_path" ] || [ ! -x "$versioned_path" ]; then
                sudo ln -sfn "$tool_path" "/usr/local/bin/$versioned_tool"
              fi
            done
          done

      - name: Verify Samba shared-header staging contract
        run: python3 scripts/check_samba_shared_header.py

      - name: Compile and run Samba parent-directory security regression
        run: |
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -fno-omit-frame-pointer -I trunk/user/rc/src \
            trunk/user/rc/src/tests/samba_config_transaction.c \
            -o /tmp/samba-config-transaction-regression
          /tmp/samba-config-transaction-regression
          python3 - <<'PY'
          from pathlib import Path

          source = Path("trunk/user/rc/src/services_ex.c").read_text()
          storage = Path("trunk/user/rc/src/services_stor.c").read_text()
          header = Path("trunk/user/rc/src/samba_config_transaction.h").read_text()

          def function_body(text, signature):
              start = text.index(signature)
              brace = text.index("{", start)
              depth = 0
              for pos in range(brace, len(text)):
                  if text[pos] == "{":
                      depth += 1
                  elif text[pos] == "}":
                      depth -= 1
                      if depth == 0:
                          return text[brace + 1:pos]
              raise AssertionError("unterminated function: " + signature)

          wins = function_body(source, "start_wins(void)")
          run_samba = function_body(storage, "int run_samba(void)")
          public_writer = function_body(storage, "write_smb_conf(void)")
          for name, body in (("start_wins", wins),
                             ("run_samba", run_samba),
                             ("write_smb_conf", public_writer)):
              prepare = body.index("samba_config_transaction_prepare_parent_directory(")
              recover = body.index("samba_config_transaction_recover(")
              assert prepare < recover, name + ": private parent must precede recovery"
          assert 'mkdir_if_none("/etc/samba", "777")' not in source
          assert 'mkdir_if_none("/etc/samba", "777")' not in storage
          assert 'SAMBA_CONFIG_BASE_DIRECTORY "/.config-transaction"' in header
          assert "O_DIRECTORY | O_NOFOLLOW" in header
          assert "fchmod(fd, 0700)" in header
          print("Samba private parent-directory call-site contract: PASS")
          PY

      - name: Verify DHCPv6 DUID staged-header contract
        run: python3 scripts/check_dhcp6c_duid_header_staging.py

      - name: Verify vsftpd extension header self-containment
        run: |
          printf '%s\n' '#include "asus_ext.h"' | \
            cc -std=gnu89 -Wall -Wextra -Werror -fsyntax-only \
              -iquote trunk/user/vsftpd/src -x c -



      - name: Compile and run RC module load/unload postcondition regression
        run: |
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -fno-omit-frame-pointer -I trunk/user/rc/src \
            trunk/user/rc/src/tests/wireless_module_load_policy.c \
            -o "$RUNNER_TEMP/wireless-module-load-policy"
          ASAN_OPTIONS=detect_leaks=1 "$RUNNER_TEMP/wireless-module-load-policy"

      - name: Compile and run HW NAT WAN VID configuration regression
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -fno-omit-frame-pointer -I trunk/user/rc/src \
            trunk/user/rc/src/tests/hwnat_config_policy.c \
            -o "$RUNNER_TEMP/hwnat-config-policy"
          ASAN_OPTIONS=detect_leaks=1 "$RUNNER_TEMP/hwnat-config-policy"
      - name: Compile and run WAN route flush failure regression
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -fno-omit-frame-pointer -I trunk/user/rc/src \
            trunk/user/rc/src/tests/wan_route_flush_policy.c \
            -o "$RUNNER_TEMP/wan-route-flush-policy"
          ASAN_OPTIONS=detect_leaks=1 "$RUNNER_TEMP/wan-route-flush-policy"

      - name: Compile and run SFE sysfs configuration status regression
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -fno-omit-frame-pointer -I trunk/user/rc/src \
            trunk/user/rc/src/tests/sfe_config_policy.c \
            -o "$RUNNER_TEMP/sfe-config-policy"
          ASAN_OPTIONS=detect_leaks=1 "$RUNNER_TEMP/sfe-config-policy"

      - name: Verify boot hardware module result propagation
        run: python3 scripts/check_rc_boot_module_loads.py

      - name: Verify XY-C1 USB modem driver configuration
        run: python3 scripts/check_usb_modem_driver_config.py

      - name: Compile and run RWFS UBI attach and mount fail-closed policy regression
        run: |
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -fno-omit-frame-pointer -I trunk/user/rc/src \
            trunk/user/rc/src/tests/storage_rwfs_mount_policy.c \
            -o "$RUNNER_TEMP/storage-rwfs-mount-policy"
          ASAN_OPTIONS=detect_leaks=1 "$RUNNER_TEMP/storage-rwfs-mount-policy"
      - name: Compile and run RC notification result policy regression
        run: |
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -fno-omit-frame-pointer -I trunk/user/rc/src \
            trunk/user/rc/src/tests/rc_notify_batch_policy.c \
            -o "$RUNNER_TEMP/rc-notify-batch-policy"
          ASAN_OPTIONS=detect_leaks=1 "$RUNNER_TEMP/rc-notify-batch-policy"
      - name: Verify firmware update notification status propagation
        run: python3 scripts/check_firmware_update_notification.py

      - name: Verify RWFS mount and Optware readiness integration
        run: python3 scripts/check_rwfs_mount_integration.py

      - name: Compile and run RC watchdog module restart postcondition regression
        run: |
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -fno-omit-frame-pointer -I trunk/user/rc/src \
            trunk/user/rc/src/tests/watchdog_cpu_restart_policy.c \
            -o "$RUNNER_TEMP/watchdog-cpu-restart-policy"
          ASAN_OPTIONS=detect_leaks=1 "$RUNNER_TEMP/watchdog-cpu-restart-policy"

      - name: Compile and run RC DDNS restart result policy regression
        run: |
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -fno-omit-frame-pointer -I trunk/user/rc/src \
            trunk/user/rc/src/tests/ddns_restart_policy.c \
            -o "$RUNNER_TEMP/ddns-restart-policy"
          ASAN_OPTIONS=detect_leaks=1 "$RUNNER_TEMP/ddns-restart-policy"
      - name: Compile and run VPN server restart status propagation regression
        run: |
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -fno-omit-frame-pointer -I trunk/user/rc/src \
            trunk/user/rc/src/tests/vpn_server_restart_policy.c \
            -o "$RUNNER_TEMP/vpn-server-restart-policy"
          ASAN_OPTIONS=detect_leaks=1 "$RUNNER_TEMP/vpn-server-restart-policy"
      - name: Compile and run RC UPnP restart stop-result regression
        run: |
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -fno-omit-frame-pointer -I trunk/user/rc/src \
            trunk/user/rc/src/tests/upnp_restart_policy.c \
            -o "$RUNNER_TEMP/upnp-restart-policy"
          ASAN_OPTIONS=detect_leaks=1 "$RUNNER_TEMP/upnp-restart-policy"
      - name: Compile and run RC LAN restart first-error aggregation regression
        run: |
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -fno-omit-frame-pointer -I trunk/user/shared/src -I trunk/user/rc/src \
            trunk/user/rc/src/tests/service_start_status.c \
            -o "$RUNNER_TEMP/service-start-status"
          ASAN_OPTIONS=detect_leaks=1 "$RUNNER_TEMP/service-start-status"
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -fno-omit-frame-pointer -I trunk/user/rc/src \
            trunk/user/rc/src/tests/modem_wan_start_policy.c \
            -o "$RUNNER_TEMP/modem-wan-start-policy"
          ASAN_OPTIONS=detect_leaks=1 "$RUNNER_TEMP/modem-wan-start-policy"
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -fno-omit-frame-pointer -I trunk/user/rc/src \
            trunk/user/rc/src/tests/wan_nvram_status_policy.c \
            -o "$RUNNER_TEMP/wan-nvram-status-policy"
          ASAN_OPTIONS=detect_leaks=1 "$RUNNER_TEMP/wan-nvram-status-policy"
          python3 scripts/check_modem_wan_start_status.py
      - name: Compile and run IPv6 global cleanup result propagation regression
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -fno-omit-frame-pointer -I trunk/user/rc/src \
            trunk/user/rc/src/tests/ipv6_cleanup_policy.c \
            -o "$RUNNER_TEMP/ipv6-cleanup-policy"
          ASAN_OPTIONS=detect_leaks=1 "$RUNNER_TEMP/ipv6-cleanup-policy"
      - name: Compile and run IPv6 global sysctl result propagation regression
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -fno-omit-frame-pointer -I trunk/user/rc/src \
            trunk/user/rc/src/tests/ipv6_global_conf_policy.c \
            -o $RUNNER_TEMP/ipv6-global-conf-policy
          ASAN_OPTIONS=detect_leaks=1 $RUNNER_TEMP/ipv6-global-conf-policy

      - name: Compile and run LAN IPv6 address reload sequencing regression
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -fno-omit-frame-pointer -I trunk/user/rc/src \
            trunk/user/rc/src/tests/lan_addr6_reload_policy.c \
            -o "$RUNNER_TEMP/lan-addr6-reload-policy"
          ASAN_OPTIONS=detect_leaks=1 "$RUNNER_TEMP/lan-addr6-reload-policy"
      - name: Verify LAN IPv6 NVRAM publication failures propagate
        run: |
          python3 - <<'PY'
          from pathlib import Path

          rc = Path("trunk/user/rc/src")
          policy = (rc / "lan_addr6_reload_policy.h").read_text()
          lan6 = (rc / "net_lan6.c").read_text()
          net6 = (rc / "net6.c").read_text()
          wan6 = (rc / "net_wan6.c").read_text()
          header = (rc / "rc.h").read_text()
          workflow = Path(".github/workflows/xy-c1-firmware-validation.yml").read_text()
          lan6_test = (rc / "tests/lan_addr6_reload_policy.c").read_text()

          assert "rc_lan_addr6_nvram_write_status" in policy
          reset_snapshot = lan6.split("lan6_read_reset_snapshot(int ipv6_type,", 1)[1].split("static int", 1)[0]
          assert "rc_wan_nvram_copy_snapshot(" in reset_snapshot
          assert "lan6_snapshot_transaction_begin" in reset_snapshot
          assert "lan6_snapshot_transaction_get" in reset_snapshot
          assert "lan6_snapshot_transaction_end" in reset_snapshot
          assert '"ip6_lan_addr"' in reset_snapshot and '"ip6_lan_size"' in reset_snapshot
          assert '"ip6_lan_auto"' in reset_snapshot
          assert "rc_lan_addr6_static_mode_status(" in reset_snapshot
          assert "rc_lan_addr6_legacy_prefix_size(" in reset_snapshot
          radv_reader = lan6.split("lan6_read_config_value_status(const char *param_name,", 1)[1].split("static int", 1)[0]
          radv_getter = lan6.split("int is_lan_radv_on(void)", 1)[1].split("int is_lan_addr6_static(void)", 1)[0]
          assert "rc_wan_nvram_copy_snapshot(" in radv_reader
          assert "ip6_lan_radv" in radv_getter
          assert "rc_lan_addr6_radv_enabled_status(" in radv_getter
          assert "if (status != 0)" in radv_getter and "return -1;" in radv_getter
          assert 'nvram_invmatch("ip6_lan_radv", "0")' not in radv_getter
          dhcp_mode_getter = lan6.split("int get_lan_dhcp6s_mode_status(int *mode)", 1)[1].split("int get_lan_dhcp6s_mode(void)", 1)[0]
          assert '"ip6_lan_dhcp"' in dhcp_mode_getter
          assert "lan6_read_config_value_status(" in dhcp_mode_getter
          assert "rc_lan_addr6_legacy_integer_status(" in dhcp_mode_getter
          assert "parsed_mode < 0 || parsed_mode > 3" in dhcp_mode_getter
          assert "if (status != 0)" in dhcp_mode_getter and "return status;" in dhcp_mode_getter
          assert 'nvram_get_int("ip6_lan_dhcp")' not in dhcp_mode_getter
          dhcp_mode_wrapper = lan6.split("int get_lan_dhcp6s_mode(void)", 1)[1].split("int get_lan_dhcp6s_irt_status(int *irt)", 1)[0]
          assert "get_lan_dhcp6s_mode_status(&mode)" in dhcp_mode_wrapper
          assert "if (status != 0)" in dhcp_mode_wrapper and "return -1;" in dhcp_mode_wrapper
          reset = lan6.split("int reset_lan6_vars(void)", 1)[1].split("int is_lan_radv_on", 1)[0]
          assert "status = lan6_read_reset_snapshot(ipv6_type, &snapshot);" in reset
          assert reset.index("if (status != 0)") < reset.index('nvram_set_temp("lan_addr6", addr6s)')
          assert "preserving current state" in reset
          assert "rc_lan_addr6_nvram_write_status(api_result, saved_errno)" in reset
          assert "return status;" in reset
          store = lan6.split("int store_lan_addr6(char *lan_addr6_new)", 1)[1].split("static int", 1)[0]
          assert "rc_lan_addr6_nvram_write_status(api_result, saved_errno)" in store
          assert "return -1;" in store

          sit = wan6.split("int start_sit_tunnel(", 1)[1].split("#undef WAN6_SIT_CHECK", 1)[0]
          assert "if (store_lan_addr6(lan_addr6s) < 0)" in sit
          assert "failure = \"publish derived LAN IPv6 address\"" in sit
          assert "clear_if_addr6(IFNAME_BR)" in sit
          callback = wan6.split("int dhcp6c_main(", 1)[1].split("int start_dhcp6c(", 1)[0]
          assert "wan6_identity_publish_lan_addr6(" in callback
          assert "if (lan_addr_status != 0)" in callback
          assert "callback_status = -1;" in callback
          assert "if (callback_status == 0)" in callback
          assert "store_lan_addr6(" not in callback
          assert "get_ifaddr6(IFNAME_BR, 0, addr6s)" not in callback
          lan_lookup = wan6.split("wan6_lookup_lan_addr6_status(", 1)[1].split("wan6_publish_lan_addr6_status(", 1)[0]
          assert "errno = 0;" in lan_lookup
          assert "get_ifaddr6(IFNAME_BR, 0, address)" in lan_lookup
          assert "return errno ? errno : 0;" in lan_lookup
          lan_publish = wan6.split("wan6_publish_lan_addr6_status(", 1)[1].split("int dhcp6c_main(", 1)[0]
          assert "store_lan_addr6((char *)address)" in lan_publish
          assert "return errno ? errno : EIO;" in lan_publish

          for case in (
              "test_legacy_integer_parser_preserves_nvram_get_int_defaults",
              "test_legacy_integer_backend_failure_is_not_zero_default",
              "test_radv_read_failure_is_not_enabled_by_default",
              "test_radv_missing_key_preserves_nvram_invmatch_default",
              "test_radv_literal_zero_disables_and_other_values_enable",
              "test_radv_policy_rejects_missing_output_or_value",
              "test_static_mode_policy_preserves_service_type_overrides",
              "test_dynamic_static_mode_read_failure_is_not_a_default",
              "test_dynamic_static_mode_preserves_nvram_match_defaults",
              "test_prefix_size_preserves_atoi_legacy_defaults",
              "test_prefix_size_backend_error_is_not_a_legacy_default",
          ):
              assert case in lan6_test and case + "();" in lan6_test

          assert "int reset_lan6_vars(void);" in header
          assert "operation_status = reset_lan6_vars();" in net6
          assert "if (operation_status == 0)" in net6
          filters = workflow.split("jobs:", 1)[0]
          assert '"trunk/user/rc/src/net6.c"' in filters
          assert '"trunk/user/rc/src/rc.h"' in filters
          print("LAN IPv6 NVRAM publication failures reach startup, SIT rollback and DHCPv6 callback results: PASS")
          PY

      - name: Verify WAN IPv6 runtime metadata reset errors propagate
        run: |
          python3 - <<'PY'
          from pathlib import Path

          rc = Path("trunk/user/rc/src")
          wan6 = (rc / "net_wan6.c").read_text()
          net6 = (rc / "net6.c").read_text()
          header = (rc / "rc.h").read_text()
          tests = (rc / "tests/wan6_identity_policy.c").read_text()

          wrapper = wan6.split("reset_wan6_vars(void)", 1)[1]
          assert "status = reset_wan6_vars_status();" in wrapper
          assert "return status;" in wrapper
          assert "int reset_wan6_vars(void);" in header
          disable = net6.split("if (ipv6_type == IPV6_DISABLED)", 1)[1].split("} else {", 1)[0]
          assert "operation_status = reset_wan6_vars();" in disable
          assert "restart_status = rc_first_service_start_status(restart_status" in disable
          assert "test_metadata_clear_attempts_both_fields_and_preserves_first_error" in tests
          print("WAN IPv6 reset status reaches the IPv6 restart result; partial metadata clear remains tested: PASS")
          PY

      - name: Verify WAN firewall result propagation
        run: python3 scripts/check_wan_firewall_status.py

      - name: Verify PPPoE-MWAN cleanup fail-closed and partial launch rollback
        run: |
          set -eu
          bash -n trunk/user/pppoe/detect.sh
          bash -n trunk/user/pppoe/tests/detect_status.sh
          bash trunk/user/pppoe/tests/detect_status.sh
          sh -n trunk/user/pppoe/mwan.sh
          bash -n trunk/user/pppoe/tests/mwan_lifecycle.sh
          bash trunk/user/pppoe/tests/mwan_lifecycle.sh "$GITHUB_WORKSPACE"
          python3 scripts/check_pppoe_mwan_status.py

      - name: Verify Ralink IAPP daemon firewall lifecycle
        run: |
          set -eu
          sh -n trunk/user/ralinkiappd/iappd.sh
          sh trunk/user/ralinkiappd/tests/iappd_lifecycle.sh
      - name: Compile and run WAN link NVRAM mirror retry regression
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -I trunk/user/rc/src \
            trunk/user/rc/src/tests/detect_link_nvram_policy.c \
            -o /tmp/detect-link-nvram-policy
          ASAN_OPTIONS=detect_leaks=1 /tmp/detect-link-nvram-policy
      - name: Compile and run Internet status NVRAM retry regression
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined -I trunk/user/rc/src trunk/user/rc/src/tests/detect_internet_nvram_policy.c -o /tmp/detect-internet-nvram-policy
          ASAN_OPTIONS=detect_leaks=1 /tmp/detect-internet-nvram-policy
      - name: Test XY-C1 firmware input detector
        run: python3 scripts/tests/test_xy_c1_firmware_inputs.py
      - name: Verify atomic musl sys/queue.h installation
        run: python3 scripts/tests/test_install_musl_queue_header.py

      - name: Detect firmware production input changes
        id: firmware_inputs
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: python3 scripts/check_xy_c1_firmware_inputs.py
      - name: Build XY-C1
        if: steps.firmware_inputs.outputs.changed == 'true'
        run: |
          set -e
          make XY-C1 TOOLCHAIN=mipsel-linux-musl

      - name: Verify TRX output
        if: steps.firmware_inputs.outputs.changed == 'true'
        run: |
          set -e
          shopt -s nullglob
          images=(trunk/images/*.trx)
          if [ "${#images[@]}" -eq 0 ]; then
            echo "ERROR: XY-C1 build produced no .trx image."
            find trunk/images -maxdepth 1 -type f -print 2>/dev/null || true
            exit 1
          fi
          for image in "${images[@]}"; do
            test -s "$image"
            ls -lh "$image"
            file "$image"
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.firmware_inputs.outputs.changed == 'true'
        with:
          name: XY-C1-firmware-${{ github.sha }}
          path: trunk/images/*.trx
          if-no-files-found: error
          retention-days: 7

      - name: Report host-only validation
        if: steps.firmware_inputs.outputs.changed == 'false'
        run: |
          {
            echo "Host regressions passed; no firmware production input changed."
            echo "XY-C1 cross-build, TRX verification and artifact upload were intentionally skipped."
          } >> "$GITHUB_STEP_SUMMARY"

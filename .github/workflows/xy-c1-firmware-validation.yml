      - ".github/workflows/httpd-security.yml"
      - "trunk/user/rc/src/samba_share_policy.h"
      - "trunk/user/rc/src/services_stor.c"
      - "trunk/user/rc/src/storage_service_stop_policy.h"
      - "trunk/user/rc/src/storage_optware_start_policy.h"
      - "trunk/user/libdisk/src/disk_initial.h"
      - "trunk/user/libdisk/src/disk_inventory_policy.h"
      - "trunk/user/libdisk/src/disk_initial.c"
      - "trunk/user/rc/src/rc.h"
      - "trunk/user/rc/src/samba_process_policy.h"
      - "trunk/user/rc/src/samba_daemon_policy.h"
      - "trunk/user/shared/src/shutils.h"
      - "trunk/user/shared/src/process_inventory.c"
      - "trunk/user/shared/src/process_inventory.h"
      - "trunk/user/shared/src/process_pidfile.c"

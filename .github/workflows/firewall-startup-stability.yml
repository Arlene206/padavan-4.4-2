      - "trunk/user/rc/src/wan_route_flush_policy.h"
      - "trunk/user/rc/src/tests/wan_route_flush_policy.c"
      - "trunk/user/rc/src/common_ex.c"
      - "trunk/user/rc/src/hwnat_config_policy.h"
      - "trunk/user/rc/src/sfe_config_policy.h"
      - "trunk/user/rc/src/tests/sfe_config_policy.c"
      - "trunk/user/rc/src/tests/hwnat_config_policy.c"
      - "trunk/user/rc/src/firewall_ex.c"
      - "trunk/user/rc/src/firewall_nvram_match_policy.h"
      - "trunk/user/rc/src/tests/firewall_nvram_match_policy.c"
      - "trunk/user/rc/src/firewall_lifecycle_lock.h"
      - "trunk/user/rc/src/tests/firewall_lifecycle_lock.c"
      - "trunk/user/rc/src/firewall_module_table_policy.h"
      - "trunk/user/rc/src/tests/firewall_module_table_policy.c"
      - "trunk/user/rc/src/firewall_mangle_ttl_policy.h"
      - "trunk/user/rc/src/tests/firewall_mangle_ttl_policy.c"
      - "trunk/user/rc/src/firewall_rp_filter_policy.h"
      - "trunk/user/rc/src/tests/firewall_rp_filter_policy.c"
      - "trunk/user/rc/src/firewall_restore_transaction.h"
      - "trunk/user/rc/src/firewall_adbyby_restore_policy.h"
      - "trunk/user/rc/src/firewall_command_status.h"
      - "trunk/user/rc/src/firewall_filter_policy.h"
      - "trunk/user/rc/src/ipv4_netmask_policy.h"
      - "trunk/user/rc/src/firewall_hook_file.h"
      - "trunk/user/rc/src/firewall_rule_file.h"
      - "trunk/user/rc/src/tests/firewall_adbyby_restore_policy.c"
      - "trunk/user/rc/src/tests/firewall_command_status.c"
      - "trunk/user/rc/src/tests/firewall_filter_policy.c"
      - "trunk/user/rc/src/tests/firewall_hook_file.c"
      - "trunk/user/rc/src/tests/firewall_rule_file.c"
      - "trunk/user/rc/src/tests/firewall_snapshot_fd.c"
      - "trunk/user/rc/src/tests/firewall_restore_transaction.c"
      - "trunk/user/rc/src/wireless_module_load_policy.h"
      - "trunk/user/rc/src/tests/wireless_module_load_policy.c"
      - "trunk/user/rc/src/upnp_restart_policy.h"
      - "trunk/user/rc/src/tests/upnp_restart_policy.c"
      - "trunk/user/rc/src/rc.h"
      - "scripts/check_modem_wan_start_status.py"
      - "trunk/user/rc/src/firewall_startup_policy.h"
      - "trunk/user/rc/src/tests/firewall_startup_policy.c"
      - ".github/workflows/firewall-startup-stability.yml"
      - "trunk/user/rc/src/net_lan.c"
  workflow_dispatch:

jobs:
  firewall-startup-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Compile and run firewall lifecycle interprocess lock regression
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -I trunk/user/rc/src trunk/user/rc/src/tests/firewall_lifecycle_lock.c -o "$RUNNER_TEMP/firewall-lifecycle-lock"
          ASAN_OPTIONS=detect_leaks=1 "$RUNNER_TEMP/firewall-lifecycle-lock"

      - name: Compile and run firewall startup policy regression
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -I trunk/user/rc/src trunk/user/rc/src/tests/firewall_startup_policy.c -o "$RUNNER_TEMP/firewall_startup_policy"
          ASAN_OPTIONS=detect_leaks=1 "$RUNNER_TEMP/firewall_startup_policy"

      - name: Compile and run checked firewall-enable NVRAM regression
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -I trunk/user/rc/src trunk/user/rc/src/tests/firewall_nvram_match_policy.c -o "$RUNNER_TEMP/firewall-nvram-match-policy"
          ASAN_OPTIONS=detect_leaks=1 "$RUNNER_TEMP/firewall-nvram-match-policy"

      - name: Compile and run static-route bounds and input policy regression
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -I trunk/user/rc/src trunk/user/rc/src/tests/static_route_policy.c -o "$RUNNER_TEMP/static-route-policy"
          ASAN_OPTIONS=detect_leaks=1 "$RUNNER_TEMP/static-route-policy"

      - name: Verify required NAT restore gates WAN startup
        run: |
          python3 - <<'PY'
          from pathlib import Path

          rc = Path("trunk/user/rc/src/rc.c").read_text()
          rc_header = Path("trunk/user/rc/src/rc.h").read_text()
          net_lan = Path("trunk/user/rc/src/net_lan.c").read_text()
          policy = Path("trunk/user/rc/src/firewall_startup_policy.h").read_text()
          workflow = Path(".github/workflows/firewall-startup-stability.yml").read_text()
          startup_test = Path("trunk/user/rc/src/tests/firewall_startup_policy.c").read_text()

          def body(source, signature):
              start = source.index(signature)
              opening = source.index("{", start)
              depth = 0
              state = "code"
              quote = ""
              pos = opening
              while pos < len(source):
                  char = source[pos]
                  nxt = source[pos + 1] if pos + 1 < len(source) else ""
                  if state == "code":
                      if char == "/" and nxt == "*":
                          state = "block"
                          pos += 2
                          continue
                      if char == "/" and nxt == "/":
                          state = "line"
                          pos += 2
                          continue
                      if char in ("'", '"'):
                          quote = char
                          state = "quote"
                      elif char == "{":
                          depth += 1
                      elif char == "}":
                          depth -= 1
                          if depth == 0:
                              return source[opening + 1:pos]
                  elif state == "quote":
                      if char == chr(92):
                          pos += 2
                          continue
                      if char == quote:
                          state = "code"
                  elif state == "line" and char == chr(10):
                      state = "code"
                  elif state == "block" and char == "*" and nxt == "/":
                      state = "code"
                      pos += 2
                      continue
                  pos += 1
              raise AssertionError("unterminated function: " + signature)

          startup = body(rc, "init_router(void)")
          boot_reader = body(rc, "rc_read_firewall_boot_enabled(const char *param_name, int *enabled)")
          assert "nvram_get_checked(param_name, &value)" in boot_reader
          assert "firewall_nvram_match_status(" in boot_reader
          assert "errno = status;" in boot_reader
          assert 'firewall_enable_status = rc_read_firewall_boot_enabled(' in startup
          assert '"fw_enable_x", &firewall_enabled' in startup
          assert 'nat_enable_status = rc_read_firewall_boot_enabled(' in startup
          assert '"wan_nat_x", &nat_required' in startup
          assert startup.index('"fw_enable_x", &firewall_enabled') < startup.index("nat_restore_status = ipt_nat_default();")
          assert startup.index('"wan_nat_x", &nat_required') < startup.index("nat_restore_status = ipt_nat_default();")
          assert "firewall_startup_policy_allows_wan_checked(" in startup
          assert "test_unreadable_firewall_enable_state_blocks_wan" in startup_test
          assert startup.index("nat_restore_status = ipt_nat_default();") < startup.index("firewall_startup_policy_allows_wan_checked(")
          startup_compact = " ".join(startup.split())
          assert "nat_required, nat_restore_status, switch_vlan_status, ipv6_disable_required, ipv6_init_status))" in startup_compact
          assert "ipv6_disable_required = (get_ipv6_type() == IPV6_DISABLED);" in startup
          assert "ipv6_init_status = init_ipv6();" in startup
          assert "ipv6_filter_required = !ipv6_disable_required;" in startup
          assert startup.index("ipv6_init_status = init_ipv6();") < startup.index("firewall_startup_policy_allows_wan_checked(")
          assert startup.index("if (!firewall_startup_policy_allows_wan_checked(") < startup.index("start_wan();")
          assert "set_ipv4_forward(0);" in startup
          assert "required NAT table or restrictive IPv4/IPv6 firewall filters" in startup
          assert "required switch VLAN isolation could not be verified" in startup

          bridge = body(net_lan, "init_bridge(int is_ap_mode, int *switch_vlan_status)")
          bridge_compact = " ".join(bridge.split())
          assert "if (switch_vlan_status) *switch_vlan_status = 0;" in bridge_compact
          assert "int init_bridge(int is_ap_mode, int *switch_vlan_status);" in rc_header
          vlan_config = bridge_compact.index("operation_status = switch_config_vlan(1);")
          vlan_capture = bridge_compact.index("*switch_vlan_status = operation_status;", vlan_config)
          vlan_record = bridge_compact.index('rc_bridge_init_record(&bridge_status, "switch VLAN setup", operation_status);', vlan_capture)
          assert vlan_config < vlan_capture < vlan_record

          router_init = body(rc, "init_router(void)")
          router_compact = " ".join(router_init.split())
          assert "int switch_vlan_status = 0;" in router_compact
          assert "init_bridge(is_ap_mode, &switch_vlan_status)" in router_compact
          policy_call = router_compact.index("firewall_startup_policy_allows_wan_checked(")
          policy_vlan_arg = router_compact.index("switch_vlan_status", policy_call)
          wan_start = router_compact.index("start_wan();")
          assert policy_call < policy_vlan_arg < wan_start
          assert "Blocking WAN startup: required switch VLAN isolation could not be verified" in router_init
          switch_vlan_gate = policy.index("if (switch_vlan_status != 0)")
          nat_gate = policy.index("if (nat_required && nat_restore_status != 0)")
          ipv6_disable_gate = policy.index("if (ipv6_disable_required && ipv6_disable_status != 0)")
          firewall_bypass = policy.index("if (!firewall_enabled)")
          assert switch_vlan_gate < nat_gate < ipv6_disable_gate < firewall_bypass
          assert "test_disabled_ipv6_requires_verified_global_disable" in startup_test
          assert "Blocking WAN startup: IPv6 is configured disabled but global disable sysctls could not be verified" in startup
          assert 'ipv6_forward_disable_status = set_interface_conf_int("ipv6", "all", "forwarding", 0);' in startup

          nat_gate = policy.index("if (nat_required && nat_restore_status != 0)")
          firewall_bypass = policy.index("if (!firewall_enabled)")
          assert nat_gate < firewall_bypass
          assert "if (ipv4_filter_status != 0)" in policy
          assert "if (ipv6_filter_required && ipv6_filter_status != 0)" in policy

          firewall_source_for_ttl = Path("trunk/user/rc/src/firewall_ex.c").read_text()
          firewall_entry_for_mask = body(firewall_source_for_ttl, "start_firewall_ex_locked(void)")
          mask_read = firewall_entry_for_mask.index('lan_netmask = nvram_safe_get("lan_netmask");')
          mask_check = firewall_entry_for_mask.index("ipv4_netmask_is_contiguous(lan_netmask)", mask_read)
          subnet_derive = firewall_entry_for_mask.index("ip2class(lan_ip, lan_netmask, lan_net", mask_check)
          assert mask_read < mask_check < subnet_derive
          assert "Invalid LAN IPv4 netmask for firewall; refusing rebuild" in firewall_entry_for_mask
          nat_default = body(firewall_source_for_ttl, "ipt_nat_default(void)")
          nat_enable_read = nat_default.index('firewall_read_enabled_setting("wan_nat_x", &is_nat_enabled)')
          nat_ip_read = nat_default.index('firewall_read_string_setting("lan_ipaddr", &lan_ip_setting)')
          nat_mask_read = nat_default.index('firewall_read_string_setting("lan_netmask", &lan_netmask_setting)')
          nat_mask_check = nat_default.index("ipv4_netmask_is_contiguous(lan_netmask_setting)")
          nat_loop_read = nat_default.index('firewall_read_enabled_setting("nf_nat_loop", &is_nat_loopback_enabled)')
          nat_file_open = nat_default.index('firewall_open_rule_file(ipt_file, "IPv4 default NAT")')
          assert nat_enable_read < nat_file_open
          assert nat_ip_read < nat_mask_read < nat_mask_check < nat_file_open
          assert nat_mask_check < nat_loop_read < nat_file_open
          assert "nvram_safe_get(" not in nat_default
          assert "nvram_match(" not in nat_default
          assert "ip2class(lan_ip, lan_netmask, lan_net" in nat_default
          assert "Invalid LAN IPv4 netmask for default NAT; refusing restore" in nat_default
          filter_policy = Path("trunk/user/rc/src/firewall_filter_policy.h").read_text()
          filter_test = Path("trunk/user/rc/src/tests/firewall_filter_policy.c").read_text()
          netmask_policy = Path("trunk/user/rc/src/ipv4_netmask_policy.h").read_text()
          assert '#include "ipv4_netmask_policy.h"' in filter_policy
          assert "ipv4_netmask_is_contiguous" in netmask_policy
          assert "test_ipv4_netmask_contiguity" in filter_test
          rp_filter_source = body(firewall_source_for_ttl, "start_firewall_ex_locked(void)")
          rp_filter_write = rp_filter_source.index("firewall_rp_filter_write_status(")
          rp_filter_abort = rp_filter_source.index("return status;", rp_filter_write)
          assert rp_filter_source.index('set_interface_conf_int("ipv4", man_if, "rp_filter", i_rp)') < rp_filter_write
          assert rp_filter_source.index("man_if[0] && is_interface_exist(man_if)", rp_filter_write) < rp_filter_abort
          assert "IPv4 rp_filter update failed" in rp_filter_source[rp_filter_write:rp_filter_abort]
          rp_filter_policy = Path("trunk/user/rc/src/firewall_rp_filter_policy.h").read_text()
          rp_filter_test = Path("trunk/user/rc/src/tests/firewall_rp_filter_policy.c").read_text()
          assert "configured_value == 1 ? 0 : ENODEV" in rp_filter_policy
          assert "return write_errno > 0 ? write_errno : EIO;" in rp_filter_policy
          assert "test_present_interface_write_failures_propagate" in rp_filter_test
          mangle_body = body(firewall_source_for_ttl, "ipt_mangle_rules(")
          ttl_write = mangle_body.index("firewall_mangle_ttl_write_status(")
          ttl_failure = mangle_body.index("firewall_core_restore_transaction.failed = 1;", ttl_write)
          ttl_return = mangle_body.index("return;", ttl_failure)
          assert mangle_body.index('fput_int("/proc/sys/net/ipv4/ip_default_ttl", i_wan_ttl_value)') < ttl_write
          assert ttl_write < ttl_failure < ttl_return
          assert "logmessage(LOGNAME" in mangle_body[ttl_write:ttl_failure]
          ttl_policy = Path("trunk/user/rc/src/firewall_mangle_ttl_policy.h").read_text()
          ttl_test = Path("trunk/user/rc/src/tests/firewall_mangle_ttl_policy.c").read_text()
          assert "configured_value <= 1 || write_status == 0" in ttl_policy
          assert "return write_errno > 0 ? write_errno : EIO;" in ttl_policy
          assert "test_configured_ttl_requires_successful_write" in ttl_test
          module_policy = Path("trunk/user/rc/src/firewall_module_table_policy.h").read_text()
          module_test = Path("trunk/user/rc/src/tests/firewall_module_table_policy.c").read_text()
          firewall_source = Path("trunk/user/rc/src/firewall_ex.c").read_text()
          firewall_nvram_policy = Path("trunk/user/rc/src/firewall_nvram_match_policy.h").read_text()
          firewall_nvram_test = Path("trunk/user/rc/src/tests/firewall_nvram_match_policy.c").read_text()
          firewall_reconcile = body(firewall_source, "start_firewall_ex_locked(void)")
          firewall_entry = body(firewall_source, "start_firewall_ex(void)")
          assert '#include "firewall_lifecycle_lock.h"' in firewall_source
          acquire_pos = firewall_entry.index("firewall_lifecycle_lock_acquire()")
          rebuild_pos = firewall_entry.index("status = start_firewall_ex_locked();")
          release_pos = firewall_entry.index("firewall_lifecycle_lock_release(lock_fd)")
          assert "if (lock_fd < 0)" in firewall_entry
          assert acquire_pos < rebuild_pos < release_pos
          lock_test = Path("trunk/user/rc/src/tests/firewall_lifecycle_lock.c").read_text()
          assert "test_cross_process_exclusion_and_stable_inode" in lock_test
          assert "test_untrusted_lock_files_fail_closed" in lock_test
          detect_preflight = 'status = firewall_read_enabled_setting("pppoemwan_enable", &is_pppoemwan_enabled);'
          detect_gate = "if (is_pppoemwan_enabled)"
          detect_call = 'hook_error = firewall_log_command_failure("PPPoE-MWAN detection",'
          detect_merge = "status = rc_first_service_start_status(status, hook_error);"
          detect_preflight_pos = firewall_reconcile.find(detect_preflight)
          detect_sysctl_pos = firewall_reconcile.find(
              'set_interface_conf_int("ipv4", man_if, "rp_filter", i_rp)'
          )
          detect_gate_pos = firewall_reconcile.find(detect_gate)
          detect_call_pos = firewall_reconcile.find(detect_call)
          detect_merge_pos = firewall_reconcile.find(detect_merge, detect_call_pos)
          assert detect_preflight_pos >= 0
          assert detect_sysctl_pos > detect_preflight_pos
          assert detect_gate_pos > detect_sysctl_pos
          assert detect_call_pos > detect_gate_pos
          assert detect_merge_pos > detect_call_pos
          assert 'nvram_match("pppoemwan_enable", "1")' not in firewall_reconcile
          assert 'doSystem("/usr/bin/detect.sh");' not in firewall_reconcile
          for module in ("iptable_mangle", "iptable_raw", "ip6table_mangle"):
              assert f'"{module}"' in firewall_source
          assert "is_module_loaded_status(module_name)" in firewall_source
          assert "rc_firewall_module_table_restore_decide" in firewall_source
          assert "firewall_core_restore_transaction.failed = 1;" in firewall_source
          assert "probe_status < 0" in module_policy
          assert "probe_status > 1" in module_policy
          assert "INT_MIN" in module_policy
          assert "test_unknown_aborts" in module_test
          assert "test_invalid_probe_fails_closed" in module_test

          firewall_nvram_reader = body(firewall_source, "firewall_read_enabled_setting(const char *param_name, int *enabled)")
          assert "nvram_get_checked(param_name, &value)" in firewall_nvram_reader
          assert "firewall_nvram_match_status(" in firewall_nvram_reader
          assert "firewall_abort_core_restore_after_staging_failure();" in firewall_nvram_reader
          not_zero_reader = body(firewall_source, "firewall_read_not_zero_setting(const char *param_name, int *enabled)")
          assert "nvram_get_checked(param_name, &value)" in not_zero_reader
          assert "firewall_nvram_not_zero_status(api_result, saved_errno" in not_zero_reader
          assert "firewall_abort_core_restore_after_staging_failure();" in not_zero_reader
          assert "test_not_zero_reader_preserves_invmatch_defaults" in firewall_nvram_test
          assert "test_not_zero_backend_failure_preserves_output" in firewall_nvram_test
          assert "test_backend_errors_preserve_status_and_output" in firewall_nvram_test

name: Firewall Startup Stability Regression

on:
  push:
    paths:
      - "trunk/user/rc/src/rc.c"
      - "trunk/user/rc/src/firewall_startup_policy.h"
      - "trunk/user/rc/src/tests/firewall_startup_policy.c"
      - ".github/workflows/firewall-startup-stability.yml"
  pull_request:
    paths:
      - "trunk/user/rc/src/rc.c"
      - "trunk/user/rc/src/firewall_startup_policy.h"
      - "trunk/user/rc/src/tests/firewall_startup_policy.c"
      - ".github/workflows/firewall-startup-stability.yml"
  workflow_dispatch:

jobs:
  firewall-startup-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Compile and run firewall startup policy regression
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -I trunk/user/rc/src trunk/user/rc/src/tests/firewall_startup_policy.c -o "$RUNNER_TEMP/firewall_startup_policy"
          ASAN_OPTIONS=detect_leaks=1 "$RUNNER_TEMP/firewall_startup_policy"

      - name: Verify required NAT restore gates WAN startup
        run: |
          python3 - <<'PY'
          from pathlib import Path

          rc = Path("trunk/user/rc/src/rc.c").read_text()
          policy = Path("trunk/user/rc/src/firewall_startup_policy.h").read_text()
          workflow = Path(".github/workflows/firewall-startup-stability.yml").read_text()

          def block_after(source, marker):
              marker_pos = source.index(marker)
              start = source.rfind("if (!is_ap_mode) {", 0, marker_pos)
              assert start >= 0, "router-mode startup block not found"
              brace = source.index("{", start)
              depth = 0
              for pos in range(brace, len(source)):
                  if source[pos] == "{":
                      depth += 1
                  elif source[pos] == "}":
                      depth -= 1
                      if depth == 0:
                          return source[brace + 1:pos]
              raise AssertionError("unterminated router-mode startup block")

          startup = block_after(rc, "nat_restore_status = ipt_nat_default();")
          assert "nat_required = nvram_match(\"wan_nat_x\", \"1\");" in startup
          assert startup.index("nat_required = nvram_match") < startup.index("nat_restore_status = ipt_nat_default();")
          assert startup.index("nat_restore_status = ipt_nat_default();") < startup.index("firewall_startup_policy_allows_wan(")
          assert "nat_required," in startup and "nat_restore_status))" in startup
          assert startup.index("if (!firewall_startup_policy_allows_wan(") < startup.index("start_wan();")
          assert "set_ipv4_forward(0);" in startup
          assert "required NAT table or restrictive IPv4/IPv6 firewall filters" in startup

          nat_gate = policy.index("if (nat_required && nat_restore_status != 0)")
          firewall_bypass = policy.index("if (!firewall_enabled)")
          assert nat_gate < firewall_bypass
          assert "if (ipv4_filter_status != 0)" in policy
          assert "if (ipv6_filter_required && ipv6_filter_status != 0)" in policy

          paths = (
              "trunk/user/rc/src/rc.c",
              "trunk/user/rc/src/firewall_startup_policy.h",
              "trunk/user/rc/src/tests/firewall_startup_policy.c",
              ".github/workflows/firewall-startup-stability.yml",
          )
          push = workflow.split("  pull_request:", 1)[0]
          pr = workflow.split("  workflow_dispatch:", 1)[0].split("  pull_request:", 1)[1]
          for path in paths:
              assert push.count('"' + path + '"') == 1
              assert pr.count('"' + path + '"') == 1

          print("Required NAT restore, filter safety and push/PR workflow contracts: PASS")
          PY

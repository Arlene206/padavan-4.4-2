      - "trunk/user/rc/src/tests/firewall_rp_filter_policy.c"
      - "trunk/user/rc/src/firewall_restore_transaction.h"
      - "trunk/user/rc/src/firewall_adbyby_restore_policy.h"
      - "trunk/user/rc/src/firewall_command_status.h"
      - "trunk/user/rc/src/firewall_filter_policy.h"
      - "trunk/user/rc/src/ipv4_netmask_policy.h"
      - "trunk/user/rc/src/firewall_hook_file.h"
      - "trunk/user/rc/src/firewall_rule_file.h"
      - "trunk/user/rc/src/tests/firewall_adbyby_restore_policy.c"
      - "trunk/user/rc/src/tests/firewall_command_status.c"
      - "trunk/user/rc/src/tests/firewall_filter_policy.c"
      - "trunk/user/rc/src/tests/firewall_hook_file.c"
      - "trunk/user/rc/src/tests/firewall_rule_file.c"
      - "trunk/user/rc/src/tests/firewall_snapshot_fd.c"
      - "trunk/user/rc/src/tests/firewall_restore_transaction.c"
      - "trunk/user/rc/src/wireless_module_load_policy.h"
      - "trunk/user/rc/src/tests/wireless_module_load_policy.c"
      - "trunk/user/rc/src/upnp_restart_policy.h"
      - "trunk/user/rc/src/tests/upnp_restart_policy.c"
      - "trunk/user/rc/src/rc.h"
      - "scripts/check_modem_wan_start_status.py"
      - "trunk/user/rc/src/firewall_startup_policy.h"
      - "trunk/user/rc/src/tests/firewall_startup_policy.c"
      - ".github/workflows/firewall-startup-stability.yml"
      - "trunk/user/rc/src/net_lan.c"
  pull_request:
    paths:
      - "trunk/user/rc/src/rc.c"
      - "trunk/user/rc/src/services_stor.c"
      - "trunk/user/rc/src/net6.c"
      - "trunk/user/rc/src/tests/ipv6_global_conf_policy.c"
      - "trunk/user/rc/src/ipv6_global_conf_policy.h"
      - "trunk/user/rc/src/vpn_server.c"

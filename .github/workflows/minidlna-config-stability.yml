name: MiniDLNA configuration snapshot and INI safety regression

on:
  push:
    paths:
      - ".github/workflows/minidlna-config-stability.yml"
      - "trunk/user/rc/src/services_stor.c"
      - "trunk/user/rc/src/minidlna_config_file.h"
      - "trunk/user/rc/src/tests/minidlna_config_file.c"
  pull_request:
    paths:
      - ".github/workflows/minidlna-config-stability.yml"
      - "trunk/user/rc/src/services_stor.c"
      - "trunk/user/rc/src/minidlna_config_file.h"
      - "trunk/user/rc/src/tests/minidlna_config_file.c"

permissions:
  contents: read

jobs:
  minidlna-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run MiniDLNA atomic publication and INI injection regression
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -fno-omit-frame-pointer -I trunk/user/rc/src \
            trunk/user/rc/src/tests/minidlna_config_file.c \
            -o /tmp/minidlna-config-file
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 /tmp/minidlna-config-file
      - name: Verify transactional MiniDLNA NVRAM snapshot and safe config source
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path("trunk/user/rc/src/services_stor.c").read_text()
          config = Path("trunk/user/rc/src/minidlna_config_file.h").read_text()
          test = Path("trunk/user/rc/src/tests/minidlna_config_file.c").read_text()

          def body(text, signature):
              start = text.find(signature)
              assert start >= 0, f"missing definition: {signature}"
              brace = text.find("{", start + len(signature))
              assert brace >= 0, f"missing body: {signature}"
              depth = 0
              for pos in range(brace, len(text)):
                  if text[pos] == "{":
                      depth += 1
                  elif text[pos] == "}":
                      depth -= 1
                      if depth == 0:
                          return text[brace + 1:pos]
              raise AssertionError(f"unterminated body: {signature}")

          snapshot = body(source, "storage_read_minidlna_config_status(")
          updater = body(source, "update_minidlna_conf(")
          daemon_start = body(source, "int run_dms(int force_rescan)")
          # Require one C escape for LF in each attack fixture. Two source
          # backslashes would pass literal backslash+n, not a control character.
          malicious_config_literals = (
              r'values.friendly_name = "Padavan\nmodel_number=999";',
              r'values.media_source1 = "V,/media/video\nmedia_dir=V,/etc";',
              r'values.interface_name = "br0\nnotify_interval=1";',
              r'values.database_dir = "/mnt/minidlna\nlog_dir=/";',
          )
          for fixture in malicious_config_literals:
              assert fixture in test, f"missing real newline-injection fixture: {fixture}"

          assert "nvram_transaction_begin(&transaction)" in snapshot
          keys = ('"dlna_disc"', '"dlna_root"', '"dlna_src1"',
                  '"dlna_src2"', '"dlna_src3"', '"dlna_sort"')
          positions = [snapshot.index(key) for key in keys]
          assert positions == sorted(positions)
          assert snapshot.index('"dlna_sort"') < snapshot.index("nvram_transaction_end(&transaction)")
          assert snapshot.count("rc_wan_nvram_copy_value(") == 3
          assert updater.index("storage_read_minidlna_config_status(") < updater.index("minidlna_config_publish(")
          assert "if (status != 0)" in updater
          # The configured -R/-U scan mode must not be lost on NVRAM errors.
          rescan_read_compact = 'storage_read_integer_status("dlna_rescan",0,&db_rescan_mode)'
          rescan_compact = "".join(daemon_start.split())
          assert rescan_read_compact in rescan_compact
          assert 'nvram_get_int("dlna_rescan")' not in daemon_start
          force_gate = rescan_compact.index("if(!force_rescan)")
          rescan_at = rescan_compact.index(rescan_read_compact)
          failure_gate = rescan_compact.index("if(config_status!=0)", rescan_at)
          link_mutation = rescan_compact.index("unlink(link_path)")
          assert force_gate < rescan_at < failure_gate < link_mutation
          assert "cannot read database rescan mode; aborting daemon start" in daemon_start
          assert "if (force_rescan || db_rescan_mode == 2)" in daemon_start
          # Service enable and server identity are also checked before side effects.
          enable_read = 'storage_read_string_status("apps_dms",apps_enabled,sizeof(apps_enabled))'
          enable_gate = "if(enable_status!=0)"
          assert enable_read in rescan_compact
          assert enable_gate in rescan_compact
          enable_at = rescan_compact.index(enable_read)
          enable_error_at = rescan_compact.index(enable_gate, enable_at)
          disabled_gate_at = rescan_compact.index('if(strcmp(apps_enabled,"1")!=0)return0;', enable_error_at)
          support_check_at = rescan_compact.index("if(!is_dms_support())", disabled_gate_at)
          assert enable_at < enable_error_at < disabled_gate_at < support_check_at
          assert 'nvram_match("apps_dms","1")' not in rescan_compact
          mac_read_compact = 'storage_read_string_status("il0macaddr",mac_address,sizeof(mac_address))'
          mac_at = rescan_compact.index(mac_read_compact)
          mac_error_at = rescan_compact.index("if(mac_status!=0)", mac_at)
          mac_parse_at = rescan_compact.index("if(!ether_atoe(mac_address,mac_bin))", mac_error_at)
          assert mac_at < mac_error_at < mac_parse_at < link_mutation
          assert "cannot read MiniDLNA server identity; aborting daemon start" in daemon_start
          assert "invalid MiniDLNA server identity; aborting daemon start" in daemon_start
          assert 'nvram_safe_get("il0macaddr")' not in rescan_compact
          assert "minidlna_argv[4] = ether_etoa3(mac_bin, mac_str);" in daemon_start
          for getter in ('nvram_get_int("dlna_disc")', 'nvram_get_int("dlna_root")',
                         'nvram_get_int("dlna_sort")', 'nvram_safe_get("dlna_src1")',
                         'nvram_safe_get("dlna_src2")', 'nvram_safe_get("dlna_src3")'):
              assert getter not in updater

          validator = body(config, "minidlna_config_text_is_safe(")
          writer = body(config, "minidlna_config_values_are_safe(")
          publisher = body(config, "minidlna_config_publish(")
          assert "*cursor < 0x20" in validator and "*cursor == 0x7f" in validator
          for field in ("interface_name", "media_source1", "media_source2",
                        "media_source3", "friendly_name", "database_dir"):
              assert f"minidlna_config_text_is_safe(values->{field})" in writer
          assert "minidlna_config_values_are_safe(values)" in publisher
          assert publisher.index("minidlna_config_values_are_safe(values)") < publisher.index("mkstemp(")
          for marker in ("model_number=999", "media_dir=V,/etc", "notify_interval=1", "log_dir=/"):
              assert marker in test
          assert "last-good-configuration" in test
          print("MiniDLNA transactional snapshot and config-injection contract: PASS")
          PY

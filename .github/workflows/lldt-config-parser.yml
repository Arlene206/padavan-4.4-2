name: LLDT bounded configuration parser regression

on:
  push:
    branches: [main]
    paths:
      - "trunk/user/lldt/src/main.c"
      - "trunk/user/lldt/src/ctmain.c"
      - "trunk/user/lldt/src/lldt_config_parse_policy.h"
      - "trunk/user/lldt/src/lldt_config_path_policy.h"
      - "trunk/user/lldt/src/tests/lldt_config_path_policy.c"
      - "scripts/check_lldt_config_parser.py"
      - ".github/workflows/lldt-config-parser.yml"
  pull_request:
    branches: [main]
    paths:
      - "trunk/user/lldt/src/main.c"
      - "trunk/user/lldt/src/ctmain.c"
      - "trunk/user/lldt/src/lldt_config_parse_policy.h"
      - "trunk/user/lldt/src/lldt_config_path_policy.h"
      - "trunk/user/lldt/src/tests/lldt_config_path_policy.c"
      - "scripts/check_lldt_config_parser.py"
      - ".github/workflows/lldt-config-parser.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lldt-config-parser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run GNU89 config parser and icon path regressions
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer \
            -I trunk/user/lldt/src \
            trunk/user/lldt/src/tests/lldt_config_path_policy.c \
            -o /tmp/lldt-config-parser
          ASAN_OPTIONS=detect_leaks=1 /tmp/lldt-config-parser
      - name: Verify production and conformance-tool parser contracts
        run: python3 scripts/check_lldt_config_parser.py

name: USB modem WDM/NDIS physical identity stability

on:
  push:
    paths:
      - ".github/workflows/usb-modem-identity-stability.yml"
      - "trunk/user/libdisk/src/dev_info.c"
      - "trunk/user/libdisk/src/dev_info.h"
      - "trunk/user/libdisk/src/usb_info.c"
      - "trunk/user/rc/src/hotplug_usb.c"
      - "trunk/user/rc/src/modem_sg_module_policy.h"
      - "trunk/user/rc/src/tests/modem_sg_module_policy.c"
      - "trunk/user/rc/src/modem_sr_status_policy.h"
      - "trunk/user/rc/src/tests/modem_sr_status_policy.c"
      - "trunk/user/rc/src/services_stor.c"
      - "trunk/user/rc/src/modem_wan_start_policy.h"
      - "trunk/user/rc/src/tests/modem_wan_start_policy.c"
      - "trunk/user/rc/src/wan_nvram_status_policy.h"
      - "trunk/user/rc/src/tests/wan_nvram_status_policy.c"
      - "scripts/check_modem_wan_start_status.py"
      - "trunk/user/rc/src/services_usb.c"
      - "trunk/user/rc/src/usb_modem.c"
      - "trunk/user/rc/src/modem_node_file.h"
      - "trunk/user/rc/src/modem_node_identity_policy.h"
      - "trunk/user/rc/src/tests/modem_node_file.c"
      - "scripts/check_modem_module_reload.py"
      - "trunk/user/rc/src/rc.c"
      - "trunk/user/rc/src/rc.h"
      - "trunk/user/rc/src/modem_module_reload_policy.h"
      - "trunk/user/rc/src/tests/modem_module_reload_policy.c"
      - "trunk/user/rc/src/net_wan.c"
  pull_request:
    paths:
      - ".github/workflows/usb-modem-identity-stability.yml"
      - "trunk/user/libdisk/src/dev_info.c"
      - "trunk/user/libdisk/src/dev_info.h"
      - "trunk/user/libdisk/src/usb_info.c"
      - "trunk/user/rc/src/hotplug_usb.c"
      - "trunk/user/rc/src/modem_sg_module_policy.h"
      - "trunk/user/rc/src/tests/modem_sg_module_policy.c"
      - "trunk/user/rc/src/modem_sr_status_policy.h"
      - "trunk/user/rc/src/tests/modem_sr_status_policy.c"
      - "trunk/user/rc/src/services_stor.c"
      - "trunk/user/rc/src/modem_wan_start_policy.h"
      - "trunk/user/rc/src/tests/modem_wan_start_policy.c"
      - "trunk/user/rc/src/wan_nvram_status_policy.h"
      - "trunk/user/rc/src/tests/wan_nvram_status_policy.c"
      - "scripts/check_modem_wan_start_status.py"
      - "trunk/user/rc/src/services_usb.c"
      - "trunk/user/rc/src/usb_modem.c"
      - "trunk/user/rc/src/modem_node_file.h"
      - "trunk/user/rc/src/modem_node_identity_policy.h"
      - "trunk/user/rc/src/tests/modem_node_file.c"
      - "scripts/check_modem_module_reload.py"
      - "trunk/user/rc/src/rc.c"
      - "trunk/user/rc/src/rc.h"
      - "trunk/user/rc/src/modem_module_reload_policy.h"
      - "trunk/user/rc/src/tests/modem_module_reload_policy.c"
      - "trunk/user/rc/src/net_wan.c"

permissions:
  contents: read

jobs:
  usb-modem-identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run SCSI generic module readiness regression
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -fno-omit-frame-pointer -I trunk/user/rc/src \
            trunk/user/rc/src/tests/modem_sg_module_policy.c \
            -o /tmp/modem-sg-module-policy
          ASAN_OPTIONS=detect_leaks=1 /tmp/modem-sg-module-policy
      - name: Compile and run SCSI CD eject/unload result policy regression
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -fno-omit-frame-pointer -I trunk/user/rc/src \
            trunk/user/rc/src/tests/modem_sr_status_policy.c \
            -o /tmp/modem-sr-status-policy
          ASAN_OPTIONS=detect_leaks=1 /tmp/modem-sr-status-policy
      - name: Compile and run GNU89 modem identity and metadata regression
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -I trunk/user/rc/src \
            trunk/user/rc/src/tests/modem_node_file.c \
            -o /tmp/modem-node-file
          ASAN_OPTIONS=detect_leaks=1 /tmp/modem-node-file
      - name: Compile and run modem module alternative readiness regression
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -I trunk/user/rc/src \
            trunk/user/rc/src/tests/modem_module_reload_policy.c \
            -o /tmp/modem-module-reload-policy
          ASAN_OPTIONS=detect_leaks=1 /tmp/modem-module-reload-policy
      - name: Compile and run modem WAN deferred-event retry regression
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -fno-omit-frame-pointer -I trunk/user/rc/src \
            trunk/user/rc/src/tests/modem_wan_start_policy.c \
            -o /tmp/modem-wan-start-policy
          ASAN_OPTIONS=detect_leaks=1 /tmp/modem-wan-start-policy
      - name: Compile and run checked WAN NVRAM read policy regression
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -fno-omit-frame-pointer -I trunk/user/rc/src \
            trunk/user/rc/src/tests/wan_nvram_status_policy.c \
            -o /tmp/wan-nvram-status-policy
          ASAN_OPTIONS=detect_leaks=1 /tmp/wan-nvram-status-policy
      - name: Verify WDM discovery, hotplug identity publication and NDIS matching
        run: |
          python3 - <<'PY'
          from pathlib import Path

          libdisk = Path("trunk/user/libdisk/src")
          rc = Path("trunk/user/rc/src")
          dev_info = (libdisk / "dev_info.c").read_text()
          dev_info_header = (libdisk / "dev_info.h").read_text()
          usb_info = (libdisk / "usb_info.c").read_text()
          hotplug = (rc / "hotplug_usb.c").read_text()
          wan_network = (rc / "net_wan.c").read_text()
          sr_policy = (rc / "modem_sr_status_policy.h").read_text()
          sr_test = (rc / "tests/modem_sr_status_policy.c").read_text()
          sg_policy = (rc / "modem_sg_module_policy.h").read_text()
          sg_test = (rc / "tests/modem_sg_module_policy.c").read_text()
          modem = (rc / "usb_modem.c").read_text()
          services_stor = (rc / "services_stor.c").read_text()
          retry_policy = (rc / "modem_wan_start_policy.h").read_text()
          retry_test = (rc / "tests/modem_wan_start_policy.c").read_text()
          services_stor = (rc / "services_stor.c").read_text()
          services_usb = (rc / "services_usb.c").read_text()
          metadata = (rc / "modem_node_file.h").read_text()
          identity = (rc / "modem_node_identity_policy.h").read_text()
          test = (rc / "tests/modem_node_file.c").read_text()
          workflow = Path(".github/workflows/usb-modem-identity-stability.yml").read_text()

          def body(source, signature):
              start = source.index(signature)
              brace = source.index("{", start)
              depth = 0
              for pos in range(brace, len(source)):
                  if source[pos] == "{":
                      depth += 1
                  elif source[pos] == "}":
                      depth -= 1
                      if depth == 0:
                          return source[brace + 1:pos]
              raise AssertionError("unterminated function: " + signature)

          modem_selector = body(wan_network, "select_usb_modem_to_wan(void)")
          assert 'get_nvram_int_checked_status("modem_prio", &modem_priority)' in modem_selector
          assert "modem_wan_select_device_status(" in modem_selector
          assert 'nvram_get_int("modem_prio")' not in modem_selector
          assert "if (has_link < 0)" in modem_selector
          assert "link_probe_status = errno > 0 ? errno : EIO;" in modem_selector
          assert modem_selector.index('get_nvram_int_checked_status("modem_prio"') < modem_selector.index("modem_wan_select_device_status(") < modem_selector.index("set_usb_modem_dev_wan(")
          ethernet_probe = body(wan_network, "get_wan_ether_link_direct(int is_ap_mode)")
          assert 'get_nvram_int_checked_status("wan_src_phy", &wan_src_phy)' in ethernet_probe
          assert 'nvram_get_int("wan_src_phy")' not in ethernet_probe
          assert "if (status != 0)" in ethernet_probe and "errno = status;" in ethernet_probe
          assert "errno = EIO;" in ethernet_probe and "return -1;" in ethernet_probe
          for marker in (
              "test_modem_selection_preserves_missing_priority_default",
              "test_modem_selection_fails_closed_on_priority_read_error",
              "test_modem_selection_fails_closed_on_unknown_ethernet_link",
              "test_modem_selection_prefers_wired_link_when_present",
              "test_modem_selection_uses_modem_only_after_confirmed_link_absence",
              "test_modem_selection_keeps_wisp_compatibility_without_link_probe",
              "test_modem_selection_skips_priority_read_when_no_modem_is_present",
              "test_modem_selection_rejects_invalid_probe_and_output",
          ):
              assert marker in retry_test and marker + "();" in retry_test

          assert "DEVICE_TYPE_MODEM_WDM" in dev_info_header
          classify = body(dev_info, "get_device_type_by_device(")
          assert "isWDMNode(device_name)" in classify
          assert "return DEVICE_TYPE_MODEM_WDM;" in classify

          resolve = body(usb_info, "get_usb_path_by_device(")
          assert "DEVICE_TYPE_MODEM_WDM" in resolve
          assert "SYS_PRINTER" in resolve
          assert "realpath(device_path, resolved_path)" in resolve
          assert "sleep(1)" in resolve[resolve.index("DEVICE_TYPE_MODEM_WDM"):]

          printer = body(hotplug, "int mdev_lp_main(")
          assert 'notify_usb_hotplug_event("on_unplug_usb_printer", device_name)' in printer
          assert 'notify_usb_hotplug_event("on_hotplug_usb_printer", device_name)' in printer
          assert "notify_rc(" not in printer
          assert "return notification_status == 0 ? 0 : 1;" in printer

          net = body(hotplug, "int mdev_net_main(")
          net_remove_start = net.index("if(!get_hotplug_action(action)){")
          net_remove_end = net.index("goto out_unlock;", net_remove_start)
          net_remove = net[net_remove_start:net_remove_end]
          assert "interface_down_status = ifconfig(device_name, 0, \"0.0.0.0\", NULL);" in net_remove
          assert "interface_flags = get_interface_flags(device_name);" in net_remove
          assert "modem_wan_unplug_interface_down_result(" in net_remove
          assert "metadata_status = metadata_status != 0 ? metadata_status : 1;" in net_remove
          assert net_remove.index("ifconfig(device_name, 0, \"0.0.0.0\", NULL)") < net_remove.index("get_interface_flags(device_name)") < net_remove.index("modem_wan_unplug_interface_down_result(")
          assert net_remove.index("modem_wan_unplug_interface_down_result(") < net_remove.index('notify_usb_hotplug_event("on_unplug_usb_modem", device_name)')
          assert "Always notify the WAN owner" in net_remove
          assert "notify_usb_hotplug_event(\"on_unplug_usb_modem\", device_name)" in net_remove
          assert "modem_wan_hotplug_notification_result(" in net_remove
          net_plug_start = net.index('if (nvram_invmatch("modem_prio", "0")')
          net_plug = net[net_plug_start:]
          assert "notify_usb_hotplug_event(\"on_hotplug_usb_modem\", device_name)" in net_plug
          assert "modem_wan_hotplug_notification_result(" in net_plug
          assert "notify_rc(" not in net
          assert '#include "modem_wan_start_policy.h"' in hotplug
          assert "test_unplug_ifdown_failure_is_distinguished_from_removed_interface" in (
              (rc / "tests/modem_wan_start_policy.c").read_text()
          )
          net = body(hotplug, "int mdev_net_main(")
          assert "data_len >= 0 && data_len < (int)sizeof(node_data)" in net
          assert net.index("modem_node_usb_identity_is_valid") < net.index("modem_node_file_publish_identity(")
          assert "publish_status = modem_node_file_publish_identity(" in net
          assert "if (publish_status != 0)" in net
          assert "publish_status == -2" in net
          assert "Failed to publish and remove stale NDIS metadata" in net
          assert "Failed to publish NDIS metadata; stale metadata removed" in net
          assert "metadata_status = 1;" in net
          assert "return metadata_status;" in net
          assert net.count("modem_node_file_remove(MODEM_NODE_DIR, device_name) != 0") == 3
          modem_notify = body(hotplug, "static int\nnotify_usb_hotplug_event(")
          assert "notify_rc_status(event_name)" in modem_notify
          assert "errno > 0 ? errno : EIO" in modem_notify
          assert "modem_wan_hotplug_notification_result" in (
              (rc / "modem_wan_start_policy.h").read_text()
          )
          assert "test_hotplug_notification_queue_failure_reaches_handler_result" in retry_test

          tty = body(hotplug, "int mdev_tty_main(")
          tty_remove_start = tty.index("if(!get_hotplug_action(action)){")
          tty_remove_end = tty.index("goto out_unlock;", tty_remove_start)
          tty_remove = tty[tty_remove_start:tty_remove_end]
          assert "notify_usb_hotplug_event(\"on_unplug_usb_modem\", device_name)" in tty_remove
          assert "modem_wan_hotplug_notification_result(" in tty_remove
          assert "notify_rc(" not in tty
          tty_plug_start = tty.index('if (nvram_invmatch("modem_prio", "0")')
          tty_plug = tty[tty_plug_start:]
          assert "notify_usb_hotplug_event(\"on_hotplug_usb_modem\", device_name)" in tty_plug
          assert "modem_wan_hotplug_notification_result(" in tty_plug

          tty = body(hotplug, "int mdev_tty_main(")
          assert "publish_status = modem_node_file_publish_identity(" in tty
          assert "if (publish_status != 0)" in tty
          assert "Failed to publish and remove stale TTY metadata" in tty
          assert "Failed to publish TTY metadata; stale metadata removed" in tty
          assert "metadata_status = 1;" in tty
          assert "return metadata_status;" in tty
          assert "modem_node_file_remove(MODEM_NODE_DIR, device_name)" in tty
          assert "publish_status == -2" in net
          publish = body(metadata, "modem_node_file_publish_with_cleanup(")
          assert "write_fn(directory, name, contents) == 0" in publish
          assert "return remove_fn(directory, name) == 0 ? -1 : -2;" in publish
          publish_wrapper = body(metadata, "modem_node_file_publish_identity(")
          assert "modem_node_file_publish_with_cleanup(" in publish_wrapper
          assert "test_metadata_publication_cleanup" in test

          wdm = body(hotplug, "mdev_wdm_main(")
          assert "get_usb_port_by_device(device_name" in wdm
          assert "get_usb_devnum(usb_port_id)" in wdm
          assert "modem_node_usb_identity_is_valid(usb_port_id, devnum)" in wdm
          assert '"pref=%d\\ndevnum=%d\\nportid=%s\\n"' in wdm
          assert wdm.index("modem_node_usb_identity_is_valid") < wdm.index(
              "modem_node_file_publish_identity(")
          assert "publish_status == -2" in wdm
          assert "metadata_status = 1;" in wdm
          assert "return metadata_status;" in wdm
          assert "modem_node_file_remove(MODEM_NODE_DIR, device_name) != 0" in wdm
          net = body(hotplug, "int mdev_net_main(")
          assert '"pref=%d\\ndevnum=%d\\nportid=%s\\n"' in net
          assert wdm.count("modem_node_file_remove(MODEM_NODE_DIR, device_name)") >= 3

          legacy_finder = body(modem, "find_modem_node(")
          assert "modem_node_manual_index_matches(fetch_index, i)" in legacy_finder
          assert "node_valid_last" not in legacy_finder
          assert "return -1;" in legacy_finder
          assert "modem_node_manual_index_matches" in identity

          reader = body(modem, "find_modem_node_by_usb_identity(")
          assert "strtol(buf + 7, &endptr, 10)" in reader
          assert 'strncmp(buf, "portid=", 7)' in reader
          assert "ferror(fp)" in reader and "fclose(fp)" in reader
          assert 'strncmp(buf, "pref=", 5)' in reader
          assert "have_pref && have_devnum && have_port_id" in reader
          assert "modem_node_usb_identity_node_is_eligible(" in reader

          selector = body(modem, "get_modem_node_by_usb_identity(")
          assert 'nvram_get_int("modem_node") - 1' in selector
          assert "manual_index, 0" in selector
          assert "expected_devnum, -1, 1" in selector
          assert "expected_devnum, -1, 0" in selector

          ndis = body(modem, "ndis_control_network(")
          assert "get_usb_port_by_device(ndis_ifname" in ndis
          assert 'find_modem_node_by_usb_identity("cdc-wdm"' in ndis
          tty_select = 'get_modem_node_by_usb_identity("ttyUSB", ndis_port_id, devnum)'
          assert tty_select in ndis
          assert 'get_modem_node("ttyUSB", devnum, NULL)' not in ndis
          assert ndis.index("get_usb_port_by_device(ndis_ifname") < ndis.index("find_modem_node_by_usb_identity") < ndis.index(tty_select)
          assert 'find_modem_node("cdc-wdm", 0, 0, -1, NULL)' not in ndis
          sg = body(hotplug, "int mdev_sg_main(")
          assert '#include "modem_sg_module_policy.h"' in hotplug
          assert "module_load_status = module_smart_load(\"sr_mod\", NULL);" in sg
          assert 'module_presence = is_module_loaded_status("sr_mod");' in sg
          assert "modem_sg_module_ready_status(module_presence)" in sg
          assert "SCSI generic module unavailable" in sg
          assert 'int zerocd_status = _eval(zerocd_argv, NULL, 0, NULL);' in sg
          assert "modem_sg_zerocd_command_status(zerocd_status)" in sg
          assert "ZeroCD mode switch failed" in sg
          assert sg.index("int zerocd_status = _eval") < sg.index("modem_sg_zerocd_command_status")
          assert sg.index("module_load_status = module_smart_load") < sg.index("is_module_loaded_status")
          assert sg.index("is_module_loaded_status") < sg.index("modem_sg_module_ready_status")
          assert "return (module_presence == 1) ? 0 : -1;" in sg_policy
          assert "return (command_status == 0) ? 0 : -1;" in sg_policy
          for marker in (
              "test_loaded_module_is_ready",
              "test_absent_module_is_not_ready",
              "test_unknown_module_state_fails_closed",
              "test_zerocd_success_is_accepted",
              "test_zerocd_failure_is_reported",
              "USB SCSI generic/ZeroCD command status policy: PASS",
          ):
              assert marker in sg_test

          assert "modem_node_usb_identity_matches" in identity

          sr = body(hotplug, "int mdev_sr_main(")
          assert '#include "modem_sr_status_policy.h"' in hotplug
          assert 'eject_status = _eval(eject_argv, NULL, 0, NULL);' in sr
          assert 'unload_status = module_smart_unload("sr_mod", 1);' in sr
          assert 'is_module_loaded_status("sr_mod")' in sr
          assert "modem_sr_completion_status(eject_status, unload_status," in sr
          assert "SCSI CD eject failed" in sr
          assert "sr_mod unload incomplete" in sr
          assert sr.index("eject_status = _eval") < sr.index("unload_status = module_smart_unload")
          assert sr.index("unload_status = module_smart_unload") < sr.index("is_module_loaded_status")
          assert sr.index("is_module_loaded_status") < sr.index("modem_sr_completion_status")
          assert "unload_status != 0 || module_presence == 0" in sr_policy
          for marker in (
              "test_successful_unload",
              "test_in_use_module_is_a_safe_noop",
              "test_already_absent_module_is_a_safe_noop",
              "test_present_module_after_unload_failure_is_rejected",
              "test_unknown_module_presence_fails_closed",
              "test_eject_failure_is_reported_even_when_unload_is_safe",
              "USB SCSI CD eject/unload result policy: PASS",
          ):
              assert marker in sr_test
          assert "modem_node_identity_policy.h" in metadata

          remove = body(modem, "safe_remove_usb_modem(void)")
          assert "stop_udhcpc_wan(0)" in remove
          assert '"/var/run/ppp-wan0.pid"' in remove
          assert "kill_services_with_pidfiles" in remove
          assert "set_usb_modem_dev_wan(0, 0)" in remove
          assert remove.index("if (stop_status != 0)") < remove.index("set_usb_modem_dev_wan(0, 0)")

          deferred_hotplug = body(services_stor, "on_deferred_hotplug_dev(void)")
          assert "modem_wan_hotplug_retry_mask(unplug_modem, plug_modem, modem_unplug_status, modem_plug_status)" in " ".join(deferred_hotplug.split())
          plug_event = deferred_hotplug[deferred_hotplug.index('if (nvram_match("usb_hotplug_md", "1"))'):deferred_hotplug.index("if (unplug_modem)")]
          assert "if (!unplug_modem)" in plug_event
          assert plug_event.index("if (!unplug_modem)") < plug_event.index('nvram_set_int_temp("usb_hotplug_md", 0)')
          assert "MODEM_WAN_HOTPLUG_RETRY_UNPLUG" in retry_policy
          assert "MODEM_WAN_HOTPLUG_RETRY_PLUG" in retry_policy
          assert "test_modem_hotplug_retry_mask_preserves_failed_and_coalesced_events" in retry_test

          modem_start = body(services_usb, "try_start_usb_modem_to_wan(void)")
          assert "return try_wan_reconnect(1, 0);" in modem_start
          assert "return;" not in modem_start

          deferred_hotplug = body(services_stor, "on_deferred_hotplug_dev(void)")
          assert "int modem_unplug_status = 0;" in deferred_hotplug
          assert "int modem_plug_status = 0;" in deferred_hotplug
          unplug_start = deferred_hotplug[deferred_hotplug.index("if (unplug_modem)"):deferred_hotplug.index("if (plug_modem && !unplug_modem)")]
          assert "modem_unplug_status = try_wan_reconnect(1, 0);" in unplug_start
          assert "modem_unplug_status != 0" in unplug_start

          plug_start = deferred_hotplug[deferred_hotplug.index("if (plug_modem && !unplug_modem)"): ]
          assert "modem_plug_status = try_start_usb_modem_to_wan();" in plug_start
          assert "modem_plug_status != 0" in plug_start
          assert 'nvram_set_int_temp("usb_unplug_md", 1)' in plug_start
          assert 'nvram_set_int_temp("usb_hotplug_md", 1)' in plug_start
          assert plug_start.index('nvram_set_int_temp("usb_unplug_md", 1)') < plug_start.index("alarm(5)")
          assert plug_start.index('nvram_set_int_temp("usb_hotplug_md", 1)') < plug_start.index("alarm(5)")

          for marker in (
              'modem_node_manual_index_matches(-1, 0)',
              'modem_node_manual_index_matches(4, 4)',
              '!modem_node_manual_index_matches(4, 3)',
              'modem_node_manual_index_matches(4, -1)',
              'modem_node_usb_identity_matches("1-1", 7, "1-1", 7)',
              'modem_node_usb_identity_matches("1-1", 7, "1-2", 7)',
              'modem_node_usb_identity_matches("1-1", 7, "1-1", 8)',
              'modem_node_usb_identity_node_is_eligible("1-1", 7, "1-1", 7, 2, 0, -1, 1)',
              'modem_node_usb_identity_node_is_eligible("1-1", 7, "1-1", 7, 4, 0, 4, 1)',
              "USB modem node identity and private metadata staging: PASS",
          ):
              assert marker in test

          paths = (

name: USB modem WDM/NDIS physical identity stability

on:
  push:
    paths:
      - ".github/workflows/usb-modem-identity-stability.yml"
      - "trunk/user/libdisk/src/dev_info.c"
      - "trunk/user/libdisk/src/dev_info.h"
      - "trunk/user/libdisk/src/usb_info.c"
      - "trunk/user/rc/src/hotplug_usb.c"
      - "trunk/user/rc/src/usb_modem.c"
      - "trunk/user/rc/src/modem_node_file.h"
      - "trunk/user/rc/src/modem_node_identity_policy.h"
      - "trunk/user/rc/src/tests/modem_node_file.c"
  pull_request:
    paths:
      - ".github/workflows/usb-modem-identity-stability.yml"
      - "trunk/user/libdisk/src/dev_info.c"
      - "trunk/user/libdisk/src/dev_info.h"
      - "trunk/user/libdisk/src/usb_info.c"
      - "trunk/user/rc/src/hotplug_usb.c"
      - "trunk/user/rc/src/usb_modem.c"
      - "trunk/user/rc/src/modem_node_file.h"
      - "trunk/user/rc/src/modem_node_identity_policy.h"
      - "trunk/user/rc/src/tests/modem_node_file.c"

permissions:
  contents: read

jobs:
  usb-modem-identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run GNU89 modem identity and metadata regression
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -I trunk/user/rc/src \
            trunk/user/rc/src/tests/modem_node_file.c \
            -o /tmp/modem-node-file
          ASAN_OPTIONS=detect_leaks=1 /tmp/modem-node-file
      - name: Verify WDM discovery, hotplug identity publication and NDIS matching
        run: |
          python3 - <<'PY'
          from pathlib import Path

          libdisk = Path("trunk/user/libdisk/src")
          rc = Path("trunk/user/rc/src")
          dev_info = (libdisk / "dev_info.c").read_text()
          dev_info_header = (libdisk / "dev_info.h").read_text()
          usb_info = (libdisk / "usb_info.c").read_text()
          hotplug = (rc / "hotplug_usb.c").read_text()
          modem = (rc / "usb_modem.c").read_text()
          metadata = (rc / "modem_node_file.h").read_text()
          identity = (rc / "modem_node_identity_policy.h").read_text()
          test = (rc / "tests/modem_node_file.c").read_text()
          workflow = Path(".github/workflows/usb-modem-identity-stability.yml").read_text()

          def body(source, signature):
              start = source.index(signature)
              brace = source.index("{", start)
              depth = 0
              for pos in range(brace, len(source)):
                  if source[pos] == "{":
                      depth += 1
                  elif source[pos] == "}":
                      depth -= 1
                      if depth == 0:
                          return source[brace + 1:pos]
              raise AssertionError("unterminated function: " + signature)

          assert "DEVICE_TYPE_MODEM_WDM" in dev_info_header
          classify = body(dev_info, "get_device_type_by_device(")
          assert "isWDMNode(device_name)" in classify
          assert "return DEVICE_TYPE_MODEM_WDM;" in classify

          resolve = body(usb_info, "get_usb_path_by_device(")
          assert "DEVICE_TYPE_MODEM_WDM" in resolve
          assert "SYS_PRINTER" in resolve
          assert "realpath(device_path, resolved_path)" in resolve
          assert "sleep(1)" in resolve[resolve.index("DEVICE_TYPE_MODEM_WDM"):]

          wdm = body(hotplug, "mdev_wdm_main(")
          assert "get_usb_port_by_device(device_name" in wdm
          assert "get_usb_devnum(usb_port_id)" in wdm
          assert "modem_node_usb_identity_is_valid(usb_port_id, devnum)" in wdm
          assert '"pref=%d\\ndevnum=%d\\nportid=%s\\n"' in wdm
          assert wdm.count("modem_node_file_remove(MODEM_NODE_DIR, device_name)") >= 3

          reader = body(modem, "find_modem_node_by_usb_identity(")
          assert "strtol(buf + 7, &endptr, 10)" in reader
          assert 'strncmp(buf, "portid=", 7)' in reader
          assert "ferror(fp)" in reader and "fclose(fp)" in reader
          assert "modem_node_usb_identity_matches(" in reader
          assert "have_devnum && have_port_id" in reader

          ndis = body(modem, "ndis_control_network(")
          assert "get_usb_port_by_device(ndis_ifname" in ndis
          assert 'find_modem_node_by_usb_identity("cdc-wdm"' in ndis
          assert ndis.index("get_usb_port_by_device(ndis_ifname") < ndis.index("find_modem_node_by_usb_identity")
          assert 'find_modem_node("cdc-wdm", 0, 0, -1, NULL)' not in ndis
          assert "modem_node_usb_identity_matches" in identity
          assert "modem_node_identity_policy.h" in metadata

          for marker in (
              'modem_node_usb_identity_matches("1-1", 7, "1-1", 7)',
              'modem_node_usb_identity_matches("1-1", 7, "1-2", 7)',
              'modem_node_usb_identity_matches("1-1", 7, "1-1", 8)',
              "USB modem node identity and private metadata staging: PASS",
          ):
              assert marker in test

          paths = (
              ".github/workflows/usb-modem-identity-stability.yml",
              "trunk/user/libdisk/src/dev_info.c",
              "trunk/user/libdisk/src/dev_info.h",
              "trunk/user/libdisk/src/usb_info.c",
              "trunk/user/rc/src/hotplug_usb.c",
              "trunk/user/rc/src/usb_modem.c",
              "trunk/user/rc/src/modem_node_file.h",
              "trunk/user/rc/src/modem_node_identity_policy.h",
              "trunk/user/rc/src/tests/modem_node_file.c",
          )
          filters = workflow.split("jobs:", 1)[0]
          push_filters, pr_filters = filters.split("  pull_request:", 1)
          for path in paths:
              assert push_filters.count(path) == 1, f"push path missing/duplicated: {path}"
              assert pr_filters.count(path) == 1, f"pull_request path missing/duplicated: {path}"

          print("USB modem WDM/NDIS physical identity contract: PASS")
          PY

name: Samba share configuration stability regression

on:
  push:
    paths:
      - ".github/workflows/samba-share-stability.yml"
      - "trunk/user/rc/src/services_stor.c"
      - "trunk/user/rc/src/services_ex.c"
      - "trunk/user/rc/src/services_stor.c"
      - "trunk/user/rc/src/service_wait_policy.h"
      - "trunk/user/rc/src/tests/service_wait_policy.c"
      - "trunk/user/rc/src/rc.h"
      - "trunk/user/rc/src/rc.c"
      - "trunk/user/rc/src/samba_config_file.h"
      - "trunk/user/rc/src/samba_config_mode_policy.h"
      - "trunk/user/rc/src/wan_nvram_status_policy.h"
      - "trunk/user/rc/src/tests/samba_config_mode_policy.c"
      - "trunk/user/rc/src/tests/samba_config_file.c"
      - "trunk/user/rc/src/samba_passdb_policy.h"
      - "trunk/user/rc/src/tests/samba_passdb_policy.c"
      - "trunk/user/rc/src/samba_config_transaction.h"
      - "trunk/user/rc/src/tests/samba_config_transaction.c"
      - "trunk/user/rc/src/samba_daemon_policy.h"
      - "trunk/user/rc/src/tests/samba_daemon_policy.c"
      - "trunk/user/rc/src/samba_process_policy.h"
      - "trunk/user/rc/src/tests/samba_process_policy.c"
      - "trunk/user/rc/src/samba_fastpath_policy.h"
      - "trunk/user/rc/src/tests/samba_fastpath_policy.c"
  pull_request:
    paths:
      - ".github/workflows/samba-share-stability.yml"
      - "trunk/user/rc/src/services_stor.c"
      - "trunk/user/rc/src/services_ex.c"
      - "trunk/user/rc/src/samba_config_mode_policy.h"
      - "trunk/user/rc/src/wan_nvram_status_policy.h"
      - "trunk/user/rc/src/tests/samba_config_mode_policy.c"
      - "trunk/user/rc/src/service_wait_policy.h"
      - "trunk/user/rc/src/tests/service_wait_policy.c"
      - "trunk/user/rc/src/rc.h"
      - "trunk/user/rc/src/rc.c"
      - "trunk/user/rc/src/samba_config_file.h"
      - "trunk/user/rc/src/tests/samba_config_file.c"
      - "trunk/user/rc/src/samba_passdb_policy.h"
      - "trunk/user/rc/src/tests/samba_passdb_policy.c"
      - "trunk/user/rc/src/samba_config_transaction.h"
      - "trunk/user/rc/src/tests/samba_config_transaction.c"
      - "trunk/user/rc/src/samba_daemon_policy.h"
      - "trunk/user/rc/src/tests/samba_daemon_policy.c"
      - "trunk/user/rc/src/samba_process_policy.h"
      - "trunk/user/rc/src/tests/samba_process_policy.c"
      - "trunk/user/rc/src/samba_fastpath_policy.h"
      - "trunk/user/rc/src/tests/samba_fastpath_policy.c"

jobs:
  samba-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run Samba config publication regression
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror \
            -I trunk/user/rc/src \
            trunk/user/rc/src/tests/samba_config_file.c \
            -o /tmp/samba-config-file
          /tmp/samba-config-file
          cc -std=gnu89 -Wall -Wextra -Werror \
            -I trunk/user/rc/src \
            trunk/user/rc/src/tests/samba_passdb_policy.c \
            -o /tmp/samba-passdb-policy
          /tmp/samba-passdb-policy
          cc -std=gnu89 -Wall -Wextra -Werror \
            -I trunk/user/rc/src \
            trunk/user/rc/src/tests/samba_config_transaction.c \
            -o /tmp/samba-config-transaction
          /tmp/samba-config-transaction
          cc -std=gnu89 -Wall -Wextra -Werror \
            -I trunk/user/rc/src -I trunk/user/shared/src \
            trunk/user/rc/src/tests/samba_daemon_policy.c \
            -o /tmp/samba-daemon-policy
          /tmp/samba-daemon-policy
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer \
            -I trunk/user/rc/src -I trunk/user/shared/src \
            trunk/user/rc/src/tests/service_wait_policy.c \
            -o /tmp/service-wait-policy
          ASAN_OPTIONS=detect_leaks=1 /tmp/service-wait-policy
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer \
            -I trunk/user/rc/src -I trunk/user/shared/src \
            trunk/user/rc/src/tests/samba_process_policy.c \
            -o /tmp/samba-process-policy
          ASAN_OPTIONS=detect_leaks=1 /tmp/samba-process-policy
          cc -std=gnu89 -Wall -Wextra -Werror \
            -I trunk/user/shared/src -I trunk/user/rc/src \
            trunk/user/rc/src/tests/samba_fastpath_policy.c \
            -o /tmp/samba-fastpath-policy
          /tmp/samba-fastpath-policy
          cc -std=gnu89 -Wall -Wextra -Werror \
            -I trunk/user/rc/src \
            trunk/user/rc/src/tests/samba_config_mode_policy.c \
            -o /tmp/samba-config-mode-policy
          /tmp/samba-config-mode-policy
      - name: Verify Samba config staging and service failure gates
        run: |
          python3 - <<'PY'
          from pathlib import Path

          stor = Path("trunk/user/rc/src/services_stor.c").read_text()
          services = Path("trunk/user/rc/src/services_ex.c").read_text()
          storage_services = Path("trunk/user/rc/src/services_stor.c").read_text()
          wait_policy = Path("trunk/user/rc/src/service_wait_policy.h").read_text()
          samba_daemon_policy = Path("trunk/user/rc/src/samba_daemon_policy.h").read_text()
          wait_test = Path("trunk/user/rc/src/tests/service_wait_policy.c").read_text()
          header = Path("trunk/user/rc/src/rc.h").read_text()
          helper = Path("trunk/user/rc/src/samba_config_file.h").read_text()
          test = Path("trunk/user/rc/src/tests/samba_config_file.c").read_text()
          fastpath_policy = Path("trunk/user/rc/src/samba_fastpath_policy.h").read_text()
          fastpath_test = Path("trunk/user/rc/src/tests/samba_fastpath_policy.c").read_text()
          config_mode_policy = Path("trunk/user/rc/src/samba_config_mode_policy.h").read_text()
          config_mode_test = Path("trunk/user/rc/src/tests/samba_config_mode_policy.c").read_text()
          nvram_policy = Path("trunk/user/rc/src/wan_nvram_status_policy.h").read_text()

          def function_body(source, signature):
              start = source.index(signature)
              brace = source.index("{", start)
              depth = 0
              for pos in range(brace, len(source)):
                  if source[pos] == "{":
                      depth += 1
                  elif source[pos] == "}":
                      depth -= 1
                      if depth == 0:
                          return source[brace + 1:pos]
              raise AssertionError("unterminated function: " + signature)

          assert "int write_smb_conf_header(FILE *fp);" in header
          header_body = function_body(services, "write_smb_conf_header(FILE *fp)")
          assert "fopen(SAMBA_CONF" not in header_body
          assert "unlink(SAMBA_CONF)" not in header_body
          assert "ferror(fp)" in header_body

          smb = function_body(stor, "write_smb_conf_unlocked(void)")
          integer_reader = function_body(stor, "samba_read_integer_status(const char *name, int missing_value, int *value)")
          boolean_reader = function_body(stor, "samba_read_boolean_status(const char *name, int missing_value, int *enabled)")
          mode_reader = function_body(stor, "samba_read_mode_status(int missing_value, int *mode)")
          config_mode_reader = function_body(stor, "samba_read_config_mode_status(int *mode)")
          runtime_reader = function_body(stor, "samba_read_runtime_enabled_status(int *enabled)")
          assert 'nvram_get_checked(name, &text)' in integer_reader
          assert "rc_wan_nvram_read_int_status(api_result, saved_errno" in integer_reader
          assert "samba_boolean_value_status(read_status, value, enabled)" in boolean_reader
          assert 'samba_read_integer_status("st_samba_mode", missing_value, mode)' in mode_reader
          assert "samba_config_mode_is_valid(*mode)" in mode_reader
          assert "samba_read_mode_status(0, mode)" in config_mode_reader
          runtime_reader_compact = "".join(runtime_reader.split())
          assert 'samba_read_integer_status("enable_samba",1,&enable_value)' in runtime_reader_compact
          assert 'samba_read_integer_status("st_samba_mode",1,&mode_value)' in runtime_reader_compact
          assert "samba_runtime_enabled_status(" in runtime_reader
          assert "rc_wan_nvram_parse_int_value" in nvram_policy
          assert 'nvram_get_int("st_samba_mode")' not in smb
          assert "samba_read_config_mode_status(&i_smb_mode)" in smb
          assert smb.index("samba_read_config_mode_status(&i_smb_mode)") < smb.index("samba_config_file_open(SAMBA_CONF")
          assert "i_smb_mode == 0" in smb
          assert "result = -1;" in smb[smb.index("i_smb_mode == 0"):]
          assert "samba_config_mode_is_valid" in config_mode_policy
          assert "samba_boolean_value_status" in config_mode_policy
          assert "samba_runtime_enabled_status" in config_mode_policy
          assert "samba_config_mode_is_valid(2)" in config_mode_test
          assert "samba_boolean_value_status(EIO, 0, &enabled)" in config_mode_test
          assert "samba_runtime_enabled_status(0, 0, EIO, 99, &enabled)" in config_mode_test
          assert "samba_runtime_enabled_status(0, 1, EIO, 1, &enabled)" in config_mode_test
          assert "samba_runtime_enabled_status(0, 1, 0, 4, &enabled)" in config_mode_test
          assert "samba_config_file_open(SAMBA_CONF" in smb
          assert "write_smb_conf_header(fp)" in smb
          assert "samba_config_file_publish(&fp, staged_path, SAMBA_CONF)" in smb
          assert 'fopen(SAMBA_CONF, "a")' not in smb
          assert 'fopen(staged_path, "a")' in smb
          assert "check_existed_share(share, staged_path)" in smb
          folder_check = smb[smb.index("get_folder_list_in_mount_path("):]
          folder_check = folder_check[:folder_check.index("for (n = 0")]
          assert "goto confpage;" in folder_check
          assert "continue;" not in folder_check

          check = function_body(stor, "check_existed_share(")
          assert 'fopen(config_path, "r")' in check
          assert "ferror(tp)" in check
          assert "fclose(tp)" in check

          wins_reader = function_body(services, "samba_ex_read_boolean_status(const char *name, int missing_value, int *enabled)")
          assert "nvram_get_checked(name, &value)" in wins_reader
          assert "rc_wan_nvram_read_int_status(api_result, saved_errno" in wins_reader
          assert "samba_boolean_value_status(read_status, parsed, enabled)" in wins_reader
          wins = function_body(services, "start_wins(void)")
          wins_compact = "".join(wins.split())
          assert 'samba_ex_read_boolean_status("wins_enable",1,&wins_enabled)' in wins_compact
          assert wins_compact.index('samba_ex_read_boolean_status("wins_enable",1,&wins_enabled)') < wins_compact.index("samba_config_transaction_lock_acquire(")
          assert 'nvram_match("wins_enable","0")' not in wins_compact
          assert "samba_config_transaction_prepare_parent_directory(" in wins
          assert wins.index("samba_config_transaction_prepare_parent_directory(") < wins.index("samba_config_transaction_recover(")
          assert "samba_config_transaction_lock_acquire(" in wins
          assert "samba_config_transaction_recover(" in wins
          assert 'process_inventory_scan("nmbd", &nmbd_snapshot)' in wins
          assert wins.index('process_inventory_scan("nmbd", &nmbd_snapshot)') < wins.index("samba_config_file_open")
          assert "PROCESS_PRESENCE_UNKNOWN" in wins
          assert "samba_daemon_signal_snapshot(" in wins
          assert 'samba_ex_require_absent("nmbd"' in wins
          assert "samba_config_file_open(SAMBA_CONF" in wins
          assert "write_smb_conf_header(fp)" in wins
          assert "samba_config_file_publish(&fp, staged_path, SAMBA_CONF)" in wins
          assert "killall" not in wins
          assert "pids(" not in wins
          assert "process_snapshot_release(&nmbd_snapshot)" in wins
          assert '#include "service_wait_policy.h"' in services
          sleep_adapter = function_body(services, "samba_ex_daemon_sleep(void *context, unsigned int microseconds)")
          assert "service_wait_microseconds(microseconds)" in sleep_adapter
          assert "usleep(" not in sleep_adapter
          assert "service_wait_nanosleep_real" in wait_policy
          samba_sleep = function_body(storage_services, "samba_daemon_sleep(void *context, unsigned int microseconds)")
          assert "return service_wait_microseconds(microseconds);" in samba_sleep
          assert "usleep(microseconds)" not in samba_sleep
          assert "requested = remaining;" in wait_policy
          assert "errno != EINTR" in wait_policy
          assert "service_wait_microseconds_with" in wait_test
          assert "int (*sleep_us)(void *context, unsigned int microseconds);" in samba_daemon_policy
          assert "ops->sleep_us(context, 500000U) != 0" in samba_daemon_policy
          assert "ops->sleep_us(context, 100000U) != 0" in samba_daemon_policy

          reload = function_body(services, "reload_nmbd(void)")
          assert 'process_inventory_scan("nmbd", &snapshot)' in reload
          assert "PROCESS_PRESENCE_UNKNOWN" in reload
          assert "PROCESS_PRESENCE_ABSENT" in reload
          assert "samba_daemon_signal_snapshot(" in reload
          assert "killall" not in reload and "pids(" not in reload

          restart = function_body(services, "restart_nmbd(void)")
          assert 'process_inventory_scan("nmbd", &nmbd_snapshot)' in restart
          assert "samba_ex_require_absent" in restart
          assert restart.index('process_inventory_scan("smbd", &smbd_snapshot)') < restart.index("write_smb_conf() != 0")
          assert "samba_daemon_signal_snapshot(" in restart
          assert "killall" not in restart and "pids(" not in restart
          assert "process_snapshot_release(&nmbd_snapshot)" in restart

          open_fn = function_body(helper, "samba_config_file_open(")
          publish_fn = function_body(helper, "samba_config_file_publish(")
          for token in ("mkstemp(", "fchmod(", "fdopen("):
              assert token in open_fn
          for token in ("ferror(fp)", "fflush(fp)", "fclose(fp)",
                        "rename(staged_path, target_path)", "unlink(staged_path)"):
              assert token in publish_fn
          assert publish_fn.index("fflush(fp)") < publish_fn.index("rename(")
          assert publish_fn.index("fclose(fp)") < publish_fn.index("rename(")

          assert "samba_config_file_publish(&fp, staged, target) == 0" in test
          assert "samba_config_file_publish(&fp, staged, directory_target) != 0" in test
          assert "samba_config_file_discard(&fp, staged)" in test
          run_samba = function_body(stor, "int run_samba(void)")
          assert "samba_read_runtime_enabled_status(&runtime_enabled)" in run_samba
          assert run_samba.index("samba_read_runtime_enabled_status(&runtime_enabled)") < run_samba.index("samba_config_transaction_lock_acquire(")
          assert 'nvram_match("enable_samba", "0")' not in run_samba
          assert 'nvram_match("st_samba_mode", "0")' not in run_samba
          assert run_samba.index("samba_config_transaction_prepare_parent_directory(") < run_samba.index("samba_config_transaction_recover(")
          assert 'mkdir_if_none("/etc/samba", "777")' not in run_samba
          assert run_samba.index("samba_config_transaction_lock_acquire(") < run_samba.index("samba_config_transaction_recover(")
          assert run_samba.index("samba_run_smbpasswd(") < run_samba.index("samba_config_transaction_begin(")
          assert run_samba.index("if (credential_failed)") < run_samba.index("samba_config_transaction_begin(")
          assert run_samba.index("samba_config_transaction_begin(") < run_samba.index('rename(staged_passdb, SAMBA_CONFIG_TRANSACTION_PASSDB)')
          assert run_samba.index('rename(staged_passdb, SAMBA_CONFIG_TRANSACTION_PASSDB)') < run_samba.index("write_smb_conf_unlocked() != 0")
          assert run_samba.index("write_smb_conf_unlocked() != 0") < run_samba.index("samba_config_transaction_commit(")
          assert run_samba.index("samba_config_transaction_commit(") < run_samba.index('samba_ensure_daemon("nmbd"')
          assert "samba_config_transaction_abort(" in run_samba
          transaction = Path("trunk/user/rc/src/samba_config_transaction.h").read_text()
          transaction_test = Path("trunk/user/rc/src/tests/samba_config_transaction.c").read_text()
          parent_directory = function_body(transaction, "samba_config_transaction_prepare_parent_directory(")
          assert "O_DIRECTORY | O_NOFOLLOW" in parent_directory
          assert "st.st_uid != geteuid()" in parent_directory
          assert "fchmod(fd, 0700)" in parent_directory
          assert "mkdir(directory, 0700)" in parent_directory
          assert "mkdir(directory, 0755)" not in parent_directory
          assert "test_parent_directory_permissions" in transaction_test
          cleanup_fn = function_body(transaction, "samba_config_transaction_cleanup(")
          assert cleanup_fn.index('"state"') < cleanup_fn.index('"passdb.old"')
          assert "Never delete a snapshot while its marker" in cleanup_fn
          assert "termination during cleanup" in transaction_test
          assert "O_NOFOLLOW" in transaction and "st_uid != geteuid()" in transaction
          assert "PREPARED" in transaction and "COMMITTED" in transaction
          assert "samba_config_transaction_recover(" in transaction
          assert "samba_config_transaction_restore_file(" in transaction
          assert "samba_config_transaction_lock_acquire(" in transaction
          assert "Abrupt exit after both renames" in transaction_test
          assert "partial rollback can be retried" in transaction_test
          writer = function_body(stor, "write_smb_conf_unlocked(void)")
          public_writer = function_body(stor, "write_smb_conf(void)")
          assert public_writer.index("samba_config_transaction_prepare_parent_directory(") < public_writer.index("samba_config_transaction_recover(")
          assert "samba_config_file_publish(&fp, staged_path, SAMBA_CONF)" in writer
          assert "samba_config_transaction_lock_acquire(" in public_writer
          assert "samba_config_transaction_recover(" in public_writer
          assert "write_smb_conf_unlocked()" in public_writer
          passdb_policy = Path("trunk/user/rc/src/samba_passdb_policy.h").read_text()
          passdb_test = Path("trunk/user/rc/src/tests/samba_passdb_policy.c").read_text()
          backup_fn = function_body(passdb_policy, "samba_passdb_backup_file(")
          restore_fn = function_body(passdb_policy, "samba_passdb_restore_file(")
          assert "lstat(passdb_path, &st)" in backup_fn
          assert "S_ISREG(st.st_mode)" in backup_fn
          assert "link(passdb_path, backup_path)" in backup_fn
          assert "rename(backup_path, passdb_path)" in restore_fn
          assert 'unlink(passdb_path) == 0 || errno == ENOENT' in restore_fn
          assert "samba_passdb_backup_file(passdb, backup_template" in passdb_test
          assert "samba_passdb_restore_file(passdb, backup, had_original)" in passdb_test
          assert 'fopen("/dev/full", "w")' in test


          rc = Path("trunk/user/rc/src/rc.c").read_text()
          wait_fn = function_body(stor, "samba_wait_for_daemon(")
          ensure_fn = function_body(stor, "samba_ensure_daemon(")
          ex_wait_fn = function_body(services, "samba_ex_wait_for_daemon(")
          assert "samba_daemon_wait_for_stable_presence(daemon, 30" in wait_fn
          stor_presence = function_body(stor, "samba_daemon_is_running(")
          ex_presence = function_body(services, "samba_ex_daemon_is_running(")
          sleep_fn = function_body(stor, "samba_daemon_sleep(")
          assert "process_inventory_scan(daemon, &snapshot)" in stor_presence
          assert "process_snapshot_release(&snapshot)" in stor_presence
          assert "PROCESS_PRESENCE_UNKNOWN" in stor_presence
          assert "process_inventory_scan(daemon, &snapshot)" in ex_presence
          assert "process_snapshot_release(&snapshot)" in ex_presence
          assert "PROCESS_PRESENCE_UNKNOWN" in ex_presence
          assert "samba_daemon_wait_for_stable_presence(daemon, 30" in ex_wait_fn
          assert "return service_wait_microseconds(microseconds);" in sleep_fn
          assert "usleep(microseconds)" not in sleep_fn
          ensure_compact = "".join(ensure_fn.split())
          assert "samba_daemon_signal_snapshot(initial_snapshot,SIGHUP" in ensure_compact
          assert "launched_new_daemon = 1;" in ensure_fn
          assert "samba_rollback_failed_daemon_start(daemon,start_errno)" in ensure_compact
          assert ensure_compact.count("samba_rollback_failed_daemon_start(daemon,start_errno)") == 2
          reload_branch = ensure_fn[ensure_fn.index("if (action == SAMBA_DAEMON_ACTION_RELOAD)"):ensure_fn.index("} else {")]
          assert "samba_rollback_failed_daemon_start" not in reload_branch
          rollback = function_body(stor, "static void\nsamba_rollback_failed_daemon_start(const char *daemon, int start_errno)")
          assert rollback.index("kill_services(services, 5, 1)") < rollback.index("process_inventory_scan(daemon, &snapshot)")
          assert rollback.index("process_inventory_scan(daemon, &snapshot)") < rollback.index("samba_failed_start_may_leave_daemon")
          assert rollback.index("samba_failed_start_may_leave_daemon") < rollback.index("errno = start_errno > 0")
          assert "process_inventory_scan(daemon,&current_snapshot)" in ensure_compact
          assert "killall" not in ensure_fn
          assert "eval(daemon_path" in ensure_fn
          assert "if(command_status!=0)" in ensure_compact
          assert "samba_wait_for_daemon(daemon)!=0" in ensure_compact
          run_samba = function_body(stor, "int run_samba(void)")
          assert 'process_inventory_scan("smbd", &smbd_snapshot)' in run_samba
          assert 'process_inventory_scan("nmbd", &nmbd_snapshot)' in run_samba
          assert run_samba.index('process_inventory_scan("smbd", &smbd_snapshot)') < run_samba.index("recreate_passwd_unix(0)")
          assert run_samba.index('process_inventory_scan("nmbd", &nmbd_snapshot)') < run_samba.index("write_smb_conf_unlocked()")
          assert 'samba_ensure_daemon("nmbd", &nmbd_snapshot)' in run_samba
          assert 'samba_ensure_daemon("smbd", &smbd_snapshot)' in run_samba
          assert "pids(" not in run_samba
          assert "daemon_failed" in run_samba and "return -1;" in run_samba
          assert "void run_samba(void);" not in header
          assert "int run_samba(void);" in header
          assert "int restart_smbd(void);" in header
          fastpath = function_body(stor, "config_smb_fastpath(int check_pid)")
          assert 'process_inventory_scan("smbd", &snapshot)' in fastpath
          assert "samba_fastpath_should_enable(1, state)" in fastpath
          assert "PROCESS_PRESENCE_UNKNOWN" in fastpath
          assert "write_status = fput_int(" in fastpath
          assert "failed to update SMB fastpath state" in fastpath
          assert "process_snapshot_release(&snapshot)" in fastpath
          assert "samba_fastpath_should_enable" in fastpath_policy
          assert "configured == 1 && smbd_presence == PROCESS_PRESENCE_RUNNING" in fastpath_policy
          assert "Samba fastpath process-presence gate: PASS" in fastpath_test
          preflight_fastpath = run_samba.index("config_smb_fastpath(1);")
          nmbd_start = run_samba.index('samba_ensure_daemon("nmbd", &nmbd_snapshot)')
          smbd_start = run_samba.index('samba_ensure_daemon("smbd", &smbd_snapshot)')
          final_fastpath = run_samba.rindex("config_smb_fastpath(1);")

name: DDNSTO lifecycle stability regression

on:
  push:
    paths:
      - ".github/workflows/ddnsto-lifecycle.yml"
      - "scripts/check_ddnsto_lifecycle.py"
      - "trunk/user/ddnsto/ddnsto.sh"
      - "trunk/user/ddnsto/tests/ddnsto_lifecycle.sh"
      - "trunk/user/ddnsto/Makefile"
      - "trunk/user/rc/src/services.c"
      - "trunk/user/rc/src/rc.h"
      - "trunk/user/rc/src/rc.c"
  pull_request:
    paths:
      - ".github/workflows/ddnsto-lifecycle.yml"
      - "scripts/check_ddnsto_lifecycle.py"
      - "trunk/user/ddnsto/ddnsto.sh"
      - "trunk/user/ddnsto/tests/ddnsto_lifecycle.sh"
      - "trunk/user/ddnsto/Makefile"
      - "trunk/user/rc/src/services.c"
      - "trunk/user/rc/src/rc.h"
      - "trunk/user/rc/src/rc.c"

permissions:
  contents: read

jobs:
  ddnsto-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run DDNSTO bounded stop/start lifecycle regression
        run: sh trunk/user/ddnsto/tests/ddnsto_lifecycle.sh
      - name: Verify DDNSTO lifecycle and RC integration contracts
        run: python3 scripts/check_ddnsto_lifecycle.py

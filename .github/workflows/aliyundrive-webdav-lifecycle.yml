name: AliyunDrive WebDAV lifecycle stability regression

on:
  push:
    paths:
      - "SESSION_HANDOFF.md"
      - "REFACTOR_ROADMAP.md"
      - "dev_log.md"
      - ".github/workflows/aliyundrive-webdav-lifecycle.yml"
      - "scripts/check_aliyundrive_webdav_lifecycle.py"
      - "scripts/test_aliyundrive_webdav_binary.py"
      - "trunk/user/aliyundrive-webdav/aliyundrive-webdav"
      - "trunk/user/aliyundrive-webdav/aliyundrive-webdav.sh"
      - "trunk/user/aliyundrive-webdav/tests/aliyundrive_webdav_lifecycle.sh"
      - "trunk/user/aliyundrive-webdav/Makefile"
      - "trunk/user/Makefile"
      - "trunk/user/rc/src/services.c"
      - "trunk/user/rc/src/rc.h"
      - "trunk/user/rc/src/rc.c"
      - "trunk/user/httpd/src/variables.c"
      - "trunk/user/httpd/src/web_ex.c"
      - "trunk/configs/boards/busybox.config"
      - "trunk/user/busybox/busybox-1.24.x/util-linux/flock.c"
  pull_request:
    paths:
      - "SESSION_HANDOFF.md"
      - "REFACTOR_ROADMAP.md"
      - "dev_log.md"
      - ".github/workflows/aliyundrive-webdav-lifecycle.yml"
      - "scripts/check_aliyundrive_webdav_lifecycle.py"
      - "scripts/test_aliyundrive_webdav_binary.py"
      - "trunk/user/aliyundrive-webdav/aliyundrive-webdav"
      - "trunk/user/aliyundrive-webdav/aliyundrive-webdav.sh"
      - "trunk/user/aliyundrive-webdav/tests/aliyundrive_webdav_lifecycle.sh"
      - "trunk/user/aliyundrive-webdav/Makefile"
      - "trunk/user/Makefile"
      - "trunk/user/rc/src/services.c"
      - "trunk/user/rc/src/rc.h"
      - "trunk/user/rc/src/rc.c"
      - "trunk/user/httpd/src/variables.c"
      - "trunk/user/httpd/src/web_ex.c"
      - "trunk/configs/boards/busybox.config"
      - "trunk/user/busybox/busybox-1.24.x/util-linux/flock.c"

permissions:
  contents: read

jobs:
  aliyundrive-webdav-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check AliyunDrive WebDAV launcher shell syntax
        run: sh -n trunk/user/aliyundrive-webdav/aliyundrive-webdav.sh
      - name: Install MIPS user-mode emulator
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user
      - name: Verify bundled MIPSel daemon CLI under QEMU
        run: python3 scripts/test_aliyundrive_webdav_binary.py
      - name: Run AliyunDrive WebDAV lifecycle regression
        run: sh trunk/user/aliyundrive-webdav/tests/aliyundrive_webdav_lifecycle.sh
      - name: Verify AliyunDrive WebDAV source and RC integration contracts
        run: python3 scripts/check_aliyundrive_webdav_lifecycle.py

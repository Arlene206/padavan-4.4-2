name: Inadyn fail-closed lifecycle regression

on:
  push:
    paths:
      - ".github/workflows/inadyn-lifecycle-stability.yml"
      - "scripts/check_inadyn_lifecycle.py"
      - "trunk/user/rc/src/services_ex.c"
      - "trunk/user/rc/src/inadyn_lifecycle_lock.h"
      - "trunk/user/rc/src/tests/inadyn_lifecycle_lock.c"
      - "trunk/user/rc/src/service_wait_policy.h"
      - "trunk/user/rc/src/rc.h"
      - "trunk/user/rc/src/inadyn_daemon_policy.h"
      - "trunk/user/rc/src/tests/inadyn_daemon_policy.c"
      - "trunk/user/rc/src/inadyn_config_file.h"
      - "trunk/user/rc/src/tests/inadyn_config_file.c"
      - "trunk/user/httpd/src/web_ex.c"
      - "trunk/user/rc/src/rc.c"
      - "trunk/user/shared/src/notify_rc.h"
  pull_request:
    paths:
      - ".github/workflows/inadyn-lifecycle-stability.yml"
      - "scripts/check_inadyn_lifecycle.py"
      - "trunk/user/rc/src/services_ex.c"
      - "trunk/user/rc/src/inadyn_lifecycle_lock.h"
      - "trunk/user/rc/src/tests/inadyn_lifecycle_lock.c"
      - "trunk/user/rc/src/service_wait_policy.h"
      - "trunk/user/rc/src/rc.h"
      - "trunk/user/rc/src/inadyn_daemon_policy.h"
      - "trunk/user/rc/src/tests/inadyn_daemon_policy.c"
      - "trunk/user/rc/src/inadyn_config_file.h"
      - "trunk/user/rc/src/tests/inadyn_config_file.c"
      - "trunk/user/httpd/src/web_ex.c"
      - "trunk/user/rc/src/rc.c"
      - "trunk/user/shared/src/notify_rc.h"

permissions:
  contents: read

jobs:
  inadyn-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile Inadyn tri-state and PID-bound signal policy (GNU89, ASan, UBSan)
        run: |
          cc -std=gnu89 -Wall -Wextra -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -I trunk/user/shared/src -I trunk/user/rc/src \
            trunk/user/rc/src/tests/inadyn_daemon_policy.c \
            -o "$RUNNER_TEMP/inadyn-lifecycle-policy"
      - name: Run Inadyn fail-closed policy regression
        env:
          ASAN_OPTIONS: detect_leaks=1
        run: "$RUNNER_TEMP/inadyn-lifecycle-policy"
      - name: Compile Inadyn config publication and quoted-value escaping regression (GNU89, ASan, UBSan)
        run: |
          cc -std=gnu89 -Wall -Wextra -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -I trunk/user/rc/src \
            trunk/user/rc/src/tests/inadyn_config_file.c \
            -o "$RUNNER_TEMP/inadyn-config-file"
          ASAN_OPTIONS=detect_leaks=1 "$RUNNER_TEMP/inadyn-config-file"
      - name: Compile Inadyn exclusive lifecycle lock regression (GNU89, ASan, UBSan)
        run: |
          cc -std=gnu89 -Wall -Wextra -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -I trunk/user/rc/src \
            trunk/user/rc/src/tests/inadyn_lifecycle_lock.c \
            -o "$RUNNER_TEMP/inadyn-lifecycle-lock"
          ASAN_OPTIONS=detect_leaks=1 "$RUNNER_TEMP/inadyn-lifecycle-lock"
      - name: Verify Inadyn production integration
        run: python3 scripts/check_inadyn_lifecycle.py

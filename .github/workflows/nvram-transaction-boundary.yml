name: NVRAM transaction boundary audit

on:
  push:
    paths:
      - "SESSION_HANDOFF.md"
      - "REFACTOR_ROADMAP.md"
      - "dev_log.md"
      - ".github/workflows/nvram-transaction-boundary.yml"
      - "scripts/check_nvram_transaction_boundary.py"
      - "trunk/user/**"
      - "trunk/linux-4.4.x/**"
      - "trunk/configs/boards/**"

permissions:
  contents: read

jobs:
  nvram-transaction-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile NVRAM transaction lock regression
        run: |
          cc -std=gnu89 -Wall -Wextra -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            trunk/user/shared/src/tests/nvram_transaction_lock.c \
            -o "$RUNNER_TEMP/nvram-transaction-lock"
      - name: Compile NVRAM unlocked-snapshot policy regression
        run: |
          cc -std=gnu89 -Wall -Wextra -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            trunk/linux-4.4.x/drivers/nvram/tests/nvram_snapshot_policy.c \
            -o "$RUNNER_TEMP/nvram-snapshot-policy"
      - name: Exercise NVRAM unlocked-snapshot sizing and retry policy
        env:
          ASAN_OPTIONS: detect_leaks=1
        run: "$RUNNER_TEMP/nvram-snapshot-policy"
      - name: Compile NVRAM device-node permission policy regression
        run: |
          cc -std=gnu89 -Wall -Wextra -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            trunk/user/rc/src/tests/nvram_device_node_policy.c \
            -o "$RUNNER_TEMP/nvram-device-node-policy"
      - name: Exercise NVRAM device-node permission policy
        run: "$RUNNER_TEMP/nvram-device-node-policy"
      - name: Exercise lock inode, permissions, contention and crash release
        env:
          ASAN_OPTIONS: detect_leaks=1
        run: "$RUNNER_TEMP/nvram-transaction-lock"
      - name: Audit raw userland ioctl paths and kernel NVRAM API callers
        run: python3 scripts/check_nvram_transaction_boundary.py

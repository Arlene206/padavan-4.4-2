name: SCUT watchdog PID safety regression

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/scutclient-watchcat-safety.yml"
      - "trunk/user/scutclient/scripts/scutclient_watchcat.sh"
      - "trunk/user/scutclient/scripts/scutclient.sh"
      - "trunk/user/scutclient/scripts/scutclient_status_file.sh"
      - "trunk/user/scripts/tests/scutclient_status_file_atomic.sh"
      - "trunk/user/scripts/tests/scutclient_watchcat_lifecycle.sh"
      - "trunk/user/busybox/busybox-1.24.x/util-linux/Config.src"
      - "trunk/user/busybox/busybox-1.24.x/coreutils/Config.src"
  pull_request:
    paths:
      - ".github/workflows/scutclient-watchcat-safety.yml"
      - "trunk/user/scutclient/scripts/scutclient_watchcat.sh"
      - "trunk/user/scutclient/scripts/scutclient.sh"
      - "trunk/user/scutclient/scripts/scutclient_status_file.sh"
      - "trunk/user/scripts/tests/scutclient_status_file_atomic.sh"
      - "trunk/user/scripts/tests/scutclient_watchcat_lifecycle.sh"
      - "trunk/user/busybox/busybox-1.24.x/util-linux/Config.src"
      - "trunk/user/busybox/busybox-1.24.x/coreutils/Config.src"

permissions:
  contents: read

jobs:
  scutclient-watchcat-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax
        run: |
          sh -n trunk/user/scutclient/scripts/scutclient_watchcat.sh
          sh -n trunk/user/scutclient/scripts/scutclient.sh
          sh -n trunk/user/scutclient/scripts/scutclient_status_file.sh
          sh -n trunk/user/scripts/tests/scutclient_watchcat_lifecycle.sh
          sh -n trunk/user/scripts/tests/scutclient_status_file_atomic.sh
          command -v flock >/dev/null 2>&1
      - name: Exercise watchdog PID identity and stale PID safety
        run: sh trunk/user/scripts/tests/scutclient_watchcat_lifecycle.sh
      - name: Exercise atomic SCUTClient status-hook publication
        run: sh trunk/user/scripts/tests/scutclient_status_file_atomic.sh
      - name: Verify fail-closed source contract
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path("trunk/user/scutclient/scripts/scutclient_watchcat.sh").read_text()
          busybox_config = Path("trunk/user/busybox/busybox-1.24.x/util-linux/Config.src").read_text()
          assert 'config FLOCK\n\tbool "flock"\n\tdefault y' in busybox_config
          assert 'pidfile="${SCUTCLIENT_WATCHCAT_PIDFILE:-/var/scutclient_watchcat.pid}"' in source
          assert 'proc_root="${SCUTCLIENT_WATCHCAT_PROC_ROOT:-/proc}"' in source
          assert 'watchcat_pid_status "$previous_pid"' in source
          assert "process_argv=$(tr" in source
          assert 'process_argv0=${process_argv%%"$watchcat_newline"*}' in source
          assert 'process_argv1=${process_argv1%%"$watchcat_newline"*}' in source
          assert 'case "${process_argv0##*/}" in' in source
          assert 'script_path="/usr/bin/scutclient_watchcat.sh"' in source
          watchcat_test = Path("trunk/user/scripts/tests/scutclient_watchcat_lifecycle.sh").read_text()
          assert "later argv argument incorrectly identified the watchdog executable" in watchcat_test
          assert 'lockfile="${pidfile}.lock"' in source
          assert 'exec 9>>"$lockfile"' in source
          assert "flock -n 9" in source
          assert "exec 9>&-" in source
          claim = source.index("watchcat_claim_pidfile\nclaim_status=$?")
          assert claim < source.index("exec 9>&-", claim) < source.index("if watchcat_read_boolean scutclient_watchcat; then")
          filters = Path(".github/workflows/scutclient-watchcat-safety.yml").read_text().split("jobs:", 1)[0]
          push_filters, pr_filters = filters.split("  pull_request:", 1)
          for section in (push_filters, pr_filters):
              assert section.count('"trunk/user/busybox/busybox-1.24.x/util-linux/Config.src"') == 1
          assert "locked stale-PID unlink" in Path("trunk/user/scripts/tests/scutclient_watchcat_lifecycle.sh").read_text()
          assert 'nvram get_checked "$watchcat_key"' in source
          assert 'nvram get ' not in source
          assert "watchcat_read_boolean scutclient_watchcat" in source
          assert "watchcat_read_boolean scutclient_enable" in source
          assert "watchcat_read_boolean scutclient_wdg_flag" in source
          assert "watchcat_read_force" in source
          assert "watchcat_fail" in source
          assert "SCUTCLIENT_WATCHCAT_AUTH_FLAG" in source
          client_source = Path("trunk/user/scutclient/scripts/scutclient.sh").read_text()
          status_writer = Path("trunk/user/scutclient/scripts/scutclient_status_file.sh").read_text()
          status_test = Path("trunk/user/scripts/tests/scutclient_status_file_atomic.sh").read_text()
          assert '-E "${auth_hook:-"/usr/bin/scutclient_status_file.sh 0"}"' in client_source
          assert '-Q "${fail_hook:-"/usr/bin/scutclient_status_file.sh 1"}"' in client_source
          assert 'tmp_file=$(mktemp "${status_file}.tmp.XXXXXX")' in status_writer
          assert 'chmod 600 "$tmp_file"' in status_writer
          assert 'mv -f "$tmp_file" "$status_file"' in status_writer
          assert 'echo 0 > /tmp/scutclient_status' not in client_source
          assert 'echo 1 > /tmp/scutclient_status' not in client_source
          assert "hardlink-sentinel" in status_test
          assert "directory destination" in status_test
          assert "scripts/ /usr/bin/" in Path("trunk/user/scutclient/Makefile").read_text()
          assert "NVRAM_FAIL_KEY" in Path("trunk/user/scripts/tests/scutclient_watchcat_lifecycle.sh").read_text()
          assert 'if (set -C; printf' in source
          assert 'kill -9' not in source
          assert 'kill "$previous_pid"' not in source
          assert '[ "$current_pid" = "$$" ] && rm -f "$pidfile"' in source
          assert "if watchcat_link_state=$(mtk_esw 11); then" in source
          assert 'watchcat_fail "$watchcat_link_status" "cannot verify WAN link state"' in source
          assert "MTK_ESW_STATUS" in Path("trunk/user/scripts/tests/scutclient_watchcat_lifecycle.sh").read_text()
          assert "watchcat_auth_flag_enabled" in source
          assert '[ ! -L "$auth_flag" ] && [ -f "$auth_flag" ]' in source
          assert 'watchcat_pid_owner=$(stat -c \'%u\' "$pidfile")' in source
          assert 'stat -c \'%u %a %h %s\' "$auth_flag"' in source
          assert '[ "$1" = "$watchcat_pid_owner" ]' in source
          assert '[ "$3" = 1 ] && [ "$4" = 2 ]' in source
          assert '0$2 & 0022' in source
          assert 'watchcat_ping_bin="${SCUTCLIENT_WATCHCAT_PING_BIN:-/bin/ping}"' in source
          assert '"$watchcat_ping_bin" -c 3' in source
          assert "watchdog trusted a symlinked authentication marker" in watchcat_test
          assert "watchdog trusted a hard-linked authentication marker" in watchcat_test
          assert "group/other-writable authentication marker" in watchcat_test
          assert 'config STAT\n\tbool "stat"\n\tdefault y' in Path("trunk/user/busybox/busybox-1.24.x/coreutils/Config.src").read_text()
          print("SCUT watchdog refuses stale/reused PID signals and unknown process identity: PASS")
          PY

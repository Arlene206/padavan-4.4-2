name: Wireless radio state regression

on:
  push:
    paths:
      - ".github/workflows/wireless-radio-state.yml"
      - "trunk/user/rc/src/net_wifi.c"
      - "trunk/user/shared/src/netutils.c"
      - "trunk/user/shared/src/bridge_membership_policy.h"
      - "trunk/user/shared/src/tests/bridge_membership_policy.c"
      - "trunk/user/rc/src/rc.h"
      - "trunk/user/rc/src/wireless_radio_policy.h"
      - "trunk/user/rc/src/tests/wireless_radio_policy.c"
      - "trunk/linux-4.4.x/net/bridge/br_if.c"
  pull_request:
    paths:
      - ".github/workflows/wireless-radio-state.yml"
      - "trunk/user/rc/src/net_wifi.c"
      - "trunk/user/shared/src/netutils.c"
      - "trunk/user/shared/src/bridge_membership_policy.h"
      - "trunk/user/shared/src/tests/bridge_membership_policy.c"
      - "trunk/user/rc/src/rc.h"
      - "trunk/user/rc/src/wireless_radio_policy.h"
      - "trunk/user/rc/src/tests/wireless_radio_policy.c"
      - "trunk/linux-4.4.x/net/bridge/br_if.c"

jobs:
  wireless-radio-state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and verify radio state publication gates
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror \
            -I trunk/user/rc/src \
            trunk/user/rc/src/tests/wireless_radio_policy.c \
            -o /tmp/wireless-radio-policy
          /tmp/wireless-radio-policy
          cc -std=gnu89 -Wall -Wextra -Werror \
            -I trunk/user/shared/src \
            trunk/user/shared/src/tests/bridge_membership_policy.c \
            -o /tmp/bridge-membership-policy
          /tmp/bridge-membership-policy
          python3 - <<'PY'
          from pathlib import Path

          root = Path(".")
          rc = root / "trunk/user/rc/src"
          source = (rc / "net_wifi.c").read_text()
          workflow = Path(".github/workflows/wireless-radio-state.yml").read_text()
          shared = root / "trunk/user/shared/src"
          netutils_source = (shared / "netutils.c").read_text()
          bridge_policy_header = (shared / "bridge_membership_policy.h").read_text()

          def function_body(text, signature):
              start = text.index(signature)
              brace = text.index("{", start)
              depth = 0
              for pos in range(brace, len(text)):
                  if text[pos] == "{":
                      depth += 1
                  elif text[pos] == "}":
                      depth -= 1
                      if depth == 0:
                          return text[brace + 1:pos]
              raise AssertionError(f"unterminated function: {signature}")

          assert '#include "wireless_radio_policy.h"' in source

          wl = function_body(source, "mlme_radio_wl_apply(int is_on)")
          assert "if (!wifname)" in wl
          assert wl.index("if (!wifname)") < wl.index("return 0;") < wl.index("doSystem(")
          assert wl.index("doSystem(") < wl.index("wireless_radio_status_success(ret)") < wl.index("mlme_state_wl(is_on)")
          assert wl.index("mlme_state_wl(is_on)") < wl.index("LED_CONTROL(")

          rt = function_body(source, "mlme_radio_rt_apply(int is_on)")
          assert "if (!wifname)" in rt
          assert rt.index("if (!wifname)") < rt.index("return 0;") < rt.index("doSystem(")
          assert rt.index("doSystem(") < rt.index("wireless_radio_status_success(ret)") < rt.index("mlme_state_rt(is_on)")
          assert rt.index("mlme_state_rt(is_on)") < rt.index("LED_CONTROL(")

          for name, restart in (("control_radio_wl", "restart_wifi_wl"),
                                ("control_radio_rt", "restart_wifi_rt")):
              body = function_body(source, name + "(int radio_on, int manual)")
              assert "is_radio_changed = 1;" not in body
              assert "wireless_radio_status_success(" + restart + "(" in body
              assert "mlme_radio_" in body and "_apply(" in body
              assert "if (is_radio_changed && !manual)" in body

          for name, generator in (("restart_wifi_wl", "gen_ralink_config_5g"),
                                  ("restart_wifi_rt", "gen_ralink_config_2g")):
              body = function_body(source, name + "(int radio_on, int need_reload_conf)")
              assert "wireless_restart_preflight(need_reload_conf, " + generator + ")" in body
              assert body.index("wireless_restart_preflight(") < body.index("return -1;") < body.index("stop_8021x_")

          control = function_body(source, "wif_control_success(const char *wifname, int is_up)")
          assert "ret = wif_control(wifname, is_up)" in control
          assert "wireless_radio_status_success(ret)" in control
          assert control.index("wireless_radio_status_success(ret)") < control.index("return 0;") < control.index("return 1;")

          for name in ("control_guest_wl", "control_guest_rt"):
              body = function_body(source, name + "(int guest_on, int manual)")
              for is_up in (1, 0):
                  gate = "if (!wif_control_success(ifname_ap, " + str(is_up) + "))"
                  assert gate in body, f"{name}: missing ifconfig status gate for {'up' if is_up else 'down'}"
                  gate_pos = body.index(gate)
                  failure_return = body.index("return 0;", gate_pos)
                  publish = body.index("is_ap_changed = 1;", gate_pos)
                  bridge = body.index("br_add_del_if(", gate_pos)
                  assert gate_pos < failure_return < publish < bridge, f"{name}: interface failure can still publish scheduler/bridge state"


          for name, gates in (
              ("start_wifi_ap_wl", (
                  ("if (!wif_control_success(IFNAME_5G_MAIN, 1))",
                   ("br_add_del_if(IFNAME_BR, IFNAME_5G_MAIN, 1)", "wif_control_m2u(1, IFNAME_5G_MAIN)")),
                  ("if (!wif_control_success(IFNAME_5G_GUEST, 1))",
                   ("br_add_del_if(IFNAME_BR, IFNAME_5G_GUEST, 1)", "wif_control_m2u(1, IFNAME_5G_GUEST)")),
              )),
              ("start_wifi_ap_rt", (
                  ("if (!wif_control_success(IFNAME_INIC_GUEST, 1))",
                   ("br_add_del_if(IFNAME_BR, IFNAME_INIC_GUEST_VLAN, 1)",)),
                  ("if (!wif_control_success(IFNAME_2G_MAIN, 1))",
                   ("br_add_del_if(IFNAME_BR, IFNAME_2G_MAIN, 1)", "wif_control_m2u(0, IFNAME_2G_MAIN)")),
                  ("if (!wif_control_success(IFNAME_2G_GUEST, 1))",
                   ("br_add_del_if(IFNAME_BR, IFNAME_2G_GUEST, 1)", "wif_control_m2u(0, IFNAME_2G_GUEST)")),
              )),
              ("start_wifi_apcli_wl", (
                  ("if (!wif_control_success(ifname_apcli, 1))",
                   ("br_add_del_if(IFNAME_BR, ifname_apcli,", "ApCliAutoConnect")),
              )),
              ("start_wifi_apcli_rt", (
                  ("if (!wif_control_success(ifname_apcli, 1))",
                   ("br_add_del_if(IFNAME_BR, ifname_apcli,", "ApCliAutoConnect")),
              )),
          ):
              body = function_body(source, name + "(int radio_on)")
              for gate, effects in gates:
                  gate_pos = body.index(gate)
                  failure_return = body.index("return -EIO;", gate_pos)
                  for effect in effects:
                      effect_pos = body.index(effect, gate_pos)
                      assert gate_pos < failure_return < effect_pos, (
                          f"{name}: failed interface-up may still reach {effect}"
                      )

          for name in ("start_wifi_apcli_wl", "start_wifi_apcli_rt"):
              body = function_body(source, name + "(int radio_on)")
              for mode in (3, 1):
                  command = ('doSystem("iwpriv %s set %s=%d", ifname_apcli, '
                             '"ApCliAutoConnect", ' + str(mode) + ')')
                  if command in body:
                      checked = "wireless_radio_status_success(" + command + ")"
                      assert checked in body, f"{name}: AutoConnect command status is discarded"
                      checked_pos = body.index(checked)
                      assert checked_pos < body.index("return -EIO;", checked_pos), (
                          f"{name}: AutoConnect failure must be returned to the restart"
                      )

          for name, ifnames in (
              ("start_wifi_wds_wl", (
                  "IFNAME_5G_WDS3", "IFNAME_5G_WDS2",
                  "IFNAME_5G_WDS1", "IFNAME_5G_WDS0",
              )),
              ("start_wifi_wds_rt", (
                  "IFNAME_2G_WDS3", "IFNAME_2G_WDS2",
                  "IFNAME_2G_WDS1", "IFNAME_2G_WDS0",
              )),
          ):
              body = function_body(source, name + "(int radio_on)")
              assert "return;" not in body and "return -EIO;" not in body, (
                  f"{name}: one WDS failure must not block remaining WDS interfaces"
              )
              interface_positions = []
              for ifname in ifnames:
                  gate = "interface_started = wif_control_success(" + ifname + ", 1);"
                  assert gate in body, f"{name}: missing interface-up status capture for {ifname}"
                  gate_pos = body.index(gate)
                  interface_positions.append(gate_pos)
                  aggregate = "all_started = wireless_radio_startup_status(all_started, interface_started);"
                  assert aggregate in body, f"{name}: failed {ifname} status is not aggregated"
                  aggregate_pos = body.index(aggregate, gate_pos)
                  assert gate_pos < aggregate_pos
                  bridge = "br_add_del_if(IFNAME_BR, " + ifname + ", 1)"
                  if bridge in body:
                      bridge_pos = body.index(bridge, aggregate_pos)
                      assert aggregate_pos < bridge_pos, (
                          f"{name}: {ifname} bridge add must follow its checked interface-up"
                      )
              assert interface_positions == sorted(interface_positions), (
                  f"{name}: all configured WDS interfaces must be attempted in order"
              )
              assert "return wireless_radio_startup_result(all_started);" in body

          # RT3352 iNIC startup must not continue publishing bridge/radio
          # state when rai0 fails to transition up. Recovery must isolate,
          # disable the RGMII path, and assert reset in that order.
          inic = function_body(source, "start_inic_mii(void)")
          startup_gate = "if (!wif_control_success(ifname_inic, 1))"
          assert startup_gate in inic, "start_inic_mii: missing checked rai0 interface-up gate"
          gate_pos = inic.index(startup_gate)
          failure_return = inic.index("return -EIO;", gate_pos)
          failure_path = inic[gate_pos:failure_return]
          recovery_steps = (
              "br_add_del_if(IFNAME_BR, ifname_inic, 0)",
              "phy_isolate_inic(1)",
              "phy_disable_inic(1)",
              "cpu_gpio_set_pin(1, 0)",
          )
          recovery_positions = [failure_path.index(step) for step in recovery_steps]
          assert recovery_positions == sorted(recovery_positions), (
              "start_inic_mii: failed rai0 startup must remove bridge membership, "
              "isolate, disable RGMII, and assert reset"
          )
          for effect in (
              "update_inic_mii();",
              'doSystem("iwpriv %s set %s=%d", ifname_inic, "RadioOn", 0)',
              "br_add_del_if(IFNAME_BR, ifname_inic, is_need_8021x(",
          ):
              assert failure_return < inic.index(effect, gate_pos), (
                  f"start_inic_mii: failed rai0 startup may still reach {effect}"
              )

          assert "return 0;" in inic, "start_inic_mii: successful/disabled path must return success"
          ap_rt = function_body(source, "start_wifi_ap_rt(int radio_on)")
          assert "if (start_inic_mii() < 0)" in ap_rt, (
              "start_wifi_ap_rt must propagate an iNIC interface-up failure"
          )
          assert 'nvram_get_int("inic_disable") != 1 && is_guest_allowed_rt()' in ap_rt, (
              "a deliberately disabled iNIC must not be treated as a failed guest-AP start"
          )
          assert 'start_inicd() != 0' in ap_rt, (
              "iNIC health monitor startup failure must remain visible in the log"
          )

          for name, helpers, own_auth, peer_helpers, peer_auth, own_stop, peer_stop in (
              ("restart_wifi_wl",
               ("start_wifi_ap_wl(radio_on)", "start_wifi_wds_wl(radio_on)", "start_wifi_apcli_wl(radio_on)"),
               "start_8021x_wl()",
               ("start_wifi_ap_rt(rt_radio_on)", "start_wifi_wds_rt(rt_radio_on)", "start_wifi_apcli_rt(rt_radio_on)"),
               "start_8021x_rt()", "stop_wifi_all_wl()", "stop_wifi_all_rt()"),
              ("restart_wifi_rt",
               ("start_wifi_ap_rt(radio_on)", "start_wifi_wds_rt(radio_on)", "start_wifi_apcli_rt(radio_on)"),
               "start_8021x_rt()",
               ("start_wifi_ap_wl(wl_radio_on)", "start_wifi_wds_wl(wl_radio_on)", "start_wifi_apcli_wl(wl_radio_on)"),
               "start_8021x_wl()", "stop_wifi_all_rt()", "stop_wifi_all_wl()"),
          ):
              body = function_body(source, name + "(int radio_on, int need_reload_conf)")
              first = helpers[0]
              gate = "if (" + first + " < 0 ||"
              assert gate in body, f"{name}: startup helper failures must gate authentication startup"
              own_auth_pos = body.index(own_auth)
              assert body.index(gate) < own_auth_pos
              assert body.index(own_stop + " < 0", body.index(gate)) < body.index("return -1;", body.index(gate))
              peer_gate = "if (" + peer_helpers[0] + " < 0 ||"
              assert peer_gate in body, f"{name}: DBDC peer startup failures must be propagated"
              peer_pos = body.index(peer_gate)
              peer_failure = body.index("return -1;", peer_pos)
              auth_cleanup = "stop_8021x_" + ("wl" if name == "restart_wifi_wl" else "rt") + "();"
              assert peer_pos < body.index(auth_cleanup, peer_pos) < peer_failure
              assert body.index(peer_stop + " < 0", peer_pos) < peer_failure

          # A raw bridge-add ioctl cannot safely be treated as a failure
          # until membership is checked: Linux 4.4 returns -EBUSY when the
          # interface already has a master, including an existing bridge port.
          bridge_source = (root / "trunk/linux-4.4.x/net/bridge/br_if.c").read_text()
          bridge_add = function_body(bridge_source, "br_add_if(struct net_bridge *br, struct net_device *dev)")
          master_gate = bridge_add.index("if (netdev_master_upper_dev_get(dev))")
          busy_return = bridge_add.index("return -EBUSY;", master_gate)
          assert master_gate < busy_return

          # Same-bridge additions are idempotent; a port attached to a
          # different bridge must continue to fail with the kernel error.
          assert '#include "bridge_membership_policy.h"' in netutils_source
          assert "BRIDGE_PORT_LIST_CAPACITY 1024" in bridge_policy_header
          assert "bridge_port_list_contains" in bridge_policy_header
          membership_query = function_body(
              netutils_source,
              "bridge_has_ifindex(int sockfd, const char *brname, int ifindex)")
          assert "BRCTL_GET_PORT_LIST" in membership_query
          assert "SIOCDEVPRIVATE" in membership_query
          assert "bridge_port_list_contains(ifindices, BRIDGE_PORT_LIST_CAPACITY, ifindex)" in membership_query
          add_if = function_body(
              netutils_source,
              "br_add_del_if(const char *brname, const char *ifname, int is_add)")
          assert add_if.count("bridge_has_ifindex(sockfd, brname, ifr.ifr_ifindex)") == 2
          assert add_if.index("if (is_add)") < add_if.index("bridge_has_ifindex(")
          assert add_if.index("bridge_has_ifindex(") < add_if.index("ret = ioctl(sockfd, (is_add) ? SIOCBRADDIF")
          assert "if (membership < 0)" in add_if
          assert "if (membership > 0)" in add_if
          assert "ret < 0 && errno == EBUSY" in add_if
          assert add_if.rindex("bridge_has_ifindex(") > add_if.index("errno == EBUSY")

          # Bulk bridge teardown must report failures and respect the separate
          # do_if_down and do_if_rem controls.
          cleanup = function_body(
              netutils_source,
              "br_del_all_ifs(const char *brname, int do_if_down, int do_if_rem)")
          assert "BRIDGE_PORT_LIST_CAPACITY" in cleanup
          assert "unsigned char detached[BRIDGE_PORT_LIST_CAPACITY]" in cleanup
          assert "ret = ioctl(sockfd, SIOCBRDELIF, &ifr)" in cleanup
          assert "status = bridge_cleanup_status_update(status, ret)" in cleanup
          assert cleanup.index("if (ret < 0)") < cleanup.index("detached[i] = 1;")
          assert "if (!detached[i])" in cleanup
          assert "if (do_if_down)" in cleanup
          assert "bridge_cleanup_should_set_interface_down(" in cleanup
          assert "return status;" in cleanup
          assert cleanup.index("if (!detached[i])") < cleanup.index("SIOCGIFNAME")
          assert cleanup.index("if (do_if_down)") < cleanup.index("SIOCGIFFLAGS")

          # The periodic iNIC health check must retain the guest-up result.
          inic_check = function_body(source, "check_inic_mii_rebooted(void)")
          guest_gate = "if (!is_interface_up(IFNAME_INIC_GUEST) && is_guest_allowed_rt())"
          assert guest_gate in inic_check
          assert "wif_control_success(IFNAME_INIC_GUEST, 1)" in inic_check
          assert "wif_control(IFNAME_INIC_GUEST, 1)" not in inic_check
          assert inic_check.index(guest_gate) < inic_check.index("wif_control_success(IFNAME_INIC_GUEST, 1)")
          assert "deferred until the next health check" in inic_check

          def assert_shutdown_calls(body, interfaces):
              calls = []
              for ifname in interfaces:
                  call = ("all_stopped = wireless_radio_shutdown_status(all_stopped, "
                          "wif_control_success(" + ifname + ", 0));")
                  assert call in body, f"shutdown must check {ifname}"
                  calls.append(body.index(call))
              assert calls == sorted(calls), "shutdown must attempt every required interface in order"

          wl_stop = function_body(source, "stop_wifi_all_wl(void)")
          assert "int all_stopped = 1;" in wl_stop
          assert_shutdown_calls(wl_stop, (
              "IFNAME_5G_APCLI", "IFNAME_5G_WDS3", "IFNAME_5G_WDS2",
              "IFNAME_5G_WDS1", "IFNAME_5G_WDS0", "IFNAME_5G_GUEST",
              "IFNAME_5G_MAIN",
          ))
          assert wl_stop.index("if (all_stopped)") < wl_stop.index("LED_CONTROL(LED_SW5G, LED_OFF);")
          assert wl_stop.count("LED_CONTROL(LED_SW5G, LED_OFF);") == 1
          assert "shutdown incomplete; retaining radio LED state" in wl_stop

          rt_stop = function_body(source, "stop_wifi_all_rt(void)")
          assert "int all_stopped = 1;" in rt_stop
          mii_start = rt_stop.index("#if defined(USE_RT3352_MII)")
          mii_else = rt_stop.index("#else", mii_start)
          mii_branch = rt_stop[mii_start:mii_else]
          generic_branch = rt_stop[mii_else:]
          assert_shutdown_calls(mii_branch, ("IFNAME_INIC_GUEST", "IFNAME_INIC_MAIN"))
          assert "phy_isolate_inic(1)" in mii_branch and "phy_disable_inic(1)" in mii_branch
          assert "IFNAME_INIC_GUEST_VLAN, 0" in mii_branch
          assert_shutdown_calls(generic_branch, (
              "IFNAME_2G_APCLI", "IFNAME_2G_WDS3", "IFNAME_2G_WDS2",
              "IFNAME_2G_WDS1", "IFNAME_2G_WDS0", "IFNAME_2G_GUEST",
              "IFNAME_2G_MAIN",
          ))
          assert rt_stop.index("if (all_stopped)") < rt_stop.index("LED_CONTROL(LED_SW2G, LED_OFF);")
          assert rt_stop.count("LED_CONTROL(LED_SW2G, LED_OFF);") == 1
          assert "shutdown incomplete; retaining radio LED state" in rt_stop

          assert "return wireless_radio_shutdown_result(all_stopped);" in wl_stop
          assert "return wireless_radio_shutdown_result(all_stopped);" in rt_stop

          for name, own_stop, peer_stop, own_auth, peer_auth, first_start in (
              ("restart_wifi_wl", "stop_wifi_all_wl", "stop_wifi_all_rt",
               "stop_8021x_wl", "stop_8021x_rt", "start_wifi_ap_wl"),
              ("restart_wifi_rt", "stop_wifi_all_rt", "stop_wifi_all_wl",
               "stop_8021x_rt", "stop_8021x_wl", "start_wifi_ap_rt"),
          ):
              body = function_body(source, name + "(int radio_on, int need_reload_conf)")
              own_gate = "if (" + own_stop + "() < 0)"
              assert own_gate in body, f"{name}: own-radio shutdown failure is not propagated"
              own_pos = body.index(own_gate)
              own_failure = body.index("return -1;", own_pos)
              own_auth_pos = body.index(own_auth + "()")
              start_pos = body.index(first_start + "(")
              assert own_pos < own_failure < own_auth_pos < start_pos
              peer_gate = "if (" + peer_stop + "() < 0)"
              assert peer_gate in body, f"{name}: DBDC peer stop failure is not propagated"
              peer_pos = body.index(peer_gate)
              peer_failure = body.index("return -1;", peer_pos)
              peer_auth_pos = body.index(peer_auth + "()")
              assert peer_pos < peer_failure < peer_auth_pos < start_pos


          # The explicit inic_disable path is fail-safe: a failed ifconfig
          # down must not prevent bridge removal, isolation, RGMII disable,
          # or reset assertion.
          disable_pos = inic.rfind("} else {")
          assert disable_pos >= 0, "start_inic_mii: missing inic_disable branch"
          disable_path = inic[disable_pos:]
          down_call = "(void)wif_control_success(ifname_inic, 0)"
          assert down_call in disable_path, "start_inic_mii: missing checked rai0 shutdown"
          down_pos = disable_path.index(down_call)
          disable_steps = (
              "br_add_del_if(IFNAME_BR, ifname_inic, 0)",
              "phy_isolate_inic(1)",
              "phy_disable_inic(1)",
              "cpu_gpio_set_pin(1, 0)",
          )
          disable_positions = [disable_path.index(step, down_pos) for step in disable_steps]
          assert disable_positions == sorted(disable_positions), (
              "start_inic_mii: failed rai0 shutdown must not skip fail-safe cleanup"
          )
          assert "return;" not in disable_path, (
              "start_inic_mii: interface-down failure must not short-circuit reset cleanup"
          )

          paths = (
              ".github/workflows/wireless-radio-state.yml",
              "trunk/user/rc/src/net_wifi.c",
              "trunk/user/shared/src/netutils.c",
              "trunk/user/shared/src/bridge_membership_policy.h",
              "trunk/user/shared/src/tests/bridge_membership_policy.c",
              "trunk/user/rc/src/rc.h",
              "trunk/user/rc/src/wireless_radio_policy.h",
              "trunk/user/rc/src/tests/wireless_radio_policy.c",
              "trunk/linux-4.4.x/net/bridge/br_if.c",
          )
          filters = workflow.split("jobs:", 1)[0]
          push_filters, pr_filters = filters.split("  pull_request:", 1)
          for path in paths:
              assert push_filters.count(path) == 1, f"push path filter missing or duplicated: {path}"
              assert pr_filters.count(path) == 1, f"pull_request path filter missing or duplicated: {path}"

          print("Wireless driver/restart failure state-publication contracts: PASS")
          PY

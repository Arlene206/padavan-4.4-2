name: Wireless radio state regression

on:
  push:
    paths:
      - ".github/workflows/wireless-radio-state.yml"
      - "trunk/user/rc/src/net_wifi.c"
      - "trunk/user/rc/src/net_wan.c"
      - "trunk/user/rc/src/net_lan.c"
      - "scripts/check_guest_lan_isolation_status.py"
      - "trunk/user/rc/src/wireless_guest_isolation_policy.h"
      - "trunk/user/rc/src/tests/wireless_guest_isolation_policy.c"
      - "trunk/user/shared/src/netutils.c"
      - "trunk/user/shared/src/bridge_membership_policy.h"
      - "trunk/user/shared/src/tests/bridge_membership_policy.c"
      - "trunk/user/rc/src/rc.h"
      - "trunk/user/rc/src/rc.c"
      - "trunk/user/rc/src/wireless_radio_policy.h"
      - "trunk/user/rc/src/service_wait_policy.h"
      - "trunk/user/rc/src/tests/service_wait_policy.c"
      - "trunk/user/rc/src/tests/wireless_radio_policy.c"
      - "trunk/linux-4.4.x/net/bridge/br_if.c"
  pull_request:
    paths:
      - ".github/workflows/wireless-radio-state.yml"
      - "trunk/user/rc/src/net_wifi.c"
      - "trunk/user/rc/src/net_wan.c"
      - "trunk/user/rc/src/net_lan.c"
      - "scripts/check_guest_lan_isolation_status.py"
      - "trunk/user/rc/src/wireless_guest_isolation_policy.h"
      - "trunk/user/rc/src/tests/wireless_guest_isolation_policy.c"
      - "trunk/user/shared/src/netutils.c"
      - "trunk/user/shared/src/bridge_membership_policy.h"
      - "trunk/user/shared/src/tests/bridge_membership_policy.c"
      - "trunk/user/rc/src/rc.h"
      - "trunk/user/rc/src/rc.c"
      - "trunk/user/rc/src/wireless_radio_policy.h"
      - "trunk/user/rc/src/service_wait_policy.h"
      - "trunk/user/rc/src/tests/service_wait_policy.c"
      - "trunk/user/rc/src/tests/wireless_radio_policy.c"
      - "trunk/linux-4.4.x/net/bridge/br_if.c"

jobs:
  wireless-radio-state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and verify radio state publication gates
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror \
            -I trunk/user/rc/src \
            trunk/user/rc/src/tests/wireless_radio_policy.c \
            -o /tmp/wireless-radio-policy
          /tmp/wireless-radio-policy
          cc -std=gnu89 -Wall -Wextra -Werror \
            -I trunk/user/shared/src \
            trunk/user/shared/src/tests/bridge_membership_policy.c \
            -o /tmp/bridge-membership-policy
          /tmp/bridge-membership-policy
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -I trunk/user/rc/src trunk/user/rc/src/tests/wireless_guest_isolation_policy.c -o /tmp/wireless-guest-isolation-policy
          ASAN_OPTIONS=detect_leaks=1 /tmp/wireless-guest-isolation-policy
          python3 scripts/check_guest_lan_isolation_status.py
          python3 - <<'PY'
          from pathlib import Path

          root = Path(".")
          rc = root / "trunk/user/rc/src"
          source = (rc / "net_wifi.c").read_text()
          rc_source = (rc / "rc.c").read_text()
          workflow = Path(".github/workflows/wireless-radio-state.yml").read_text()
          notification_policy = (rc / "wireless_radio_policy.h").read_text()
          notification_test = (rc / "tests/wireless_radio_policy.c").read_text()
          shared = root / "trunk/user/shared/src"
          netutils_source = (shared / "netutils.c").read_text()
          bridge_policy_header = (shared / "bridge_membership_policy.h").read_text()

          def function_body(text, signature):
              start = text.index(signature)
              brace = text.index("{", start)
              depth = 0
              for pos in range(brace, len(text)):
                  if text[pos] == "{":
                      depth += 1
                  elif text[pos] == "}":
                      depth -= 1
                      if depth == 0:
                          return text[brace + 1:pos]
              raise AssertionError(f"unterminated function: {signature}")

          assert '#include "wireless_radio_policy.h"' in source
          header = (rc / "rc.h").read_text()
          wan_source = (rc / "net_wan.c").read_text()

          reconnect = function_body(source, "reconnect_apcli(const char *ifname_apcli, int force)")
          assert "int status = 0, wait_status;" in reconnect
          assert "return status;" in reconnect
          assert reconnect.count("doSystem(") + 1 == reconnect.count("wireless_radio_restart_status(status,")
          assert reconnect.count('doSystem("iwpriv %s set %s=%d", ifname_apcli, "ApCliAutoConnect"') == 4
          assert reconnect.count("ApCliEnable") == 2
          disable_pos = reconnect.index('"ApCliEnable", 0')
          wait_pos = reconnect.index("wait_status = service_wait_microseconds(300000U);", disable_pos)
          wait_failure = reconnect.index("if (wait_status != 0)", wait_pos)
          wait_errno = reconnect.index("wait_status = errno > 0 ? errno : EIO;", wait_failure)
          wait_status_merge = reconnect.index("wireless_radio_restart_status(status, wait_status)", wait_errno)
          enable_pos = reconnect.index('"ApCliEnable", 1', wait_status_merge)
          assert disable_pos < wait_pos < wait_failure < wait_errno < wait_status_merge < enable_pos
          assert "usleep(300000);" not in reconnect
          assert "return" not in reconnect[wait_pos:enable_pos]
          assert "AP-client reconnect settling wait failed" in reconnect
          assert "AP-client reconnect command failed" in reconnect
          assert "int reconnect_apcli(const char *ifname_apcli, int force);" in header
          assert '#include "service_wait_policy.h"' in source
          watchdog_wait = function_body(source, "wait_wifi_watchdog_update(const char *radio_name)")
          assert "service_wait_microseconds(300000U)" in watchdog_wait
          assert "errno > 0 ? errno : EIO" in watchdog_wait
          assert "watchdog Wi-Fi notification settling wait failed" in watchdog_wait
          assert "return -1;" in watchdog_wait
          for signature, notify, label, nvram_key, control in (
              ("manual_change_radio_rt(int radio_on)", "notify_watchdog_wifi(0)", "2.4GHz radio", '"radio_x"', "control_radio_rt"),
              ("manual_change_radio_wl(int radio_on)", "notify_watchdog_wifi(1)", "5GHz radio", '"radio_x"', "control_radio_wl"),
              ("manual_change_guest_rt(int radio_on)", "notify_watchdog_wifi(0)", "2.4GHz guest AP", '"guest_enable"', "control_guest_rt"),
              ("manual_change_guest_wl(int radio_on)", "notify_watchdog_wifi(1)", "5GHz guest AP", '"guest_enable"', "control_guest_wl"),
          ):
              manual = function_body(source, signature)
              notify_at = manual.index(notify)
              wait_at = manual.index(f'wait_wifi_watchdog_update("{label}")', notify_at)
              fail_at = manual.index("if (wait_status != 0)", wait_at)
              return_at = manual.index("return wait_status;", fail_at)
              nvram_at = manual.index(nvram_key, return_at)
              control_at = manual.index(f"return {control}(", nvram_at)
              assert notify_at < wait_at < fail_at < return_at < nvram_at < control_at
              assert "usleep(300000);" not in manual

          wan_start = function_body(wan_source, "start_wan(void)")
          reconnect_call = wan_start.index("vlan_result = reconnect_apcli(wan_ifname, 0);")
          reconnect_result = wan_start.index("wan_start_status = rc_first_service_start_status(", reconnect_call)
          reconnect_log = wan_start.index("WAN AP-client reconnect incomplete", reconnect_call)
          assert reconnect_call < reconnect_result < reconnect_log

          manual_reassoc = function_body(wan_source, "manual_wisp_reassoc(void)")
          assert "reconnect_status = reconnect_apcli(wisp_ifname, 1);" in manual_reassoc
          assert "if (reconnect_status != 0)" in manual_reassoc
          assert "manual WISP reassociation failed" in manual_reassoc

          wl = function_body(source, "mlme_radio_wl_apply(int is_on)")
          assert "if (!wifname)" in wl
          assert wl.index("if (!wifname)") < wl.index("return 0;") < wl.index("doSystem(")
          assert wl.index("doSystem(") < wl.index("wireless_radio_status_success(ret)") < wl.index("mlme_state_wl(is_on)")
          assert wl.index("mlme_state_wl(is_on)") < wl.index("LED_CONTROL(")

          rt = function_body(source, "mlme_radio_rt_apply(int is_on)")
          assert "if (!wifname)" in rt
          assert "wireless_inic_radio_transition(is_on, &wireless_inic_radio_ops, &context)" in rt
          assert rt.index("if (!wifname)") < rt.index("wireless_inic_radio_transition(") < rt.index("return 1;")
          mii_helpers = (
              "wireless_inic_radio_set_power(void *opaque, int is_on)",
              "wireless_inic_radio_set_isolation(void *opaque, int isolated)",
              "wireless_inic_radio_prepare_on(void *opaque)",
              "wireless_inic_radio_publish(void *opaque, int is_on)",
          )
          for signature in mii_helpers:
              assert signature in source
          set_power = function_body(source, mii_helpers[0])
          assert 'doSystem("iwpriv %s set %s=%d", context->ifname, "RadioOn", !!is_on)' in set_power
          assert "wireless_radio_status_success(status)" in set_power
          set_isolation = function_body(source, mii_helpers[1])
          assert "phy_isolate_inic((unsigned int)!!isolated)" in set_isolation
          assert "if (status != 0)" in set_isolation
          prepare_on = function_body(source, mii_helpers[2])
          assert '"TxPower"' in prepare_on and "doSystem(" in prepare_on
          assert "return status;" in prepare_on
          publish = function_body(source, mii_helpers[3])
          assert "status = nvram_set_int(\"mlme_radio_rt\", !!is_on);" in publish
          assert "if (status != 0)" in publish
          assert publish.index("if (status != 0)") < publish.index("LED_CONTROL(")
          assert "return status;" in publish and "return 0;" in publish
          assert "test_inic_radio_enable_publication_failure_rolls_back" in notification_test
          assert "test_inic_radio_disable_publication_failure_is_reported" in notification_test

          inic_transition = function_body(notification_policy,
              "wireless_inic_radio_transition(int is_on,")
          publication_call = "publish_status = ops->publish(context, !!is_on);"
          publication_failure = inic_transition.index("if (publish_status != 0)")
          assert publication_call in inic_transition
          assert inic_transition.index(publication_call) < publication_failure
          assert "return publish_status;" in inic_transition
          assert "if (is_on)" in inic_transition[publication_failure:]
          assert "ops->set_isolation(context, 1)" in inic_transition[publication_failure:]
          assert "ops->set_power(context, 0)" in inic_transition[publication_failure:]

          for name, restart in (("control_radio_wl", "restart_wifi_wl"),
                                ("control_radio_rt", "restart_wifi_rt")):
              body = function_body(source, name + "(int radio_on, int manual)")
              assert "is_radio_changed = 1;" not in body
              assert "wireless_radio_status_success(" + restart + "(" in body
              assert "mlme_radio_" in body and "_apply(" in body
              assert "if (is_radio_changed && !manual)" in body

          for token in ("wireless_inic_radio_transition",
                        "ops->set_isolation(context, 1)",
                        "ops->set_power(context, 0)",
                        "ops->publish(context, !!is_on)"):
              assert token in notification_policy
          radio_transition = function_body(notification_policy, "wireless_inic_radio_transition(int is_on")
          assert radio_transition.index("ops->set_isolation(context, 1)") < radio_transition.index("ops->set_power(context, 1)")
          assert radio_transition.index("ops->set_power(context, 1)") < radio_transition.index("ops->set_isolation(context, 0)")
          for token in ("test_inic_radio_enable_orders_power_before_unisolation_and_publication",
                        "test_inic_radio_disable_isolates_before_power_off_and_publication",
                        "test_inic_radio_power_on_failure_rolls_back_without_publishing",
                        "test_inic_radio_unisolation_failure_rolls_back_and_preserves_cause",
                        "test_inic_radio_isolation_failure_still_powers_off_without_publishing",
                        "test_inic_radio_initial_isolation_failure_prevents_power_on",
                        "test_inic_radio_txpower_failure_rolls_back_without_unisolation"):
              assert token in notification_test
          for token in ("was_on", "requested_on", "change_reported",
                        "change_reported == 1 ? 0 : -EIO"):
              assert token in notification_policy
          for token in ("test_radio_notification_noop_is_success_only_when_already_at_target",
                        "test_radio_notification_successful_transitions",
                        "test_radio_notification_failed_transitions_remain_pending"):
              assert token in notification_test

          notification_adapter = function_body(
              rc_source, "rc_notify_apply_radio_control(int is_5g, int radio_on, int manual)")
          assert "was_on = is_radio_on_wl();" in notification_adapter
          assert "change_reported = control_radio_wl(radio_on, manual);" in notification_adapter
          assert "was_on = is_radio_on_rt();" in notification_adapter
          assert "change_reported = control_radio_rt(radio_on, manual);" in notification_adapter
          assert "wireless_radio_notification_result(was_on, radio_on," in notification_adapter
          assert "if (status != 0)" in notification_adapter

          notification_handler = function_body(rc_source, "handle_notifications(void)")
          assert notification_handler.count("rc_notify_apply_radio_control(") == 6
          assert "control_radio_wl(" not in notification_handler
          assert "control_radio_rt(" not in notification_handler
          assert '#include "wireless_radio_policy.h"' in rc_source

          manual_toggle = function_body(
              rc_source, "rc_manual_toggle_radio_status(int is_5g, int requested_on)")
          assert "was_on = is_radio_on_wl();" in manual_toggle
          assert "was_on = is_radio_on_rt();" in manual_toggle
          assert "effective_request = requested_on < 0 ? !was_on : !!requested_on;" in manual_toggle
          assert "changed = manual_toggle_radio_wl(requested_on);" in manual_toggle
          assert "changed = manual_toggle_radio_rt(requested_on);" in manual_toggle
          assert "wireless_radio_notification_result(was_on, effective_request," in manual_toggle

          manual_change = function_body(
              rc_source, "rc_manual_change_radio_status(int is_5g, int requested_on)")
          assert "was_enabled = get_enabled_radio_wl();" in manual_change
          assert "was_enabled = get_enabled_radio_rt();" in manual_change
          assert "status = manual_change_radio_wl(requested_on);" in manual_change
          assert "status = manual_change_radio_rt(requested_on);" in manual_change
          assert "if (status < 0)" in manual_change
          assert "wireless_radio_notification_result(was_enabled, requested_on," in manual_change

          rc_main = rc_source[rc_source.index("main(int argc, char **argv)"):]
          for call in (
              "rc_manual_toggle_radio_status(0, -1)", "rc_manual_toggle_radio_status(0, 1)",
              "rc_manual_toggle_radio_status(0, 0)", "rc_manual_change_radio_status(0, 1)",
              "rc_manual_change_radio_status(0, 0)", "rc_manual_toggle_radio_status(1, -1)",
              "rc_manual_toggle_radio_status(1, 1)", "rc_manual_toggle_radio_status(1, 0)",
              "rc_manual_change_radio_status(1, 1)", "rc_manual_change_radio_status(1, 0)"):
              assert "ret = " + call + ";" in rc_main, f"radio applet drops {call} status"
          for raw_call in ("manual_toggle_radio_rt(", "manual_toggle_radio_wl(",
                           "manual_change_radio_rt(", "manual_change_radio_wl("):
              assert raw_call not in rc_main

          for name, generator in (("restart_wifi_wl", "gen_ralink_config_5g"),
                                  ("restart_wifi_rt", "gen_ralink_config_2g")):
              body = function_body(source, name + "(int radio_on, int need_reload_conf)")
              assert "wireless_restart_preflight(need_reload_conf, " + generator + ")" in body
              assert body.index("wireless_restart_preflight(") < body.index("return -1;") < body.index("stop_8021x_")

          interface_control = function_body(source, "wif_control(const char *wifname, int is_up)")
          assert "ret = ifconfig(wifname, is_up ? IFUP : 0, NULL, NULL);" in interface_control
          assert 'doSystem("ifconfig %s %s 2>/dev/null", wifname' not in interface_control
          assert "return ret;" in interface_control
          hw_nat_gate = 'if (ret == 0 && is_up && is_module_loaded("hw_nat")) {'
          hw_nat_command = 'int hw_nat_status = doSystem("iwpriv %s set hw_nat_register=%d",'
          assert hw_nat_gate in interface_control
          assert hw_nat_command in interface_control
          assert 'ret = wireless_radio_status_merge(ret, hw_nat_status);' in interface_control
          assert interface_control.index(hw_nat_gate) < interface_control.index(hw_nat_command)
          assert interface_control.index(hw_nat_command) < interface_control.index('ret = wireless_radio_status_merge(ret, hw_nat_status);')

          control = function_body(source, "wif_control_success(const char *wifname, int is_up)")
          assert "ret = wif_control(wifname, is_up)" in control
          assert "wireless_radio_status_success(ret)" in control
          assert control.index("wireless_radio_status_success(ret)") < control.index("return 0;") < control.index("return 1;")

          for name, finish_label in (("control_guest_wl", "finish_wl"),
                                      ("control_guest_rt", "finish_rt")):
              body = function_body(source, name + "(int guest_on, int manual)")
              assert finish_label + ":" in body
              up_gate = "if (!wif_control_success(ifname_ap, 1))"
              assert up_gate in body, f"{name}: missing interface-up failure gate"
              up_pos = body.index(up_gate)
              up_record = body.index("wireless_guest_isolation_status_record(&control_status", up_pos)
              up_jump = body.index("goto " + finish_label + ";", up_record)
              publish = body.index("is_ap_changed = 1;", up_pos)
              attach = body.index("br_add_del_if(", up_pos)
              assert up_pos < up_record < up_jump < publish < attach, f"{name}: failed interface-up may publish bridge/scheduler state"

              down_gate = "if (!wif_control_success(ifname_ap, 0))"
              assert down_gate in body, f"{name}: missing interface-down status gate"
              down_pos = body.index(down_gate)
              down_record = body.index("wireless_guest_isolation_status_record(&control_status", down_pos)
              detach = body.index("br_add_del_if(", down_record)
              assert down_pos < down_record < detach, f"{name}: interface-down failure must not skip bridge detach"
              assert "goto " + finish_label + ";" not in body[down_record:detach]

              assert "rollback_candidate = 1;" in body
              assert "if (guest_on && rollback_candidate && control_status.first_status != 0)" in body
              assert "wireless_guest_ap_rollback(ifname_ap, bridge_ifname, &control_status);" in body

          rollback = function_body(source, "wireless_guest_ap_rollback(")
          assert "wireless_guest_isolation_status_rollback(status, &ops, &context)" in rollback
          assert "br_add_del_if(IFNAME_BR, rollback->bridge_ifname, 0)" in source
          rt_bridge = function_body(source, "wireless_guest_rt_bridge_ifname(int is_ap_mode)")
          assert "if (!is_ap_mode)" in rt_bridge and "IFNAME_INIC_GUEST_VLAN" in rt_bridge

          restart_rollback = function_body(source, "wireless_guest_restart_fail_closed(")
          assert "wireless_guest_ap_rollback(IFNAME_5G_GUEST" in restart_rollback
          assert "wireless_guest_ap_rollback(IFNAME_2G_GUEST" in restart_rollback
          for name in ("restart_wifi_wl", "restart_wifi_rt"):
              body = function_body(source, name + "(int radio_on, int need_reload_conf)")
              assert "wireless_guest_restart_fail_closed(" in body

          for name, gates in (
              ("start_wifi_ap_wl", (
                  ("if (!wif_control_success(IFNAME_5G_MAIN, 1))",
                   ("wireless_bridge_membership_record(&all_started, IFNAME_5G_MAIN, 1)", "wif_control_m2u(1, IFNAME_5G_MAIN)")),
                  ("if (!wif_control_success(IFNAME_5G_GUEST, 1))",
                   ("wireless_bridge_membership_record(&all_started, IFNAME_5G_GUEST, 1)", "wif_control_m2u(1, IFNAME_5G_GUEST)")),
              )),
              ("start_wifi_ap_rt", (
                  ("if (!wif_control_success(IFNAME_INIC_GUEST, 1))",
                   ("wireless_bridge_membership_record(&all_started, IFNAME_INIC_GUEST_VLAN, 1)",)),
                  ("if (!wif_control_success(IFNAME_2G_MAIN, 1))",
                   ("wireless_bridge_membership_record(&all_started, IFNAME_2G_MAIN, 1)", "wif_control_m2u(0, IFNAME_2G_MAIN)")),
                  ("if (!wif_control_success(IFNAME_2G_GUEST, 1))",
                   ("wireless_bridge_membership_record(&all_started, IFNAME_2G_GUEST, 1)", "wif_control_m2u(0, IFNAME_2G_GUEST)")),
              )),
              ("start_wifi_apcli_wl", (
                  ("if (!wif_control_success(ifname_apcli, 1))",
                   ("wireless_bridge_membership_record(&all_started, ifname_apcli,", "ApCliAutoConnect")),
              )),
              ("start_wifi_apcli_rt", (
                  ("if (!wif_control_success(ifname_apcli, 1))",
                   ("wireless_bridge_membership_record(&all_started, ifname_apcli,", "ApCliAutoConnect")),
              )),
          ):
              body = function_body(source, name + "(int radio_on)")
              for gate, effects in gates:
                  gate_pos = body.index(gate)
                  failure_return = body.index("return -EIO;", gate_pos)
                  for effect in effects:
                      effect_pos = body.index(effect, gate_pos)
                      assert gate_pos < failure_return < effect_pos, (
                          f"{name}: failed interface-up may still reach {effect}"
                      )

          # On RT3352 MII, the iNIC health monitor is part of radio readiness.
          # Preserve its launch error rather than logging and returning success.
          inic_ap_start = function_body(source, "start_wifi_ap_rt(int radio_on)")
          monitor_gate = 'if (nvram_get_int("inic_disable") != 1) {'
          monitor_launch = "int inicd_start_status = start_inicd();"
          monitor_log = 'logmessage(LOGNAME, "failed to start iNIC health monitor (status=%d)",'
          monitor_merge = "all_started = wireless_radio_startup_status("
          monitor_success = "wireless_radio_status_success(inicd_start_status)"
          monitor_result = "return wireless_radio_startup_result(all_started);"
          assert monitor_gate in inic_ap_start
          assert monitor_launch in inic_ap_start
          assert monitor_log in inic_ap_start
          assert monitor_merge in inic_ap_start
          assert monitor_success in inic_ap_start
          gate_at = inic_ap_start.index(monitor_gate)
          launch_at = inic_ap_start.index(monitor_launch, gate_at)
          log_at = inic_ap_start.index(monitor_log, launch_at)
          merge_at = inic_ap_start.index(monitor_merge, log_at)
          success_at = inic_ap_start.index(monitor_success, merge_at)
          result_at = inic_ap_start.index(monitor_result)
          assert gate_at < launch_at < log_at < merge_at < success_at < result_at
          assert "start_inicd()" not in inic_ap_start[:gate_at]
          assert "test_inic_monitor_launch_failure_is_sticky" in (
              (rc / "tests/wireless_radio_policy.c").read_text()
          )

          for name in ("start_wifi_apcli_wl", "start_wifi_apcli_rt"):
              body = function_body(source, name + "(int radio_on)")
              for mode in (3, 1):
                  command = ('doSystem("iwpriv %s set %s=%d", ifname_apcli, '
                             '"ApCliAutoConnect", ' + str(mode) + ')')
                  if command in body:
                      checked = "wireless_radio_status_success(" + command + ")"
                      assert checked in body, f"{name}: AutoConnect command status is discarded"
                      checked_pos = body.index(checked)
                      assert checked_pos < body.index("return -EIO;", checked_pos), (
                          f"{name}: AutoConnect failure must be returned to the restart"
                      )

          for name, ifnames in (
              ("start_wifi_wds_wl", (
                  "IFNAME_5G_WDS3", "IFNAME_5G_WDS2",
                  "IFNAME_5G_WDS1", "IFNAME_5G_WDS0",
              )),
              ("start_wifi_wds_rt", (
                  "IFNAME_2G_WDS3", "IFNAME_2G_WDS2",
                  "IFNAME_2G_WDS1", "IFNAME_2G_WDS0",
              )),
          ):
              body = function_body(source, name + "(int radio_on)")
              assert "return;" not in body and "return -EIO;" not in body, (
                  f"{name}: one WDS failure must not block remaining WDS interfaces"
              )
              interface_positions = []
              for ifname in ifnames:
                  gate = "interface_started = wif_control_success(" + ifname + ", 1);"
                  assert gate in body, f"{name}: missing interface-up status capture for {ifname}"
                  gate_pos = body.index(gate)
                  interface_positions.append(gate_pos)
                  aggregate = "all_started = wireless_radio_startup_status(all_started, interface_started);"
                  assert aggregate in body, f"{name}: failed {ifname} status is not aggregated"
                  aggregate_pos = body.index(aggregate, gate_pos)
                  assert gate_pos < aggregate_pos
                  bridge = "wireless_bridge_membership_record(&all_started, " + ifname + ", 1)"
                  if bridge in body:
                      bridge_pos = body.index(bridge, aggregate_pos)
                      assert aggregate_pos < bridge_pos, (
                          f"{name}: {ifname} bridge add must follow its checked interface-up"
                      )
              assert interface_positions == sorted(interface_positions), (
                  f"{name}: all configured WDS interfaces must be attempted in order"
              )
              assert "return wireless_radio_startup_result(all_started);" in body

          # RT3352 iNIC startup must verify every state-changing dependency:
          # RGMII enable, rai0 up, isolation/MLME configuration and RADIUS bridge.
          inic = function_body(source, "start_inic_mii(void)")
          reset_release = inic.index("cpu_gpio_set_pin(1, 1);")
          reset_wait = inic.index("operation_status = service_wait_microseconds(50000U);", reset_release)
          wait_failure = inic.index("if (operation_status != 0)", reset_wait)
          wait_errno = inic.index("operation_status = errno > 0 ? errno : EIO;", wait_failure)
          wait_log = inic.index("iNIC reset settling wait failed", wait_errno)
          wait_abort = inic.index("goto fail_start;", wait_log)
          rgmii_enable = inic.index("operation_status = phy_disable_inic(0);")
          assert reset_release < reset_wait < wait_failure < wait_errno < wait_log < wait_abort < rgmii_enable
          assert "usleep(50000);" not in inic
          assert "operation_status = phy_disable_inic(0);" in inic
          assert "if (operation_status != 0)" in inic
          assert "if (!wif_control_success(ifname_inic, 1))" in inic
          assert "operation_status = phy_isolate_inic(0);" in inic
          assert 'operation_status = doSystem("iwpriv %s set %s=%d",' in inic
          assert "wireless_radio_status_success(operation_status)" in inic
          assert "wireless_bridge_membership_record(" in inic
          assert "if (!all_started)" in inic
          assert "return -EIO;" in inic
          enabled_start = inic.index("operation_status = phy_disable_inic(0);")
          fail_start = inic.index("fail_start:")
          assert enabled_start < fail_start
          assert inic.index("if (operation_status != 0)", enabled_start) < fail_start
          for effect in (
              "update_inic_mii();",
              "operation_status = phy_isolate_inic(0);",
              'operation_status = doSystem("iwpriv %s set %s=%d",',
              "wireless_bridge_membership_record(\n\t\t\t&all_started, ifname_inic,",
          ):
              assert fail_start > inic.index(effect), (
                  f"start_inic_mii: setup effect {effect} must be after RGMII enable"
              )
          failure_path = inic[fail_start:]
          cleanup_steps = (
              "if (!wif_control_success(ifname_inic, 0))",
              "wireless_bridge_membership_record(&all_started, ifname_inic, 0);",
              "phy_isolate_inic(1)",
              "phy_disable_inic(1)",
              "cpu_gpio_set_pin(1, 0)",
          )
          cleanup_positions = [failure_path.index(step) for step in cleanup_steps]
          assert cleanup_positions == sorted(cleanup_positions), (
              "start_inic_mii: startup failure must continue all iNIC cleanup steps"
          )
          assert "return 0;" in inic, "start_inic_mii: enabled success path must return success"
          assert "return wireless_radio_startup_result(all_started);" in inic
          disable_pos = inic.index("/* Force-disable path:")
          disable_path = inic[disable_pos:]
          disabled_steps = (
              "wireless_bridge_membership_record(&all_started, ifname_inic, 0);",
              "operation_status = phy_isolate_inic(1);",
              "operation_status = phy_disable_inic(1);",
              "cpu_gpio_set_pin(1, 0)",
          )
          disabled_positions = [disable_path.index(step) for step in disabled_steps]
          assert disabled_positions == sorted(disabled_positions), (
              "start_inic_mii: forced disable must complete bridge/isolation/RGMII/reset"
          )
          assert "return;" not in disable_path

          ap_rt = function_body(source, "start_wifi_ap_rt(int radio_on)")
          assert "if (start_inic_mii() < 0)" in ap_rt, (
              "start_wifi_ap_rt must propagate an iNIC interface-up failure"
          )
          assert 'nvram_get_int("inic_disable") != 1 && is_guest_allowed_rt()' in ap_rt, (
              "a deliberately disabled iNIC must not be treated as a failed guest-AP start"
          )
          assert "int inicd_start_status = start_inicd();" in ap_rt, (
              "iNIC health monitor launch result must be captured"
          )
          assert "wireless_radio_status_success(inicd_start_status)" in ap_rt, (
              "iNIC health monitor startup failure must be aggregated"
          )

          for name, helpers, own_auth, peer_helpers, peer_auth, own_stop, peer_stop in (
              ("restart_wifi_wl",
               ("start_wifi_ap_wl(radio_on)", "start_wifi_wds_wl(radio_on)", "start_wifi_apcli_wl(radio_on)"),
               "start_8021x_wl()",
               ("start_wifi_ap_rt(rt_radio_on)", "start_wifi_wds_rt(rt_radio_on)", "start_wifi_apcli_rt(rt_radio_on)"),
               "start_8021x_rt()", "stop_wifi_all_wl()", "stop_wifi_all_rt()"),
              ("restart_wifi_rt",
               ("start_wifi_ap_rt(radio_on)", "start_wifi_wds_rt(radio_on)", "start_wifi_apcli_rt(radio_on)"),
               "start_8021x_rt()",
               ("start_wifi_ap_wl(wl_radio_on)", "start_wifi_wds_wl(wl_radio_on)", "start_wifi_apcli_wl(wl_radio_on)"),
               "start_8021x_wl()", "stop_wifi_all_rt()", "stop_wifi_all_wl()"),
          ):
              body = function_body(source, name + "(int radio_on, int need_reload_conf)")
              first = helpers[0]
              gate = "if (" + first + " < 0 ||"
              assert gate in body, f"{name}: startup helper failures must gate authentication startup"
              own_auth_pos = body.index(own_auth)
              assert body.index(gate) < own_auth_pos
              assert body.index(own_stop + " < 0", body.index(gate)) < body.index("return -1;", body.index(gate))
              peer_gate = "if (" + peer_helpers[0] + " < 0 ||"
              assert peer_gate in body, f"{name}: DBDC peer startup failures must be propagated"
              peer_pos = body.index(peer_gate)
              peer_failure = body.index("return -1;", peer_pos)
              # The primary radio's authenticator is already running; peer
              # authentication is not launched until all peer interfaces start.
              auth_cleanup = "if (" + own_auth.replace("start_", "stop_", 1) + " != 0)"
              assert peer_pos < body.index(auth_cleanup, peer_pos) < peer_failure
              assert body.index(peer_stop + " < 0", peer_pos) < peer_failure

          # A raw bridge-add ioctl cannot safely be treated as a failure
          # until membership is checked: Linux 4.4 returns -EBUSY when the
          # interface already has a master, including an existing bridge port.
          bridge_source = (root / "trunk/linux-4.4.x/net/bridge/br_if.c").read_text()
          bridge_add = function_body(bridge_source, "br_add_if(struct net_bridge *br, struct net_device *dev)")
          master_gate = bridge_add.index("if (netdev_master_upper_dev_get(dev))")
          busy_return = bridge_add.index("return -EBUSY;", master_gate)
          assert master_gate < busy_return

          # Same-bridge additions are idempotent; a port attached to a
          # different bridge must continue to fail with the kernel error.
          assert '#include "bridge_membership_policy.h"' in netutils_source
          assert "BRIDGE_PORT_LIST_CAPACITY 1024" in bridge_policy_header
          assert "bridge_port_list_contains" in bridge_policy_header
          membership_query = function_body(
              netutils_source,
              "bridge_has_ifindex(int sockfd, const char *brname, int ifindex)")
          assert "BRCTL_GET_PORT_LIST" in membership_query
          assert "SIOCDEVPRIVATE" in membership_query
          assert "bridge_port_list_contains(ifindices, BRIDGE_PORT_LIST_CAPACITY, ifindex)" in membership_query
          add_if = function_body(
              netutils_source,
              "br_add_del_if_internal(const char *brname, const char *ifname, int is_add,")
          assert add_if.count("bridge_has_ifindex(sockfd, brname, ifr.ifr_ifindex)") == 2
          assert "membership = bridge_has_ifindex(sockfd, brname, ifr.ifr_ifindex)" in add_if
          assert add_if.index("membership = bridge_has_ifindex(") < add_if.index("ret = ioctl(sockfd, (is_add) ? SIOCBRADDIF")
          assert "if (membership < 0)" in add_if
          assert "bridge_membership_request_satisfied(is_add, membership)" in add_if
          assert "bridge_membership_race_is_idempotent(is_add, errno)" in add_if
          assert "if (ret < 0 && bridge_membership_race_is_idempotent(is_add, errno))" in add_if
          assert add_if.rindex("bridge_has_ifindex(") > add_if.index("bridge_membership_race_is_idempotent(is_add, errno)")

          # Bulk bridge teardown must report failures and respect the separate
          # do_if_down and do_if_rem controls.
          cleanup = function_body(
              netutils_source,
              "br_del_all_ifs(const char *brname, int do_if_down, int do_if_rem)")
          assert "BRIDGE_PORT_LIST_CAPACITY" in cleanup
          assert "unsigned char detached[BRIDGE_PORT_LIST_CAPACITY]" in cleanup
          assert "ret = ioctl(sockfd, SIOCBRDELIF, &ifr)" in cleanup
          assert "status = bridge_cleanup_status_update(status, ret)" in cleanup
          assert cleanup.index("if (ret < 0)") < cleanup.index("detached[i] = 1;")
          assert "if (!detached[i])" in cleanup
          assert "if (do_if_down)" in cleanup
          assert "bridge_cleanup_should_set_interface_down(" in cleanup
          assert "return status;" in cleanup
          assert cleanup.index("if (!detached[i])") < cleanup.index("SIOCGIFNAME")
          assert cleanup.index("if (do_if_down)") < cleanup.index("SIOCGIFFLAGS")
          assert "bridge_cleanup_should_remove_vlan(do_if_rem, ifr.ifr_name, IFNAME_LAN)" in cleanup
          vlan_remove_pos = cleanup.index("ret = vconfig_del_if(ifr.ifr_name);")
          vlan_status_pos = cleanup.index(
              "status = bridge_cleanup_status_update(status, ret);", vlan_remove_pos)
          assert vlan_remove_pos < vlan_status_pos, (
              "failed VLAN deletion must be included in bridge teardown status")
          vlan_delete = function_body(
              netutils_source, "vconfig_del_if(const char *vifname)")
          assert "ret = ioctl(sockfd, SIOCSIFVLAN, &ifr)" in vlan_delete
          assert "return ret;" in vlan_delete

          # Bridge membership is part of radio readiness; preserve ioctl failures.
          bridge_record = function_body(
              source,
              "wireless_bridge_membership_record(int *all_started, const char *ifname, int is_add)")
          assert "status = br_add_del_if(IFNAME_BR, ifname, is_add);" in bridge_record
          assert 'is_add ? "attach" : "detach"' in bridge_record
          assert "*all_started = wireless_radio_startup_status(" in bridge_record
          assert "wireless_radio_status_success(status)" in bridge_record
          for name in (
              "start_wifi_ap_rt", "start_wifi_ap_wl", "start_wifi_wds_rt",
              "start_wifi_wds_wl", "start_wifi_apcli_rt", "start_wifi_apcli_wl",
          ):
              body = function_body(source, name + "(int radio_on)")
              assert "br_add_del_if(" not in body, f"{name}: unchecked bridge call remains"
              assert "wireless_bridge_membership_record(&all_started," in body
              assert "wireless_radio_startup_result(all_started)" in body
          for name, ifnames in (
              ("start_wifi_wds_rt", ("IFNAME_2G_WDS3", "IFNAME_2G_WDS2", "IFNAME_2G_WDS1", "IFNAME_2G_WDS0")),
              ("start_wifi_wds_wl", ("IFNAME_5G_WDS3", "IFNAME_5G_WDS2", "IFNAME_5G_WDS1", "IFNAME_5G_WDS0")),
          ):
              body = function_body(source, name + "(int radio_on)")
              assert body.count("wireless_bridge_membership_record(&all_started,") == 8
              for ifname in ifnames:
                  assert "wireless_bridge_membership_record(&all_started, " + ifname + ", 1)" in body
                  assert "wireless_bridge_membership_record(&all_started, " + ifname + ", 0)" in body

          # The periodic iNIC health check must surface failed recovery commands.
          inic_check = function_body(source, "check_inic_mii_rebooted(void)")
          assert "int\ncheck_inic_mii_rebooted(void)" in source
          disabled_gate = "if (!get_mlme_radio_rt())"
          assert disabled_gate in inic_check
          assert 'status = doSystem("iwpriv %s set %s=%d", IFNAME_INIC_MAIN,' in " ".join(inic_check.split())
          assert "if (status != 0)" in inic_check
          assert "iNIC radio force-disable command failed" in inic_check
          assert "return wireless_radio_restart_status(0, status);" in inic_check
          assert inic_check.index("status = doSystem(") < inic_check.index("if (status != 0)") < inic_check.index("return wireless_radio_restart_status(0, status);")
          guest_state_check = "status = wireless_guest_interface_state_checked(IFNAME_INIC_GUEST,"
          guest_state_error = "if (status != 0)"
          guest_gate = "if (!guest_is_up && is_guest_allowed_rt())"
          guest_isolation_policy = (rc / "wireless_guest_isolation_policy.h").read_text()
          guest_isolation_test = (rc / "tests/wireless_guest_isolation_policy.c").read_text()
          assert guest_state_check in " ".join(inic_check.split())
          assert guest_state_error in inic_check
          assert "iNIC guest AP state is unknown; recovery deferred until the next health check" in inic_check
          assert guest_gate in inic_check
          assert "is_interface_up(IFNAME_INIC_GUEST)" not in inic_check
          guest_state_call_pos = inic_check.index("wireless_guest_interface_state_checked(")
          guest_state_error_pos = inic_check.index(guest_state_error, guest_state_call_pos)
          guest_state_return_pos = inic_check.index("return status;", guest_state_error_pos)
          guest_state_gate_pos = inic_check.index(guest_gate)
          assert guest_state_call_pos < guest_state_error_pos < guest_state_return_pos < guest_state_gate_pos
          assert "wireless_guest_isolation_link_state" in guest_isolation_policy
          assert "test_unknown_guest_link_state_still_requests_down" in guest_isolation_test
          assert "wireless_guest_isolation_link_state(-1, EACCES, ENODEV," in guest_isolation_test
          assert "status = wif_control(IFNAME_INIC_GUEST, 1);" in inic_check
          assert "wireless_radio_status_success(status)" in inic_check
          assert "wif_control_success(IFNAME_INIC_GUEST, 1)" not in inic_check
          assert inic_check.index(guest_gate) < inic_check.index("status = wif_control(IFNAME_INIC_GUEST, 1);")
          assert "iNIC guest AP recovery deferred until the next health check (status=%d)" in inic_check
          assert inic_check.rstrip().endswith("return 0;")
          assert "test_restart_failure_wait_status_is_normalized_and_sticky" in notification_test

          stop_helper = function_body(
              source,
              "wireless_stop_interface(const char *ifname, const char *bridge_ifname)")
          down_gate = "if (!wif_control_success(ifname, 0))"
          detach_call = "ret = br_add_del_if(IFNAME_BR, bridge_ifname, 0)"
          assert down_gate in stop_helper
          assert detach_call in stop_helper
          assert stop_helper.index(down_gate) < stop_helper.index(detach_call)
          assert stop_helper.index(detach_call) < stop_helper.index("if (ret != 0)")
          assert "failed to detach %s from %s after shutdown" in stop_helper
          assert stop_helper.index("if (ret != 0)") < stop_helper.rindex("return 1;")

          def assert_shutdown_calls(body, interfaces):
              normalized = " ".join(body.split())
              calls = []
              for ifname, bridge_ifname in interfaces:
                  call = ("all_stopped = wireless_radio_shutdown_status(all_stopped, "
                          "wireless_stop_interface(" + ifname + ", " + bridge_ifname + "));")
                  normalized_call = " ".join(call.split())
                  assert normalized_call in normalized, (
                      f"shutdown must stop and detach {ifname} ({bridge_ifname})")
                  calls.append(normalized.index(normalized_call))
              assert calls == sorted(calls), "shutdown must attempt every required interface in order"
              assert "wif_control_success(" not in normalized, "stop path bypasses bridge-detach helper"

          wl_stop = function_body(source, "stop_wifi_all_wl(void)")
          assert "int all_stopped = 1;" in wl_stop
          assert_shutdown_calls(wl_stop, (
              ("IFNAME_5G_APCLI", "IFNAME_5G_APCLI"),
              ("IFNAME_5G_WDS3", "IFNAME_5G_WDS3"),
              ("IFNAME_5G_WDS2", "IFNAME_5G_WDS2"),
              ("IFNAME_5G_WDS1", "IFNAME_5G_WDS1"),
              ("IFNAME_5G_WDS0", "IFNAME_5G_WDS0"),
              ("IFNAME_5G_GUEST", "IFNAME_5G_GUEST"),
              ("IFNAME_5G_MAIN", "IFNAME_5G_MAIN"),
          ))
          assert wl_stop.index("if (all_stopped)") < wl_stop.index("LED_CONTROL(LED_SW5G, LED_OFF);")
          assert wl_stop.count("LED_CONTROL(LED_SW5G, LED_OFF);") == 1
          assert "shutdown incomplete; retaining radio LED state" in wl_stop

          rt_stop = function_body(source, "stop_wifi_all_rt(void)")
          assert "int all_stopped = 1;" in rt_stop
          mii_start = rt_stop.index("#if defined(USE_RT3352_MII)")
          mii_else = rt_stop.index("#else", mii_start)
          mii_branch = rt_stop[mii_start:mii_else]
          generic_branch = rt_stop[mii_else:]
          assert_shutdown_calls(mii_branch, (
              ("IFNAME_INIC_GUEST", "IFNAME_INIC_GUEST_VLAN"),
              ("IFNAME_INIC_MAIN", "IFNAME_INIC_MAIN"),
          ))
          assert "phy_isolate_inic(1)" in mii_branch and "phy_disable_inic(1)" in mii_branch
          assert_shutdown_calls(generic_branch, (
              ("IFNAME_2G_APCLI", "IFNAME_2G_APCLI"),
              ("IFNAME_2G_WDS3", "IFNAME_2G_WDS3"),
              ("IFNAME_2G_WDS2", "IFNAME_2G_WDS2"),
              ("IFNAME_2G_WDS1", "IFNAME_2G_WDS1"),
              ("IFNAME_2G_WDS0", "IFNAME_2G_WDS0"),
              ("IFNAME_2G_GUEST", "IFNAME_2G_GUEST"),
              ("IFNAME_2G_MAIN", "IFNAME_2G_MAIN"),
          ))
          assert rt_stop.index("if (all_stopped)") < rt_stop.index("LED_CONTROL(LED_SW2G, LED_OFF);")
          assert rt_stop.count("LED_CONTROL(LED_SW2G, LED_OFF);") == 1
          assert "shutdown incomplete; retaining radio LED state" in rt_stop

          assert "return wireless_radio_shutdown_result(all_stopped);" in wl_stop
          assert "return wireless_radio_shutdown_result(all_stopped);" in rt_stop

          for name, own_stop, peer_stop, own_auth, peer_auth, first_start in (
              ("restart_wifi_wl", "stop_wifi_all_wl", "stop_wifi_all_rt",
               "stop_8021x_wl", "stop_8021x_rt", "start_wifi_ap_wl"),
              ("restart_wifi_rt", "stop_wifi_all_rt", "stop_wifi_all_wl",
               "stop_8021x_rt", "stop_8021x_wl", "start_wifi_ap_rt"),
          ):
              body = function_body(source, name + "(int radio_on, int need_reload_conf)")
              own_gate = "if (" + own_stop + "() < 0)"
              assert own_gate in body, f"{name}: own-radio shutdown failure is not propagated"
              own_pos = body.index(own_gate)
              own_failure = body.index("return -1;", own_pos)
              own_auth_pos = body.index(own_auth + "()")
              start_pos = body.index(first_start + "(")
              assert own_pos < own_failure < own_auth_pos < start_pos
              peer_gate = "if (" + peer_stop + "() < 0)"
              assert peer_gate in body, f"{name}: DBDC peer stop failure is not propagated"
              peer_pos = body.index(peer_gate)
              peer_failure = body.index("return -1;", peer_pos)
              peer_auth_pos = body.index(peer_auth + "()")
              assert peer_pos < peer_failure < peer_auth_pos < start_pos


          # The explicit inic_disable path is fail-safe: a failed ifconfig
          # down must not prevent bridge removal, isolation, RGMII disable,
          # or reset assertion.
          disable_pos = inic.rfind("} else {")
          assert disable_pos >= 0, "start_inic_mii: missing inic_disable branch"
          disable_path = inic[disable_pos:]
          down_call = "all_started = wireless_radio_startup_status("
          down_argument = "all_started, wif_control_success(ifname_inic, 0));"
          assert down_call in disable_path and down_argument in disable_path, (
              "start_inic_mii: rai0 interface-down failure must be included in returned status")
          down_pos = disable_path.index(down_call)
          assert "test_inic_force_disable_interface_failure_is_sticky" in (
              (rc / "tests/wireless_radio_policy.c").read_text()
          )
          disable_steps = (
              "wireless_bridge_membership_record(&all_started, ifname_inic, 0);",
              "phy_isolate_inic(1)",
              "phy_disable_inic(1)",
              "cpu_gpio_set_pin(1, 0)",
          )
          disable_positions = [disable_path.index(step, down_pos) for step in disable_steps]
          assert disable_positions == sorted(disable_positions), (
              "start_inic_mii: failed rai0 shutdown must not skip fail-safe cleanup"
          )
          assert down_pos < disable_path.index("return wireless_radio_startup_result(all_started);")
          assert "return;" not in disable_path, (
              "start_inic_mii: interface-down failure must not short-circuit reset cleanup"
          )

          paths = (
              ".github/workflows/wireless-radio-state.yml",
              "trunk/user/rc/src/net_wifi.c",
              "trunk/user/rc/src/net_wan.c",
              "trunk/user/shared/src/netutils.c",
              "trunk/user/shared/src/bridge_membership_policy.h",
              "trunk/user/shared/src/tests/bridge_membership_policy.c",
              "trunk/user/rc/src/rc.h",
              "trunk/user/rc/src/wireless_radio_policy.h",
              "trunk/user/rc/src/tests/wireless_radio_policy.c",
              "trunk/linux-4.4.x/net/bridge/br_if.c",
          )
          filters = workflow.split("jobs:", 1)[0]
          push_filters, pr_filters = filters.split("  pull_request:", 1)
          for path in paths:
              assert push_filters.count(path) == 1, f"push path filter missing or duplicated: {path}"
              assert pr_filters.count(path) == 1, f"pull_request path filter missing or duplicated: {path}"

          print("Wireless driver/restart failure state-publication contracts: PASS")
          PY

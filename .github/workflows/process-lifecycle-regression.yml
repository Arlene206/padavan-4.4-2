      - name: Verify RC user-config copy errors abort staged publication
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def function_body(source, signature):
              start = source.find(signature)
              assert start >= 0, "missing function: " + signature
              brace = source.find("{", start + len(signature))
              depth = 0
              for pos in range(brace, len(source)):
                  if source[pos] == "{":
                      depth += 1
                  elif source[pos] == "}":
                      depth -= 1
                      if depth == 0:
                          return source[brace + 1:pos]
              raise AssertionError("unterminated function: " + signature)

          common = Path("trunk/user/rc/src/common_ex.c").read_text()
          policy = Path("trunk/user/rc/src/rc_user_config_copy_policy.h").read_text()
          lan = Path("trunk/user/rc/src/net_lan.c").read_text()
          wan = Path("trunk/user/rc/src/net_wan.c").read_text()
          ralink = Path("trunk/user/rc/src/ralink.c").read_text()

          loader = function_body(common, "load_user_config(FILE *fp,")
          assert "rc_user_config_copy_stream(" in loader
          assert "fclose(fp_user)" in loader
          assert "dnsmasq_file_open_safe_read(real_path)" in loader
          assert 'fopen(real_path, "r")' not in loader
          dnsmasq_file_policy = Path("trunk/user/rc/src/dnsmasq_file.h").read_text()
          equal_start = dnsmasq_file_policy.rindex("dnsmasq_file_contents_equal(")
          equal_body = function_body(dnsmasq_file_policy[equal_start:], "dnsmasq_file_contents_equal(")
          assert "dnsmasq_file_open_safe_read(path)" in equal_body
          assert "dnsmasq_file_open_safe_read(staged_path)" in equal_body
          assert 'fopen(path, "r")' not in equal_body
          assert 'fopen(staged_path, "r")' not in equal_body
          safe_read_policy = Path("trunk/user/rc/src/dnsmasq_safe_read.h").read_text()
          assert "open(path, O_RDONLY | O_NOFOLLOW | O_NONBLOCK, 0)" in safe_read_policy
          assert "fstat(fd, &st)" in safe_read_policy
          assert "st.st_uid != geteuid()" in safe_read_policy
          assert "st.st_nlink != 1" in safe_read_policy
          assert "st.st_mode & (S_IWGRP | S_IWOTH)" in safe_read_policy
          assert "line[length - 1]" not in loader
          assert "fgetc(input)" in policy
          assert "overlong = 1" in policy
          assert "invalid = 1" in policy
          assert "saved_errno = load_user_config(hosts_fp" in lan
          assert "saved_errno = load_user_config(hosts_fp" in wan
          assert "if (saved_errno != 0)" in lan
          assert "if (saved_errno != 0)" in wan
          assert "user_config_status = load_user_config(" in ralink
          assert "ralink_config_discard_atomic(&fp, temp_path)" in ralink

          print("RC user-config whole-record and staged-publication contract: PASS")
          PY

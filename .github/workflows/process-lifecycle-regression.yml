      - name: Compile and run RC wireless module post-load verification regression
        run: |
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -fno-omit-frame-pointer -I trunk/user/rc/src \
            trunk/user/rc/src/tests/wireless_module_load_policy.c \
            -o "$RUNNER_TEMP/wireless-module-load-policy"
          ASAN_OPTIONS=detect_leaks=1 "$RUNNER_TEMP/wireless-module-load-policy"
      - name: Compile and run RC watchdog module restart postcondition regression
        run: |
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -fno-omit-frame-pointer -I trunk/user/rc/src \
            trunk/user/rc/src/tests/watchdog_cpu_restart_policy.c \
            -o "$RUNNER_TEMP/watchdog-cpu-restart-policy"
          ASAN_OPTIONS=detect_leaks=1 "$RUNNER_TEMP/watchdog-cpu-restart-policy"
      - name: Compile and run RC DDNS restart result policy regression
        run: |
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -fno-omit-frame-pointer -I trunk/user/rc/src \
            trunk/user/rc/src/tests/ddns_restart_policy.c \
            -o "$RUNNER_TEMP/ddns-restart-policy"

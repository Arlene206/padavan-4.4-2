          assert "passwd_temp_file_backup_create(\"/etc/group\"" in recreate
          assert "passwd_file_publish_transaction(file_updates, update_count, rename, unlink, &rollback_failed)" in recreate_compact
          assert "if (rollback_failed)" in recreate
          assert "passwd_backup[0]" in recreate and "group_backup[0]" in recreate
          assert "passwd_file_publish_transaction(" in header
          assert "link(source_path, backup_template)" in header
          assert "rollback_failed" in header
          assert 'fprintf(fp1, "%s:!:' in recreate
          assert "password_status = change_passwd_unix(" in recreate
          assert "int passwd_status = recreate_passwd_unix(1);" in init
          assert "boot_services_status, passwd_status);" in init

      - name: Compile and run Firefly atomic configuration publication regression
        run: |
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -fno-omit-frame-pointer -I trunk/user/rc/src \
            trunk/user/rc/src/tests/firefly_config_file.c \
            -o "$RUNNER_TEMP/firefly-config-file-regression"
          ASAN_OPTIONS=detect_leaks=1 "$RUNNER_TEMP/firefly-config-file-regression"
      - name: Compile and run MiniDLNA atomic configuration publication regression
        run: |
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -fno-omit-frame-pointer -I trunk/user/rc/src \
            trunk/user/rc/src/tests/minidlna_config_file.c \
            -o "$RUNNER_TEMP/minidlna-config-file-regression"
          ASAN_OPTIONS=detect_leaks=1 "$RUNNER_TEMP/minidlna-config-file-regression"
      - name: Check SCUT, vlmcsd, iperf3, mentohust, ttyd, OpenSSH and Dropbear lifecycle status propagation
        run: python3 scripts/check_optional_app_start_status.py
      - name: Exercise Ralink IAPP daemon lifecycle postconditions
        run: |
          sh -n trunk/user/ralinkiappd/iappd.sh

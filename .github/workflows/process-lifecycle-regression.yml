name: Process inventory and lifecycle fail-closed regression

on:
  push:
    paths:
      - ".github/workflows/process-lifecycle-regression.yml"
      - ".github/workflows/xy-c1-firmware-validation.yml"
      - "trunk/user/shared/src/process_inventory.c"
      - "trunk/user/shared/src/process_inventory.h"
      - "trunk/user/shared/src/process_pidfile.c"
      - "trunk/user/shared/src/process_pidfile.h"
      - "trunk/user/shared/src/process_pidfile_record.h"
      - "trunk/user/shared/src/tests/process_pidfile_record.c"
      - "trunk/user/busybox/busybox-1.24.x/networking/udhcp/dhcpc.c"
      - "trunk/user/busybox/Makefile"
      - "trunk/user/shared/src/tests/process_pidfile.c"
      - "trunk/user/shared/src/pids.c"
      - "trunk/user/shared/src/shutils.h"
      - "trunk/user/shared/src/Makefile"
      - "trunk/user/shared/src/tests/process_inventory.c"
      - "trunk/user/rc/src/common_ex.c"
      - "trunk/user/rc/src/net.c"
      - "trunk/user/rc/src/services.c"
      - "trunk/user/rc/src/net_wifi.c"
      - "trunk/user/rc/src/auth.c"
      - "trunk/user/rc/src/rc.c"
      - "trunk/user/rc/src/pppoe_relay_policy.h"
      - "trunk/user/rc/src/tests/pppoe_relay_policy.c"
      - "trunk/user/rc/src/net_wan.c"
      - "trunk/user/rc/src/net_lan.c"
      - "trunk/user/rc/src/usb_modem.c"
      - "trunk/user/rc/src/vpn_server.c"
      - "trunk/user/rc/src/rc.h"
      - "trunk/user/pppd/ppp-2.4.7/pppd/main.c"
      - "trunk/user/pppd/ppp-2.4.7/pppd/pppd_pidfile_policy.h"
      - "trunk/user/pppd/ppp-2.4.7/pppd/tests/pppd_pidfile_policy.c"
      - "trunk/user/rc/src/services_usb.c"
      - "trunk/user/LPRng/src/src/common/lpd.c"
      - "trunk/user/LPRng/src/src/include/lpd_pidfile_policy.h"
      - "trunk/user/LPRng/src/src/tests/lpd_pidfile_policy.c"
      - "trunk/user/rc/src/service_lifecycle_policy.h"
      - "trunk/user/rc/src/tests/service_lifecycle_policy.c"
      - "trunk/user/rc/src/detect_internet.c"
      - "trunk/user/rc/src/detect_link.c"
      - "trunk/user/rc/src/watchdog.c"
      - "trunk/user/rc/src/detect_wan.c"
      - "trunk/user/rc/src/detect_wan_udhcpc_policy.h"
      - "trunk/user/rc/src/tests/detect_wan_udhcpc_policy.c"
      - "trunk/user/rc/src/process_presence_start_policy.h"
      - "trunk/user/rc/src/tests/process_presence_start_policy.c"
      - "trunk/user/httpd/src/web_ex.c"
      - "trunk/user/rc/src/rstats.c"
      - "scripts/check_process_lifecycle_integration.py"
      - "SESSION_HANDOFF.md"
      - "REFACTOR_ROADMAP.md"
      - "dev_log.md"

permissions:
  contents: read

jobs:
  process-lifecycle-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile production scanner and injected regression (GNU89, ASan, UBSan)
        run: |
          cc -std=gnu89 -Wall -Wextra -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -I trunk/user/shared/src \
            trunk/user/shared/src/process_inventory.c \
            trunk/user/shared/src/tests/process_inventory.c \
            -o "$RUNNER_TEMP/process-inventory-regression"
      - name: Exercise process scanner allocation and procfs fault injection
        env:
          ASAN_OPTIONS: detect_leaks=1
        run: "$RUNNER_TEMP/process-inventory-regression"
      - name: Compile service lifecycle all-target preflight regression
        run: |
          cc -std=gnu89 -Wall -Wextra -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -I trunk/user/shared/src -I trunk/user/rc/src \
            trunk/user/shared/src/process_inventory.c \
            trunk/user/rc/src/tests/service_lifecycle_policy.c \
            -o "$RUNNER_TEMP/service-lifecycle-regression"
      - name: Exercise UNKNOWN, identity revalidation and zero-signal gates
        env:
          ASAN_OPTIONS: detect_leaks=1
        run: "$RUNNER_TEMP/service-lifecycle-regression"
      - name: Compile and run process PID-file identity record regression
        run: |
          cc -std=gnu89 -Wall -Wextra -Werror \
            -I trunk/user/shared/src \
            trunk/user/shared/src/process_inventory.c \
            trunk/user/shared/src/process_pidfile.c \
            trunk/user/shared/src/tests/process_pidfile.c \
            -o "$RUNNER_TEMP/process-pidfile-regression"
          "$RUNNER_TEMP/process-pidfile-regression"
      - name: Compile and run shared PID-file record policy regression
        run: |
          cc -std=gnu89 -Wall -Wextra -Werror \
            -I trunk/user/shared/src \
            trunk/user/shared/src/tests/process_pidfile_record.c \
            -o "$RUNNER_TEMP/process-pidfile-record-policy"
          "$RUNNER_TEMP/process-pidfile-record-policy"
      - name: Compile and run strict LPD PID-file parser regression
        run: |
          cc -std=gnu89 -Wall -Wextra -Werror \
            -I trunk/user/LPRng/src/src/include \
            trunk/user/LPRng/src/src/tests/lpd_pidfile_policy.c \
            -o "$RUNNER_TEMP/lpd-pidfile-regression"
          "$RUNNER_TEMP/lpd-pidfile-regression"
      - name: Compile and run PPPD PID-file identity policy regression
        run: |
          cc -std=gnu89 -Wall -Wextra -Werror \
            -I trunk/user/pppd/ppp-2.4.7/pppd \
            trunk/user/pppd/ppp-2.4.7/pppd/tests/pppd_pidfile_policy.c \
            -o "$RUNNER_TEMP/pppd-pidfile-policy"
          "$RUNNER_TEMP/pppd-pidfile-policy"
      - name: Compile and run WAN DHCP renewal presence policy regression
        run: |
          cc -std=gnu89 -Wall -Wextra -Werror \
            -I trunk/user/shared/src -I trunk/user/rc/src \
            trunk/user/rc/src/tests/detect_wan_udhcpc_policy.c \
            -o "$RUNNER_TEMP/detect-wan-udhcpc-policy"
          "$RUNNER_TEMP/detect-wan-udhcpc-policy"
      - name: Compile and run PPPoE relay tri-state startup policy regression
        run: |
          cc -std=gnu89 -Wall -Wextra -Werror \
            -I trunk/user/shared/src -I trunk/user/rc/src \
            trunk/user/rc/src/tests/pppoe_relay_policy.c \
            -o "$RUNNER_TEMP/pppoe-relay-policy"
          "$RUNNER_TEMP/pppoe-relay-policy"
      - name: Compile and run process presence start/notify tri-state regression
        run: |
          cc -std=gnu89 -Wall -Wextra -Werror \
            -I trunk/user/shared/src -I trunk/user/rc/src \
            trunk/user/rc/src/tests/process_presence_start_policy.c \
            -o "$RUNNER_TEMP/process-presence-start-policy"
          "$RUNNER_TEMP/process-presence-start-policy"
      - name: Verify shared-library and RC integration boundaries
        run: python3 scripts/check_process_lifecycle_integration.py

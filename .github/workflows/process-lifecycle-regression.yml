permissions:
  contents: read

concurrency:
  group: process-lifecycle-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  process-lifecycle-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inventory all tracked process lifecycle consumers
        run: |
          python3 scripts/audit_process_lifecycle.py --self-test
          python3 scripts/audit_process_lifecycle.py --repo-root . --revision HEAD --output-dir "$RUNNER_TEMP/process-lifecycle-inventory"
          python3 - "$RUNNER_TEMP/process-lifecycle-inventory/process-lifecycle-inventory.json" <<'PY'
          import json
          import sys

          report = json.load(open(sys.argv[1], encoding="utf-8"))
          print("PROCESS LIFECYCLE INVENTORY:", report["revision"])
          print("Coverage:", json.dumps(report["coverage"], sort_keys=True))
          for symbol in ("pids", "is_dns_dhcpd_run", "dnsmasq_process_status",
                          "kill_pidfile", "kill_pidfile_s"):
              hits = report["api_symbols"][symbol]["hits"]
              calls = [hit for hit in hits if hit["role"] == "call_or_macro"]
              print(f"\n{symbol}: {len(hits)} lexical occurrences; {len(calls)} call candidates")
              for hit in calls:
                  print(f"  {hit['path']}:{hit['line']}: {hit['context']}")
          commands = report["lifecycle_categories"]["process_commands"]["hits"]
          killall = [hit for hit in commands if hit["token"] == "killall"]
          print(f"\nkillall command candidates: {len(killall)}")
          for hit in killall[:120]:
              print(f"  {hit['path']}:{hit['line']}: {hit['context']}")
          if len(killall) > 120:
              print(f"  ... {len(killall) - 120} additional candidates in the full report")
          PY
      - name: Validate SmartDNS process-state and stop postconditions
        run: |
          set -eu
          sh -n trunk/user/smartdns/smartdns.sh
          sh -n trunk/user/smartdns/smartdns_process_lifecycle.sh
          sh -n trunk/user/smartdns/tests/smartdns_process_lifecycle.sh
          sh trunk/user/smartdns/tests/smartdns_process_lifecycle.sh
          python3 scripts/check_smartdns_lifecycle.py
      - name: Validate Adbyby stop postcondition and cleanup gate
        run: |
          set -eu
          sh -n trunk/user/adbyby/adbyby.sh
          sh -n trunk/user/adbyby/tests/adbyby_stop_postcondition.sh
          sh trunk/user/adbyby/tests/adbyby_stop_postcondition.sh
      - name: Validate Adbyby detached startup readiness and restart status
        run: |
          set -eu
          sh -n trunk/user/adbyby/adbyby.sh
          sh -n trunk/user/adbyby/tests/adbyby_start_postcondition.sh
          sh trunk/user/adbyby/tests/adbyby_start_postcondition.sh
      - name: Run fail-closed shared shell process lifecycle regression
        run: |
          set -eu
          sh -n trunk/user/shared/scripts/process_lifecycle.sh
          sh -n trunk/user/shared/tests/process_lifecycle.sh
          sh trunk/user/shared/tests/process_lifecycle.sh
      - name: Compile production scanner and injected regression (GNU89, ASan, UBSan)
        run: |
          cc -std=gnu89 -Wall -Wextra -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -I trunk/user/shared/src \
            trunk/user/shared/src/process_inventory.c \
            trunk/user/shared/src/tests/process_inventory.c \
            -o "$RUNNER_TEMP/process-inventory-regression"
      - name: Exercise process scanner allocation and procfs fault injection
        env:
          ASAN_OPTIONS: detect_leaks=1
        run: "$RUNNER_TEMP/process-inventory-regression"
      - name: Verify bounded procfs read interruption handling
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path("trunk/user/shared/src/process_inventory.c").read_text()
          assert "comm_length > sizeof(identity->comm) - 1" in source
          start = source.index("proc_default_read_file(")
          opening = source.index("{", start)
          depth = 0
          for position in range(opening, len(source)):
              if source[position] == "{":
                  depth += 1
              elif source[position] == "}":
                  depth -= 1
                  if depth == 0:
                      body = source[opening + 1:position]
                      break
          else:
              raise AssertionError("proc_default_read_file body is incomplete")
          assert body.count("process_io_retry_interrupted(&interruptions)") == 1
          assert body.count("process_io_retry_interrupted(&extra_interruptions)") == 1
          assert "PROCESS_IO_MAX_INTERRUPTS 8U" in Path(
              "trunk/user/shared/src/process_io_retry_policy.h"
          ).read_text()
          test = Path("trunk/user/shared/src/tests/process_inventory.c").read_text()
          assert "test_procfs_read_eintr_retries_are_bounded" in test
          assert "test_exact_max_length_comm_is_not_truncated" in test

          flash = Path("trunk/user/shared/src/flash_mtd.c").read_text()
          def function_body(source, signature):
              start = source.index(signature)
              opening = source.index("{", start)
              depth = 0
              for position in range(opening, len(source)):
                  if source[position] == "{":
                      depth += 1
                  elif source[position] == "}":
                      depth -= 1
                      if depth == 0:
                          return source[opening + 1:position]
              raise AssertionError("incomplete function: " + signature)
          read_body = function_body(flash, "read_safe(int fd")
          write_body = function_body(flash, "write_safe(int fd")
          assert "process_io_read(fd, buf + r_len, buf_len - r_len)" in read_body
          assert "process_io_write(fd, buf + w_len, buf_len - w_len)" in write_body
          # The wrapper owns the bounded EINTR counter; do not restart it.
          assert "if (errno == EINTR)" not in read_body
          assert "if (errno == EINTR)" not in write_body
          assert "continue;" not in read_body
          assert "continue;" not in write_body
          assert "ssize_t ret = read(fd, buf + r_len" not in read_body
          assert "ssize_t ret = write(fd, buf + w_len" not in write_body
          assert "r_len += ret;" in read_body and "if (ret == 0)" in read_body
          assert "w_len += (size_t)ret;" in write_body and "errno = EIO;" in write_body
          print("Procfs and MTD flash I/O EINTR retry bound contract: PASS")
          PY
      - name: Compile and run legacy pids() UNKNOWN mapping regression
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -I trunk/user/shared/src \
            trunk/user/shared/src/tests/pids_presence_policy.c \
            -o "$RUNNER_TEMP/pids-presence-policy"
          ASAN_OPTIONS=detect_leaks=1 "$RUNNER_TEMP/pids-presence-policy"

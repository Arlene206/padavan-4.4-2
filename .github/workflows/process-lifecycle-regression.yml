              start = source.index(signature)
              opening = source.index("{", start)
              depth = 0
              quote = None
              escaped = False
              line_comment = False
              block_comment = False
              position = opening
              while position < len(source):
                  char = source[position]
                  following = source[position + 1] if position + 1 < len(source) else ""
                  if line_comment:
                      if char == "\n":
                          line_comment = False
                      position += 1
                      continue
                  if block_comment:
                      if char == "*" and following == "/":
                          block_comment = False
                          position += 2
                      else:
                          position += 1
                      continue
                  if quote:
                      if escaped:
                          escaped = False
                      elif char == "\\":
                          escaped = True
                      elif char == quote:
                          quote = None
                      position += 1
                      continue
                  if char == "/" and following == "/":
                      line_comment = True
                      position += 2
                      continue
                  if char == "/" and following == "*":
                      block_comment = True
                      position += 2
                      continue
                  if char in ('"', "'"):
                      quote = char
                  elif char == "{":
                      depth += 1
                  elif char == "}":
                      depth -= 1
                      if depth == 0:
                          return source[opening + 1:position]
                  position += 1
              raise AssertionError("incomplete function: " + signature)

          change = function_body(shared, "change_passwd_unix(")
          recreate = function_body(shared, "recreate_passwd_unix(")
          recreate_compact = " ".join(recreate.split())

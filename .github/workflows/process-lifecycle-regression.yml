          bridge_init_regression = (rc / "tests/bridge_init_policy.c").read_text()

          def body(source, signature):
              start = source.index(signature)
              brace = source.index("{", start)
              depth = 0
              for pos in range(brace, len(source)):
                  if source[pos] == "{":
                      depth += 1
                  elif source[pos] == "}":
                      depth -= 1
                      if depth == 0:
                          return source[brace + 1:pos]
              raise AssertionError("unterminated function: " + signature)

          assert "\nint\nstart_lan(int is_ap_mode, int do_wait)" in lan
          assert "\nint\nlan_up_manual(char *lan_ifname, char *lan_dname)" in lan
          assert "\nvoid\nint\nstart_lan(" not in lan
          assert "\nvoid\nlan_up_manual(" not in lan
          start_lan = body(lan, "start_lan(int is_ap_mode, int do_wait)")
          assert "operation_status = ifconfig(lan_ifname, IFUP, lan_ipaddr, lan_netmsk);" in start_lan
          assert "operation_status = start_udhcpc_lan(lan_ifname);" in start_lan
          assert "operation_status = lan_up_manual(lan_ifname, lan_dname);" in start_lan
          assert "operation_status = add_static_lan_routes(lan_ifname);" in start_lan
          assert start_lan.count("rc_first_service_start_status(start_status, operation_status)") >= 4
          assert "return start_status;" in start_lan


name: Process inventory and lifecycle fail-closed regression

on:
  push:
    paths:
      - ".github/workflows/process-lifecycle-regression.yml"
      - "trunk/user/shared/src/process_inventory.c"
      - "trunk/user/shared/src/process_inventory.h"
      - "trunk/user/shared/src/pids.c"
      - "trunk/user/shared/src/shutils.h"
      - "trunk/user/shared/src/Makefile"
      - "trunk/user/shared/src/tests/process_inventory.c"
      - "trunk/user/rc/src/common_ex.c"
      - "trunk/user/rc/src/service_lifecycle_policy.h"
      - "trunk/user/rc/src/tests/service_lifecycle_policy.c"
      - "scripts/check_process_lifecycle_integration.py"
      - "SESSION_HANDOFF.md"
      - "REFACTOR_ROADMAP.md"
      - "dev_log.md"

permissions:
  contents: read

jobs:
  process-lifecycle-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile production scanner and injected regression (GNU89, ASan, UBSan)
        run: |
          cc -std=gnu89 -Wall -Wextra -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -I trunk/user/shared/src \
            trunk/user/shared/src/process_inventory.c \
            trunk/user/shared/src/tests/process_inventory.c \
            -o "$RUNNER_TEMP/process-inventory-regression"
      - name: Exercise process scanner allocation and procfs fault injection
        env:
          ASAN_OPTIONS: detect_leaks=1
        run: "$RUNNER_TEMP/process-inventory-regression"
      - name: Compile service lifecycle all-target preflight regression
        run: |
          cc -std=gnu89 -Wall -Wextra -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -I trunk/user/shared/src -I trunk/user/rc/src \
            trunk/user/shared/src/process_inventory.c \
            trunk/user/rc/src/tests/service_lifecycle_policy.c \
            -o "$RUNNER_TEMP/service-lifecycle-regression"
      - name: Exercise UNKNOWN, identity revalidation and zero-signal gates
        env:
          ASAN_OPTIONS: detect_leaks=1
        run: "$RUNNER_TEMP/service-lifecycle-regression"
      - name: Verify shared-library and RC integration boundaries
        run: python3 scripts/check_process_lifecycle_integration.py

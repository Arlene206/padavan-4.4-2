          assert "boot_services_status = rc_first_service_start_status(" in init_body
          assert "int loopback_start_status = init_loopback();" in init_body
          assert "boot_services_status, loopback_start_status);" in init_body
          assert "int start_lan(int is_ap_mode, int do_wait);" in header
          assert "int lan_up_manual(char *lan_ifname, char *lan_dname);" in header
          assert "test_lan_start_preserves_first_required_failure();" in regression
          bridge = body(lan, "config_bridge(int is_ap_mode)")
          bridge_policy_body = body(bridge_policy, "rc_bridge_config_apply(")
          iptv = body(net, "restart_iptv(int is_ap_mode)")
          assert ("int" + chr(10) + "config_bridge(int is_ap_mode)") in lan
          assert "int config_bridge(int is_ap_mode);" in header
          assert "rc_bridge_config_apply(" in bridge and "return status;" in bridge
          assert "failure_count" in bridge and "first_failure" in bridge
          assert bridge_policy_body.count("rc_bridge_config_record_failure(status") == 7
          for operation in ("multicast_router", "multicast_querier",
                            "multicast_query_use_ifaddr", "multicast_snooping",
                            "multicast_to_unicast", "phy_igmp_static_port",
                            "phy_igmp_snooping"):
              assert operation in bridge_policy_body
          assert "operation_status = config_bridge(is_ap_mode);" in start_lan
          assert "rc_first_service_start_status(start_status, operation_status)" in start_lan
          assert "operation_status = config_bridge(is_ap_mode);" in iptv
          assert "return rc_first_service_start_status(start_status, operation_status);" in iptv
          assert "return rc_first_service_start_status(start_status, stop_status);" in iptv
          assert "test_first_failure_is_returned_after_all_operations" in bridge_regression

          init_bridge = body(lan, "init_bridge(int is_ap_mode)")
          switch_vlan = body(lan, "switch_config_vlan(int first_call)")
          switch_vlan_restart = body(lan, "restart_switch_config_vlan(void)")
          bridge_create = body(lan, "init_bridge_add_bridge(const char *bridge_ifname)")
          assert ("int" + chr(10) + "init_bridge(int is_ap_mode)") in lan
          assert "int init_bridge(int is_ap_mode);" in header
          assert "operation_status = switch_config_vlan(1);" in init_bridge
          assert 'rc_bridge_init_record(&bridge_status, "switch VLAN setup", operation_status);' in init_bridge
          for operation in ("set MAC interface address", "bring up MAC interface",

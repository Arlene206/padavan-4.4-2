                            "set LAN bridge STP", "set LAN bridge forward delay",
                            "set LAN bridge address", "bring up LAN bridge"):
              assert operation in init_bridge
          assert "return rc_bridge_init_result(&bridge_status);" in init_bridge
          assert 'rc_bridge_init_record(&bridge_status, "attach router LAN port", operation_status);' in init_bridge
          assert 'rc_bridge_init_record(&bridge_status, "attach AP LAN port", operation_status);' in init_bridge
          assert "operation_status = br_add_del_if(IFNAME_BR, IFNAME_LAN, 1);" in init_bridge
          assert "br_add_del_if(IFNAME_BR, IFNAME_LAN, 1);" not in init_bridge
          assert "br_add_del_bridge(bridge_ifname, 1)" in bridge_create

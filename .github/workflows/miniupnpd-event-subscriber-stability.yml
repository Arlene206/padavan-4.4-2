name: miniupnpd event subscription resource stability regression

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/miniupnpd-event-subscriber-stability.yml"
      - "trunk/user/miniupnpd/miniupnpd-2.x/upnpevents.c"
      - "trunk/user/miniupnpd/miniupnpd-2.x/upnphttp.c"
      - "trunk/user/miniupnpd/miniupnpd-2.x/miniupnpd_event_subscription_policy.h"
      - "trunk/user/miniupnpd/miniupnpd-2.x/miniupnpd_event_timeout_policy.h"
      - "trunk/user/miniupnpd/miniupnpd-2.x/tests/miniupnpd_event_subscription_policy_test.c"
      - "trunk/user/miniupnpd/miniupnpd-2.x/Makefile.linux"
      - "trunk/user/miniupnpd/miniupnpd-2.x/Makefile.linux_nft"
      - "scripts/check_miniupnpd_event_subscription.py"
  pull_request:
    paths:
      - ".github/workflows/miniupnpd-event-subscriber-stability.yml"
      - "trunk/user/miniupnpd/miniupnpd-2.x/upnpevents.c"
      - "trunk/user/miniupnpd/miniupnpd-2.x/upnphttp.c"
      - "trunk/user/miniupnpd/miniupnpd-2.x/miniupnpd_event_subscription_policy.h"
      - "trunk/user/miniupnpd/miniupnpd-2.x/miniupnpd_event_timeout_policy.h"
      - "trunk/user/miniupnpd/miniupnpd-2.x/tests/miniupnpd_event_subscription_policy_test.c"
      - "trunk/user/miniupnpd/miniupnpd-2.x/Makefile.linux"
      - "trunk/user/miniupnpd/miniupnpd-2.x/Makefile.linux_nft"
      - "scripts/check_miniupnpd_event_subscription.py"

permissions:
  contents: read

jobs:
  miniupnpd-event-subscriber:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run GNU89 subscriber-capacity and timeout policy regressions
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Itrunk/user/miniupnpd/miniupnpd-2.x \
            trunk/user/miniupnpd/miniupnpd-2.x/tests/miniupnpd_event_subscription_policy_test.c \
            -o /tmp/miniupnpd_event_subscription_policy_test
          ASAN_OPTIONS=detect_leaks=1 /tmp/miniupnpd_event_subscription_policy_test
      - name: Verify production subscriber allocation and HTTP failure behavior
        run: python3 scripts/check_miniupnpd_event_subscription.py

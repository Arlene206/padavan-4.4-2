name: PID 1 notification queue stability regression

on:
  push:
    paths:
      - ".github/workflows/rc-notification-queue-stability.yml"
      - "trunk/user/rc/src/rc.c"
      - "trunk/user/rc/src/rc.h"
      - "trunk/user/rc/src/optional_daemon_policy.h"
      - "trunk/user/rc/src/tests/optional_daemon_policy.c"
      - "trunk/user/rc/src/services.c"
      - "trunk/user/rc/src/sshd_daemon_policy.h"
      - "trunk/user/rc/src/tests/sshd_daemon_policy.c"
      - "trunk/user/rc/src/rc_notify_batch_policy.h"
      - "trunk/user/rc/src/tests/rc_notify_batch_policy.c"
      - "trunk/user/rc/src/init.c"
      - "trunk/user/rc/src/pid1_signal_policy.h"
      - "trunk/user/shared/src/notify_rc.c"
      - "trunk/user/shared/src/rc_notify_queue.h"
      - "trunk/user/shared/src/tests/rc_notify_queue.c"
      - "trunk/user/shared/src/notify_rc.h"
      - "trunk/user/shared/src/tests/notify_rc_status.c"
  pull_request:
    paths:
      - ".github/workflows/rc-notification-queue-stability.yml"
      - "trunk/user/rc/src/rc.c"
      - "trunk/user/rc/src/rc.h"
      - "trunk/user/rc/src/optional_daemon_policy.h"
      - "trunk/user/rc/src/tests/optional_daemon_policy.c"
      - "trunk/user/rc/src/services.c"
      - "trunk/user/rc/src/sshd_daemon_policy.h"
      - "trunk/user/rc/src/tests/sshd_daemon_policy.c"
      - "trunk/user/rc/src/rc_notify_batch_policy.h"
      - "trunk/user/rc/src/tests/rc_notify_batch_policy.c"
      - "trunk/user/rc/src/init.c"
      - "trunk/user/rc/src/pid1_signal_policy.h"
      - "trunk/user/shared/src/notify_rc.c"
      - "trunk/user/shared/src/rc_notify_queue.h"
      - "trunk/user/shared/src/tests/rc_notify_queue.c"
      - "trunk/user/shared/src/notify_rc.h"
      - "trunk/user/shared/src/tests/notify_rc_status.c"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rc-notification-queue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run bounded notification batch policy
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror \
            -I trunk/user/rc/src \
            trunk/user/rc/src/tests/rc_notify_batch_policy.c \
            -o /tmp/rc-notify-batch-policy
          /tmp/rc-notify-batch-policy
      - name: Compile and run notification marker trust-boundary regression
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror \
            -I trunk/user/shared/src \
            trunk/user/shared/src/tests/rc_notify_queue.c \
            -o /tmp/rc-notify-queue
          /tmp/rc-notify-queue
      - name: Compile and run notification enqueue status regression
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror \
            -I trunk/user/shared/src \
            trunk/user/shared/src/tests/notify_rc_status.c \
            -o /tmp/notify-rc-status
          /tmp/notify-rc-status
      - name: Compile and run optional daemon tri-state stop postcondition regression
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer \
            -I trunk/user/rc/src -I trunk/user/shared/src \
            trunk/user/rc/src/tests/optional_daemon_policy.c \
            -o /tmp/optional-daemon-policy
          ASAN_OPTIONS=detect_leaks=1 /tmp/optional-daemon-policy
      - name: Compile and run GNU89 SSH daemon restart policy regression
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer \
            -I trunk/user/rc/src -I trunk/user/shared/src \
            trunk/user/rc/src/tests/sshd_daemon_policy.c \
            -o /tmp/sshd-daemon-policy
          ASAN_OPTIONS=detect_leaks=1 /tmp/sshd-daemon-policy
      - name: Verify PID 1 batch fairness, signal wakeup and workflow paths
        run: |
          python3 - <<'PY'
          from pathlib import Path

          ROOT = Path(".")

          rc = Path("trunk/user/rc/src/rc.c").read_text()
          services = Path("trunk/user/rc/src/services.c").read_text()
          rc_header = Path("trunk/user/rc/src/rc.h").read_text()
          sshd_policy = Path("trunk/user/rc/src/sshd_daemon_policy.h").read_text()
          sshd_test = Path("trunk/user/rc/src/tests/sshd_daemon_policy.c").read_text()
          policy = Path("trunk/user/rc/src/rc_notify_batch_policy.h").read_text()
          test = Path("trunk/user/rc/src/tests/rc_notify_batch_policy.c").read_text()
          init = Path("trunk/user/rc/src/init.c").read_text()
          notify = Path("trunk/user/shared/src/notify_rc.c").read_text()
          queue = Path("trunk/user/shared/src/rc_notify_queue.h").read_text()
          notify_header = Path("trunk/user/shared/src/notify_rc.h").read_text()
          notify_status_test = Path("trunk/user/shared/src/tests/notify_rc_status.c").read_text()
          workflow = Path(".github/workflows/rc-notification-queue-stability.yml").read_text()

          def function_body(source, signature):
              start = source.index(signature)
              brace = source.index("{", start)
              depth = 0
              for pos in range(brace, len(source)):
                  if source[pos] == "{":
                      depth += 1
                  elif source[pos] == "}":
                      depth -= 1
                      if depth == 0:
                          return source[brace + 1:pos]
              raise AssertionError("unterminated function: " + signature)

          handler = function_body(rc, "handle_notifications(void)")
          assert '#include "rc_notify_batch_policy.h"' in rc
          assert "#define RC_NOTIFY_BATCH_LIMIT 10" in policy
          assert "for (i = 0; i < RC_NOTIFY_BATCH_LIMIT; i++)" in handler
          assert "pending_entry = readdir(directory)" in handler
          assert "rc_notify_queue_marker_is_safe_at(queue_fd, pending_entry->d_name, 0) == 0" in handler
          assert "rc_notify_batch_should_requeue(i, queue_pending, stop_handle)" in handler
          assert "kill(1, SIGUSR1)" in handler
          assert handler.index("rc_notify_batch_should_requeue") < handler.rindex("closedir(directory)")
          assert "return !stop_handle && queue_pending" in policy
          assert "rc_notify_merge_action_result" in policy
          assert "operation_status != 0" in policy
          assert "rc_notify_merge_action_result(0, EBUSY) == -1" in test
          assert "rc_notify_merge_action_result(0, 256) == -1" in test
          hddtune_event = function_body(handler, "else if (strcmp(entry->d_name, RCN_RESTART_HDDTUNE) == 0)")
          assert 'int hddtune_status = system("/sbin/hddtune.sh");' in hddtune_event
          assert "if (hddtune_status != 0)" in hddtune_event
          assert "action_result = rc_notify_merge_action_result(action_result," in hddtune_event
          assert "hddtune_status);" in hddtune_event
          assert hddtune_event.index("action_result = rc_notify_merge_action_result") < hddtune_event.index("set_pagecache_reclaim();")
          assert "rc_notify_merge_action_result(action_result, restart_dhcpd())" in handler
          sshd_presence = function_body(services, "sshd_process_presence(int *scan_error)")
          assert 'process_inventory_scan(process_name, &snapshot)' in sshd_presence
          assert "process_snapshot_release(&snapshot);" in sshd_presence
          assert "PROCESS_PRESENCE_RUNNING" in function_body(services, "is_sshd_run(void)")
          sshd_start = function_body(services, "start_sshd(void)")
          assert 'start_status = eval("/usr/bin/sshd.sh", "start", "-s");' in sshd_start
          assert 'start_status = eval("/usr/bin/sshd.sh", "start");' in sshd_start
          assert "if (start_status != 0)" in sshd_start
          assert "PROCESS_PRESENCE_START_INITIAL_WAIT_SECONDS" in sshd_start
          assert "sshd_start_postcondition(start_status, state) == 0" in sshd_start
          assert "return sshd_start_postcondition(start_status, PROCESS_PRESENCE_ABSENT);" in sshd_start
          sshd_stop = function_body(services, "stop_sshd(void)")
          assert "sshd_process_name_for_binaries" in sshd_presence
          assert "sshd_process_name_for_binaries" in sshd_stop
          assert "kill_services(service_names, 3, 1)" in sshd_stop
          assert 'eval("/usr/bin/sshd.sh", "stop")' not in sshd_stop
          sshd_restart = function_body(services, "restart_sshd(void)")
          assert "sshd_restart_can_start(stop_status, stopped_state)" in sshd_restart
          assert "PROCESS_PRESENCE_UNKNOWN" in sshd_restart
          assert "sshd_firewall_refresh_required(before_state, after_state)" in sshd_restart
          assert "return start_status;" in sshd_restart
          assert "PROCESS_PRESENCE_UNKNOWN" in sshd_policy
          assert "test_unknown" not in sshd_test or "PROCESS_PRESENCE_UNKNOWN" in sshd_test
          for name in ("restart_sshd", "restart_rstats", "restart_lltd"):
              restart_body = function_body(services, "int " + name + "(void)") if name == "restart_sshd" else function_body(services, "int\n" + name + "(void)")
              assert "return stop_status;" in restart_body if name == "restart_sshd" else "stop_status" in restart_body
          assert "rc_notify_merge_action_result(action_result, restart_sshd())" in handler
          assert "rc_notify_merge_action_result(action_result, restart_lltd())" in handler
          services = open("trunk/user/rc/src/services.c").read()
          optional_policy = (ROOT / "trunk/user/rc/src/optional_daemon_policy.h").read_text()
          optional_test = (ROOT / "trunk/user/rc/src/tests/optional_daemon_policy.c").read_text()
          app_restarts = (
              "restart_scutclient", "restart_mentohust", "restart_ttyd",
              "restart_ss", "restart_ss_tunnel", "restart_vlmcsd",
              "restart_iperf3", "restart_adguardhome", "restart_ddnsto",
              "restart_sqm", "restart_aldriver", "restart_wireguard",
              "restart_adbyby", "restart_smartdns", "restart_aliddns",
              "restart_frp", "restart_zerotier", "restart_httpd",
          )
          for name in app_restarts:
              assert "action_result = rc_notify_merge_action_result(action_result, " + name + "())" in handler, name
          # Restart APIs must preserve launcher failures from their start phase.
          # The start entry point also serves boot startup, so disabled daemons are
          # successful no-ops rather than failed starts.
          services_once = function_body(services, "start_services_once(int is_ap_mode)")
          assert "int ttyd_start_status = start_ttyd();" in services_once
          assert "if (ttyd_start_status != 0)" in services_once
          assert '"ttyd boot startup failed (status=%d)"' in services_once
          for name, launcher in (
              ("ttyd", 'eval("/usr/bin/ttyd.sh", "start")'),
              ("ss", 'eval("/usr/bin/shadowsocks.sh","start")'),
              ("ss_tunnel", 'eval("/usr/bin/ss-tunnel.sh","start")'),
              ("zerotier", 'eval("/usr/bin/zerotier.sh","start")'),
              ("sqm", 'eval("/usr/lib/sqm/run.sh")'),
              ("aldriver", 'eval("/usr/bin/aliyundrive-webdav.sh","start")'),
              ("wireguard", 'eval("/usr/bin/wireguard.sh","start")'),
              ("smartdns", 'eval("/usr/bin/smartdns.sh","start")'),
          ):
              # Match the function name independently of return-type formatting.
              start_body = function_body(services, "start_" + name + "(void)")
              restart_body = function_body(services, "restart_" + name + "(void)")
              assert " != 1)" in start_body
              assert "return 0;" in start_body
              if name == "ttyd":
                  # ttyd logs the launcher failure before returning its captured status.
                  assert "start_status = " + launcher + ";" in start_body
                  assert "return start_status;" in start_body
              else:
                  assert "return " + launcher + ";" in start_body
              assert "return start_" + name + "();" in restart_body
              assert "start_" + name + "();" not in restart_body.replace("return start_" + name + "();", "")
              assert "int start_" + name + "(void);" in rc_header
          for daemon, process in (
              ("scutclient", "bin_scutclient"),
              ("mentohust", "bin_mentohust"),
              ("vlmcsd", "vlmcsd"),
              ("iperf3", "iperf3"),
          ):
              assert 'optional_daemon_presence("' + process + '", NULL)' in services
              assert 'optional_daemon_stop_status("' + daemon + '", "' + process + '"' in services
              assert "return start_" + daemon + "();" in services
              assert "int start_" + daemon + "(void);" in rc_header
          assert "optional_daemon_stop_complete(command_status, presence)" in services
          assert "optional_daemon_start_allowed(presence)" in services
          for daemon, process in (
              ("scutclient", "bin_scutclient"),
              ("mentohust", "bin_mentohust"),
              ("vlmcsd", "vlmcsd"),
              ("iperf3", "iperf3"),
          ):
              start_body = function_body(services, "int start_" + daemon + "(void)")
              assert 'optional_daemon_start_status("' + daemon + '", "' + process + '")' in start_body
              assert "return start_status;" in start_body

          assert "PROCESS_PRESENCE_ABSENT" in optional_policy
          assert "PROCESS_PRESENCE_UNKNOWN" in optional_test

          for name in ("stop_scutclient", "stop_mentohust"):
              assert "action_result = rc_notify_merge_action_result(action_result, " + name + "())" in handler, name
          assert "int stop_status = stop_telnetd();" in handler
          assert "rc_notify_merge_action_result(action_result, stop_status)" in handler
          run_telnetd = function_body(services, "run_telnetd(void)")
          assert "int stop_status = stop_telnetd();" in run_telnetd
          assert "if (stop_status != 0)" in run_telnetd
          assert "return stop_status;" in run_telnetd
          assert "return start_telnetd();" in run_telnetd
          start_telnetd = function_body(services, "start_telnetd(void)")
          assert 'start_status = eval("telnetd");' in start_telnetd
          assert "if (start_status != 0)" in start_telnetd
          assert "return start_status;" in start_telnetd
          telnet_stop = function_body(services, "stop_telnetd(void)")
          assert 'optional_daemon_stop_status("telnetd", "telnetd"' in telnet_stop
          telnet_start = function_body(services, "start_telnetd(void)")
          assert 'optional_daemon_start_status("telnetd", "telnetd")' in telnet_start
          assert "return start_status;" in telnet_start
          telnet_event = function_body(handler, "else if (strcmp(entry->d_name, RCN_RESTART_TELNETD) == 0)")
          assert "if (stop_status == 0)" in telnet_event
          assert "rc_notify_merge_action_result(action_result, start_telnetd())" in telnet_event
          assert "ret = run_telnetd();" in rc
          assert "int run_telnetd(void);" in rc_header
          assert "int start_telnetd(void);" in rc_header
          httpd_restart = function_body(services, "int\nrestart_httpd(void)")
          assert 'httpd_lifecycle_lock_acquire_status("restart", &lock_fd)' in httpd_restart
          assert "stop_status = stop_httpd_locked();" in httpd_restart
          assert "httpd_restart_can_start(stop_status)" in httpd_restart
          assert "status = start_httpd_locked(1);" in httpd_restart
          assert 'httpd_lifecycle_lock_finish(lock_fd, status, "restart")' in httpd_restart
          assert "stop_httpd();" not in httpd_restart
          assert "start_httpd(1);" not in httpd_restart
          stop_whole_wan = function_body(handler, 'else if (!strcmp(entry->d_name, "stop_whole_wan"))')
          assert "rc_notify_merge_action_result(action_result, stop_wan())" in stop_whole_wan
          modem = function_body(handler, 'else if (!strcmp(entry->d_name, RCN_RESTART_MODEM))')
          assert "wan_stop_status = stop_wan()" in modem
          assert "action_result = rc_notify_merge_action_result(" in modem
          assert "stop_failed = 1" in modem
          assert modem.index("if (!stop_failed)") < modem.index("reload_modem_modules(")
          assert modem.index("if (!stop_failed)") < modem.index("unload_modem_modules()")
          assert "if (!stop_failed && need_restart_wan)" in modem
          assert "nvram_modem_rule = modem_rule;" in modem
          assert "if (!stop_failed && nvram_modem_type != modem_type)" in modem
          assert "assert(rc_notify_batch_should_requeue(10, 1, 0))" in test
          assert "assert(!rc_notify_batch_should_requeue(10, 1, 1))" in test
          assert "kill(1, SIGUSR1)" in notify
          assert "int notify_rc_status(const char *event_name)" in notify
          assert "return notify_rc_internal(event_name, 0);" in notify
          assert "static int" in notify and "notify_rc_internal(" in notify
          assert "RC_NOTIFY_OWNER ((uid_t)0)" in notify
          assert "rc_notify_queue_touch_at(notify_dir_fd, event_name, owner)" in notify
          assert "extern int notify_rc_status(const char *event_name);" in notify_header
          assert "test_queue_failure_is_reported" in notify_status_test
          assert "test_signal_failure_keeps_queued_status_successful" in notify_status_test
          assert "O_NOFOLLOW" in queue and "st.st_nlink != 1" in queue
          main_loop = function_body(init, "init_main_loop(void)")
          assert "sigaddset(&wait_mask, SIGUSR1)" in main_loop
          assert "sigsuspend(&original_mask)" in main_loop

          paths = (
              ".github/workflows/rc-notification-queue-stability.yml",
              "trunk/user/rc/src/rc.c",
              "trunk/user/rc/src/rc.h",
              "trunk/user/rc/src/optional_daemon_policy.h",
              "trunk/user/rc/src/tests/optional_daemon_policy.c",
              "trunk/user/rc/src/services.c",
              "trunk/user/rc/src/sshd_daemon_policy.h",
              "trunk/user/rc/src/tests/sshd_daemon_policy.c",
              "trunk/user/rc/src/rc_notify_batch_policy.h",
              "trunk/user/rc/src/tests/rc_notify_batch_policy.c",
              "trunk/user/rc/src/init.c",
              "trunk/user/rc/src/pid1_signal_policy.h",
              "trunk/user/shared/src/notify_rc.c",
              "trunk/user/shared/src/rc_notify_queue.h",
              "trunk/user/shared/src/tests/rc_notify_queue.c",
              "trunk/user/shared/src/notify_rc.h",
              "trunk/user/shared/src/tests/notify_rc_status.c",
          )
          filters = workflow.split("jobs:", 1)[0]
          push_filters, pr_filters = filters.split("  pull_request:", 1)
          for path in paths:
              assert push_filters.count(path) == 1, path
              assert pr_filters.count(path) == 1, path
          print("PID 1 notification queue and service restart status contract: PASS")
          PY

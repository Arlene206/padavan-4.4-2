name: BusyBox procps stat parser stability regression

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/busybox-procps-stat-regression.yml"
      - "scripts/check_busybox_procps_stat.py"
      - "trunk/user/busybox/busybox-1.24.x/libbb/procps.c"
      - "trunk/user/busybox/busybox-1.24.x/libbb/procps_stat_policy.h"
      - "trunk/user/busybox/busybox-1.24.x/libbb/tests/procps_io_policy.c"
      - "trunk/user/busybox/busybox-1.24.x/libbb/procps_io_policy.h"
      - "trunk/user/busybox/busybox-1.24.x/libbb/tests/procps_stat_policy.c"
  pull_request:
    paths:
      - ".github/workflows/busybox-procps-stat-regression.yml"
      - "scripts/check_busybox_procps_stat.py"
      - "trunk/user/busybox/busybox-1.24.x/libbb/procps.c"
      - "trunk/user/busybox/busybox-1.24.x/libbb/procps_stat_policy.h"
      - "trunk/user/busybox/busybox-1.24.x/libbb/tests/procps_stat_policy.c"
      - "trunk/user/busybox/busybox-1.24.x/libbb/procps_io_policy.h"
      - "trunk/user/busybox/busybox-1.24.x/libbb/tests/procps_io_policy.c"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: busybox-procps-stat-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile bounded proc stat parser regression (GNU89, ASan, UBSan)
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Itrunk/user/busybox/busybox-1.24.x/libbb \
            trunk/user/busybox/busybox-1.24.x/libbb/tests/procps_stat_policy.c \
            -o "$RUNNER_TEMP/busybox-procps-stat-regression"
      - name: Exercise empty, malformed and parenthesized comm records
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
        run: "$RUNNER_TEMP/busybox-procps-stat-regression"
      - name: Compile bounded interrupted-read regression (GNU89, ASan, UBSan)
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Itrunk/user/busybox/busybox-1.24.x/libbb \
            trunk/user/busybox/busybox-1.24.x/libbb/tests/procps_io_policy.c \
            -o "$RUNNER_TEMP/busybox-procps-io-regression"
      - name: Exercise interrupted-read retry bound and error propagation
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
        run: "$RUNNER_TEMP/busybox-procps-io-regression"
      - name: Verify production scanner integration
        run: python3 scripts/check_busybox_procps_stat.py

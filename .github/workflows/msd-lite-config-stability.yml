name: MSD Lite config publication durability

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/msd-lite-config-stability.yml"
      - "trunk/user/rc/src/config_file_sync.h"
      - "trunk/user/rc/src/msd_lite_config_file.h"
      - "trunk/user/rc/src/tests/msd_lite_config_file.c"
  pull_request:
    paths:
      - ".github/workflows/msd-lite-config-stability.yml"
      - "trunk/user/rc/src/config_file_sync.h"
      - "trunk/user/rc/src/msd_lite_config_file.h"
      - "trunk/user/rc/src/tests/msd_lite_config_file.c"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  config-publication:
    runs-on: ubuntu-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Compile MSD Lite config regression
        run: |
          cc -std=gnu89 -Wall -Wextra -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -I trunk/user/rc/src \
            trunk/user/rc/src/tests/msd_lite_config_file.c \
            -o "$RUNNER_TEMP/msd-lite-config-file"

      - name: Run MSD Lite config regression
        run: "$RUNNER_TEMP/msd-lite-config-file"

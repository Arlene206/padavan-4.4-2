          assert "storage_fsck_fat_status_needs_verification" in policy
          assert "storage_fsck_fat_status_allows_mount" in policy
          assert "storage_chkntfs_status_allows_mount" in policy
          assert "storage_chkntfs_status_allows_mount 0" in fat_test

          python3 - <<'PY'
          from pathlib import Path

          init = Path("trunk/user/rc/src/init.c").read_text()
          policy = Path("trunk/user/rc/src/pid1_signal_policy.h").read_text()
          pid1_test = Path("trunk/user/rc/src/tests/pid1_signal_policy.c").read_text()
          workflow = Path(".github/workflows/httpd-security.yml").read_text()

          def body(source, signature):
              start = source.index(signature)
              brace = source.index("{", start)
              depth = 0
              for pos in range(brace, len(source)):
                  if source[pos] == "{":
                      depth += 1
                  elif source[pos] == "}":
                      depth -= 1
                      if depth == 0:
                          return source[brace + 1:pos]
              raise AssertionError("unterminated function: " + signature)

          def array_items(source, name):
              start = source.index("static const int " + name + "[]")
              end = source.index("};", start)
              return set(source[start:end].split("{", 1)[1].replace(",", " ").split())

          event = body(init, "catch_sig_event(int sig)")
          shutdown = body(init, "catch_sig_shutdown(int sig)")
          reap = body(init, "catch_sig_reap(int sig)")
          fatal = body(init, "handle_sig_fatal(int sig)")
          main_loop = body(init, "init_main_loop(void)")
          setup = body(init, "init_signals(void)")

          assert "pid1_signal_record_event(&signal_state, sig);" in event
          assert not any(token in event for token in ("printf(", "dprintf(", "strsignal(", "notify_shutdown", "shutdown_router("))
          assert "pid1_signal_record_shutdown(&signal_state, sig);" in shutdown
          assert not any(token in shutdown for token in ("printf(", "dprintf(", "strsignal(", "shutdown_router(", "system("))
          assert "pid1_signal_reap_available_children(&signal_state, waitpid);" in reap
          reaper_policy = body(policy, "pid1_signal_reap_available_children(")
          assert "wait_child(-1, NULL, WNOHANG)" in reaper_policy
          assert "int saved_errno = errno;" in reaper_policy
          assert "errno = saved_errno;" in reaper_policy
          assert "pid1_signal_record_child_reaped(" in reaper_policy
          assert "errno == EINTR" in reaper_policy
          assert "test_pid1_signal_reaper_preserves_errno" in pid1_test
          assert not any(token in reap for token in ("printf(", "dprintf(", "perror(", "fprintf("))

          assert array_items(init, "signals_fatal") == {
              "SIGILL", "SIGSEGV", "SIGABRT", "SIGFPE", "SIGBUS", "SIGSYS", "SIGTRAP"
          }
          assert array_items(init, "signals_shutdown") == {"SIGPIPE", "SIGPWR", "SIGQUIT", "SIGTERM"}
          assert "sa.sa_handler = catch_sig_shutdown;" in setup
          setup_compact = "".join(setup.split())
          for token in (
              "init_signal_install_status(first_status,signals_fatal[i],&sa)",
              "init_signal_install_status(first_status,signals_shutdown[i],&sa)",
              "init_signal_install_status(first_status,SIGCHLD,&sa)",
              "init_signal_install_status(first_status,signals_event[i],&sa)",
          ):
              assert token in setup_compact, "missing checked PID 1 signal install: " + token
          assert "pid1_signal_install_action(sigaction, signal_number, action)" in init
          assert "handle_sig_fatal((int)signal_state.shutdown_signal);" in main_loop
          assert "signal_state.shutdown_pending && !shutdown_handled" in main_loop
          signal_mask = body(policy, "pid1_signal_update_mask")
          signal_mask_control = body(init, "control_signal(int sig, int how)")
          signal_mask_setup = body(init, "init_signal_mask_update(int how,")
          main_loop_compact = "".join(main_loop.split())
          assert "init_signal_mask_update(how,&set,NULL," in "".join(signal_mask_control.split())
          assert "pid1_signal_update_mask(sigprocmask,how,set,old_set)" in "".join(signal_mask_setup.split())
          assert "errno = 0;" in signal_mask and "returnerrno>0?errno:EIO;" in "".join(signal_mask.split())
          reset_body = body(init, "/* Reset signal handlers installed by PID 1 and release inherited masks. */")
          reset_compact = "".join(reset_body.split())
          for token in ("signals_event[i]", "signals_shutdown[i]", "signals_fatal[i]"):
              assert token in reset_body, "reset_signals omits installed PID 1 group: " + token
          assert "pid1_signal_install_action(sigaction,signals_event[i],&sa)" in reset_compact
          assert "pid1_signal_install_action(sigaction,signals_shutdown[i],&sa)" in reset_compact
          assert "pid1_signal_install_action(sigaction,signals_fatal[i],&sa)" in reset_compact
          assert "pid1_signal_update_mask(sigprocmask,SIG_UNBLOCK,&set,NULL)" in reset_compact
          assert "if(sigemptyset(&sa.sa_mask)<0)" in reset_compact
          assert "if(sigfillset(&set)<0)" in reset_compact
          shell = body(init, "run_shell(int timeout, int nowait)")
          shell_compact = "".join(shell.split())
          assert "if(reset_status!=0)" in shell_compact and "_exit(126);" in shell_compact
          fatal = body(init, "handle_sig_fatal(int sig)")
          assert "reset_status = reset_signals();" in fatal
          assert "wait_mask_build_status" in main_loop
          assert "if(!wait_mask_ready)" in main_loop_compact
          assert "original_mask_ready?NULL:&original_mask" in main_loop_compact
          assert "init_signal_mask_update(SIG_SETMASK,&original_mask,NULL," in main_loop_compact
          assert "init_signal_mask_update(SIG_BLOCK,&wait_mask,NULL," in main_loop_compact
          assert "if(sigsuspend(&original_mask)<0&&errno!=EINTR)" in main_loop_compact
          assert "test_pid1_signal_mask_update_reports_failures" in pid1_test
          assert "shutdown_router(0);" in fatal and "reboot(RB_AUTOBOOT);" in fatal
          assert "static inline void" in policy
          assert "volatile sig_atomic_t shutdown_pending;" in policy
          assert "state->shutdown_pending" in policy

          triggers = (
              "trunk/user/rc/src/init.c",
              "trunk/user/rc/src/pid1_signal_policy.h",
              "trunk/user/rc/src/tests/pid1_signal_policy.c",
          )
          push = workflow.split("  pull_request:", 1)[0]
          pr = workflow.split("  pull_request:", 1)[1].split("  workflow_dispatch:", 1)[0]
          for path in triggers:
              assert '"' + path + '"' in push

          assert "Refusing to mount $dev_full after fsck.fat status" in fat_branch

          ntfs_start = automount.index('elif [ "$ID_FS_TYPE" == "ntfs" ]')
          ntfs_end = automount.index('elif [ "$ID_FS_TYPE" == "hfsplus"', ntfs_start)

          ext_branch = automount[ext_start:ext_end]
          assert ". /sbin/storage_fsck_status.sh" in ext_branch
          assert "e2fsck_status=$?" in ext_branch
          assert ext_branch.index("/sbin/e2fsck -p -v") < ext_branch.index("e2fsck_status=$?")
          assert ext_branch.index("e2fsck_status=$?") < ext_branch.index("storage_e2fsck_status_allows_mount")
          assert ext_branch.index("storage_e2fsck_status_allows_mount") < ext_branch.index('mount -t $ID_FS_TYPE')
          assert "0|1) return 0 ;;" in policy
          assert "*) return 1 ;;" in policy
          assert " 2 3 4 8 16 32 128 255 invalid" in ext_test

          fat_start = automount.index('if [ "$ID_FS_TYPE" == "msdos" -o "$ID_FS_TYPE" == "vfat" ]')
          fat_end = automount.index('elif [ "$ID_FS_TYPE" == "exfat" ]', fat_start)

          service_config = Path("trunk/user/rc/src/services_ex.c").read_text()
          share_test = Path("trunk/user/rc/src/tests/samba_share_policy.c").read_text()
          assert "samba_config_value_is_safe" in config_policy
          assert '#include "samba_config_value_policy.h"' in service_config
          header_start = service_config.index("write_smb_conf_header(FILE *fp)")
          workgroup_guard = service_config.index("samba_config_value_is_safe(p_workgroup)")
          workgroup_write = service_config.index('fprintf(fp, "workgroup = %s')
          hostname_guard = service_config.index("samba_config_value_is_safe(p_computer_name)")
          hostname_write = service_config.index('fprintf(fp, "netbios name = %s')
          assert header_start < workgroup_guard < workgroup_write
          assert header_start < hostname_guard < hostname_write
          assert "samba_acl_right_can_read(1)" in share_test
          assert "samba_acl_right_can_write(2)" in share_test
          assert "samba_acl_right_is_denied(2)" in share_test
          assert "samba_acl_right_is_denied(-1)" in share_test
          assert '#include "samba_share_policy.h"' in source
          assert '#include "ftp_share_policy.h"' in source
          assert '#include "samba_passdb_policy.h"' in source
          assert "samba_passdb_password_is_safe" in passdb_policy
          assert "len >= 128" in passdb_policy and "*p == 0x7f" in passdb_policy
          assert "samba_passdb_password_is_safe(overlong_password)" in passdb_test

          # Preserve supported UI modes; corrupted values must not fall
          # through to anonymous-enabled FTP mode.
          ftp_start = source.index("write_vsftpd_conf(void)")
          ftp_end = source.index(chr(10) + "static int" + chr(10) + "ftp_wait_for_daemon", ftp_start)
          ftp_config = source[ftp_start:ftp_end]
          assert 'storage_read_integer_status(\n\t\t"st_ftp_mode", 0, &ftp_mode_value)' in ftp_config
          assert "ftp_share_mode_normalize(ftp_mode_value)" in ftp_config
          assert 'nvram_get_int("st_ftp_mode")' not in ftp_config
          assert 'fprintf(fp, "anonymous_enable=%s\\n", (i_ftp_mode == 2) ? "NO" : "YES");' in ftp_config
          assert 'fprintf(fp, "nopriv_user=%s\\n", "nobody");' in ftp_config
          assert 'fprintf(fp, "nopriv_user=%s\\n", "root");' not in ftp_config
          assert "case 1:" in ftp_policy and "case 4:" in ftp_policy
          assert "return 2;" in ftp_policy
          assert "ftp_share_mode_normalize(INT_MIN) == 2" in ftp_test
          assert "ftp_share_mode_normalize(INT_MAX) == 2" in ftp_test

          # The selected non-root account exists in the firmware passwd
          # database and is locked out of interactive login.
          assert 'SYS_USER_NOBODY, 99, 99, "/media", "/bin/false"' in accounts_compact
          assert 'SYS_USER_NOBODY, "*", 16000' in accounts_compact

          # Partition share output must follow path, section-name and comment guards.
          partition = source[source.index("if (i_smb_mode == 1) {"):
                             source.index("} else if (i_smb_mode == 3) {")]
          assert partition.index("samba_share_name_is_safe(mount_folder)") < partition.index('fprintf(fp, "[%s]\\n", mount_folder)')
          assert partition.index("samba_mount_path_is_safe(follow_partition->mount_point)") < partition.index('fprintf(fp, "path = %s\\n", follow_partition->mount_point)')
          assert partition.index("samba_conf_text_is_safe(disk_tag)") < partition.index('fprintf(fp, "comment = %s')

          # Per-folder names/paths are checked before permission lookup and config output.
          folder_writer_start = source.index("write_smb_conf_unlocked(const char *router_username,")
          folder_writer_end = source.index("static void" + chr(10) + "clean_smbd_trash", folder_writer_start)
          folder_writer = source[folder_writer_start:folder_writer_end]
          folder_start = folder_writer.index("// 2. start to get every share")
          folder_end = folder_writer.rindex("free_2_dimension_list(&sh_num, &folder_list);")
          folder_block = folder_writer[folder_start:folder_end]
          assert folder_block.index("samba_share_name_is_safe(folder_list[n])") < folder_block.index('fprintf(fp, "[%s]\\n", share)')
          assert folder_block.index("samba_mount_path_is_safe(follow_partition->mount_point)") < folder_block.index('fprintf(fp, "path = %s/%s\\n"')
          # One validation occurs in the new per-share ACL snapshot loop.
          assert folder_block.count("if (!samba_service_account_is_safe(account_list[i], safe_router_username))") == 5
          account_permission_read = 'get_permission(account_list[i], follow_partition->mount_point, folder_list[n], "cifs")'
          assert folder_block.count(account_permission_read) == 1
          assert 'account_rights[i] = get_permission(account_list[i], follow_partition->mount_point, folder_list[n], "cifs");' in folder_block
          assert folder_block.count("right = account_rights[i];") == 4
          invalid_users_start = folder_block.index('fprintf(fp, "invalid users = ");')
          read_list_start = folder_block.index('fprintf(fp, "read list = ");', invalid_users_start)
          invalid_users_block = folder_block[invalid_users_start:read_list_start]
          assert "samba_acl_right_is_denied(right)" in invalid_users_block
          assert "samba_acl_right_can_read(right)" not in invalid_users_block
          assert folder_block.count("samba_acl_right_is_denied(guest_right)") == 2

          # Anonymous SMB users must map to locked UID 99, never http_username (UID 0).
          guest_start = source.index("if (i_smb_mode == 1 || i_smb_mode == 3) {")
          guest_end = source.index("} else if (i_smb_mode == 4)", guest_start)
          guest_mode = source[guest_start:guest_end]
          assert '#define SAMBA_GUEST_ACCOUNT "nobody"' in samba_policy
          assert 'fprintf(fp, "guest account = %s\\n", SAMBA_GUEST_ACCOUNT);' in guest_mode
          assert "http_username" not in guest_mode
          assert 'SYS_USER_NOBODY, 99, 99, "/media", "/bin/false"' in accounts_compact
          assert 'SYS_USER_NOBODY, "*", 16000' in accounts_compact
          assert 'assert(strcmp(SAMBA_GUEST_ACCOUNT, "nobody") == 0);' in Path("trunk/user/rc/src/tests/samba_share_policy.c").read_text()

          run_start = source.index("int run_samba(void)")
          run_body = source[run_start:]
          run_body_compact = "".join(run_body.split())
          account_snapshot_begin = "nvram_transaction_begin(&account_snapshot)"
          account_snapshot_end = "nvram_transaction_end(&account_snapshot)"
          account_count_read = 'storage_read_transaction_integer_status(&account_snapshot,"acc_num",0,&account_count_value)'
          router_identity_read = 'storage_read_transaction_string_status(&account_snapshot,"http_username",router_username,sizeof(router_username))'
          user_identity_read = 'storage_read_transaction_string_status(&account_snapshot,tmpuser,account_usernames[i],sizeof(account_usernames[i]))'
          password_read = 'storage_read_transaction_string_status(&account_snapshot,tmp2,account_passwords[i],sizeof(account_passwords[i]))'
          assert account_snapshot_begin in run_body_compact
          assert account_snapshot_end in run_body_compact
          assert account_count_read in run_body_compact
          assert router_identity_read in run_body_compact
          assert user_identity_read in run_body_compact
          assert password_read in run_body_compact
          assert run_body_compact.index(account_snapshot_begin) < run_body_compact.index(account_count_read)
          assert run_body_compact.index(account_count_read) < run_body_compact.index(router_identity_read)
          assert run_body_compact.index(router_identity_read) < run_body_compact.index(user_identity_read)
          assert run_body_compact.index(user_identity_read) < run_body_compact.index(password_read)
          assert run_body_compact.index(password_read) < run_body_compact.index(account_snapshot_end)
          first_inventory = run_body_compact.index('process_inventory_scan("smbd",&smbd_snapshot)')
          assert run_body_compact.index(account_snapshot_end) < first_inventory
          assert 'storage_read_integer_status("acc_num",0,&account_count_value)' not in run_body_compact
          assert 'storage_read_string_status("http_username",router_username,sizeof(router_username))' not in run_body_compact
          assert "samba_passdb_snapshot_end_status" in passdb_policy
          assert "samba_passdb_password_is_safe" in passdb_policy
          assert "samba_passdb_password_is_safe(account_passwords[i])" in run_body
          assert "nvram_safe_get(tmpuser)" not in run_body
          assert "nvram_safe_get(tmp2)" not in run_body
          assert "_eval(smb_args" not in run_body
          assert 'execl("/bin/smbpasswd", "smbpasswd", "-s", "-f"' in source
          assert 'execl("/bin/smbpasswd", "smbpasswd", "-s"' in source
          assert "WIFEXITED(status)" in source and "WEXITSTATUS(status) != 0" in source
          # The descriptor-based parent guard replaces the old path-based
          # lstat/chmod helper and must run before transaction recovery.
          parent_guard = run_body.index("samba_config_transaction_prepare_parent_directory(")
          assert parent_guard < run_body.index("samba_config_transaction_recover(")
          assert "write_smb_conf_unlocked(router_username, account_list_snapshot, sh_num) != 0" in run_body
          assert "samba_prepare_private_passdb(staged_passdb" in run_body
          assert 'rename(staged_passdb, SAMBA_CONFIG_TRANSACTION_PASSDB)' in run_body
          assert "fchmod(input_fd, 0600)" in source
          handoff_start = source.index("samba_run_smbpasswd(")
          handoff_open = source.index("{", handoff_start)
          handoff_depth = 0
          handoff_end = None
          for position in range(handoff_open, len(source)):
              if source[position] == "{":
                  handoff_depth += 1
              elif source[position] == "}":
                  handoff_depth -= 1
                  if handoff_depth == 0:
                      handoff_end = position + 1
                      break
          assert handoff_end is not None
          handoff = source[handoff_start:handoff_end]
          assert handoff.index("unlink(input_path)") < handoff.index("child = fork();")
          assert "if (input_fd != STDIN_FILENO)" in handoff
          assert "read_password_line" in passdb_patch
          assert "strcmp(password, confirmation) != 0" in passdb_patch
          assert "fchmod(fileno(fp), 0600)" in passdb_patch
          assert "md4hash(password, nt_p16)" in passdb_patch
          assert "strdup(password)" not in passdb_patch
          assert "pw = argv[2]" not in passdb_patch
          assert 'doSystem("rm -f %s", "/etc/samba/*")' not in run_body

          # A failed disk/account discovery, append open, or stream close must
          # abort configuration generation instead of returning false success.
          writer_start = source.index("write_smb_conf_unlocked(const char *router_username,")
          writer_end = source.index("static void" + chr(10) + "clean_smbd_trash", writer_start)
          writer = source[writer_start:writer_end]
          writer_compact = "".join(writer.split())
          inventory_read = "read_disk_data_checked(&disks_info)"
          assert inventory_read in writer_compact
          assert "disks_info=read_disk_data();" not in writer_compact
          assert "if(!disks_info)" not in writer_compact
          assert writer_compact.index(inventory_read) < writer_compact.index("for(follow_disk=disks_info;")
          assert "saved_errno=errno?errno:EIO;" in writer_compact
          assert "errno=saved_errno;return-1;" in writer_compact
          assert "if (get_account_list(&acc_num, &account_list) < 0)" in writer
          assert "samba_config_file_open(SAMBA_CONF" in writer
          assert "write_smb_conf_header(fp)" in writer
          assert 'fp = fopen(staged_path, "a");' in writer
          assert "check_existed_share(share, staged_path)" in writer
          assert "samba_config_file_publish(&fp, staged_path, SAMBA_CONF)" in writer
          assert 'fopen(SAMBA_CONF, "a")' not in writer
          assert "if (fclose(fp) != 0)" in writer
          assert "result = -1;" in writer and writer.count("result = -1;") >= 4
          assert writer.index("if (result != 0)") < writer.index("samba_config_file_discard(&fp, staged_path)")
          assert writer.index("samba_config_file_discard(&fp, staged_path)") < writer.index("samba_config_file_publish(&fp, staged_path, SAMBA_CONF)")
          assert "return -1;" in writer
          assert "samba_acl_right_can_read(guest_right)" in writer
          assert "samba_acl_right_can_write(guest_right)" in writer
          assert "samba_acl_right_can_read(right)" in writer
          assert "samba_acl_right_can_write(right)" in writer
          assert "guest_right >= " not in writer and "right < " not in writer
          assert "samba_config_value_is_safe(p_workgroup)" in service_config
          assert "samba_config_value_is_safe(p_computer_name)" in service_config

          # The FTP banner is emitted only after rejecting line controls/escapes.
          banner_guard = source.index("if (!samba_conf_text_is_safe(banner_product)")
          banner_write = source.index('fprintf(fp, "ftpd_banner=Welcome to %s FTP service.')
          assert banner_guard < banner_write
          print("Samba share/ACL and FTP configuration trust-boundary contracts: OK")
          PY


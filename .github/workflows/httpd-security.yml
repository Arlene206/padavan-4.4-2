          policy = Path("trunk/user/rc/src/storage_nfs_export_policy.h").read_text()
          regression = Path("trunk/user/rc/src/tests/storage_nfs_export_policy.c").read_text()
          workflow = Path(".github/workflows/httpd-security.yml").read_text()

          def body(source, signature):
              start = source.index(signature)
              brace = source.index("{", start)
              depth = 0
              for pos in range(brace, len(source)):
                  if source[pos] == "{":
                      depth += 1
                  elif source[pos] == "}":
                      depth -= 1
                      if depth == 0:
                          return source[brace + 1:pos]
              raise AssertionError("unterminated function: " + signature)

          writer = body(source, "write_nfsd_exports(void)")
          starter = body(source, "run_nfsd_locked(void)")
          start_impl = body(source, "run_nfsd_enabled_locked(int enabled)")
          enable_read = body(source, "nfsd_enabled_config_read(int *enabled)")
          public_starter = body(source, "run_nfsd(void)")
          reloader = body(source, "reload_nfsd_locked(void)")
          reload_impl = body(source, "reload_nfsd_enabled_locked(int enabled)")
          public_reloader = body(source, "reload_nfsd(void)")
          assert "storage_operation_lock_acquire(file_lock)" in public_starter
          assert public_starter.index("storage_operation_lock_acquire") < public_starter.index("run_nfsd_locked()")
          assert "file_unlock(storage_lock)" in public_starter
          assert "storage_operation_lock_acquire(file_lock)" in public_reloader
          assert public_reloader.index("storage_operation_lock_acquire") < public_reloader.index("reload_nfsd_locked()")
          assert "file_unlock(storage_lock)" in public_reloader
          assert "storage_nfs_export_parse_mount_line" in writer
          assert "storage_nfs_export_may_publish" in writer
          assert "storage_nfs_export_field_is_decimal" in policy
          assert "storage_nfs_export_next_token(&cursor, dump_frequency" in policy
          assert "storage_nfs_export_next_token(&cursor, fsck_order" in policy
          assert "storage_nfs_export_next_token(&cursor, trailing" in policy
          assert 'ext4 rw 0\\n' in regression
          assert 'ext4 rw invalid 0\\n' in regression
          assert 'ext4 rw 0 0 extra\\n' in regression
          assert "ferror(procpt)" in writer and "fclose(procpt)" in writer
          assert "mkstemp(staged_path)" in writer
          assert "rename(staged_path, exports_file)" in writer
          assert "unlink(exports_file)" not in writer
          assert "storage_nfs_export_may_start" in policy
          assert 'nvram_get_checked("nfsd_enable", &value)' in enable_read
          assert "storage_nfs_enabled_status(api_result, saved_errno" in enable_read
          for wrapper, implementation, action in (
              (starter, start_impl, '"start"'),
              (reloader, reload_impl, '"reload"'),
          ):
              assert "nfsd_enabled_config_read(&enabled)" in wrapper
              assert wrapper.index("nfsd_enabled_config_read(&enabled)") < wrapper.index("if (config_status != 0)")
              assert "return -1;" in wrapper
              assert "write_nfsd_exports()" not in wrapper
              assert "storage_nfs_export_may_start" not in wrapper
              assert "if (!enabled)" in implementation
              assert "write_nfsd_exports()" in implementation
              assert "storage_nfs_export_may_start" in implementation
              assert implementation.index("storage_nfs_export_may_start") < implementation.index("eval(")
              assert action in implementation
          assert 'nvram_invmatch("nfsd_enable", "1")' not in starter
          assert 'nvram_invmatch("nfsd_enable", "1")' not in reloader
          paths = (
              "trunk/user/rc/src/services_stor.c",
              "trunk/user/rc/src/storage_nfs_export_policy.h",
              "trunk/user/rc/src/tests/storage_nfs_export_policy.c",
          )
          push = workflow.split("  pull_request:", 1)[0]
          pr = workflow.split("  workflow_dispatch:", 1)[0].split("  pull_request:", 1)[1]
          for path in paths:
              assert push.count('"' + path + '"') == 1
              assert pr.count('"' + path + '"') == 1

          print("NFS export inventory atomic publication and start/reload failure gates: OK")
          PY

      - name: Verify NVRAM shared-userland transaction exclusion
        run: |
          set -eu
          cc -D_GNU_SOURCE -std=gnu89 -Wall -Wextra -Werror -g \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -I trunk/user/shared/src \
            trunk/user/shared/src/tests/nvram_transaction_lock.c \
            -o "$RUNNER_TEMP/nvram_transaction_lock"
          ASAN_OPTIONS=detect_leaks=1 "$RUNNER_TEMP/nvram_transaction_lock"
          python3 - <<'PY'
          from pathlib import Path

          shared = Path("trunk/user/shared/src/nvram_linux.c").read_text()
          api = Path("trunk/user/shared/src/nvram_linux.h").read_text()
          lock = Path("trunk/user/shared/src/nvram_transaction_lock.h").read_text()
          cli = Path("trunk/user/nvram/src/nvram.c").read_text()
          workflow = Path(".github/workflows/httpd-security.yml").read_text()

          def body(source, signature):
              start = source.index(signature)
              brace = source.index("{", start)
              depth = 0
              for pos in range(brace, len(source)):
                  if source[pos] == "{":
                      depth += 1
                  elif source[pos] == "}":
                      depth -= 1
                      if depth == 0:
                          return source[brace + 1:pos]
              raise AssertionError("unterminated function: " + signature)

          assert "flock(fd, operation | LOCK_NB)" in lock
          assert "lstat(\"/tmp\", &tmp_stat)" in lock
          assert "O_NOFOLLOW | O_CLOEXEC" in lock and "st.st_nlink != 1" in lock
          for signature in (
              "nvram_get_checked(const char *name, char **value)",
              "nvram_getall(char *buf, int count, int include_temp)",
              "nvram_set_guarded(const char *name, const char *value, int is_temp)",
              "nvram_commit(void)",
              "nvram_clear(void)",
          ):
              section = body(shared, signature)
              assert "nvram_api_lock_acquire" in section
              assert "nvram_api_lock_finish" in section
          assert "int\n_nvram_set(" in shared
          assert "struct nvram_transaction" in api and "nvram_transaction_begin" in api
          restore = body(cli, "nvram_restore(char *file)")
          assert restore.index("nvram_transaction_begin") < restore.index("nvram_transaction_getall")
          assert restore.index("nvram_transaction_getall") < restore.index("nvram_restore_transaction_run")
          assert "nvram_transaction_end" in restore
          assert "nvram_transaction_clear" in shared and "nvram_transaction_set" in shared
          for path in (
              "trunk/user/shared/src/nvram_transaction_lock.h",
              "trunk/user/shared/src/tests/nvram_transaction_lock.c",
          ):
              push = workflow.split("  pull_request:", 1)[0]
              pr = workflow.split("  pull_request:", 1)[1].split("  workflow_dispatch:", 1)[0]
              assert push.count('"' + path + '"') == 1
              assert pr.count('"' + path + '"') == 1

          print("NVRAM shared-userland API lock and profile-restore transaction source contracts: OK")
          PY


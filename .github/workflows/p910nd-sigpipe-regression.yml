name: p910nd bidirectional SIGPIPE resilience regression

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/p910nd-sigpipe-regression.yml"
      - "trunk/user/p910nd/p910nd.c"
      - "trunk/user/p910nd/p910nd_sigpipe_policy.h"
      - "trunk/user/p910nd/p910nd_io_policy.h"
      - "trunk/user/p910nd/Makefile"
      - "scripts/test_p910nd_sigpipe.c"
      - "scripts/test_p910nd_sigpipe.sh"
      - "scripts/check_p910nd_sigpipe.py"
  pull_request:
    paths:
      - ".github/workflows/p910nd-sigpipe-regression.yml"
      - "trunk/user/p910nd/p910nd.c"
      - "trunk/user/p910nd/p910nd_sigpipe_policy.h"
      - "trunk/user/p910nd/p910nd_io_policy.h"
      - "trunk/user/p910nd/Makefile"
      - "scripts/test_p910nd_sigpipe.c"
      - "scripts/test_p910nd_sigpipe.sh"
      - "scripts/check_p910nd_sigpipe.py"

permissions:
  contents: read

jobs:
  sigpipe:
    name: p910nd bidirectional SIGPIPE policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compile and run GNU89 ASan/UBSan socket regression and source contract
        run: sh scripts/test_p910nd_sigpipe.sh

name: HTTPD daemon lifecycle stability

on:
  push:
    paths:
      - "trunk/user/rc/src/services.c"
      - "trunk/user/rc/src/rc.h"
      - "trunk/user/rc/src/httpd_daemon_policy.h"
      - "trunk/user/rc/src/tests/httpd_daemon_policy.c"
      - ".github/workflows/httpd-daemon-lifecycle.yml"
  pull_request:
    paths:
      - "trunk/user/rc/src/services.c"
      - "trunk/user/rc/src/rc.h"
      - "trunk/user/rc/src/httpd_daemon_policy.h"
      - "trunk/user/rc/src/tests/httpd_daemon_policy.c"
      - ".github/workflows/httpd-daemon-lifecycle.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  httpd-daemon-lifecycle:
    name: HTTPD startup, stop and restart postconditions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compile and run daemon policy regression
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer \
            -I trunk/user/rc/src \
            trunk/user/rc/src/tests/httpd_daemon_policy.c \
            -o /tmp/httpd_daemon_policy
          ASAN_OPTIONS=detect_leaks=1 /tmp/httpd_daemon_policy

      - name: Verify HTTPD lifecycle integration and path filters
        run: |
          set -eu
          python3 - <<'PY'
          from pathlib import Path

          def body(source, signature):
              start = source.index(signature)
              brace = source.index("{", start)
              depth = 0
              for pos in range(brace, len(source)):
                  if source[pos] == "{":
                      depth += 1
                  elif source[pos] == "}":
                      depth -= 1
                      if depth == 0:
                          return source[brace + 1:pos]
              raise AssertionError("unterminated function: " + signature)

          services = Path("trunk/user/rc/src/services.c").read_text()
          header = Path("trunk/user/rc/src/rc.h").read_text()
          policy = Path("trunk/user/rc/src/httpd_daemon_policy.h").read_text()
          test = Path("trunk/user/rc/src/tests/httpd_daemon_policy.c").read_text()
          workflow = Path(".github/workflows/httpd-daemon-lifecycle.yml").read_text()

          start = body(services, "start_httpd(int restart_fw)")
          stop = body(services, "stop_httpd(void)")
          restart = body(services, "restart_httpd(void)")

          assert "httpd_start_can_launch(pids(\"httpd\"))" in start
          assert start.index("httpd_start_can_launch(pids(\"httpd\"))") < start.index("launch_status = _eval(httpd_argv, NULL, 0, NULL);")
          assert 'nvram_set_int_temp("httpd_started", 0)' in start
          assert start.index('nvram_set_int_temp("httpd_started", 0)') < start.index("launch_status = _eval(httpd_argv, NULL, 0, NULL);")
          assert "launch_status = _eval(httpd_argv, NULL, 0, NULL);" in start
          assert "return httpd_start_postcondition(launch_status, 0);" in start
          assert 'httpd_start_postcondition(launch_status, pids("httpd"))' in start
          assert "HTTPD_START_PROBE_ATTEMPTS" in start
          probe_loop = start.index("status = -1;")
          started_publish = start.index('nvram_set_int_temp("httpd_started", 1)', probe_loop)
          assert start.index('if (status == 0)', probe_loop) < started_publish
          assert started_publish < start.index("restart_firewall();", started_publish)
          assert "return status;" in start

          assert "kill_services(svcs, 3, 1)" in stop
          assert stop.index("kill_services(svcs, 3, 1)") < stop.index("httpd_stop_policy_publish_stopped")
          assert stop.index("httpd_stop_policy_publish_stopped") < stop.index('nvram_set_int_temp("httpd_started", 0)')
          assert "return stop_status;" in stop

          assert "stop_status = stop_httpd();" in restart
          assert restart.index("stop_status = stop_httpd();") < restart.index("httpd_restart_can_start(stop_status)")
          assert restart.index("httpd_restart_can_start(stop_status)") < restart.index("return start_httpd(1);")
          assert "return start_httpd(1);" in restart

          assert "int start_httpd(int restart_fw);" in header
          assert "int stop_httpd(void);" in header
          assert "int restart_httpd(void);" in header
          assert "HTTPD_START_PROBE_ATTEMPTS 4" in policy
          assert "httpd_start_can_launch" in policy
          assert "httpd_start_postcondition" in test
          assert "httpd_start_can_launch" in test
          assert "httpd_restart_can_start" in test

          push_marker = workflow.index("  pull_request:")
          dispatch_marker = workflow.index("  workflow_dispatch:",push_marker)
          push = workflow[:push_marker]
          pr = workflow[push_marker:dispatch_marker]
          triggers = (
              "trunk/user/rc/src/services.c",
              "trunk/user/rc/src/rc.h",
              "trunk/user/rc/src/httpd_daemon_policy.h",
              "trunk/user/rc/src/tests/httpd_daemon_policy.c",
              ".github/workflows/httpd-daemon-lifecycle.yml",
          )
          for path in triggers:
              assert '"' + path + '"' in push
              assert '"' + path + '"' in pr

          print("HTTPD daemon startup, state publication, stop-before-start and path-filter source contracts: PASS")
          PY

name: infosvr packet and signal lifecycle stability regression

on:
  push:
    paths:
      - ".github/workflows/infosvr-packet-stability.yml"
      - "SESSION_HANDOFF.md"
      - "scripts/check_infosvr_packets.py"
      - "trunk/user/infosvr/src/infosvr.c"
      - "trunk/user/infosvr/src/asus.c"
      - "trunk/user/infosvr/src/infosvr_packet_policy.h"
      - "trunk/user/infosvr/src/tests/infosvr_packet_policy.c"
      - "trunk/user/infosvr/src/infosvr_signal_policy.h"
      - "trunk/user/infosvr/src/tests/infosvr_signal_policy.c"
      - "trunk/user/shared/src/include/ibox.h"
  pull_request:
    paths:
      - ".github/workflows/infosvr-packet-stability.yml"
      - "SESSION_HANDOFF.md"
      - "scripts/check_infosvr_packets.py"
      - "trunk/user/infosvr/src/infosvr.c"
      - "trunk/user/infosvr/src/asus.c"
      - "trunk/user/infosvr/src/infosvr_packet_policy.h"
      - "trunk/user/infosvr/src/tests/infosvr_packet_policy.c"
      - "trunk/user/infosvr/src/infosvr_signal_policy.h"
      - "trunk/user/infosvr/src/tests/infosvr_signal_policy.c"
      - "trunk/user/shared/src/include/ibox.h"

permissions:
  contents: read

jobs:
  infosvr-packets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run GNU89 infosvr packet and signal policy regressions
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer \
            -I trunk/user/infosvr/src \
            trunk/user/infosvr/src/tests/infosvr_packet_policy.c \
            -o /tmp/infosvr-packet-policy
          ASAN_OPTIONS=detect_leaks=1 /tmp/infosvr-packet-policy
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer \
            -I trunk/user/infosvr/src \
            trunk/user/infosvr/src/tests/infosvr_signal_policy.c \
            -o /tmp/infosvr-signal-policy
          ASAN_OPTIONS=detect_leaks=1 /tmp/infosvr-signal-policy
      - name: Verify UDP receive, SIGTERM and request bounds contracts
        run: python3 scripts/check_infosvr_packets.py

name: infosvr packet and signal lifecycle stability regression

on:
  push:
    paths:
      - ".github/workflows/infosvr-packet-stability.yml"
      - "scripts/check_infosvr_packets.py"
      - "scripts/check_infosvr_lifecycle.py"
      - "trunk/user/rc/src/services.c"
      - "trunk/user/rc/src/service_wait_policy.h"
      - "trunk/user/rc/src/rc.c"
      - "trunk/user/rc/src/rc.h"
      - "trunk/user/rc/src/infosvr_daemon_policy.h"
      - "trunk/user/rc/src/tests/infosvr_daemon_policy.c"
      - "trunk/user/infosvr/src/infosvr.c"
      - "trunk/user/infosvr/src/asus.c"
      - "trunk/user/infosvr/src/infosvr_packet_policy.h"
      - "trunk/user/infosvr/src/tests/infosvr_packet_policy.c"
      - "trunk/user/infosvr/src/tests/infosvr_dispatch_test.c"
      - "trunk/user/infosvr/src/infosvr_signal_policy.h"
      - "trunk/user/infosvr/src/infosvr_interface_policy.h"
      - "trunk/user/infosvr/src/infosvr_pidfile_policy.h"
      - "trunk/user/infosvr/src/tests/infosvr_pidfile_policy.c"
      - "trunk/user/infosvr/src/tests/infosvr_interface_policy.c"
      - "trunk/user/infosvr/src/tests/infosvr_signal_policy.c"
      - "trunk/user/shared/src/include/ibox.h"
  pull_request:
    paths:
      - ".github/workflows/infosvr-packet-stability.yml"
      - "scripts/check_infosvr_packets.py"
      - "scripts/check_infosvr_lifecycle.py"
      - "trunk/user/rc/src/services.c"
      - "trunk/user/rc/src/service_wait_policy.h"
      - "trunk/user/rc/src/rc.c"
      - "trunk/user/rc/src/rc.h"
      - "trunk/user/rc/src/infosvr_daemon_policy.h"
      - "trunk/user/rc/src/tests/infosvr_daemon_policy.c"
      - "trunk/user/infosvr/src/infosvr.c"
      - "trunk/user/infosvr/src/asus.c"
      - "trunk/user/infosvr/src/infosvr_packet_policy.h"
      - "trunk/user/infosvr/src/tests/infosvr_packet_policy.c"
      - "trunk/user/infosvr/src/tests/infosvr_dispatch_test.c"
      - "trunk/user/infosvr/src/infosvr_signal_policy.h"
      - "trunk/user/infosvr/src/infosvr_interface_policy.h"
      - "trunk/user/infosvr/src/infosvr_pidfile_policy.h"
      - "trunk/user/infosvr/src/tests/infosvr_pidfile_policy.c"
      - "trunk/user/infosvr/src/tests/infosvr_interface_policy.c"
      - "trunk/user/infosvr/src/tests/infosvr_signal_policy.c"
      - "trunk/user/shared/src/include/ibox.h"

permissions:
  contents: read

concurrency:
  group: infosvr-packet-stability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  infosvr-packets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run GNU89 infosvr packet, signal and RC daemon lifecycle regressions
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer \
            -I trunk/user/infosvr/src \
            trunk/user/infosvr/src/tests/infosvr_packet_policy.c \
            -o /tmp/infosvr-packet-policy
          ASAN_OPTIONS=detect_leaks=1 /tmp/infosvr-packet-policy
          cc -std=gnu89 -Wall -Wextra -Werror -Wno-unused-parameter -fsanitize=address,undefined -fno-omit-frame-pointer \
            -I trunk/user/infosvr/src -I trunk/user/shared/src/include \
            trunk/user/infosvr/src/tests/infosvr_dispatch_test.c \
            -o /tmp/infosvr-dispatch-test
          ASAN_OPTIONS=detect_leaks=1 /tmp/infosvr-dispatch-test
          cc -D_GNU_SOURCE -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer \
            -I trunk/user/infosvr/src \
            trunk/user/infosvr/src/tests/infosvr_pidfile_policy.c \
            -o /tmp/infosvr-pidfile-policy
          ASAN_OPTIONS=detect_leaks=1 /tmp/infosvr-pidfile-policy
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer \
            -I trunk/user/infosvr/src \
            trunk/user/infosvr/src/tests/infosvr_signal_policy.c \
            -o /tmp/infosvr-signal-policy
          ASAN_OPTIONS=detect_leaks=1 /tmp/infosvr-signal-policy
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer \
            -I trunk/user/infosvr/src \
            trunk/user/infosvr/src/tests/infosvr_interface_policy.c \
            -o /tmp/infosvr-interface-policy
          ASAN_OPTIONS=detect_leaks=1 /tmp/infosvr-interface-policy
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer \
            -I trunk/user/rc/src -I trunk/user/shared/src \
            trunk/user/rc/src/tests/infosvr_daemon_policy.c \
            -o /tmp/infosvr-daemon-policy
          ASAN_OPTIONS=detect_leaks=1 /tmp/infosvr-daemon-policy
      - name: Verify UDP receive, SIGTERM and request bounds contracts
        run: python3 scripts/check_infosvr_packets.py

      - name: Verify RC infosvr stop-before-start and notification failure propagation
        run: python3 scripts/check_infosvr_lifecycle.py

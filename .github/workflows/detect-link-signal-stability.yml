name: detect_link signal lifecycle stability regression

on:
  push:
    paths:
      - ".github/workflows/detect-link-signal-stability.yml"
      - "trunk/user/rc/src/detect_link.c"
      - "trunk/user/rc/src/detect_link_signal_policy.h"
      - "trunk/user/rc/src/tests/detect_link_signal_policy.c"
      - "trunk/user/rc/src/rc.c"
      - "trunk/user/rc/src/rc.h"
      - "trunk/user/rc/src/net_wan.c"
      - "trunk/user/rc/src/net_lan.c"
      - "trunk/user/rc/src/services.c"
      - "trunk/user/rc/src/Makefile"
      - "trunk/user/rc/Makefile"
  pull_request:
    paths:
      - ".github/workflows/detect-link-signal-stability.yml"
      - "trunk/user/rc/src/detect_link.c"
      - "trunk/user/rc/src/detect_link_signal_policy.h"
      - "trunk/user/rc/src/tests/detect_link_signal_policy.c"
      - "trunk/user/rc/src/rc.c"
      - "trunk/user/rc/src/rc.h"
      - "trunk/user/rc/src/net_wan.c"
      - "trunk/user/rc/src/net_lan.c"
      - "trunk/user/rc/src/services.c"
      - "trunk/user/rc/src/Makefile"
      - "trunk/user/rc/Makefile"

permissions:
  contents: read

jobs:
  detect-link-signal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run GNU89 signal deferral policy regression
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -I trunk/user/rc/src \
            trunk/user/rc/src/tests/detect_link_signal_policy.c \
            -o /tmp/detect-link-signal-policy
          ASAN_OPTIONS=detect_leaks=1 /tmp/detect-link-signal-policy
      - name: Verify deferred dispatch, signal masks and caller wiring
        run: |
          python3 - <<'PY'
          from pathlib import Path

          rc = Path("trunk/user/rc/src")
          detect = (rc / "detect_link.c").read_text()
          policy = (rc / "detect_link_signal_policy.h").read_text()
          test = (rc / "tests/detect_link_signal_policy.c").read_text()
          dispatcher = (rc / "rc.c").read_text()
          header = (rc / "rc.h").read_text()
          wan = (rc / "net_wan.c").read_text()
          lan = (rc / "net_lan.c").read_text()
          services = (rc / "services.c").read_text()
          makefile = (rc / "Makefile").read_text()
          package_makefile = Path("trunk/user/rc/Makefile").read_text()
          workflow = Path(".github/workflows/detect-link-signal-stability.yml").read_text()

          def body(source, signature):
              start = source.index(signature)
              brace = source.index("{", start)
              depth = 0
              for pos in range(brace, len(source)):
                  if source[pos] == "{":
                      depth += 1
                  elif source[pos] == "}":
                      depth -= 1
                      if depth == 0:
                          return source[brace + 1:pos]
              raise AssertionError("unterminated function: " + signature)

          assert '#include "detect_link_signal_policy.h"' in detect
          handler = body(detect, "catch_sig_detect_link(int sig)")
          assert "detect_link_record_signal(&dl_pending_events, sig)" in handler
          for forbidden in ("dl_on_timer(", "dl_update_leds(", "dl_reset_state(",
                            "dl_alarmtimer(", "remove(", "exit(", "LED_CONTROL",
                            "nvram_", "notify_", "doSystem(", "phy_status_"):
              assert forbidden not in handler, "signal handler still performs work: " + forbidden

          main = body(detect, "detect_link_main(int argc, char *argv[])")
          assert main.index("sigprocmask(SIG_BLOCK, &managed_signals, &original_mask)") < main.index("sigaction(SIGHUP")
          assert "sa.sa_mask = managed_signals;" in main
          for signal_name in ("SIGHUP", "SIGUSR1", "SIGALRM", "SIGTERM"):
              assert f"sigaddset(&managed_signals, {signal_name})" in main
              assert f"sigaction({signal_name}, &sa, NULL)" in main
          assert "sigsuspend(&wait_mask)" in main
          assert "wait_mask = original_mask;" in main
          for signal_name in ("SIGALRM", "SIGHUP", "SIGUSR1", "SIGTERM"):
              assert f"sigdelset(&wait_mask, {signal_name})" in main

          snapshot = main.index("events = detect_link_take_pending_events(&dl_pending_events)")
          terminate = main.index("if (events & DL_PENDING_TERMINATE)", snapshot)
          reset = main.index("if (events & DL_PENDING_RESET)", terminate)
          timer = main.index("if (events & DL_PENDING_TIMER)", reset)
          led_refresh = main.index("if (events & DL_PENDING_LED_REFRESH)", timer)
          assert snapshot < terminate < reset < timer < led_refresh
          stop_body = main[terminate:reset]
          assert "dl_alarmtimer(0)" in stop_body and "remove(DL_PID_FILE)" in stop_body
          assert "return 0;" in stop_body

          assert "DL_PENDING_TIMER" in policy and "DL_PENDING_LED_REFRESH" in policy
          assert "DL_PENDING_RESET" in policy and "DL_PENDING_TERMINATE" in policy
          for marker in ("test_signals_are_recorded_without_dispatch",
                         "test_repeated_standard_signals_coalesce",
                         "test_termination_remains_pending_with_other_events",
                         "test_snapshot_is_cleared_for_next_wait"):
              assert marker in test

          reset_notify = body(detect, "notify_reset_detect_link(void)")
          led_notify = body(detect, "notify_leds_detect_link(void)")
          stop_notify = body(detect, "stop_detect_link(void)")
          show_leds = body(detect, "show_hide_front_leds(int is_show)")
          assert "kill_pidfile_s(DL_PID_FILE, SIGUSR1)" in reset_notify
          assert "kill_pidfile_s(DL_PID_FILE, SIGHUP)" in led_notify
          assert "killall" in stop_notify
          assert "notify_leds_detect_link();" in show_leds
          assert "notify_reset_detect_link();" in wan
          assert "notify_reset_detect_link();" in lan
          assert "stop_detect_link();" in services
          assert '"detect_link"' in dispatcher and "detect_link_main" in dispatcher
          assert '"leds_front"' in dispatcher and "show_hide_front_leds(power_on)" in dispatcher
          assert "detect_link_main(int argc, char *argv[])" in header
          assert "detect_link.o" in makefile
          assert '$(LN) rc $(ROMFSDIR)/sbin/detect_link' in package_makefile

          paths = (
              ".github/workflows/detect-link-signal-stability.yml",
              "trunk/user/rc/src/detect_link.c",
              "trunk/user/rc/src/detect_link_signal_policy.h",
              "trunk/user/rc/src/tests/detect_link_signal_policy.c",
              "trunk/user/rc/src/rc.c",
              "trunk/user/rc/src/rc.h",
              "trunk/user/rc/src/net_wan.c",
              "trunk/user/rc/src/net_lan.c",
              "trunk/user/rc/src/services.c",
              "trunk/user/rc/src/Makefile",
              "trunk/user/rc/Makefile",
          )
          filters = workflow.split("jobs:", 1)[0]
          push_filters, pr_filters = filters.split("  pull_request:", 1)
          for path in paths:
              assert push_filters.count(path) == 1, f"push path missing/duplicated: {path}"
              assert pr_filters.count(path) == 1, f"pull_request path missing/duplicated: {path}"

          print("detect_link signal/context and caller contract: PASS")
          PY

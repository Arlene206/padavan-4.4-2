name: DHCP lease-file atomic-write validation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/udhcp-lease-file-atomic.yml"
      - "trunk/user/busybox/busybox-1.24.x/networking/udhcp/files.c"
      - "trunk/user/busybox/busybox-1.24.x/networking/udhcp/udhcp_lease_file_atomic.h"
      - "trunk/user/busybox/busybox-1.24.x/networking/udhcp/tests/udhcp_lease_file_atomic.c"
      - "scripts/check_udhcp_lease_file_atomic.py"
  pull_request:
    paths:
      - ".github/workflows/udhcp-lease-file-atomic.yml"
      - "trunk/user/busybox/busybox-1.24.x/networking/udhcp/files.c"
      - "trunk/user/busybox/busybox-1.24.x/networking/udhcp/udhcp_lease_file_atomic.h"
      - "trunk/user/busybox/busybox-1.24.x/networking/udhcp/tests/udhcp_lease_file_atomic.c"
      - "scripts/check_udhcp_lease_file_atomic.py"

permissions:
  contents: read

jobs:
  lease-file-atomic-write:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run GNU89 ASan/UBSan fault-injection regression
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -fno-omit-frame-pointer \
            -Itrunk/user/busybox/busybox-1.24.x/networking/udhcp \
            trunk/user/busybox/busybox-1.24.x/networking/udhcp/tests/udhcp_lease_file_atomic.c \
            -o /tmp/udhcp_lease_file_atomic_test
          ASAN_OPTIONS=detect_leaks=1:abort_on_error=1 \
            /tmp/udhcp_lease_file_atomic_test
      - name: Verify atomic lease-file integration
        run: python3 scripts/check_udhcp_lease_file_atomic.py

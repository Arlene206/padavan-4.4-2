name: Ralink IAPP daemon firewall lifecycle regression

on:
  push:
    paths:
      - ".github/workflows/iappd-lifecycle.yml"
      - "trunk/user/ralinkiappd/iappd.sh"
      - "trunk/user/ralinkiappd/src/rtmpiapp.c"
      - "trunk/user/ralinkiappd/src/mt_iapp_util.c"
      - "trunk/user/ralinkiappd/src/rt_config.h"
      - "trunk/user/ralinkiappd/src/rtmpiapp.h"
      - "trunk/user/ralinkiappd/src/ft_client_hash_policy.h"
      - "trunk/user/ralinkiappd/src/iapp_rx_length_policy.h"
      - "trunk/user/ralinkiappd/src/iapp_signal_pipe_policy.h"
      - "trunk/user/ralinkiappd/tests/iapp_tcp_restart_reuseaddr.c"
      - "trunk/user/ralinkiappd/tests/iapp_ioctl_ifname_policy.c"
      - "trunk/user/ralinkiappd/tests/iappd_lifecycle.sh"
      - "trunk/user/ralinkiappd/tests/iappd_make_dependencies.sh"
      - "trunk/user/ralinkiappd/tests/iapp_signal_pipe_policy.c"
      - "trunk/user/ralinkiappd/tests/iapp_event_log_policy.c"
      - "trunk/user/ralinkiappd/src/iapp_select_fd_policy.h"
      - "trunk/user/ralinkiappd/src/iapp_tcp_deadline_policy.h"
      - "trunk/user/ralinkiappd/src/iapp_event_log_policy.h"
      - "trunk/user/ralinkiappd/src/iapp_event_log_poll_policy.h"
      - "trunk/user/ralinkiappd/tests/iapp_select_fd_policy.c"
      - "trunk/user/ralinkiappd/tests/iapp_select_fd_policy.sh"
      - "scripts/check_iappd_select_fd.py"
  pull_request:
    paths:
      - ".github/workflows/iappd-lifecycle.yml"
      - "trunk/user/ralinkiappd/iappd.sh"
      - "trunk/user/ralinkiappd/src/rtmpiapp.c"
      - "trunk/user/ralinkiappd/src/mt_iapp_util.c"
      - "trunk/user/ralinkiappd/src/rt_config.h"
      - "trunk/user/ralinkiappd/src/rtmpiapp.h"
      - "trunk/user/ralinkiappd/src/ft_client_hash_policy.h"
      - "trunk/user/ralinkiappd/src/iapp_rx_length_policy.h"
      - "trunk/user/ralinkiappd/src/iapp_signal_pipe_policy.h"
      - "trunk/user/ralinkiappd/tests/iapp_tcp_restart_reuseaddr.c"
      - "trunk/user/ralinkiappd/tests/iapp_ioctl_ifname_policy.c"
      - "trunk/user/ralinkiappd/tests/iappd_lifecycle.sh"
      - "trunk/user/ralinkiappd/tests/iappd_make_dependencies.sh"
      - "trunk/user/ralinkiappd/tests/iapp_signal_pipe_policy.c"
      - "trunk/user/ralinkiappd/tests/iapp_event_log_policy.c"
      - "trunk/user/ralinkiappd/src/iapp_select_fd_policy.h"
      - "trunk/user/ralinkiappd/src/iapp_tcp_deadline_policy.h"
      - "trunk/user/ralinkiappd/src/iapp_event_log_policy.h"
      - "trunk/user/ralinkiappd/src/iapp_event_log_poll_policy.h"
      - "trunk/user/ralinkiappd/tests/iapp_select_fd_policy.c"
      - "trunk/user/ralinkiappd/tests/iapp_select_fd_policy.sh"
      - "scripts/check_iappd_select_fd.py"

jobs:
  iappd-firewall-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check POSIX shell syntax
        run: sh -n trunk/user/ralinkiappd/iappd.sh
      - name: Run Ralink IAPP daemon lifecycle regression
        run: sh trunk/user/ralinkiappd/tests/iappd_lifecycle.sh
      - name: Test Ralink IAPP header dependency rebuilds
        run: sh trunk/user/ralinkiappd/tests/iappd_make_dependencies.sh
      - name: Run select descriptor boundary regression
        run: sh trunk/user/ralinkiappd/tests/iapp_select_fd_policy.sh
      - name: Verify Linux event-loop, datagram receive, and event-log persistence guards
        run: python3 scripts/check_iappd_select_fd.py

      - name: Compile and run event-log monotonic deadline regression
        run: |
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -fno-omit-frame-pointer -I trunk/user/ralinkiappd/src \
            trunk/user/ralinkiappd/tests/iapp_event_log_policy.c \
            -o "$RUNNER_TEMP/iapp-event-log-policy"
          ASAN_OPTIONS=detect_leaks=1 "$RUNNER_TEMP/iapp-event-log-policy"

      - name: Compile optional IAPP event-log branch
        run: |
          cc -std=gnu89 -Werror=int-conversion -Werror=incompatible-pointer-types \
            -Werror=address-of-packed-member -fsyntax-only -DIAPP_EVENT_LOG \
            -I trunk/user/ralinkiappd/src \
            trunk/user/ralinkiappd/src/rtmpiapp.c

  iappd-event-log-xy-c1-target-compile:
    name: Compile optional IAPP event log with XY-C1 MIPS toolchain
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify the XY-C1 MIPS musl toolchain
        run: |
          set -eu
          toolchain_url="https://github.com/Arlene206/padavan-4.4-2/releases/download/toolchain/mipsel-linux-musl.tar.xz"
          toolchain_sha256="7c1dc5c5ed6c3b86fa5baf7e2832309e1ce21434e1e6dae491f838c95f3a6863"
          toolchain_root="$RUNNER_TEMP/iappd-mipsel-linux-musl"
          archive="$RUNNER_TEMP/mipsel-linux-musl.tar.xz"
          mkdir -p "$toolchain_root"
          curl --fail --location --retry 3 --retry-delay 2 \
            --output "$archive" "$toolchain_url"
          printf '%s  %s\n' "$toolchain_sha256" "$archive" | sha256sum --check -
          tar -xJf "$archive" -C "$toolchain_root"
          compiler="$toolchain_root/bin/mipsel-linux-musl-gcc"
          test -x "$compiler"
          test "$("$compiler" -dumpmachine)" = "mipsel-linux-musl"
      - name: Compile optional IAPP event-log sources for XY-C1
        run: |
          set -eu
          compiler="$RUNNER_TEMP/iappd-mipsel-linux-musl/bin/mipsel-linux-musl-gcc"
          "$compiler" \
            -std=gnu89 -march=mips32r2 -mtune=1004kc \
            -DDBG -DSYSLOG -fvisibility=hidden \
            -Werror=int-conversion -Werror=incompatible-pointer-types \
            -Werror=address-of-packed-member -fsyntax-only \
            -DIAPP_EVENT_LOG -DIAPP_OS_LINUX \
            -I trunk/user/ralinkiappd/src \
            trunk/user/ralinkiappd/src/rtmpiapp.c \
            trunk/user/ralinkiappd/src/mt_iapp_util.c

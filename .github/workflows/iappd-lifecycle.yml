name: Ralink IAPP daemon firewall lifecycle regression

on:
  push:
    paths:
      - ".github/workflows/iappd-lifecycle.yml"
      - "trunk/user/ralinkiappd/iappd.sh"
      - "trunk/user/ralinkiappd/src/rtmpiapp.c"
      - "trunk/user/ralinkiappd/src/mt_iapp_util.c"
      - "trunk/user/ralinkiappd/src/ft_client_hash_policy.h"
      - "trunk/user/ralinkiappd/src/iapp_rx_length_policy.h"
      - "trunk/user/ralinkiappd/src/iapp_signal_pipe_policy.h"
      - "trunk/user/ralinkiappd/tests/iapp_tcp_restart_reuseaddr.c"
      - "trunk/user/ralinkiappd/tests/iapp_ioctl_ifname_policy.c"
      - "trunk/user/ralinkiappd/tests/iappd_lifecycle.sh"
      - "trunk/user/ralinkiappd/tests/iappd_make_dependencies.sh"
      - "trunk/user/ralinkiappd/tests/iapp_signal_pipe_policy.c"
      - "trunk/user/ralinkiappd/src/iapp_select_fd_policy.h"
      - "trunk/user/ralinkiappd/src/iapp_tcp_deadline_policy.h"
      - "trunk/user/ralinkiappd/src/iapp_event_log_policy.h"
      - "trunk/user/ralinkiappd/src/iapp_event_log_poll_policy.h"
      - "trunk/user/ralinkiappd/tests/iapp_select_fd_policy.c"
      - "trunk/user/ralinkiappd/tests/iapp_select_fd_policy.sh"
      - "scripts/check_iappd_select_fd.py"
  pull_request:
    paths:
      - ".github/workflows/iappd-lifecycle.yml"
      - "trunk/user/ralinkiappd/iappd.sh"
      - "trunk/user/ralinkiappd/src/rtmpiapp.c"
      - "trunk/user/ralinkiappd/src/mt_iapp_util.c"
      - "trunk/user/ralinkiappd/src/ft_client_hash_policy.h"
      - "trunk/user/ralinkiappd/src/iapp_rx_length_policy.h"
      - "trunk/user/ralinkiappd/src/iapp_signal_pipe_policy.h"
      - "trunk/user/ralinkiappd/tests/iapp_tcp_restart_reuseaddr.c"
      - "trunk/user/ralinkiappd/tests/iapp_ioctl_ifname_policy.c"
      - "trunk/user/ralinkiappd/tests/iappd_lifecycle.sh"
      - "trunk/user/ralinkiappd/tests/iappd_make_dependencies.sh"
      - "trunk/user/ralinkiappd/tests/iapp_signal_pipe_policy.c"
      - "trunk/user/ralinkiappd/src/iapp_select_fd_policy.h"
      - "trunk/user/ralinkiappd/src/iapp_tcp_deadline_policy.h"
      - "trunk/user/ralinkiappd/src/iapp_event_log_policy.h"
      - "trunk/user/ralinkiappd/src/iapp_event_log_poll_policy.h"
      - "trunk/user/ralinkiappd/tests/iapp_select_fd_policy.c"
      - "trunk/user/ralinkiappd/tests/iapp_select_fd_policy.sh"
      - "scripts/check_iappd_select_fd.py"

jobs:
  iappd-firewall-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check POSIX shell syntax
        run: sh -n trunk/user/ralinkiappd/iappd.sh
      - name: Run Ralink IAPP daemon lifecycle regression
        run: sh trunk/user/ralinkiappd/tests/iappd_lifecycle.sh
      - name: Test Ralink IAPP header dependency rebuilds
        run: sh trunk/user/ralinkiappd/tests/iappd_make_dependencies.sh
      - name: Run select descriptor boundary regression
        run: sh trunk/user/ralinkiappd/tests/iapp_select_fd_policy.sh
      - name: Verify Linux event-loop, datagram receive, and event-log persistence guards
        run: python3 scripts/check_iappd_select_fd.py

      - name: Compile optional IAPP event-log branch
        run: |
          cc -std=gnu89 -fsyntax-only -DIAPP_EVENT_LOG \
            -I trunk/user/ralinkiappd/src \
            trunk/user/ralinkiappd/src/rtmpiapp.c

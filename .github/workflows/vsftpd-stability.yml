name: vsftpd configuration publication stability regression

on:
  push:
    paths:
      - ".github/workflows/vsftpd-stability.yml"
      - "trunk/user/vsftpd/src/asus_ext.c"
      - "trunk/user/vsftpd/src/asus_ext.h"
      - "trunk/user/vsftpd/src/postlogin.c"
      - "trunk/user/vsftpd/src/session.h"
      - "trunk/user/vsftpd/src/main.c"
      - "trunk/user/vsftpd/src/ipaddrparse.c"
      - "trunk/user/vsftpd/src/ipaddrparse.h"
      - "trunk/user/vsftpd/src/tests/ipaddrparse_policy.c"
      - "trunk/user/vsftpd/src/ftp_rest_offset_policy.h"
      - "trunk/user/vsftpd/src/ftp_octal_arg_policy.h"
      - "trunk/user/vsftpd/src/tests/ftp_active_port_policy.c"
      - "trunk/user/vsftpd/src/ftp_active_port_policy.h"
      - "trunk/user/vsftpd/src/tests/ftp_octal_arg_policy.c"
      - "trunk/user/vsftpd/src/tests/ftp_rest_offset_policy.c"
      - "trunk/user/vsftpd/src/ftp_acl_path_policy.h"
      - "trunk/user/vsftpd/src/ftp_account_auth_policy.h"
      - "trunk/user/vsftpd/src/tests/ftp_account_auth_policy.c"
      - "trunk/user/vsftpd/src/tests/ftp_acl_path_policy.c"
      - "trunk/user/vsftpd/src/ftp_listing_policy.h"
      - "trunk/user/vsftpd/src/ftpdataio.c"
      - "trunk/user/vsftpd/src/sysutil.c"
      - "trunk/user/vsftpd/src/sysutil.h"
      - "trunk/user/vsftpd/src/ls.c"
      - "trunk/user/vsftpd/src/sysstr.c"
      - "trunk/user/vsftpd/src/sysstr.h"
      - "trunk/user/rc/src/services_stor.c"
      - "trunk/user/rc/src/service_connection_limit_policy.h"
      - "trunk/user/rc/src/ftp_passive_port_policy.h"
      - "trunk/user/rc/src/ftp_transfer_rate_policy.h"
      - "trunk/user/rc/src/tests/ftp_transfer_rate_policy.c"
      - "trunk/user/rc/src/tests/ftp_passive_port_policy.c"
      - "trunk/user/rc/src/tests/service_connection_limit_policy.c"
      - "trunk/user/rc/src/service_wait_policy.h"
      - "trunk/user/rc/src/ftp_config_file.h"
      - "trunk/user/rc/src/tests/ftp_config_file.c"
      - "trunk/user/rc/src/rc.c"
      - "trunk/user/rc/src/rc.h"
      - "trunk/user/rc/src/ftp_daemon_policy.h"
      - "trunk/user/rc/src/service_daemon_wait_policy.h"
      - "trunk/user/shared/src/process_inventory.h"
      - "trunk/user/rc/src/tests/ftp_daemon_policy.c"
  pull_request:
    paths:
      - ".github/workflows/vsftpd-stability.yml"
      - "trunk/user/vsftpd/src/asus_ext.c"
      - "trunk/user/vsftpd/src/asus_ext.h"
      - "trunk/user/vsftpd/src/postlogin.c"
      - "trunk/user/vsftpd/src/session.h"
      - "trunk/user/vsftpd/src/main.c"
      - "trunk/user/vsftpd/src/ipaddrparse.c"
      - "trunk/user/vsftpd/src/ipaddrparse.h"
      - "trunk/user/vsftpd/src/tests/ipaddrparse_policy.c"
      - "trunk/user/vsftpd/src/ftp_rest_offset_policy.h"
      - "trunk/user/vsftpd/src/ftp_octal_arg_policy.h"
      - "trunk/user/vsftpd/src/tests/ftp_active_port_policy.c"
      - "trunk/user/vsftpd/src/ftp_active_port_policy.h"
      - "trunk/user/vsftpd/src/tests/ftp_octal_arg_policy.c"
      - "trunk/user/vsftpd/src/tests/ftp_rest_offset_policy.c"
      - "trunk/user/vsftpd/src/ftp_acl_path_policy.h"
      - "trunk/user/vsftpd/src/ftp_account_auth_policy.h"
      - "trunk/user/vsftpd/src/tests/ftp_account_auth_policy.c"
      - "trunk/user/vsftpd/src/tests/ftp_acl_path_policy.c"
      - "trunk/user/vsftpd/src/ftp_listing_policy.h"
      - "trunk/user/vsftpd/src/ftpdataio.c"
      - "trunk/user/vsftpd/src/sysutil.c"
      - "trunk/user/vsftpd/src/sysutil.h"
      - "trunk/user/vsftpd/src/ls.c"
      - "trunk/user/vsftpd/src/sysstr.c"
      - "trunk/user/vsftpd/src/sysstr.h"
      - "trunk/user/rc/src/services_stor.c"
      - "trunk/user/rc/src/service_connection_limit_policy.h"
      - "trunk/user/rc/src/ftp_passive_port_policy.h"
      - "trunk/user/rc/src/ftp_transfer_rate_policy.h"
      - "trunk/user/rc/src/tests/ftp_transfer_rate_policy.c"
      - "trunk/user/rc/src/tests/ftp_passive_port_policy.c"
      - "trunk/user/rc/src/tests/service_connection_limit_policy.c"
      - "trunk/user/rc/src/service_wait_policy.h"
      - "trunk/user/rc/src/ftp_config_file.h"
      - "trunk/user/rc/src/tests/ftp_config_file.c"
      - "trunk/user/rc/src/rc.c"
      - "trunk/user/rc/src/rc.h"
      - "trunk/user/rc/src/ftp_daemon_policy.h"
      - "trunk/user/rc/src/service_daemon_wait_policy.h"
      - "trunk/user/shared/src/process_inventory.h"
      - "trunk/user/rc/src/tests/ftp_daemon_policy.c"

jobs:
  vsftpd-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run vsftpd configuration publication regression
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror \
            -I trunk/user/rc/src \
            trunk/user/rc/src/tests/ftp_config_file.c \
            -o /tmp/ftp-config-file
          /tmp/ftp-config-file
          cc -std=gnu89 -Wall -Wextra -Werror \
            -I trunk/user/rc/src \
            trunk/user/rc/src/tests/service_connection_limit_policy.c \
            -o /tmp/service-connection-limit-policy
          /tmp/service-connection-limit-policy
          cc -std=gnu89 -Wall -Wextra -Werror \
            -I trunk/user/rc/src \
            trunk/user/rc/src/tests/ftp_passive_port_policy.c \
            -o /tmp/ftp-passive-port-policy
          /tmp/ftp-passive-port-policy
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer \
            -I trunk/user/rc/src \
            trunk/user/rc/src/tests/ftp_transfer_rate_policy.c \
            -o /tmp/ftp-transfer-rate-policy
          ASAN_OPTIONS=detect_leaks=1 /tmp/ftp-transfer-rate-policy
          cc -std=gnu89 -Wall -Wextra -Werror \
            -I trunk/user/rc/src -I trunk/user/shared/src \
            trunk/user/rc/src/tests/ftp_daemon_policy.c \
            -o /tmp/ftp-daemon-policy
          /tmp/ftp-daemon-policy
          cc -std=gnu89 -Wall -Wextra -Werror \
            -iquote trunk/user/vsftpd/src \
            trunk/user/vsftpd/src/tests/ftp_acl_path_policy.c \
            -o /tmp/ftp-acl-path-policy
          /tmp/ftp-acl-path-policy
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer \
            -I trunk/user/shared/src -iquote trunk/user/vsftpd/src \
            trunk/user/vsftpd/src/tests/ftp_account_auth_policy.c \
            -o /tmp/vsftpd-account-auth-policy
          ASAN_OPTIONS=detect_leaks=1 /tmp/vsftpd-account-auth-policy
          cc -std=gnu89 -Wall -Wextra -Werror -ffunction-sections -fdata-sections \
            -Wl,--gc-sections -iquote trunk/user/vsftpd/src \
            trunk/user/vsftpd/src/ipaddrparse.c \
            trunk/user/vsftpd/src/tests/ipaddrparse_policy.c \
            -o /tmp/vsftpd-ipaddrparse-policy
          /tmp/vsftpd-ipaddrparse-policy
          cc -std=gnu89 -Wall -Wextra -Werror \
            -iquote trunk/user/vsftpd/src \
            trunk/user/vsftpd/src/tests/ftp_rest_offset_policy.c \
            -o /tmp/vsftpd-rest-offset-policy
          /tmp/vsftpd-rest-offset-policy
          cc -std=gnu89 -Wall -Wextra -Werror \
            -iquote trunk/user/vsftpd/src \
            trunk/user/vsftpd/src/tests/ftp_octal_arg_policy.c \
            -o /tmp/vsftpd-octal-arg-policy
          /tmp/vsftpd-octal-arg-policy
          cc -std=gnu89 -Wall -Wextra -Werror \
            -iquote trunk/user/vsftpd/src \
            trunk/user/vsftpd/src/tests/ftp_active_port_policy.c \
            -o /tmp/vsftpd-active-port-policy
          /tmp/vsftpd-active-port-policy
      - name: Verify vsftpd configuration publication and startup gates
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path("trunk/user/rc/src/services_stor.c").read_text()
          rc = Path("trunk/user/rc/src/rc.c").read_text()
          header = Path("trunk/user/rc/src/rc.h").read_text()
          helper = Path("trunk/user/rc/src/ftp_config_file.h").read_text()
          test = Path("trunk/user/rc/src/tests/ftp_config_file.c").read_text()
          workflow = Path(".github/workflows/vsftpd-stability.yml").read_text()
          daemon_policy = Path("trunk/user/rc/src/ftp_daemon_policy.h").read_text()
          daemon_test = Path("trunk/user/rc/src/tests/ftp_daemon_policy.c").read_text()
          service_wait_policy = Path("trunk/user/rc/src/service_daemon_wait_policy.h").read_text()
          passive_port_policy = Path("trunk/user/rc/src/ftp_passive_port_policy.h").read_text()
          transfer_rate_policy = Path("trunk/user/rc/src/ftp_transfer_rate_policy.h").read_text()
          transfer_rate_test = Path("trunk/user/rc/src/tests/ftp_transfer_rate_policy.c").read_text()
          passive_port_test = Path("trunk/user/rc/src/tests/ftp_passive_port_policy.c").read_text()
          vsftpd_acl = Path("trunk/user/vsftpd/src/asus_ext.c").read_text()
          vsftpd_acl_header = Path("trunk/user/vsftpd/src/asus_ext.h").read_text()
          vsftpd_postlogin = Path("trunk/user/vsftpd/src/postlogin.c").read_text()
          vsftpd_session = Path("trunk/user/vsftpd/src/session.h").read_text()
          vsftpd_main = Path("trunk/user/vsftpd/src/main.c").read_text()
          vsftpd_octal_policy = Path("trunk/user/vsftpd/src/ftp_octal_arg_policy.h").read_text()
          octal_arg_test = Path("trunk/user/vsftpd/src/tests/ftp_octal_arg_policy.c").read_text()
          vsftpd_active_port_policy = Path("trunk/user/vsftpd/src/ftp_active_port_policy.h").read_text()
          active_port_test = Path("trunk/user/vsftpd/src/tests/ftp_active_port_policy.c").read_text()
          vsftpd_ipaddrparse = Path("trunk/user/vsftpd/src/ipaddrparse.c").read_text()
          vsftpd_ipaddrparse_header = Path("trunk/user/vsftpd/src/ipaddrparse.h").read_text()
          ipaddrparse_test = Path("trunk/user/vsftpd/src/tests/ipaddrparse_policy.c").read_text()
          vsftpd_rest_policy = Path("trunk/user/vsftpd/src/ftp_rest_offset_policy.h").read_text()
          rest_offset_test = Path("trunk/user/vsftpd/src/tests/ftp_rest_offset_policy.c").read_text()
          vsftpd_dataio = Path("trunk/user/vsftpd/src/ftpdataio.c").read_text()
          vsftpd_listing_policy = Path("trunk/user/vsftpd/src/ftp_listing_policy.h").read_text()
          vsftpd_sysutil = Path("trunk/user/vsftpd/src/sysutil.c").read_text()
          vsftpd_sysutil_header = Path("trunk/user/vsftpd/src/sysutil.h").read_text()
          vsftpd_ls = Path("trunk/user/vsftpd/src/ls.c").read_text()
          vsftpd_sysstr = Path("trunk/user/vsftpd/src/sysstr.c").read_text()
          vsftpd_sysstr_header = Path("trunk/user/vsftpd/src/sysstr.h").read_text()
          acl_path_policy = Path("trunk/user/vsftpd/src/ftp_acl_path_policy.h").read_text()
          acl_path_test = Path("trunk/user/vsftpd/src/tests/ftp_acl_path_policy.c").read_text()
          vsftpd_auth_policy = Path("trunk/user/vsftpd/src/ftp_account_auth_policy.h").read_text()
          vsftpd_auth_test = Path("trunk/user/vsftpd/src/tests/ftp_account_auth_policy.c").read_text()

          def function_body(text, signature):
              signature_has_open_brace = signature.rstrip().endswith("{")
              start = text.find(signature)
              while start >= 0:
                  signature_end = start + len(signature)
                  if signature_has_open_brace:
                      break
                  brace = text.find("{", signature_end)
                  semicolon = text.find(";", signature_end)
                  if brace >= 0 and (semicolon < 0 or brace < semicolon):
                      break
                  start = text.find(signature, semicolon + 1) if semicolon >= 0 else -1
              assert start >= 0, f"missing function definition: {signature}"
              if signature_has_open_brace:
                  brace = start + len(signature.rstrip()) - 1
              else:
                  brace = text.find("{", start + len(signature))
              assert brace >= 0, f"missing function body: {signature}"
              depth = 0
              for pos in range(brace, len(text)):
                  if text[pos] == "{":
                      depth += 1
                  elif text[pos] == "}":
                      depth -= 1
                      if depth == 0:
                          return text[brace + 1:pos]
              raise AssertionError(f"unterminated function: {signature}")

          prototype_fixture = "static int probe(void);\nstatic int probe(void) { return 1; }\n"
          assert "return 1;" in function_body(prototype_fixture, "probe(void)")

          opening_brace_fixture = "static void probe(void) { return; }\n"
          assert "return;" in function_body(opening_brace_fixture, "static void probe(void) {")

          config = function_body(source, "write_vsftpd_conf(")
          config_compact = "".join(config.split())
          max_user_read = 'storage_read_integer_status("st_max_user",0,&max_user_value)'
          max_user_policy = 'service_connection_limit_value_status(max_user_status,max_user_value,MAX_CLIENTS_NUM,&i_maxuser)'
          passive_min_read = 'storage_read_integer_status("st_ftp_pmin",50000,&ftp_min_value)'
          passive_max_read = 'storage_read_integer_status("st_ftp_pmax",50100,&ftp_max_value)'
          passive_range_check = 'ftp_passive_port_range_status(ftp_min_status,ftp_min_value,ftp_max_status,ftp_max_value,&ftp_min_port,&ftp_max_port)'
          ftp_config_open = 'ftp_config_file_open("/etc/vsftpd.conf"'
          ftp_mode_read = 'storage_read_integer_status("st_ftp_mode",0,&ftp_mode_value)'
          ftp_log_read = 'storage_read_integer_status("st_ftp_log",0,&ftp_log_value)'
          assert ftp_mode_read in config_compact
          assert ftp_log_read in config_compact
          assert config_compact.index(ftp_mode_read) < config_compact.index(ftp_config_open)
          assert config_compact.index(ftp_log_read) < config_compact.index(ftp_config_open)
          assert 'nvram_get_int("st_ftp_mode")' not in config
          assert 'nvram_get_int("st_ftp_log")' not in config
          assert "ftp_share_mode_normalize(ftp_mode_value)" in config
          assert "(ftp_log_value == 0)" in config
          assert "cannot read FTP configuration" in config
          assert config.index("cannot read FTP configuration") < config.index(ftp_config_open)
          assert max_user_read in config_compact
          assert max_user_policy in config_compact
          assert config_compact.index(max_user_read) < config_compact.index(max_user_policy) < config_compact.index(ftp_config_open)
          assert passive_min_read in config_compact and passive_max_read in config_compact
          assert passive_range_check in config_compact
          assert config_compact.index(passive_min_read) < config_compact.index(passive_range_check) < config_compact.index(ftp_config_open)
          assert config_compact.index(passive_max_read) < config_compact.index(passive_range_check) < config_compact.index(ftp_config_open)
          assert 'nvram_safe_get_int("st_ftp_pmin"' not in config
          assert 'nvram_safe_get_int("st_ftp_pmax"' not in config
          assert 'fprintf(fp, "pasv_min_port=%d\\n", ftp_min_port);' in config
          assert 'fprintf(fp, "pasv_max_port=%d\\n", ftp_max_port);' in config
          assert "minimum_value > maximum_value" in passive_port_policy
          assert "minimum_status != 0" in passive_port_policy
          assert "maximum_status != 0" in passive_port_policy
          anon_rate_required = "ftp_transfer_rate_setting_required(i_ftp_mode)"
          anon_rate_read = 'storage_read_integer_status("st_ftp_anmr",0,&ftp_anon_rate_value)'
          anon_rate_gate = 'ftp_transfer_rate_value_status(ftp_anon_rate_status,ftp_anon_rate_value,10000,&ftp_anon_rate)'
          mode_snapshot = "i_ftp_mode=ftp_share_mode_normalize(ftp_mode_value)"
          assert mode_snapshot in config_compact and anon_rate_required in config_compact
          assert config_compact.index(mode_snapshot) < config_compact.index(anon_rate_required) < config_compact.index(anon_rate_read) < config_compact.index(ftp_config_open)
          assert config_compact.index(anon_rate_gate) < config_compact.index(ftp_config_open)
          assert "ftp_transfer_rate_setting_required" in transfer_rate_policy
          assert "ftp_transfer_rate_setting_required(3)" in transfer_rate_test
          assert "ftp_transfer_rate_setting_required(4)" in transfer_rate_test
          assert "!ftp_transfer_rate_setting_required(2)" in "".join(transfer_rate_test.split())
          assert 'nvram_safe_get_int("st_ftp_anmr"' not in config
          assert 'fprintf(fp, "anon_max_rate=%u\\n", (unsigned int)ftp_anon_rate * 1024U);' in config
          assert "ftp_transfer_rate_value_status" in transfer_rate_policy
          assert "ftp_transfer_rate_value_status(EIO, 0, 10000, &rate) == EIO" in transfer_rate_test
          assert "ftp_transfer_rate_value_status(0, 20000, 10000, &rate) == 0" in transfer_rate_test
          assert "INT_MIN" in passive_port_test and "INT_MAX" in passive_port_test
          assert "EACCES" in passive_port_test and "EINVAL" in passive_port_test
          assert 'nvram_get_int("st_max_user")' not in config
          assert "cannot read FTP configuration" in config
          assert config.index("cannot read FTP configuration") < config.index(ftp_config_open)
          assert 'fprintf(fp, "max_clients=%d\\n", i_maxuser);' in config
          assert 'fprintf(fp, "max_per_ip=%d\\n", i_maxuser);' in config
          storage_reader = function_body(source, "storage_read_integer_status(const char *name, int missing_value, int *value)")
          assert 'nvram_get_checked(name, &text)' in storage_reader
          assert "rc_wan_nvram_read_int_status(api_result, saved_errno" in storage_reader
          assert "ftp_config_file_open(" in config
          assert "ftp_config_file_publish(" in config
          assert config.index("ftp_config_file_open(") < config.index("fprintf(")
          assert config.index("fprintf(") < config.index("ftp_config_file_publish(")
          assert 'fopen("/etc/vsftpd.conf", "w")' not in config
          assert "return -1;" in config
          publish_gate = config.index('if (ftp_config_file_publish(')
          publish_error = config.index("return -1;", publish_gate)
          publish_success = config.index("return 0;", publish_gate)
          assert publish_gate < publish_error < publish_success

          enable_reader = function_body(source, "ftp_read_enabled_status(int *enabled)")
          assert 'nvram_get_checked("enable_ftp", &value)' in enable_reader
          assert "rc_wan_nvram_read_int_status(api_result, saved_errno" in enable_reader
          assert "ftp_enable_value_status(read_status, parsed, enabled)" in enable_reader

          run = function_body(source, "run_ftp(")
          assert "ftp_read_enabled_status(&ftp_enabled)" in run
          assert run.index("ftp_read_enabled_status(&ftp_enabled)") < run.index("is_ftp_run()")
          assert 'nvram_match("enable_ftp", "0")' not in run
          failure_gate = run.index("if (write_vsftpd_conf() != 0)")
          failure_return = run.index("return -1;", failure_gate)
          daemon_start = run.index('eval("/sbin/vsftpd")')
          assert failure_gate < failure_return < daemon_start
          assert "command_status != 0" in run
          assert 'ftp_wait_for_daemon("vsftpd") != 0' in run
          assert "errno = 0;" in run
          assert run.count('ftp_rollback_failed_start(start_errno, "start")') == 2
          assert run.index('eval("/sbin/vsftpd")') < run.index('ftp_wait_for_daemon("vsftpd")')

          restart = function_body(source, "restart_ftpd(void)")
          assert "ftp_read_enabled_status(&ftp_enabled)" in restart
          assert restart.index("ftp_read_enabled_status(&ftp_enabled)") < restart.index("is_run_before = is_ftp_run()")
          assert restart.index("ftp_read_enabled_status(&ftp_enabled)") < restart.index("stop_status = stop_ftp_locked(&final_presence)")
          assert "ftp_stop_should_reconcile_firewall(PROCESS_PRESENCE_ABSENT)" in daemon_test
          assert "ftp_stop_should_reconcile_firewall(PROCESS_PRESENCE_RUNNING)" in daemon_test
          assert "ftp_stop_should_reconcile_firewall(PROCESS_PRESENCE_UNKNOWN)" in daemon_test
          assert "return final_presence == PROCESS_PRESENCE_ABSENT;" in daemon_policy
          stop_gate = restart.index("if (stop_status != 0)")
          failed_firewall_gate = restart.index("if (ftp_stop_should_reconcile_firewall(final_presence))", stop_gate)
          failed_firewall_call = restart.index("firewall_status = control_ftp_fw(is_run_before)", failed_firewall_gate)
          failed_status_merge = restart.index("restart_status = rc_first_service_start_status(stop_status, firewall_status)", failed_firewall_call)
          failed_return = restart.index("goto out;", failed_status_merge)
          mount_gate = restart.index('mount_status = storage_has_mounted_devices("restarting FTP")')
          firewall_gate = restart.rindex("if (ftp_stop_should_reconcile_firewall(final_presence))")
          firewall_call = restart.rindex("firewall_status = control_ftp_fw(is_run_before)")
          final_status = restart.index("rc_first_service_start_status(start_status, firewall_status)")
          assert stop_gate < failed_firewall_gate < failed_firewall_call < failed_status_merge < failed_return < mount_gate
          assert mount_gate < firewall_gate < firewall_call < final_status
          assert "errno = 0;" in restart[mount_gate - 40:mount_gate]
          assert "start_status = errno > 0 ? errno : EIO;" in restart
          assert "start_status = run_ftp();" in restart
          assert restart.count("control_ftp_fw(is_run_before)") == 2
          assert "ftp_enable_value_status(EIO, 1, &enabled)" in daemon_test
          assert "ftp_enable_value_status(0, 2, &enabled)" in daemon_test
          assert "ftp_enable_value_status(0, 1, NULL)" in daemon_test
          assert "ftp_enable_value_status(int read_status, int value, int *enabled)" in daemon_policy
          assert "ftp_failed_start_may_leave_daemon(PROCESS_PRESENCE_UNKNOWN)" in daemon_test
          assert "ftp_failed_start_may_leave_daemon((enum process_presence)9)" in daemon_test
          assert "ftp_failed_start_may_leave_daemon(enum process_presence state)" in daemon_policy
          assert "return state != PROCESS_PRESENCE_ABSENT;" in daemon_policy
          rollback = function_body(source, "static void\nftp_rollback_failed_start(int start_errno, const char *operation)")

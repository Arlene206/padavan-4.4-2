name: PID 1 mdev hotplug configuration security regression

on:
  push:
    paths:
      - "trunk/user/rc/src/init.c"
      - "trunk/user/rc/src/init_mdev_config_file.h"
      - "trunk/user/rc/src/tests/init_mdev_config_file.c"
      - ".github/workflows/init-mdev-security.yml"
  pull_request:
    paths:
      - "trunk/user/rc/src/init.c"
      - "trunk/user/rc/src/init_mdev_config_file.h"
      - "trunk/user/rc/src/tests/init_mdev_config_file.c"
      - ".github/workflows/init-mdev-security.yml"
  workflow_dispatch:

jobs:
  mdev-config-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run mdev config publication regression
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            trunk/user/rc/src/tests/init_mdev_config_file.c \
            -o /tmp/init_mdev_config_file
          ASAN_OPTIONS=detect_leaks=1 /tmp/init_mdev_config_file
      - name: Check PID 1 hotplug policy publication contract
        run: |
          python3 - <<'PY'
          from pathlib import Path

          init = Path("trunk/user/rc/src/init.c").read_text()
          helper = Path("trunk/user/rc/src/init_mdev_config_file.h").read_text()
          test = Path("trunk/user/rc/src/tests/init_mdev_config_file.c").read_text()
          workflow = Path(".github/workflows/init-mdev-security.yml").read_text()

          def body(source, signature):
              start = source.index(signature)
              brace = source.index("{", start)
              depth = 0
              for pos in range(brace, len(source)):
                  if source[pos] == "{":
                      depth += 1
                  elif source[pos] == "}":
                      depth -= 1
                      if depth == 0:
                          return source[brace + 1:pos]
              raise AssertionError("unterminated function: " + signature)

          mdev = body(init, "init_mdev(void)")
          main_loop = body(init, "init_main_loop(void)")
          assert '#include "init_mdev_config_file.h"' in init
          assert "init_mdev_config_open(" in mdev
          assert "init_mdev_config_publish(" in mdev
          assert mdev.index("init_mdev_config_publish(") < mdev.index(
              'fput_string("/proc/sys/kernel/hotplug", "/sbin/mdev")'
          )
          assert "unlink(mdev_conf)" not in mdev
          assert 'fopen(mdev_conf, "w")' not in mdev
          assert "if (hotplug_result != 0)" in mdev
          assert "Failed to activate mdev kernel hotplug handler" in mdev
          assert "if (init_mdev() != 0)" in main_loop
          assert "mdev initialization failed; hotplug handling may be unavailable" in main_loop

          for token in ("mkstemp(", "fchmod(fd, 0644)", 'fdopen(fd, "w")',
                        "ferror(fp)", "fflush(fp)", "fsync(fileno(fp))",
                        "fclose(fp)", "rename(staged_path, path)", "unlink(staged_path)"):
              assert token in helper, token
          for token in ("umask(0000)", "st_mode & 0777", "0644",
                        "old-policy", "new-policy", "blocked_path",
                        "preserve", "init_mdev_config_publish"):
              assert token in test, token

          paths = (
              "trunk/user/rc/src/init.c",
              "trunk/user/rc/src/init_mdev_config_file.h",
              "trunk/user/rc/src/tests/init_mdev_config_file.c",
              ".github/workflows/init-mdev-security.yml",
          )
          push = workflow.split("  push:\n    paths:\n", 1)[1].split(
              "  pull_request:\n", 1
          )[0]
          pull = workflow.split("  pull_request:\n    paths:\n", 1)[1].split(
              "  workflow_dispatch:\n", 1
          )[0]
          for path in paths:
              assert push.count(path) == 1, (path, "push")
              assert pull.count(path) == 1, (path, "pull_request")
          print("PID 1 mdev hotplug config root-only atomic publication contract: PASS")
          PY

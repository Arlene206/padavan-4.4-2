name: Redsocks lifecycle stability regression

on:
  push:
    paths:
      - ".github/workflows/redsocks-lifecycle.yml"
      - "scripts/check_redsocks_lifecycle.py"
      - "scripts/tests/redsocks_lifecycle.sh"
      - "trunk/user/redsocks/redsocks.sh"
  pull_request:
    paths:
      - ".github/workflows/redsocks-lifecycle.yml"
      - "scripts/check_redsocks_lifecycle.py"
      - "scripts/tests/redsocks_lifecycle.sh"
      - "trunk/user/redsocks/redsocks.sh"

permissions:
  contents: read

jobs:
  redsocks-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Redsocks shell syntax
        run: bash -n trunk/user/redsocks/redsocks.sh && bash -n scripts/tests/redsocks_lifecycle.sh
      - name: Run Redsocks bounded process lifecycle regression
        run: bash scripts/tests/redsocks_lifecycle.sh
      - name: Verify Redsocks source contract
        run: python3 scripts/check_redsocks_lifecycle.py

jobs:
  wan-route-status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile checked WAN VLAN ID read policy regression with sanitizers
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -fno-omit-frame-pointer -I trunk/user/rc/src \
            trunk/user/rc/src/tests/wan_vlan_vid_policy.c \
            -o /tmp/wan-vlan-vid-policy
          ASAN_OPTIONS=detect_leaks=1 /tmp/wan-vlan-vid-policy
      - name: Compile and run DHCP lease route input policy regression
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -fno-omit-frame-pointer -I trunk/user/rc/src \
            trunk/user/rc/src/tests/dhcp_lease_policy.c \
            -o /tmp/dhcp-lease-policy
          ASAN_OPTIONS=detect_leaks=1 /tmp/dhcp-lease-policy

      - name: Compile route status regression with sanitizers
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -I trunk/user/rc/src \
            trunk/user/rc/src/tests/route_status_policy.c \
            -o /tmp/route-status-policy
          ASAN_OPTIONS=detect_leaks=1 /tmp/route-status-policy

      - name: Compile and run static-route input policy regression
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -fno-omit-frame-pointer -I trunk/user/rc/src \
            trunk/user/rc/src/tests/static_route_policy.c \
            -o "$RUNNER_TEMP/static-route-policy"
          ASAN_OPTIONS=detect_leaks=1 "$RUNNER_TEMP/static-route-policy"

      - name: Compile and run WAN teardown route-selection policy regression
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -fno-omit-frame-pointer -I trunk/user/rc/src \
            trunk/user/rc/src/tests/wan_teardown_policy.c \
            -o /tmp/wan-teardown-policy
          ASAN_OPTIONS=detect_leaks=1 /tmp/wan-teardown-policy

      - name: Compile and run PPP callback link ownership regression
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -fno-omit-frame-pointer -I trunk/user/rc/src \
            trunk/user/rc/src/tests/ppp_callback_link_policy.c \
            -o /tmp/ppp-callback-link-policy
          ASAN_OPTIONS=detect_leaks=1 /tmp/ppp-callback-link-policy
      - name: Compile and run AP-client association wait status regression
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -fno-omit-frame-pointer -I trunk/user/rc/src \
            trunk/user/rc/src/tests/apcli_wait_policy.c \
            -o /tmp/apcli-wait-policy
          ASAN_OPTIONS=detect_leaks=1 /tmp/apcli-wait-policy
      - name: Compile and run network sysctl result policy regression
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -fno-omit-frame-pointer -I trunk/user/rc/src \
            trunk/user/rc/src/tests/network_sysctl_policy.c \
            -o /tmp/network-sysctl-policy
          ASAN_OPTIONS=detect_leaks=1 /tmp/network-sysctl-policy
      - name: Compile and run NAT offload selector snapshot regression
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -fno-omit-frame-pointer -I trunk/user/rc/src \
            trunk/user/rc/src/tests/nat_offload_settings_policy.c \
            -o /tmp/nat-offload-settings-policy
          ASAN_OPTIONS=detect_leaks=1 /tmp/nat-offload-settings-policy
      - name: Compile and run NAT helper settings snapshot regression
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -fno-omit-frame-pointer -I trunk/user/rc/src \
            trunk/user/rc/src/tests/nat_helper_settings_policy.c \
            -o /tmp/nat-helper-settings-policy
          ASAN_OPTIONS=detect_leaks=1 /tmp/nat-helper-settings-policy
      - name: Check NAT helper reload preserves module state on NVRAM errors
        run: python3 scripts/check_nat_helper_settings.py
      - name: Compile and run checked WAN interface publication policy regression
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -fno-omit-frame-pointer -I trunk/user/rc/src \

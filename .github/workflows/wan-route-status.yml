jobs:
  wan-route-status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile route status regression with sanitizers
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -I trunk/user/rc/src \
            trunk/user/rc/src/tests/route_status_policy.c \
            -o /tmp/route-status-policy
          ASAN_OPTIONS=detect_leaks=1 /tmp/route-status-policy

      - name: Compile and run PPP callback link ownership regression
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -fno-omit-frame-pointer -I trunk/user/rc/src \
            trunk/user/rc/src/tests/ppp_callback_link_policy.c \
            -o /tmp/ppp-callback-link-policy
          ASAN_OPTIONS=detect_leaks=1 /tmp/ppp-callback-link-policy
      - name: Compile and run AP-client association wait status regression
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -fno-omit-frame-pointer -I trunk/user/rc/src \
            trunk/user/rc/src/tests/apcli_wait_policy.c \
            -o /tmp/apcli-wait-policy
          ASAN_OPTIONS=detect_leaks=1 /tmp/apcli-wait-policy
      - name: Compile and run network sysctl result policy regression
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -fno-omit-frame-pointer -I trunk/user/rc/src \
            trunk/user/rc/src/tests/network_sysctl_policy.c \
            -o /tmp/network-sysctl-policy
          ASAN_OPTIONS=detect_leaks=1 /tmp/network-sysctl-policy
      - name: Compile and run checked WAN interface publication policy regression
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -fno-omit-frame-pointer -I trunk/user/rc/src \
            trunk/user/rc/src/tests/wan_nvram_status_policy.c \
            -o /tmp/wan-nvram-status-policy
          ASAN_OPTIONS=detect_leaks=1 /tmp/wan-nvram-status-policy
      - name: Compile and run Inadyn configured-WAN update policy regression
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -fno-omit-frame-pointer -I trunk/user/rc/src -I trunk/user/shared/src \
            trunk/user/rc/src/tests/inadyn_daemon_policy.c \
            -o /tmp/inadyn-daemon-policy
          ASAN_OPTIONS=detect_leaks=1 /tmp/inadyn-daemon-policy
      - name: Compile and run IPv6 restart runtime-mode commit regression
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -fno-omit-frame-pointer -I trunk/user/rc/src \
            trunk/user/rc/src/tests/ipv6_restart_policy.c \
            -o /tmp/ipv6-restart-policy
          ASAN_OPTIONS=detect_leaks=1 /tmp/ipv6-restart-policy
      - name: Compile and run IPv6 global cleanup result propagation regression
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -fno-omit-frame-pointer -I trunk/user/rc/src \
            trunk/user/rc/src/tests/ipv6_cleanup_policy.c \
            -o /tmp/ipv6-cleanup-policy
          ASAN_OPTIONS=detect_leaks=1 /tmp/ipv6-cleanup-policy
      - name: Compile and run IPv6 global sysctl result propagation regression
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -fno-omit-frame-pointer -I trunk/user/rc/src \
            trunk/user/rc/src/tests/ipv6_global_conf_policy.c \
            -o /tmp/ipv6-global-conf-policy
          ASAN_OPTIONS=detect_leaks=1 /tmp/ipv6-global-conf-policy
      - name: Compile and run LAN IPv6 address reload sequencing regression
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -fno-omit-frame-pointer -I trunk/user/rc/src \
            trunk/user/rc/src/tests/lan_addr6_reload_policy.c \
            -o /tmp/lan-addr6-reload-policy
          ASAN_OPTIONS=detect_leaks=1 /tmp/lan-addr6-reload-policy
      - name: Compile and run WAN IPv6 teardown selection regression
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -fno-omit-frame-pointer -I trunk/user/rc/src \
            trunk/user/rc/src/tests/wan6_teardown_policy.c \
            -o /tmp/wan6-teardown-policy
          ASAN_OPTIONS=detect_leaks=1 /tmp/wan6-teardown-policy
      - name: Compile and run static IPTV multicast startup status regression
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -fno-omit-frame-pointer -I trunk/user/rc/src \
            trunk/user/rc/src/tests/wan_viptv_static_policy.c \
            -o /tmp/wan-viptv-static-policy
          ASAN_OPTIONS=detect_leaks=1 /tmp/wan-viptv-static-policy
      - name: Compile and run WAN resolver blocked-upstream regression
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -I trunk/user/rc/src trunk/user/rc/src/tests/wan_resolver_refresh_policy.c -o /tmp/wan-resolver-refresh-policy
          ASAN_OPTIONS=detect_leaks=1 /tmp/wan-resolver-refresh-policy
      - name: Compile and run bridge membership ownership regression
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -fno-omit-frame-pointer \
            -I trunk/user/shared/src \
            trunk/user/shared/src/tests/bridge_membership_policy.c \
            -o /tmp/bridge-membership-policy
          ASAN_OPTIONS=detect_leaks=1 /tmp/bridge-membership-policy
      - name: Compile and run VLAN interface probe and rollback ownership regression
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -fno-omit-frame-pointer -I trunk/user/rc/src \
            trunk/user/rc/src/tests/vlan_interface_policy.c \
            -o /tmp/vlan-interface-policy
          ASAN_OPTIONS=detect_leaks=1 /tmp/vlan-interface-policy

      - name: Compile and run WAN interface and cache route flush regression
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -fno-omit-frame-pointer -I trunk/user/rc/src \
            trunk/user/rc/src/tests/wan_route_flush_policy.c \
            -o /tmp/wan-route-flush-policy
          ASAN_OPTIONS=detect_leaks=1 /tmp/wan-route-flush-policy
      - name: Compile and run conntrack flush result propagation regression
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -fno-omit-frame-pointer -I trunk/user/rc/src \
            trunk/user/rc/src/tests/conntrack_flush_policy.c \
            -o /tmp/conntrack-flush-policy
          ASAN_OPTIONS=detect_leaks=1 /tmp/conntrack-flush-policy
      - name: Compile and run XUPnPD detached-daemon readiness regression
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -fno-omit-frame-pointer -I trunk/user/shared/src -I trunk/user/rc/src \
            trunk/user/rc/src/tests/xupnpd_daemon_policy.c \
            -o /tmp/xupnpd-daemon-policy
          ASAN_OPTIONS=detect_leaks=1 /tmp/xupnpd-daemon-policy
      - name: Compile and run shared detached-daemon startup readiness regression
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -fno-omit-frame-pointer -I trunk/user/shared/src -I trunk/user/rc/src \
            trunk/user/rc/src/tests/detached_daemon_start_policy.c \
            -o /tmp/detached-daemon-start-policy
          ASAN_OPTIONS=detect_leaks=1 /tmp/detached-daemon-start-policy
          python3 scripts/check_udpxy_startup.py
      - name: Compile and run XUPnPD storage preparation regression
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -fno-omit-frame-pointer -I trunk/user/rc/src \
            trunk/user/rc/src/tests/xupnpd_config_file.c \
            -o /tmp/xupnpd-config-file
          ASAN_OPTIONS=detect_leaks=1 /tmp/xupnpd-config-file
          python3 scripts/check_xupnpd_startup.py
      - name: Verify WAN VLAN and bridge error propagation
        run: python3 scripts/check_wan_vlan_setup.py
      - name: Verify WAN firewall result propagation
        run: python3 scripts/check_wan_firewall_status.py
      - name: Verify WAN DDNS update status propagation
        run: python3 scripts/check_wan_ddns_status.py
      - name: Verify WAN ZeroTier launch status propagation
        run: python3 scripts/check_wan_zerotier_status.py
      - name: Verify AP-client WISP readiness result propagation
        run: python3 scripts/check_apcli_wait_status.py
      - name: Verify WAN startup and reload network sysctl status propagation
        run: python3 scripts/check_network_sysctl_status.py
      - name: Verify WAN gateway ARP checker launch result propagation
        run: python3 scripts/check_wan_detect_wan_status.py
      - name: Verify physical WAN initial MTU status and static override
        run: python3 scripts/check_wan_initial_mtu_status.py
      - name: Verify deferred WAN reconnect watchdog launch status
        run: python3 scripts/check_wan_deferred_watchdog_status.py
      - name: Verify PPPoE-MWAN detect status and command safety
        run: |
          set -eu
          bash -n trunk/user/pppoe/detect.sh
          bash -n trunk/user/pppoe/tests/detect_status.sh
          bash trunk/user/pppoe/tests/detect_status.sh
      - name: Verify PPPoE-MWAN private options and partial launch rollback
        run: |
          set -eu
          sh -n trunk/user/pppoe/mwan.sh
          bash -n trunk/user/pppoe/tests/mwan_lifecycle.sh
          bash trunk/user/pppoe/tests/mwan_lifecycle.sh "$GITHUB_WORKSPACE"
      - name: Compile and run RPL2TP session rollback policy regression
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -fno-omit-frame-pointer -I trunk/user/shared/src -I trunk/user/rc/src \
            trunk/user/rc/src/tests/xl2tpd_start_policy.c \
            -o /tmp/xl2tpd-start-policy
          ASAN_OPTIONS=detect_leaks=1 /tmp/xl2tpd-start-policy
      - name: Verify PPPoE-MWAN WAN-up and WAN-down result propagation
        run: python3 scripts/check_pppoe_mwan_status.py
      - name: Verify route result propagation and cleanup ordering
        run: |
          python3 - <<'PY'
          from pathlib import Path
          rc = Path("trunk/user/rc/src")
          net = (rc / "net.c").read_text()
          net_lan = (rc / "net_lan.c").read_text()
          net_lan6 = (rc / "net_lan6.c").read_text()
          lan6_reload_policy = (rc / "lan_addr6_reload_policy.h").read_text()
          lan6_reload_test = (rc / "tests/lan_addr6_reload_policy.c").read_text()
          wan = (rc / "net_wan.c").read_text()

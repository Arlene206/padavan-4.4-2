name: WAN route operation status regression

on:
  push:
    paths:
      - ".github/workflows/wan-route-status.yml"
      - "trunk/user/rc/src/net.c"
      - "trunk/linux-4.4.x/net/ipv4/fib_trie.c"
      - "trunk/linux-4.4.x/net/ipv4/fib_semantics.c"
      - "trunk/linux-4.4.x/net/ipv4/fib_frontend.c"
      - "trunk/user/rc/src/net_wan.c"
      - "trunk/user/rc/src/net_ppp.c"
      - "trunk/user/rc/src/rc.h"
      - "trunk/user/rc/src/route_status_policy.h"
      - "trunk/user/rc/src/tests/route_status_policy.c"
  pull_request:
    paths:
      - ".github/workflows/wan-route-status.yml"
      - "trunk/user/rc/src/net.c"
      - "trunk/linux-4.4.x/net/ipv4/fib_trie.c"
      - "trunk/linux-4.4.x/net/ipv4/fib_semantics.c"
      - "trunk/linux-4.4.x/net/ipv4/fib_frontend.c"
      - "trunk/user/rc/src/net_wan.c"
      - "trunk/user/rc/src/net_ppp.c"
      - "trunk/user/rc/src/rc.h"
      - "trunk/user/rc/src/route_status_policy.h"
      - "trunk/user/rc/src/tests/route_status_policy.c"

jobs:
  wan-route-status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile route status regression with sanitizers
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -I trunk/user/rc/src \
            trunk/user/rc/src/tests/route_status_policy.c \
            -o /tmp/route-status-policy
          ASAN_OPTIONS=detect_leaks=1 /tmp/route-status-policy
      - name: Verify route result propagation and cleanup ordering
        run: |
          python3 - <<'PY'
          from pathlib import Path
          rc = Path("trunk/user/rc/src")
          net = (rc / "net.c").read_text()
          wan = (rc / "net_wan.c").read_text()
          ppp = (rc / "net_ppp.c").read_text()
          header = (rc / "rc.h").read_text()
          policy = (rc / "route_status_policy.h").read_text()
          fib_trie = Path("trunk/linux-4.4.x/net/ipv4/fib_trie.c").read_text()
          fib_semantics = Path("trunk/linux-4.4.x/net/ipv4/fib_semantics.c").read_text()
          fib_frontend = Path("trunk/linux-4.4.x/net/ipv4/fib_frontend.c").read_text()
          workflow = Path(".github/workflows/wan-route-status.yml").read_text()

          def body(source, signature):
              start = source.index(signature)
              brace = source.index("{", start)
              depth = 0
              for pos in range(brace, len(source)):
                  if source[pos] == "{":
                      depth += 1
                  elif source[pos] == "}":
                      depth -= 1
                      if depth == 0:
                          return source[brace + 1:pos]
              raise AssertionError(f"unterminated function: {signature}")

          assert '#include "route_status_policy.h"' in net
          assert '#include "route_status_policy.h"' in wan
          static = body(net, "control_static_routes(char *ift, char *ifname, int is_add)")
          assert "int status = 0, route_status;" in static
          assert "route_status = is_add ?" in static
          assert "status = route_status_accumulate(status, route_status);" in static
          assert "return status;" in static
          assert "return 0;" not in static[static.index("foreach("):]
          assert "route_add(ifname" in static and "route_del(ifname" in static
          add_selector = static.index("route_status = is_add ?")
          normalize_add = static.index("route_status = route_status_idempotent_add(route_status);")
          accumulate_add = static.index("status = route_status_accumulate(status, route_status);", normalize_add)
          assert add_selector < normalize_add < accumulate_add
          assert "if (is_add)" in static[add_selector:normalize_add]
          idempotent_add = body(policy, "route_status_idempotent_add(")
          assert "return operation_status == EEXIST ? 0 : operation_status;" in idempotent_add
          demand_ready = body(policy, "route_status_demand_ready(")
          assert "return route_status == 0;" in demand_ready

          route_manip = body(net, "route_manip(int cmd, char *ifname, int metric, char *dst, char *gateway, char *genmask)")
          route_add = body(net, "route_add(char *ifname, int metric, char *dst, char *gateway, char *genmask)")
          assert "saved_errno = errno;" in route_manip and "return saved_errno;" in route_manip
          assert "route_manip(SIOCADDRT, ifname" in route_add

          # Linux 4.4's SIOCADDRT path returns EEXIST only for an identical FIB route.
          rtentry_config = body(fib_frontend, "rtentry_to_fib_config(struct net *net, int cmd, struct rtentry *rt,")
          assert "cfg->fc_nlflags = NLM_F_CREATE;" in rtentry_config
          assert "NLM_F_EXCL" not in rtentry_config
          ioctl_path = body(fib_frontend, "ip_rt_ioctl(struct net *net, unsigned int cmd, void __user *arg)")
          assert "err = fib_table_insert(tb, &cfg);" in ioctl_path and "return err;" in ioctl_path
          fib_insert = body(fib_trie, "fib_table_insert(struct fib_table *tb, struct fib_config *cfg)")
          assert "err = -EEXIST;" in fib_insert
          same_type = fib_insert.index("fa->fa_type == cfg->fc_type &&")
          same_info = fib_insert.index("fa->fa_info == fi", same_type)
          duplicate_match = fib_insert.index("if (fa_match)", same_info)
          duplicate_exit = fib_insert.index("goto out;", duplicate_match)
          assert same_type < same_info < duplicate_match < duplicate_exit
          fib_find = body(fib_semantics, "fib_find_info(const struct fib_info *nfi)")
          assert "nfi->fib_priority == fi->fib_priority" in fib_find
          assert "nh_comp(fi, nfi) == 0" in fib_find
          fib_create = body(fib_semantics, "fib_create_info(struct fib_config *cfg)")
          assert "ofi = fib_find_info(fi);" in fib_create and "return ofi;" in fib_create

          dynamic = body(wan, "control_dhcp_routes(char *rt, char *rt_rfc, char *rt_ms,")
          assert "static int\ncontrol_dhcp_routes(" in wan
          assert dynamic.count("route_status_accumulate(status, route_status)") == 2
          assert dynamic.count("strdup(") == 2
          assert dynamic.count("status = route_status_accumulate(status, ENOMEM);") == 2
          assert dynamic.count("route_status = is_add ?") == 2
          assert "return status;" in dynamic and "errno == ERANGE" in dynamic
          assert "return;" not in dynamic

          wrappers = (
              ("add_dhcp_routes(char *rt, char *rt_rfc, char *rt_ms, char *ifname, int metric)",
               "return control_dhcp_routes(rt, rt_rfc, rt_ms, ifname, metric, 1);"),
              ("add_dhcp_routes_by_prefix(char *prefix, char *ifname, int metric)",
               "return add_dhcp_routes(rt, rt_rfc, rt_ms, ifname, metric);"),
              ("del_dhcp_routes_by_prefix(char *prefix, char *ifname, int metric)",
               "return control_dhcp_routes(rt, rt_rfc, rt_ms, ifname, metric, 0);"),
          )
          for signature, expected in wrappers:
              assert "int\n" + signature in wan
              assert expected in body(wan, signature)
              name = signature.split("(")[0]
              assert "int  " + name in header and "void " + name not in header

          man_down = body(wan, "man_down_internal(char *man_ifname, int unit, int clear_dhcp_address)")
          dns_loop_start = man_down.index("foreach(word, man_dns, next)")
          dns_loop_end = man_down.index("\n\t\t\t}", dns_loop_start)
          dns_loop = man_down[dns_loop_start:dns_loop_end]
          assert '!is_same_subnet(word, man_addr, man_mask)) {' in dns_loop
          assert 'route_status = route_del(man_ifname, 2, word, man_gate, "255.255.255.255");' in dns_loop
          assert 'status = route_status_accumulate(status, route_status);' in dns_loop
          assert "static int\nman_down_internal(" in wan
          assert "int status = 0, route_status;" in man_down
          assert man_down.count("route_status = route_del(") == 3
          assert man_down.count("status = route_status_accumulate(status, route_status);") == 5
          assert "route_status = del_dhcp_routes_by_prefix(\"wanx_\"" in man_down
          assert "route_status = del_static_man_routes(" in man_down
          assert "return status;" in man_down
          assert man_down.index('del_dhcp_routes_by_prefix("wanx_"') < man_down.index("del_static_man_routes(")
          assert man_down.index("del_static_man_routes(") < man_down.index('nvram_set_temp("wanx_ipaddr", "0.0.0.0")')
          assert man_down.index('route_del(man_ifname, 2, man_gate, NULL, "255.255.255.255")') < man_down.index('nvram_set_temp("wanx_ipaddr", "0.0.0.0")')
          assert man_down.index('nvram_set_temp("wanx_ipaddr", "0.0.0.0")') < man_down.index('nvram_set_temp("wanx_gateway", "")')
          public_man_down = body(wan, "man_down(char *man_ifname, int unit)")
          assert "man_down_internal(man_ifname, unit, 0)" in public_man_down
          assert "MAN route teardown incomplete" in public_man_down

          wan_down = body(wan, "wan_down_internal(char *wan_ifname, int unit, int is_static)")
          assert "static int\nwan_down_internal(" in wan
          assert "int status = 0, route_status;" in wan_down
          assert "route_status = del_dhcp_routes_by_prefix(prefix, wan_ifname, 0);" in wan_down
          assert "route_status = route_del(wan_ifname, 1" in wan_down
          assert "route_status = del_static_wan_routes(wan_ifname);" in wan_down
          assert "status = route_status_accumulate(status, route_status);" in wan_down
          assert "return status;" in wan_down
          assert wan_down.index("del_dhcp_routes_by_prefix(prefix") < wan_down.index("del_static_wan_routes(")
          assert wan_down.index("del_static_wan_routes(") < wan_down.index("control_wan_led_isp_state(0, 0)")
          public_wan_down = body(wan, "wan_down(char *wan_ifname, int unit, int is_static)")
          assert "wan_down_internal(wan_ifname, unit, is_static)" in public_wan_down
          assert "WAN route teardown incomplete" in public_wan_down

          gateway_add = body(wan, "add_man_gateway_routes(char *man_ifname, int unit, int metric)")
          assert "static int" + chr(10) + "add_man_gateway_routes(" in wan
          assert gateway_add.count("route_status = route_add(") == 3
          assert gateway_add.count("route_status_accumulate(status, route_status)") == 3
          assert gateway_add.count("route_add(") == 3
          assert "return status;" in gateway_add
          assert "failed to add MAN gateway host route" in gateway_add
          assert "failed to add MAN default route" in gateway_add
          assert "failed to add MAN DNS route" in gateway_add

          man_up = body(wan, "man_up_internal(char *man_ifname, int unit, int is_static)")
          assert "static int" + chr(10) + "man_up_internal(" in wan
          assert man_up.count("route_status_accumulate(status, route_status)") == 3
          assert "route_status = add_static_man_routes(man_ifname);" in man_up
          assert 'route_status = add_dhcp_routes_by_prefix("wanx_", man_ifname, 0);' in man_up
          assert "route_status = add_man_gateway_routes(man_ifname, unit, 2);" in man_up
          assert "return status;" in man_up
          public_man_up = body(wan, "man_up(char *man_ifname, int unit, int is_static)")
          assert "man_up_internal(man_ifname, unit, is_static)" in public_man_up
          assert "MAN route setup incomplete" in public_man_up
          assert "void man_up(char *man_ifname, int unit, int is_static);" in header

          wan_up = body(wan, "wan_up_internal(char *wan_ifname, int unit, int is_static)")
          assert "static int" + chr(10) + "wan_up_internal(" in wan
          assert wan_up.count("route_status_accumulate(status, route_status)") == 5
          assert wan_up.count("route_add(") == wan_up.count("route_status = route_add(") == 2
          assert "route_status = add_static_wan_routes(wan_ifname);" in wan_up
          assert "route_status = add_static_man_routes(wan_ifname);" in wan_up
          assert "route_status = add_dhcp_routes_by_prefix(prefix, wan_ifname, 0);" in wan_up
          assert "return status;" in wan_up
          public_wan_up = body(wan, "wan_up(char *wan_ifname, int unit, int is_static)")
          assert "wan_up_internal(wan_ifname, unit, is_static)" in public_wan_up
          assert "WAN route setup incomplete" in public_wan_up
          assert "return status;" in public_wan_up
          assert "int wan_up(char *wan_ifname, int unit, int is_static);" in header
          assert "void wan_up(char *wan_ifname, int unit, int is_static);" not in header

          public_wan_down = body(wan, "wan_down(char *wan_ifname, int unit, int is_static)")
          assert "wan_down_internal(wan_ifname, unit, is_static)" in public_wan_down
          assert "return status;" in public_wan_down
          assert "int wan_down(char *wan_ifname, int unit, int is_static);" in header
          assert "void wan_down(char *wan_ifname, int unit, int is_static);" not in header

          assert '#include "route_status_policy.h"' in ppp
          preset = body(ppp, "preset_wan_ppp_routes(char *ppp_ifname, int unit)")
          assert "int status = 0, route_status;" in preset
          assert "route_status = route_add(ppp_ifname, 1," in preset
          assert "route_status = route_status_idempotent_add(route_status);" in preset
          assert "route_status = add_static_wan_routes(ppp_ifname);" in preset
          assert preset.count("route_status_accumulate(status, route_status)") == 2
          assert "return status;" in preset
          assert "int preset_wan_ppp_routes(char *ppp_ifname, int unit);" in header
          assert "void preset_wan_ppp_routes(char *ppp_ifname, int unit);" not in header

          demand_wait = body(wan, "wait_ppp_up(char *ppp_ifname, int unit)")
          preset_call = demand_wait.index("route_status = preset_wan_ppp_routes(ppp_ifname, unit);")
          ready_gate = demand_wait.index("if (!route_status_demand_ready(route_status))")
          ready_failure = demand_wait.index("return 0;", ready_gate)
          demand_ping = demand_wait.index('doSystem("ping -c1 %s", ppp_gate);')
          assert preset_call < ready_gate < ready_failure < demand_ping
          assert "PPP demand route preinstallation incomplete" in demand_wait
          assert "EEXIST-normalized entries may predate this" in demand_wait
          assert "return 1;" in demand_wait[demand_ping:]

          demand_start = body(wan, "start_wan(void)")
          demand_start_gate = demand_start.index("if (i_demand && !wait_ppp_up(ppp_ifname, unit))")
          demand_fallback = demand_start.index("restore_wan_after_ppp_start_failure(unit, wan_ifname);", demand_start_gate)
          demand_continue = demand_start.index("continue;", demand_fallback)
          assert demand_start_gate < demand_fallback < demand_continue
          demand_restore = body(wan, "restore_wan_after_ppp_start_failure(int unit, char *wan_ifname)")
          assert 'set_wan_unit_value(unit, "ifname_t", wan_ifname);' in demand_restore
          assert "start_firewall_ex();" in demand_restore
          assert "kill_services(" not in demand_restore
          assert "successful ip-up callback may switch the active WAN back to ppp0." in wan

          ppp_launch = body(ppp, "launch_wan_pppd(int unit, int wan_proto)")
          assert 'fprintf(fp, "demand\\n");' in ppp_launch
          assert 'fprintf(fp, "persist\\n");' in ppp_launch
          assert 'fprintf(fp, "maxfail %d\\n", 0);' in ppp_launch
          assert 'fprintf(fp, "holdoff %d\\n", 10);' in ppp_launch
          ipup = body(ppp, "ipup_main(int argc, char **argv)")
          assert "route_status = wan_up(ppp_ifname, unit, 0);" in ipup
          assert "route_status = add_static_wan_routes(ppp_ifname);" in preset

          ipdown = body(ppp, "ipdown_main(int argc, char **argv)")
          down_teardown = ipdown.index("teardown_status = wan_down(ppp_ifname, unit, 0);")
          down_restore = ipdown.index("restore_status = preset_wan_ppp_routes(ppp_ifname, unit);")
          down_accumulate = ipdown.index("route_status = route_status_accumulate(teardown_status, restore_status);")
          down_unlock = ipdown.index("unlock_status = ppp_wan_session_state_unlock(callback_fd);")
          down_finish = ipdown.index("return route_status_finish(route_status, unlock_status);")
          assert down_teardown < down_restore < down_accumulate < down_unlock < down_finish
          assert "Disconnected but WAN route cleanup/restoration is incomplete" in ipdown
          finish_status = body((rc / "route_status_policy.h").read_text(), "route_status_finish(")
          assert "return unlock_status ? unlock_status : operation_status;" in finish_status

          bound = body(wan, "udhcpc_bound(char *wan_ifname, int is_renew_mode)")
          assert "int interface_status, rollback_status, route_setup_status;" in bound
          assert "route_setup_status = man_up_internal(wan_ifname, unit, 0);" in bound
          assert "route_setup_status = wan_up_internal(wan_ifname, unit, 0);" in bound
          assert "accepted but route setup is incomplete" in bound
          assert "return route_setup_status;" in bound

          deconfig = body(wan, "udhcpc_deconfig(char *wan_ifname, int is_zcip)")
          assert "cleanup_status = man_down_internal(wan_ifname, unit, reset_man_address)" in deconfig
          assert "cleanup_status = wan_down_internal(wan_ifname, unit, 0)" in deconfig
          assert "return route_status_accumulate(interface_status, cleanup_status);" in deconfig

          paths = (
              ".github/workflows/wan-route-status.yml",
              "trunk/user/rc/src/net.c",
              "trunk/linux-4.4.x/net/ipv4/fib_trie.c",
              "trunk/linux-4.4.x/net/ipv4/fib_semantics.c",
              "trunk/linux-4.4.x/net/ipv4/fib_frontend.c",
              "trunk/user/rc/src/net_wan.c",
              "trunk/user/rc/src/net_ppp.c",
              "trunk/user/rc/src/rc.h",
              "trunk/user/rc/src/route_status_policy.h",
              "trunk/user/rc/src/tests/route_status_policy.c",
          )
          filters = workflow.split("jobs:", 1)[0]
          push_filters, pr_filters = filters.split("  pull_request:", 1)
          for path in paths:
              assert push_filters.count(path) == 1, f"push path missing/duplicated: {path}"
              assert pr_filters.count(path) == 1, f"pull_request path missing/duplicated: {path}"
          print("WAN route result propagation and cleanup ordering contracts: PASS")
          PY

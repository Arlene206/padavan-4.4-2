              ("WAN", wan_down, 'route_status = set_nvram_value_status("vpnc_dns_t", "")'),
          ):
              pause_at = teardown.index("route_status = notify_pause_detect_internet();")
              merge_at = teardown.index(
                  "status = route_status_accumulate(status, route_status);", pause_at
              )
              first_cleanup_at = teardown.index(first_cleanup, pause_at)
              assert pause_at < merge_at < first_cleanup_at, name
              assert "if (route_status != 0)" in teardown[merge_at:first_cleanup_at], name
              assert "return status;" in teardown, name
              assert "(void)notify_pause_detect_internet();" not in teardown, name
              assert "DHCP loss is already committed" in teardown or name == "WAN"
          assert "test_dhcp_down_monitor_pause_failure_is_reported_and_cleanup_continues" in (
              (rc / "tests/route_status_policy.c").read_text()
          )
          print("WAN route result propagation, LAN rollback and cleanup ordering contracts: PASS")
          PY

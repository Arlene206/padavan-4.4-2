name: Router mode NVRAM update failure regression

on:
  push:
    paths:
      - ".github/workflows/router-mode-update.yml"
      - "scripts/check_router_mode_update.py"
      - "trunk/user/rc/src/common_ex.c"
      - "trunk/user/rc/src/router_mode_nvram_policy.h"
      - "trunk/user/rc/src/tests/router_mode_nvram_policy.c"
      - "trunk/user/rc/src/rc.h"
      - "trunk/user/rc/src/rc.c"
      - "trunk/user/rc/src/net_wan.c"
  pull_request:
    paths:
      - ".github/workflows/router-mode-update.yml"
      - "scripts/check_router_mode_update.py"
      - "trunk/user/rc/src/common_ex.c"
      - "trunk/user/rc/src/router_mode_nvram_policy.h"
      - "trunk/user/rc/src/tests/router_mode_nvram_policy.c"
      - "trunk/user/rc/src/rc.h"
      - "trunk/user/rc/src/rc.c"
      - "trunk/user/rc/src/net_wan.c"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: router-mode-update-${{ github.ref }}
  cancel-in-progress: true

jobs:
  router-mode-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run GNU89 router-mode policy regression
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -fno-omit-frame-pointer -I trunk/user/rc/src \
            trunk/user/rc/src/tests/router_mode_nvram_policy.c \
            -o "$RUNNER_TEMP/router_mode_nvram_policy"
          ASAN_OPTIONS=detect_leaks=1 "$RUNNER_TEMP/router_mode_nvram_policy"
      - name: Verify checked router-mode update wiring
        run: python3 scripts/check_router_mode_update.py

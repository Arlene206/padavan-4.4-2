name: DHCP relay inbound packet bounds regression

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/udhcp-relay-packet-bounds.yml"
      - "trunk/user/busybox/busybox-1.24.x/networking/udhcp/dhcprelay.c"
      - "trunk/user/busybox/busybox-1.24.x/networking/udhcp/udhcp_relay_packet_bounds.h"
      - "trunk/user/busybox/busybox-1.24.x/networking/udhcp/tests/dhcprelay_packet_bounds.c"
      - "scripts/check_udhcp_relay_packet_bounds.py"
  pull_request:
    paths:
      - ".github/workflows/udhcp-relay-packet-bounds.yml"
      - "trunk/user/busybox/busybox-1.24.x/networking/udhcp/dhcprelay.c"
      - "trunk/user/busybox/busybox-1.24.x/networking/udhcp/udhcp_relay_packet_bounds.h"
      - "trunk/user/busybox/busybox-1.24.x/networking/udhcp/tests/dhcprelay_packet_bounds.c"
      - "scripts/check_udhcp_relay_packet_bounds.py"

permissions:
  contents: read

jobs:
  dhcprelay-packet-bounds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run GNU89 ASan/UBSan packet bounds regression
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -fno-omit-frame-pointer \
            -Itrunk/user/busybox/busybox-1.24.x/networking/udhcp \
            trunk/user/busybox/busybox-1.24.x/networking/udhcp/tests/dhcprelay_packet_bounds.c \
            -o /tmp/dhcprelay_packet_bounds_test
          ASAN_OPTIONS=detect_leaks=1:abort_on_error=1 \
            /tmp/dhcprelay_packet_bounds_test
      - name: Verify DHCP relay receive-path contract
        run: python3 scripts/check_udhcp_relay_packet_bounds.py

name: WAN DHCP callback state stability regression

on:
  push:
    paths:
      - "scripts/check_lan_dhcp_deconfig.py"
      - "scripts/check_wan_ifname_bounds.py"
      - "trunk/user/rc/src/wan_ifname_policy.h"
      - "trunk/user/rc/src/tests/wan_ifname_policy.c"
      - "trunk/user/rc/src/services_ex.c"
      - "trunk/user/rc/src/firewall_ex.c"
      - "scripts/check_wan6_dns_policy.py"
      - "trunk/user/rc/src/wan6_dns_policy.h"
      - "trunk/user/rc/src/tests/wan6_dns_policy.c"
      - "trunk/user/rc/src/tests/dhcp_lease_policy.c"
      - "trunk/user/rc/src/lan_kernel_name_policy.h"
      - "trunk/user/rc/src/tests/lan_kernel_name_policy.c"
      - "trunk/user/rc/src/dhcp_lease_policy.h"
      - ".github/workflows/wan-dhcp-callback-stability.yml"
      - "trunk/user/rc/src/net_wan.c"
      - "trunk/user/rc/src/wan_mtu_setup_policy.h"
      - "trunk/user/rc/src/net_wan6.c"
      - "trunk/user/rc/src/wan6_teardown_policy.h"
      - "trunk/user/rc/src/tests/wan6_teardown_policy.c"
      - "trunk/user/rc/src/common_ex.c"
      - "trunk/user/busybox/busybox-1.24.x/libbb/vfork_daemon_rexec.c"
      - "trunk/user/busybox/busybox-1.24.x/libbb/xfuncs.c"
      - "trunk/user/busybox/busybox-1.24.x/networking/udhcp/dhcp6c_script.c"
      - "trunk/user/busybox/busybox-1.24.x/networking/udhcp/dhcp6c.c"
      - "trunk/user/rc/src/tests/dhcp6c_callback_generation.c"
      - "trunk/user/rc/src/dhcp6c_callback_generation_policy.h"
      - "trunk/user/rc/src/net6.c"
      - "trunk/user/rc/src/tests/file_write_status.c"
      - "trunk/user/shared/src/netutils.c"
      - "trunk/user/shared/src/netutils.h"
      - "trunk/user/shared/src/shutils.c"
      - "trunk/user/shared/src/file_write_status.h"
      - "trunk/user/rc/src/net_ppp.c"
      - "trunk/user/rc/src/net.c"
      - "trunk/user/rc/src/ppp_wan_ipup_policy.h"
      - "trunk/user/rc/src/tests/ppp_wan_ipup_policy.c"
      - "trunk/user/rc/src/rc.h"
      - "trunk/user/rc/src/dhcp6c_config_file.h"
      - "trunk/user/rc/src/tests/dhcp6c_config_file.c"
      - "trunk/user/rc/src/dhcp_wan_interface_policy.h"
      - "trunk/user/rc/src/dhcp_wan_route_transition_policy.h"
      - "trunk/user/rc/src/tests/dhcp_wan_interface_policy.c"
      - "trunk/user/rc/src/wan_viptv_static_policy.h"
      - "trunk/user/rc/src/tests/wan_viptv_static_policy.c"
      - "trunk/user/busybox/busybox-1.24.x/networking/zcip.c"
      - "trunk/user/rc/src/net_lan.c"
      - "trunk/user/rc/src/lan_dhcp_callback_policy.h"
      - "trunk/user/rc/src/tests/lan_dhcp_callback_policy.c"
  pull_request:
    paths:
      - "scripts/check_lan_dhcp_deconfig.py"
      - "scripts/check_wan_ifname_bounds.py"
      - "trunk/user/rc/src/wan_ifname_policy.h"
      - "trunk/user/rc/src/tests/wan_ifname_policy.c"
      - "trunk/user/rc/src/services_ex.c"
      - "trunk/user/rc/src/firewall_ex.c"
      - "scripts/check_wan6_dns_policy.py"
      - "trunk/user/rc/src/wan6_dns_policy.h"
      - "trunk/user/rc/src/tests/wan6_dns_policy.c"
      - "trunk/user/rc/src/tests/dhcp_lease_policy.c"
      - "trunk/user/rc/src/lan_kernel_name_policy.h"
      - "trunk/user/rc/src/tests/lan_kernel_name_policy.c"
      - "trunk/user/rc/src/dhcp_lease_policy.h"
      - ".github/workflows/wan-dhcp-callback-stability.yml"
      - "trunk/user/rc/src/net_wan.c"
      - "trunk/user/rc/src/wan_mtu_setup_policy.h"
      - "trunk/user/rc/src/net_wan6.c"
      - "trunk/user/rc/src/wan6_teardown_policy.h"
      - "trunk/user/rc/src/tests/wan6_teardown_policy.c"
      - "trunk/user/rc/src/common_ex.c"
      - "trunk/user/busybox/busybox-1.24.x/libbb/vfork_daemon_rexec.c"
      - "trunk/user/busybox/busybox-1.24.x/libbb/xfuncs.c"
      - "trunk/user/busybox/busybox-1.24.x/networking/udhcp/dhcp6c_script.c"
      - "trunk/user/busybox/busybox-1.24.x/networking/udhcp/dhcp6c.c"
      - "trunk/user/rc/src/tests/dhcp6c_callback_generation.c"
      - "trunk/user/rc/src/dhcp6c_callback_generation_policy.h"
      - "trunk/user/rc/src/net6.c"
      - "trunk/user/rc/src/tests/file_write_status.c"
      - "trunk/user/shared/src/netutils.c"
      - "trunk/user/shared/src/netutils.h"
      - "trunk/user/shared/src/shutils.c"
      - "trunk/user/shared/src/file_write_status.h"
      - "trunk/user/rc/src/net_ppp.c"
      - "trunk/user/rc/src/net.c"
      - "trunk/user/rc/src/ppp_wan_ipup_policy.h"
      - "trunk/user/rc/src/tests/ppp_wan_ipup_policy.c"
      - "trunk/user/rc/src/rc.h"
      - "trunk/user/rc/src/dhcp6c_config_file.h"
      - "trunk/user/rc/src/tests/dhcp6c_config_file.c"
      - "trunk/user/rc/src/dhcp_wan_interface_policy.h"
      - "trunk/user/rc/src/dhcp_wan_route_transition_policy.h"
      - "trunk/user/rc/src/tests/dhcp_wan_interface_policy.c"
      - "trunk/user/rc/src/wan_viptv_static_policy.h"
      - "trunk/user/rc/src/tests/wan_viptv_static_policy.c"
      - "trunk/user/busybox/busybox-1.24.x/networking/zcip.c"

      - "trunk/user/rc/src/net_lan.c"
      - "trunk/user/rc/src/lan_dhcp_callback_policy.h"
      - "trunk/user/rc/src/tests/lan_dhcp_callback_policy.c"
jobs:
  wan-dhcp-callback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run WAN interface-name bounds regression
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -I trunk/user/rc/src trunk/user/rc/src/tests/wan_ifname_policy.c -o /tmp/wan-ifname-policy
          ASAN_OPTIONS=detect_leaks=1 /tmp/wan-ifname-policy
          python3 scripts/check_wan_ifname_bounds.py
      - name: Compile and run LAN DHCP deconfig policy regression
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -I trunk/user/rc/src trunk/user/rc/src/tests/dhcp_lease_policy.c -o /tmp/dhcp-lease-policy
          ASAN_OPTIONS=detect_leaks=1 /tmp/dhcp-lease-policy
          python3 scripts/check_lan_dhcp_deconfig.py
      - name: Verify DHCPv6 automatic DNS withdrawal contract
        run: python3 scripts/check_wan6_dns_policy.py
      - name: Compile and run WAN DHCPv6 DNS withdrawal policy regression
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -I trunk/user/rc/src trunk/user/rc/src/tests/wan6_dns_policy.c -o /tmp/wan6-dns-policy
          ASAN_OPTIONS=detect_leaks=1 /tmp/wan6-dns-policy
      - name: Compile and run LAN kernel hostname/domain status regression
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -I trunk/user/rc/src trunk/user/rc/src/tests/lan_kernel_name_policy.c -o /tmp/lan-kernel-name-policy
          ASAN_OPTIONS=detect_leaks=1 /tmp/lan-kernel-name-policy
      - name: Compile and run WAN DHCP interface rollback regression
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror \
            -I trunk/user/rc/src \
            trunk/user/rc/src/tests/dhcp_wan_interface_policy.c \
            -o /tmp/dhcp-wan-interface-policy
          /tmp/dhcp-wan-interface-policy
      - name: Compile and run static IPTV startup status regression
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror \
            -I trunk/user/rc/src \
            trunk/user/rc/src/tests/wan_viptv_static_policy.c \
            -o /tmp/wan-viptv-static-policy
          /tmp/wan-viptv-static-policy
      - name: Compile and run DHCPv6 config publication regression
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror \
            -I trunk/user/rc/src \
            trunk/user/rc/src/tests/dhcp6c_config_file.c \
            -o /tmp/dhcp6c-config-file
          /tmp/dhcp6c-config-file
      - name: Compile and run shared file write/close status regression
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror \
            -I trunk/user/shared/src \
            trunk/user/rc/src/tests/file_write_status.c \
            -o /tmp/file-write-status
          /tmp/file-write-status
      - name: Compile and run PPP IPv4 callback publication regression
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror \
            -I trunk/user/rc/src \
            trunk/user/rc/src/tests/ppp_wan_ipup_policy.c \
            -o /tmp/ppp-wan-ipup-policy
          /tmp/ppp-wan-ipup-policy
      - name: Compile and run DHCPv6 callback generation/stop fencing regression
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror \
            -I trunk/user/rc/src \
            trunk/user/rc/src/tests/dhcp6c_callback_generation.c \
            -o /tmp/dhcp6c-callback-generation
          /tmp/dhcp6c-callback-generation
      - name: Compile and run LAN DHCP post-commit callback status regression
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -fno-omit-frame-pointer -I trunk/user/rc/src \
            trunk/user/rc/src/tests/lan_dhcp_callback_policy.c \
            -o /tmp/lan-dhcp-callback-policy
          ASAN_OPTIONS=detect_leaks=1 /tmp/lan-dhcp-callback-policy
      - name: Verify WAN callback applies interface before publishing lease state
        run: |
          python3 - <<'PY'
          from pathlib import Path

          rc = Path("trunk/user/rc/src")
          source = (rc / "net_wan.c").read_text()
          lan_source = (rc / "net_lan.c").read_text()
          assert "!lan_hname || !is_valid_hostname(lan_hname)" in lan_source
          lan_callback_policy = (rc / "lan_dhcp_callback_policy.h").read_text()
          lan_callback_test = (rc / "tests/lan_dhcp_callback_policy.c").read_text()
          wan6_source = (rc / "net_wan6.c").read_text()
          wan6_policy = (rc / "wan6_teardown_policy.h").read_text()
          wan6_test = (rc / "tests/wan6_teardown_policy.c").read_text()
          ppp_source = (rc / "net_ppp.c").read_text()
          rc_header = (rc / "rc.h").read_text()
          net6_source = (rc / "net6.c").read_text()
          shared = Path("trunk/user/shared/src")
          netutils_source = (shared / "netutils.c").read_text()
          netutils_header = (shared / "netutils.h").read_text()
          shutils_source = (shared / "shutils.c").read_text()
          file_write_policy = (shared / "file_write_status.h").read_text()
          file_write_test = (rc / "tests/file_write_status.c").read_text()
          config_policy = (rc / "dhcp6c_config_file.h").read_text()
          config_test = (rc / "tests/dhcp6c_config_file.c").read_text()
          policy = (rc / "dhcp_wan_interface_policy.h").read_text()
          route_policy = (rc / "dhcp_wan_route_transition_policy.h").read_text()
          workflow = Path(".github/workflows/wan-dhcp-callback-stability.yml").read_text()
          ipup_policy = (rc / "ppp_wan_ipup_policy.h").read_text()
          ipup_test = (rc / "tests/ppp_wan_ipup_policy.c").read_text()
          dhcp6_callback_policy = (rc / "dhcp6c_callback_generation_policy.h").read_text()
          dhcp6_callback_test = (rc / "tests/dhcp6c_callback_generation.c").read_text()
          dhcp6_client_source = Path("trunk/user/busybox/busybox-1.24.x/networking/udhcp/dhcp6c.c").read_text()
          dhcp6_script_source = Path("trunk/user/busybox/busybox-1.24.x/networking/udhcp/dhcp6c_script.c").read_text()
          busybox_spawn_source = Path("trunk/user/busybox/busybox-1.24.x/libbb/vfork_daemon_rexec.c").read_text()
          busybox_wait_source = Path("trunk/user/busybox/busybox-1.24.x/libbb/xfuncs.c").read_text()
          common_ex_source = Path("trunk/user/rc/src/common_ex.c").read_text()

          def body(text, signature):
              start = text.index(signature)
              brace = text.index("{", start)
              depth = 0
              for pos in range(brace, len(text)):
                  if text[pos] == "{":
                      depth += 1
                  elif text[pos] == "}":
                      depth -= 1
                      if depth == 0:
                          return text[brace + 1:pos]
              raise AssertionError(f"unterminated function: {signature}")

          for name in (
              "man_down_internal",
              "zcip_bound",
              "zcip_viptv_bound",
              "manv_route_deconfig",
              "udhcpc_viptv_deconfig",
              "zcip_viptv_deconfig",
          ):
              signature = "static int" + chr(10) + name + "("
              assert signature in source, f"expected one private int definition: {name}"
          assert '#include "dhcp_wan_interface_policy.h"' in source
          interface_test = (rc / "tests/dhcp_wan_interface_policy.c").read_text()
          assert "dhcp_wan_interface_name_is_valid" in policy
          assert "test_dhcp_entrypoint_rejects_missing_interface_environment" in interface_test
          for signature, interface_name in (
              ("udhcpc_main(int argc, char **argv)", "wan_ifname"),
              ("udhcpc_viptv_main(int argc, char **argv)", "man_ifname"),
              ("zcip_main(int argc, char **argv)", "man_ifname"),
              ("zcip_viptv_main(int argc, char **argv)", "man_ifname"),
          ):
              entrypoint = body(source, signature)
              assert "dhcp_wan_interface_name_is_valid(" + interface_name + ")" in entrypoint
              assert "strlen(" + interface_name + ")" not in entrypoint
          callback = body(source, "udhcpc_bound(char *wan_ifname, int is_renew_mode)")
          viptv_bound = body(source, "udhcpc_viptv_bound(char *man_ifname, int is_renew_mode)")
          assert "int interface_status, rollback_status, route_setup_status, mtu_status;" in viptv_bound
          assert "mtu_status = set_interface_mtu(man_ifname, dhcp_mtu);" in viptv_bound
          apply = callback.index("dhcp_wan_interface_apply(")
          route_transition = callback.index("dhcp_wan_route_transition_apply(")
          primary_state = callback.index("wan_dhcp_nvram_state_publish(")
          assert apply < route_transition < primary_state
          assert "preserving previous lease and routes" in callback
          assert "failed to restore previous DHCP address" in callback
          assert "ifconfig(wan_ifname" not in callback
          assert callback.index("wan_dhcp_interface_clear(&interface_context)") < route_transition
          assert "preserving old lease" in callback
          assert "failed to restore previous DHCP route inventory" in callback
          transition = body(route_policy, "dhcp_wan_route_transition_apply(")
          assert "dhcp_lease_route_delete_is_ok(operation_status)" in transition
          assert "dhcp_wan_route_transition_restore_old(" in transition
          restore_old = body(route_policy, "dhcp_wan_route_transition_restore_old(")
          assert "ops->restore_old_address(context)" in restore_old
          assert "ops->restore_old_routes(context)" in restore_old
          assert restore_old.index("ops->restore_old_address(context)") < restore_old.index("ops->restore_old_routes(context)")
          delete_host = body(source, "wan_dhcp_delete_old_host_route(void *opaque)")
          assert "return route_del(context->interface_context->ifname" in delete_host
          restore_address = body(source, "wan_dhcp_restore_old_address(void *opaque)")
          assert "wan_dhcp_interface_set" in restore_address and "wan_dhcp_interface_clear" in restore_address
          restore_routes = body(source, "wan_dhcp_restore_old_routes(void *opaque)")
          assert "route_add(ifname, context->route_metric" in restore_routes
          assert "if (context->restore_host_route &&" in restore_routes
          assert "dhcp_wan_route_setup_retry_required(int route_setup_status)" in route_policy
          assert "add_dhcp_routes_by_prefix" in restore_routes
          assert "route_context.restore_host_route = remove_old_host_route;" in callback
          assert 'route_context.restore_host_route = 0;' in viptv_bound
          control_routes = body(source, "control_dhcp_routes(char *rt")
          assert control_routes.count("dhcp_lease_route_add_is_ok(route_status)") == 2
          assert control_routes.count("dhcp_lease_route_delete_is_ok(route_status)") == 2
          gateway_state = callback.index("bound_names[WAN_DHCP_BOUND_GATEWAY], gateway_buf")
          wan_route_setup = callback.index("route_setup_status = wan_up_internal(wan_ifname, unit, 0)")
          man_route_setup = callback.index("route_setup_status = man_up_internal(wan_ifname, unit, 0, NULL)")
          assert gateway_state < wan_route_setup
          assert "accepted but route setup is incomplete" in callback
          assert "return route_setup_status;" in callback
          assert 'nvram_set_int_temp(strcat_r(prefix, "route_err", tmp), route_setup_status)' in callback
          wan_dhcp_renew = body(source, "udhcpc_renew(char *wan_ifname)")
          assert "dhcp_wan_route_setup_retry_required" in wan_dhcp_renew
          assert wan_dhcp_renew.index("dhcp_wan_route_setup_retry_required") < wan_dhcp_renew.index('value = getenv("subnet")')
          assert "wan_dhcp_nvram_state_publish(" in wan_dhcp_renew
          assert "struct dhcp_lease_nvram_value renew_values[4];" in wan_dhcp_renew
          assert "if (renew_count != 0)" in wan_dhcp_renew
          assert "return nvram_status;" in wan_dhcp_renew
          for marker in (
              'nvram_set_temp(param, lease_dns)',
              'nvram_set_temp(param, lease_domain)',
              'nvram_set_temp(strcat_r(prefix, "wins", tmp), lease_wins)',
              'nvram_set_int_temp(strcat_r(prefix, "lease", tmp), (int)parsed_value)',
          ):
              assert marker not in wan_dhcp_renew
          publisher_start = source.index("wan_dhcp_nvram_state_publish(", source.index("zcip_viptv_bound("))
          renew_publisher = body(source[publisher_start:], "wan_dhcp_nvram_state_publish(")
          assert "dhcp_lease_nvram_publish(" in renew_publisher
          assert "wan_dhcp_nvram_restore_values(" in renew_publisher
          assert "nvram_transaction_begin(&transaction)" in renew_publisher
          lease_policy = (rc / "dhcp_lease_policy.h").read_text()
          lease_policy_test = (rc / "tests/dhcp_lease_policy.c").read_text()
          publish_body = body(lease_policy, "dhcp_lease_nvram_publish(")
          assert "for (i = 0; i < count; ++i)" in publish_body
          assert "for (j = count; j > 0; --j)" in publish_body
          assert "test_dhcp_lease_nvram_publish_attempts_all_and_restores_all" in lease_policy_test
          assert "test_dhcp_lease_nvram_publish_attempts_all_and_restores_all();" in lease_policy_test
          assert man_route_setup < callback.index("nvram_set_int_temp(strcat_r(prefix, \"err\", tmp), i_err)")

          apply_policy = body(policy, "dhcp_wan_interface_apply(")
          assert "ops->clear_address(context)" in apply_policy
          assert "ops->set_address(context, new_ipaddr, new_netmask)" in apply_policy
          assert "goto rollback;" in apply_policy
          assert "ops->set_address(context, old_ipaddr, old_netmask)" in apply_policy
          assert "ops->clear_address(context)" in apply_policy
          assert "if (rollback_status)" in apply_policy

          deconfig = body(source, "udhcpc_deconfig(char *wan_ifname, int is_zcip)")
          assert "interface_status = ifconfig(wan_ifname, IFUP, \"0.0.0.0\", NULL)" in deconfig
          assert "if (interface_status != 0)" in deconfig
          assert "continuing lease cleanup" in deconfig
          assert "cleanup_status = man_down_internal(wan_ifname, unit, reset_man_address)" in deconfig
          assert "cleanup_status = wan_down_internal(wan_ifname, unit, 0)" in deconfig
          assert "int conntrack_status = 0;" in deconfig
          assert "conntrack_status = flush_conntrack_table(man_addr);" in deconfig
          assert "if (conntrack_status != 0)" in deconfig
          assert deconfig.index("conntrack_status = flush_conntrack_table(man_addr);") < deconfig.index("cleanup_status = man_down_internal")
          assert deconfig.index("conntrack_status = flush_conntrack_table(man_addr);") < deconfig.index("cleanup_status = wan_down_internal")
          compact_deconfig = "".join(deconfig.split())
          assert "returnroute_status_accumulate(route_status_accumulate(interface_status,conntrack_status),cleanup_status);" in compact_deconfig
          assert 'nvram_set_temp("wanx_ipaddr", "0.0.0.0")' not in deconfig

          man_down = body(source, "man_down_internal(char *man_ifname, int unit, int clear_dhcp_address)")
          old_gateway_route = man_down.index('route_del(man_ifname, 2, man_gate, NULL, "255.255.255.255")')
          clear_address_call = man_down.index("route_status = rc_wan_nvram_set_all_values(")
          independent_clear = man_down.index("/* Attempt every independent clear even if the address write failed. */")
          clear_runtime_call = man_down.index("route_status = rc_wan_nvram_set_all_values(", independent_clear)
          assert old_gateway_route < clear_address_call < independent_clear < clear_runtime_call
          assert "if (clear_dhcp_address)" in man_down
          assert "clear_address_values[]" in man_down and "clear_runtime_values[]" in man_down
          public_man_down = body(source, "man_down(char *man_ifname, int unit)")
          assert "man_down_internal(man_ifname, unit, 0)" in public_man_down

          viptv_bound = body(source, "udhcpc_viptv_bound(char *man_ifname, int is_renew_mode)")
          assert "dhcp_wan_interface_apply(" in viptv_bound
          assert 'snprintf(old_ip, sizeof(old_ip), "%s", previous_text[0])' in viptv_bound
          assert 'snprintf(old_mask, sizeof(old_mask), "%s", previous_text[1])' in viptv_bound
          assert "interface_status = wan_dhcp_interface_clear(&interface_context)" in viptv_bound
          assert "failed to clear conflicting IPTV DHCP address" in viptv_bound
          assert "failed to apply IPTV DHCP address" in viptv_bound
          assert "failed to restore previous IPTV DHCP address" in viptv_bound
          route_transition = viptv_bound.index("dhcp_wan_route_transition_apply(")
          snapshot_publish = viptv_bound.index("wan_dhcp_nvram_state_publish(")

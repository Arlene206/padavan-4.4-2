name: WAN DHCP callback state stability regression

on:
  push:
    paths:
      - ".github/workflows/wan-dhcp-callback-stability.yml"
      - "trunk/user/rc/src/net_wan.c"
      - "trunk/user/rc/src/net_wan6.c"
      - "trunk/user/rc/src/dhcp6c_config_file.h"
      - "trunk/user/rc/src/tests/dhcp6c_config_file.c"
      - "trunk/user/rc/src/dhcp_wan_interface_policy.h"
      - "trunk/user/rc/src/tests/dhcp_wan_interface_policy.c"
      - "trunk/user/rc/src/wan_viptv_static_policy.h"
      - "trunk/user/rc/src/tests/wan_viptv_static_policy.c"
      - "trunk/user/busybox/busybox-1.24.x/networking/zcip.c"
  pull_request:
    paths:
      - ".github/workflows/wan-dhcp-callback-stability.yml"
      - "trunk/user/rc/src/net_wan.c"
      - "trunk/user/rc/src/net_wan6.c"
      - "trunk/user/rc/src/dhcp6c_config_file.h"
      - "trunk/user/rc/src/tests/dhcp6c_config_file.c"
      - "trunk/user/rc/src/dhcp_wan_interface_policy.h"
      - "trunk/user/rc/src/tests/dhcp_wan_interface_policy.c"
      - "trunk/user/rc/src/wan_viptv_static_policy.h"
      - "trunk/user/rc/src/tests/wan_viptv_static_policy.c"
      - "trunk/user/busybox/busybox-1.24.x/networking/zcip.c"

jobs:
  wan-dhcp-callback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run WAN DHCP interface rollback regression
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror \
            -I trunk/user/rc/src \
            trunk/user/rc/src/tests/dhcp_wan_interface_policy.c \
            -o /tmp/dhcp-wan-interface-policy
          /tmp/dhcp-wan-interface-policy
      - name: Compile and run static IPTV startup status regression
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror \
            -I trunk/user/rc/src \
            trunk/user/rc/src/tests/wan_viptv_static_policy.c \
            -o /tmp/wan-viptv-static-policy
          /tmp/wan-viptv-static-policy
      - name: Compile and run DHCPv6 config publication regression
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror \
            -I trunk/user/rc/src \
            trunk/user/rc/src/tests/dhcp6c_config_file.c \
            -o /tmp/dhcp6c-config-file
          /tmp/dhcp6c-config-file
      - name: Verify WAN callback applies interface before publishing lease state
        run: |
          python3 - <<'PY'
          from pathlib import Path

          rc = Path("trunk/user/rc/src")
          source = (rc / "net_wan.c").read_text()
          wan6_source = (rc / "net_wan6.c").read_text()
          config_policy = (rc / "dhcp6c_config_file.h").read_text()
          config_test = (rc / "tests/dhcp6c_config_file.c").read_text()
          policy = (rc / "dhcp_wan_interface_policy.h").read_text()
          workflow = Path(".github/workflows/wan-dhcp-callback-stability.yml").read_text()

          def body(text, signature):
              start = text.index(signature)
              brace = text.index("{", start)
              depth = 0
              for pos in range(brace, len(text)):
                  if text[pos] == "{":
                      depth += 1
                  elif text[pos] == "}":
                      depth -= 1
                      if depth == 0:
                          return text[brace + 1:pos]
              raise AssertionError(f"unterminated function: {signature}")

          assert '#include "dhcp_wan_interface_policy.h"' in source
          callback = body(source, "udhcpc_bound(char *wan_ifname, int is_renew_mode)")
          apply = callback.index("dhcp_wan_interface_apply(")
          old_routes = callback.index("route_del(wan_ifname, route_metric")
          primary_state = callback.index('nvram_set_temp(strcat_r(prefix, "ipaddr", tmp), lease_ip)')
          assert apply < old_routes < primary_state
          assert "preserving previous lease and routes" in callback
          assert "failed to restore previous DHCP address" in callback
          assert "ifconfig(wan_ifname" not in callback
          assert callback.index("wan_dhcp_interface_clear(&interface_context)") < old_routes
          gateway_state = callback.index('nvram_set_temp(strcat_r(prefix, "gateway", tmp), gateway_buf)')
          wan_route_setup = callback.index("route_setup_status = wan_up_internal(wan_ifname, unit, 0)")
          man_route_setup = callback.index("route_setup_status = man_up_internal(wan_ifname, unit, 0)")
          assert gateway_state < wan_route_setup
          assert "accepted but route setup is incomplete" in callback
          assert "return route_setup_status;" in callback
          assert man_route_setup < callback.index("nvram_set_int_temp(strcat_r(prefix, \"err\", tmp), i_err)")

          apply_policy = body(policy, "dhcp_wan_interface_apply(")
          assert "ops->clear_address(context)" in apply_policy
          assert "ops->set_address(context, new_ipaddr, new_netmask)" in apply_policy
          assert "goto rollback;" in apply_policy
          assert "ops->set_address(context, old_ipaddr, old_netmask)" in apply_policy
          assert "ops->clear_address(context)" in apply_policy
          assert "if (rollback_status)" in apply_policy

          deconfig = body(source, "udhcpc_deconfig(char *wan_ifname, int is_zcip)")
          assert "interface_status = ifconfig(wan_ifname, IFUP, \"0.0.0.0\", NULL)" in deconfig
          assert "if (interface_status != 0)" in deconfig
          assert "continuing lease cleanup" in deconfig
          assert "cleanup_status = man_down_internal(wan_ifname, unit, reset_man_address)" in deconfig
          assert "cleanup_status = wan_down_internal(wan_ifname, unit, 0)" in deconfig
          assert "return route_status_accumulate(interface_status, cleanup_status);" in deconfig
          assert 'nvram_set_temp("wanx_ipaddr", "0.0.0.0")' not in deconfig

          man_down = body(source, "man_down_internal(char *man_ifname, int unit, int clear_dhcp_address)")
          old_gateway_route = man_down.index('route_del(man_ifname, 2, man_gate, NULL, "255.255.255.255")')
          clear_old_address = man_down.index('nvram_set_temp("wanx_ipaddr", "0.0.0.0")')
          clear_other_state = man_down.index('nvram_set_temp("wanx_gateway", "")')
          assert old_gateway_route < clear_old_address < clear_other_state
          assert "if (clear_dhcp_address)" in man_down
          public_man_down = body(source, "man_down(char *man_ifname, int unit)")
          assert "man_down_internal(man_ifname, unit, 0)" in public_man_down

          viptv_bound = body(source, "udhcpc_viptv_bound(char *man_ifname, int is_renew_mode)")
          assert "dhcp_wan_interface_apply(" in viptv_bound
          assert 'snprintf(old_ip, sizeof(old_ip), "%s", nvram_safe_get("manv_ipaddr"))' in viptv_bound
          assert 'snprintf(old_mask, sizeof(old_mask), "%s", nvram_safe_get("manv_netmask"))' in viptv_bound
          assert "interface_status = wan_dhcp_interface_clear(&interface_context)" in viptv_bound
          assert "failed to clear conflicting IPTV DHCP address" in viptv_bound
          assert "failed to apply IPTV DHCP address" in viptv_bound
          assert "failed to restore previous IPTV DHCP address" in viptv_bound
          assert viptv_bound.index("dhcp_wan_interface_apply(") < viptv_bound.index('route_result = route_del(man_ifname, 10')
          assert viptv_bound.index('route_result = del_dhcp_routes_by_prefix("manv_"') < viptv_bound.index('nvram_set_temp("manv_ipaddr", ip)')
          assert viptv_bound.count("route_status = route_status_accumulate(route_status, route_result);") == 2
          assert "preserving previous lease and route inventory" in viptv_bound
          assert "return route_status;" in viptv_bound
          assert "route_result = add_dhcp_routes(rt, rt_rfc, rt_ms, man_ifname, 0);" in viptv_bound
          assert "route_result = route_add(man_ifname, 10" in viptv_bound
          assert viptv_bound.count("route_setup_status = route_status_accumulate(route_setup_status, route_result);") == 2
          assert "accepted but route setup is incomplete" in viptv_bound
          assert "return route_setup_status;" in viptv_bound

          viptv_deconfig = body(source, "manv_route_deconfig(char *man_ifname)")
          assert 'route_result = del_dhcp_routes_by_prefix("manv_"' in viptv_deconfig
          assert 'route_result = route_del(man_ifname, 10' in viptv_deconfig
          assert viptv_deconfig.count("route_status = route_status_accumulate(route_status, route_result);") == 2
          assert viptv_deconfig.index("if (route_status == 0)") < viptv_deconfig.index('nvram_set_temp("manv_gateway", "")')
          assert "preserving route inventory" in viptv_deconfig
          assert 'ret = manv_route_deconfig(man_ifname)' in body(source, "udhcpc_viptv_main(int argc, char **argv)")

          man_down = body(source, "man_down_internal(char *man_ifname, int unit, int clear_dhcp_address)")
          state_gate = man_down.index("if (status == 0)")
          clear_address = man_down.index('nvram_set_temp("wanx_ipaddr", "0.0.0.0")')
          clear_gateway = man_down.index('nvram_set_temp("wanx_gateway", "")')
          assert state_gate < clear_address < clear_gateway
          assert "preserving lease and route inventory" in man_down

          man_deconfig = body(source, "udhcpc_deconfig(char *wan_ifname, int is_zcip)")
          assert "reset_man_address = (interface_status == 0)" in man_deconfig
          assert man_deconfig.index('interface_status = ifconfig(wan_ifname, IFUP, "0.0.0.0", NULL)') < man_deconfig.index("reset_man_address = (interface_status == 0)")

          zcip_bound = body(source, "zcip_bound(char *man_ifname)")
          assert zcip_bound.index('value = getenv("ip")') < zcip_bound.index("dhcp_lease_ipv4_is_valid(ip)") < zcip_bound.index("dhcp_wan_interface_apply(")
          assert 'snprintf(old_ip, sizeof(old_ip), "%s", nvram_safe_get("wanx_ipaddr"))' in zcip_bound
          assert 'snprintf(old_mask, sizeof(old_mask), "%s", nvram_safe_get("wanx_netmask"))' in zcip_bound
          assert zcip_bound.index("dhcp_wan_interface_apply(") < zcip_bound.index('nvram_set_temp(strcat_r(prefix, "ipaddr", tmp), ip)') < zcip_bound.index("man_up_internal(")
          assert "failed to restore previous ZeroConf WAN address" in zcip_bound
          assert "return route_setup_status;" in zcip_bound
          assert "ifconfig(" not in zcip_bound and "man_up(" not in zcip_bound

          zcip_viptv_bound = body(source, "zcip_viptv_bound(char *man_ifname)")
          assert zcip_viptv_bound.index('value = getenv("ip")') < zcip_viptv_bound.index("dhcp_lease_ipv4_is_valid(ip)") < zcip_viptv_bound.index("dhcp_wan_interface_apply(")
          assert 'snprintf(old_ip, sizeof(old_ip), "%s", nvram_safe_get("manv_ipaddr"))' in zcip_viptv_bound
          assert 'snprintf(old_mask, sizeof(old_mask), "%s", nvram_safe_get("manv_netmask"))' in zcip_viptv_bound
          assert zcip_viptv_bound.index("dhcp_wan_interface_apply(") < zcip_viptv_bound.index('nvram_set_temp(strcat_r(prefix, "ipaddr", tmp), ip)') < zcip_viptv_bound.index("start_igmpproxy(man_ifname)")
          assert "ifconfig(" not in zcip_viptv_bound

          manv_deconfig = body(source, "manv_route_deconfig(char *man_ifname)")
          assert 'route_result = del_dhcp_routes_by_prefix("manv_", man_ifname, 0)' in manv_deconfig
          assert 'route_result = route_del(man_ifname, 10' in manv_deconfig
          assert manv_deconfig.count("route_status = route_status_accumulate(route_status, route_result);") == 2
          assert manv_deconfig.index("if (route_status == 0)") < manv_deconfig.index('nvram_set_temp("manv_gateway", "")')
          assert "preserving route inventory" in manv_deconfig

          zcip_deconfig = body(source, "zcip_viptv_deconfig(char *man_ifname)")
          assert 'interface_status = ifconfig(man_ifname, IFUP, "0.0.0.0", NULL)' in zcip_deconfig
          assert "route_status = manv_route_deconfig(man_ifname)" in zcip_deconfig
          assert zcip_deconfig.index("interface_status == 0 && route_status == 0") < zcip_deconfig.index('nvram_set_temp("manv_ipaddr", "0.0.0.0")')
          assert "stop_igmpproxy(man_ifname)" in zcip_deconfig
          assert "return route_status_accumulate(interface_status, route_status)" in zcip_deconfig
          assert 'ret = zcip_viptv_deconfig(man_ifname)' in body(source, "zcip_viptv_main(int argc, char **argv)")

          zcip_viptv_start = body(source, "start_zcip_viptv(char *man_ifname)")
          assert '"/sbin/zcip", "-q", man_ifname, SCRIPT_ZCIP_VIPTV' in zcip_viptv_start
          busybox_source = Path("trunk/user/busybox/busybox-1.24.x/networking/zcip.c").read_text()
          zcip_applet = body(busybox_source, "zcip_main(int argc UNUSED_PARAM, char **argv)")
          config_callback = zcip_applet.index('run(argv, "config", chosen_nip)')
          quit_after_config = zcip_applet.index("if (QUIT)", config_callback)
          monitor_state = zcip_applet.index("timeout_ms = -1; // never timeout in monitor state", quit_after_config)
          assert config_callback < quit_after_config < monitor_state

          # DHCPv6 client configuration is staged privately and published only
          # after complete write/flush/close; startup must follow the rename.
          dhcp6_start = body(wan6_source, "start_dhcp6c(char *wan_ifname)")
          assert '#include "dhcp6c_config_file.h"' in wan6_source
          assert 'fopen(conf_file, "w")' not in dhcp6_start
          assert "dhcp6c_config_file_open_staged(staged_path, &fp)" in dhcp6_start
          assert "dhcp6c_config_file_publish(fp, staged_path, conf_file)" in dhcp6_start
          assert dhcp6_start.index("dhcp6c_config_file_open_staged") < dhcp6_start.index('fprintf(fp, "interface %s')
          assert dhcp6_start.index("dhcp6c_config_file_publish") < dhcp6_start.index('eval("/sbin/dhcp6c"')
          assert "fd = mkstemp(staged_path)" in config_policy
          assert 'fdopen(fd, "w")' in config_policy
          assert "ferror(stream)" in config_policy and "fflush(stream)" in config_policy
          assert "fclose(stream)" in config_policy and "rename(staged_path, target_path)" in config_policy
          assert "unlink(staged_path)" in config_policy
          assert "assert((st.st_mode & 0777) == 0600)" in config_test
          assert "umask(0000)" in config_test
          assert "failed rename" in config_test
          assert "atomic replacement" in config_test

          assert '#include "wan_viptv_static_policy.h"' in source
          static_start = body(source, "launch_viptv_wan(void)")
          static_policy = body((rc / "wan_viptv_static_policy.h").read_text(),
                               "wan_viptv_static_start(")
          assert "if (viptv_mode == 2)" in static_start
          invalid_static = static_start.index(
              "if (!is_valid_ipv4(viptv_addr) || !is_valid_ipv4(viptv_mask))")
          static_call = static_start.index("wan_viptv_static_start(")
          assert invalid_static < static_call
          assert "return EINVAL;" in static_start[invalid_static:static_call]
          assert "return ret;" in static_start[static_call:]
          assert "wan_viptv_static_start(is_valid_ipv4(viptv_gate)," in static_start
          assert "IPTV VLAN or service setup incomplete" in source

          set_address = body(source,
                             "wan_viptv_static_configure_address(void *opaque)")
          publish_address = body(source,
                                 "wan_viptv_static_publish_address(void *opaque)")
          publish_gateway = body(source,
                                 "wan_viptv_static_publish_gateway(void *opaque)")
          add_route = body(source,
                           "wan_viptv_static_add_default_route(void *opaque)")
          start_multicast = body(source,
                                 "wan_viptv_static_start_multicast(void *opaque)")
          assert "ifconfig(context->ifname, IFUP, context->ipaddr, context->netmask)" in set_address
          assert 'nvram_set_temp("manv_ipaddr", context->ipaddr)' in publish_address
          assert 'nvram_set_temp("manv_netmask", context->netmask)' in publish_address
          assert 'nvram_set_temp("manv_gateway"' in publish_gateway
          assert 'route_add(context->ifname, 10, "0.0.0.0"' in add_route
          assert "start_igmpproxy(context->ifname)" in start_multicast
          assert static_policy.index("ops->configure_address(context)") < static_policy.index("ops->publish_address(context)")
          assert static_policy.index("ops->publish_address(context)") < static_policy.index("ops->publish_gateway(context)")
          assert static_policy.index("ops->publish_gateway(context)") < static_policy.index("ops->add_default_route(context)")
          assert static_policy.index("ops->add_default_route(context)") < static_policy.index("ops->start_multicast(context)")
          assert "if (status != 0)\n\t\treturn status;" in static_policy
          static_test = (rc / "tests/wan_viptv_static_policy.c").read_text()
          for case in (
              "test_address_failure_does_not_publish_or_start_services",
              "test_successful_start_orders_address_state_route_and_multicast",
              "test_route_failure_is_reported_after_recovery_state_publication",
              "test_missing_gateway_skips_default_route",
              "test_invalid_arguments_fail_before_side_effects",
          ):
              assert case in static_test

          paths = (
              ".github/workflows/wan-dhcp-callback-stability.yml",
              "trunk/user/rc/src/net_wan.c",
              "trunk/user/rc/src/net_wan6.c",
              "trunk/user/rc/src/dhcp6c_config_file.h",
              "trunk/user/rc/src/tests/dhcp6c_config_file.c",
              "trunk/user/rc/src/dhcp_wan_interface_policy.h",
              "trunk/user/rc/src/tests/dhcp_wan_interface_policy.c",
              "trunk/user/rc/src/wan_viptv_static_policy.h",
              "trunk/user/rc/src/tests/wan_viptv_static_policy.c",
              "trunk/user/busybox/busybox-1.24.x/networking/zcip.c",
          )
          filters = workflow.split("jobs:", 1)[0]
          push_filters, pr_filters = filters.split("  pull_request:", 1)
          for path in paths:
              assert push_filters.count(path) == 1, f"push path missing/duplicated: {path}"
              assert pr_filters.count(path) == 1, f"pull_request path missing/duplicated: {path}"

          print("WAN DHCP callback ordering and rollback contracts: PASS")
          PY

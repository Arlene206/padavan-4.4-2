name: OpenVPN client credential staging regression

on:
  push:
    paths:
      - 'trunk/user/rc/src/vpn_openvpn.c'
      - 'trunk/user/rc/src/openvpn_client_secret_file.h'
      - 'trunk/user/rc/src/openvpn_config_file.h'
      - 'trunk/user/rc/src/tests/openvpn_client_secret_file.c'
      - 'trunk/user/rc/src/tests/openvpn_config_file.c'
      - 'scripts/check_openvpn_client_secret.py'
      - '.github/workflows/openvpn-client-secret.yml'
  pull_request:
    paths:
      - 'trunk/user/rc/src/vpn_openvpn.c'
      - 'trunk/user/rc/src/openvpn_client_secret_file.h'
      - 'trunk/user/rc/src/openvpn_config_file.h'
      - 'trunk/user/rc/src/tests/openvpn_client_secret_file.c'
      - 'trunk/user/rc/src/tests/openvpn_config_file.c'
      - 'scripts/check_openvpn_client_secret.py'
      - '.github/workflows/openvpn-client-secret.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  openvpn-client-secret:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Compile and run credential staging regression
        run: |
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -fno-omit-frame-pointer \
            -I trunk/user/rc/src \
            trunk/user/rc/src/tests/openvpn_client_secret_file.c \
            -o "$RUNNER_TEMP/openvpn_client_secret_file"
          ASAN_OPTIONS=detect_leaks=1 "$RUNNER_TEMP/openvpn_client_secret_file"
      - name: Compile and run atomic configuration publication regression
        run: |
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -fno-omit-frame-pointer \
            -I trunk/user/rc/src \
            trunk/user/rc/src/tests/openvpn_config_file.c \
            -o "$RUNNER_TEMP/openvpn_config_file"
          ASAN_OPTIONS=detect_leaks=1 "$RUNNER_TEMP/openvpn_config_file"
      - name: Verify fail-closed OpenVPN startup and workflow contracts
        run: python3 scripts/check_openvpn_client_secret.py

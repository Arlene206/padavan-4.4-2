name: BusyBox PID1 reap queue regression

on:
  push:
    paths:
      - "trunk/user/busybox/busybox-1.24.x/init/init.c"
      - "trunk/user/busybox/busybox-1.24.x/init/init_reap_queue.h"
      - "trunk/user/busybox/busybox-1.24.x/init/init_signal_pending.h"
      - "trunk/user/busybox/busybox-1.24.x/init/tests/init_signal_pending.c"
      - "trunk/user/busybox/busybox-1.24.x/init/tests/init_reap_queue.c"
      - "scripts/check_busybox_init_reap_queue.py"
      - ".github/workflows/busybox-init-reap-queue.yml"
  pull_request:
    paths:
      - "trunk/user/busybox/busybox-1.24.x/init/init.c"
      - "trunk/user/busybox/busybox-1.24.x/init/init_reap_queue.h"
      - "trunk/user/busybox/busybox-1.24.x/init/init_signal_pending.h"
      - "trunk/user/busybox/busybox-1.24.x/init/tests/init_signal_pending.c"
      - "trunk/user/busybox/busybox-1.24.x/init/tests/init_reap_queue.c"
      - "scripts/check_busybox_init_reap_queue.py"
      - ".github/workflows/busybox-init-reap-queue.yml"
  workflow_dispatch:

jobs:
  host-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run bounded queue regression
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Itrunk/user/busybox/busybox-1.24.x/init \
            trunk/user/busybox/busybox-1.24.x/init/tests/init_reap_queue.c \
            -o /tmp/busybox-init-reap-queue
          /tmp/busybox-init-reap-queue
      - name: Compile and run delayed signal accumulator regression
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Itrunk/user/busybox/busybox-1.24.x/init \
            trunk/user/busybox/busybox-1.24.x/init/tests/init_signal_pending.c \
            -o /tmp/busybox-init-signal-pending
          /tmp/busybox-init-signal-pending
      - name: Check PID1 signal-context and wait/reap contracts
        run: python3 scripts/check_busybox_init_reap_queue.py

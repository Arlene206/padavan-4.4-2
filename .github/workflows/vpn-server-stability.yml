      - 'trunk/user/rc/src/rc.c'
      - 'trunk/user/rc/src/services.c'
      - 'trunk/user/rc/src/rc.h'
      - 'scripts/check_vpn_server_lifecycle.py'
      - '.github/workflows/vpn-server-stability.yml'
      - 'trunk/user/shared/src/process_pidfile.c'
      - 'trunk/user/shared/src/process_pidfile.h'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vpn-server-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Compile and run checked VPN server configuration gate regression
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -I trunk/user/rc/src \
            trunk/user/rc/src/tests/vpn_server_config_policy.c -o /tmp/vpn-server-config-policy
          ASAN_OPTIONS=detect_leaks=1 /tmp/vpn-server-config-policy
      - name: Compile and run bounded lifecycle lock regression
        run: |
          cc -std=gnu89 -Wall -Wextra -Werror -Itrunk/user/rc/src \
            trunk/user/rc/src/tests/vpn_server_lifecycle_lock.c \
            -o /tmp/vpn_server_lifecycle_lock
          /tmp/vpn_server_lifecycle_lock
          cc -std=gnu89 -Wall -Wextra -Werror -Itrunk/user/rc/src \
            trunk/user/rc/src/tests/vpn_server_callback_policy.c \
            -o /tmp/vpn_server_callback_policy
          /tmp/vpn_server_callback_policy
      - name: Compile and run xl2tpd process-presence start gate regression
        run: |
          cc -std=gnu89 -Wall -Wextra -Werror -I trunk/user/rc/src -I trunk/user/shared/src \
            trunk/user/rc/src/tests/xl2tpd_start_policy.c \
            -o /tmp/xl2tpd-start-policy
          /tmp/xl2tpd-start-policy

      - name: Compile and run rp-L2TP private atomic config regression
        run: |
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -Itrunk/user/rc/src \
            trunk/user/rc/src/tests/l2tp_config_file.c -o /tmp/l2tp-config-file
          ASAN_OPTIONS=detect_leaks=1 /tmp/l2tp-config-file
      - name: Compile and run shared lease lock ownership/contention regression
        run: |
          cc -std=gnu89 -Wall -Wextra -Werror -I trunk/user/rc/src \
            trunk/user/rc/src/tests/vpn_server_lease_lock.c \
            -o /tmp/vpn_server_lease_lock
          /tmp/vpn_server_lease_lock
      - name: Compile and run VPN server restart status regression
        run: |
          cc -std=gnu89 -Wall -Wextra -Werror -Itrunk/user/rc/src \
            trunk/user/rc/src/tests/vpn_server_restart_policy.c \
            -o /tmp/vpn_server_restart_policy
          /tmp/vpn_server_restart_policy
      - name: Compile and run VPN client runtime NVRAM policy regression
        run: |
          cc -std=gnu89 -Wall -Wextra -Werror -Itrunk/user/rc/src \
            trunk/user/rc/src/tests/vpn_client_nvram_policy.c \
            -o /tmp/vpn_client_nvram_policy
          /tmp/vpn_client_nvram_policy
      - name: Compile and run PPP scalar/multiline value regression
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer -Itrunk/user/rc/src \
            trunk/user/rc/src/tests/ppp_option_value_policy.c \
            -o /tmp/ppp-option-value-policy
          ASAN_OPTIONS=detect_leaks=1 /tmp/ppp-option-value-policy
      - name: Verify VPN client runtime NVRAM/DNS integration
        run: python3 scripts/check_vpn_client_nvram_state.py
      - name: Verify VPN lifecycle serialization and caller integration
        run: python3 scripts/check_vpn_server_lifecycle.py

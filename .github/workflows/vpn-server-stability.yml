      - 'trunk/user/rc/src/tests/xl2tpd_start_policy.c'
      - 'trunk/user/rc/src/tests/l2tp_config_file.c'
      - 'trunk/user/rc/src/l2tp_config_file.h'
      - 'trunk/user/pppoe/mwan.sh'
      - 'trunk/user/rc/src/net_wan.c'
      - 'trunk/user/rc/src/vpn_client.c'
      - 'trunk/user/rc/src/vpn_client_restart_policy.h'
      - 'trunk/user/rc/src/vpn_client_nvram_policy.h'
      - 'trunk/user/rc/src/tests/vpn_client_nvram_policy.c'

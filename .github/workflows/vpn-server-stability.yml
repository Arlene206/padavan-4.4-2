      - 'trunk/user/rc/src/ppp_option_value_policy.h'
      - 'trunk/user/rc/src/tests/ppp_option_value_policy.c'
      - 'scripts/check_vpn_client_nvram_state.py'
      - 'trunk/user/rc/src/rc.c'
      - 'trunk/user/rc/src/services.c'

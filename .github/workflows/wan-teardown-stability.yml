name: WAN interface teardown stability regression

on:
  push:
    paths:
      - ".github/workflows/wan-teardown-stability.yml"
      - "trunk/user/rc/src/net_wan.c"
      - "trunk/user/rc/src/usb_modem.c"
      - "trunk/user/rc/src/wan_teardown_policy.h"
      - "trunk/user/rc/src/tests/wan_teardown_policy.c"
  pull_request:
    paths:
      - ".github/workflows/wan-teardown-stability.yml"
      - "trunk/user/rc/src/net_wan.c"
      - "trunk/user/rc/src/usb_modem.c"
      - "trunk/user/rc/src/wan_teardown_policy.h"
      - "trunk/user/rc/src/tests/wan_teardown_policy.c"

jobs:
  wan-interface-teardown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and verify WAN interface teardown status propagation
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror \
            -I trunk/user/rc/src \
            trunk/user/rc/src/tests/wan_teardown_policy.c \
            -o /tmp/wan-teardown-policy
          /tmp/wan-teardown-policy
          python3 - <<'PY'
          from pathlib import Path

          root = Path(".")
          rc = root / "trunk/user/rc/src"
          source = (rc / "net_wan.c").read_text()
          workflow = Path(".github/workflows/wan-teardown-stability.yml").read_text()

          def function_body(text, signature):
              start = text.index(signature)
              brace = text.index("{", start)
              depth = 0
              for pos in range(brace, len(text)):
                  if text[pos] == "{":
                      depth += 1
                  elif text[pos] == "}":
                      depth -= 1
                      if depth == 0:
                          return text[brace + 1:pos]
              raise AssertionError(f"unterminated function: {signature}")

          assert '#include "wan_teardown_policy.h"' in source

          adapter = function_body(
              source,
              "wan_teardown_ifdown_interface(void *context, const char *ifname)")
          assert 'ret = ifconfig(ifname, 0, "0.0.0.0", NULL);' in adapter
          assert adapter.index("if (ret == ENODEV)") < adapter.index("return 0;")
          assert adapter.index("if (ret != 0)") < adapter.index('logmessage(')
          assert adapter.index('logmessage(') < adapter.rindex("return ret;")

          stop = function_body(source, "stop_wan_locked(void)")
          wan_daemons = stop.split("char* svcs_wan[]", 1)[1].split("};", 1)[0]
          for daemon in ("igmpproxy", "xupnpd", "udpxy", "msd_lite"):
              assert f'"{daemon}"' in wan_daemons, f"WAN teardown omits {daemon}"
          usb_modem = (rc / "usb_modem.c").read_text()
          usbnet_stop = function_body(usb_modem, "int\nstop_wan_usbnet(void)")
          dhcp_client_gate = 'kill_services_with_pidfiles(NULL, udhcpc_pidfiles, "udhcpc", 0, 30, 0)'
          wan_daemon_gate = "kill_services(svcs_wan, 3, 1)"
          teardown = "ifdown_status = wan_teardown_ifdown_interfaces("
          failure_gate = "if (stop_status != 0 || ifdown_status != 0 || callback_cleanup_status != 0)"
          usbnet_gate = 'if (get_usb_modem_wan(unit) && nvram_get_int("modem_type") == 3)'
          assert "usbnet_ifname = NULL;" in stop
          assert usbnet_gate in stop
          assert stop.index(usbnet_gate) < stop.index('usbnet_ifname = get_wan_unit_value(unit, "ifname_t");') < stop.index("stop_wan_usbnet();")
          assert "stop_status = stop_wan_usbnet();" in stop
          assert "control_required = 0;" in usbnet_stop
          assert "ndis_control_network(ndis_ifname, modem_devnum, 0, &control_required)" in " ".join(usbnet_stop.split())
          assert "modem_ndis_control_failed(control_required, control_status)" in usbnet_stop
          assert "ifdown_status != ENODEV" in usbnet_stop
          assert "return result;" in usbnet_stop
          assert stop.index(dhcp_client_gate) < stop.index(wan_daemon_gate) < stop.index("stop_status = stop_wan_usbnet();") < stop.index(teardown)
          teardown_path = stop[stop.index(teardown):stop.index("remove_cb_links();")]
          assert "usbnet_ifname" in teardown_path
          assert stop.index(teardown) < stop.index("remove_cb_links();")
          assert "callback_cleanup_status = remove_cb_links();" in stop
          assert "callbacks=%d" in stop
          assert stop.index("remove_cb_links();") < stop.index(failure_gate)
          failure_path = stop[stop.index(failure_gate):]
          assert failure_path.index("goto abort_resume_detect;") < failure_path.index("clear_wan_state();")
          assert "resume_status = notify_run_detect_internet(2);" in failure_path
          assert "Internet monitor resume failed after aborted WAN teardown" in failure_path
          assert "return wan_teardown_abort_status(stop_status, resume_status);" in failure_path
          assert stop.index("clear_wan_state();") < stop.index("control_wan_led_isp_state(0, 0);")
          assert "ifconfig(man_ifname, 0," not in stop
          assert "ifconfig(IFNAME_WAN, 0," not in stop

          # Failed bridge cleanup must prevent a WAN restart from publishing
          # a new LAN/WAN topology against ports that may still be attached.
          bridge_cleanup = function_body(source, "disassembly_bridges_wan(void)")
          assert "int i, ret, status = 0;" in bridge_cleanup
          assert "ret = ifconfig(br_ifname, 0, NULL, NULL);" in bridge_cleanup
          assert "ret = br_del_all_ifs(br_ifname, 1, 1);" in bridge_cleanup
          assert "ret = br_add_del_bridge(br_ifname, 0);" in bridge_cleanup
          assert bridge_cleanup.count("wan_teardown_status_update(status, ret)") == 3
          assert "return status;" in bridge_cleanup
          detach_pos = bridge_cleanup.index("ret = br_del_all_ifs(")
          failed_detach = bridge_cleanup.index("if (ret != 0)", detach_pos)
          skip_remove = bridge_cleanup.index("continue;", failed_detach)
          remove_bridge = bridge_cleanup.index("ret = br_add_del_bridge(", failed_detach)
          assert detach_pos < failed_detach < skip_remove < remove_bridge

          full_restart = function_body(source, "full_restart_wan(void)")
          wan_bridge_call = full_restart.index("status = disassembly_bridges_wan();")
          wan_bridge_gate = full_restart.index("if (status != 0)", wan_bridge_call)
          wan_bridge_log = full_restart.index("WAN bridge teardown failed (status=%d)", wan_bridge_gate)
          wan_bridge_return = full_restart.index("return status;", wan_bridge_log)
          lan_bridge_call = full_restart.index("status = config_soft_bridge_lan();", wan_bridge_return)
          lan_bridge_gate = full_restart.index("if (status != 0)", lan_bridge_call)
          lan_bridge_log = full_restart.index("LAN bridge VLAN setup failed (status=%d)", lan_bridge_gate)
          lan_bridge_return = full_restart.index("return status;", lan_bridge_log)
          wan_start_pos = full_restart.index("status = start_wan();")
          assert (wan_bridge_call < wan_bridge_gate < wan_bridge_log < wan_bridge_return <
                  lan_bridge_call < lan_bridge_gate < lan_bridge_log < lan_bridge_return < wan_start_pos)
          ppp_stop = function_body(source, "stop_wan_ppp_locked(void)")
          assert "int pause_status, stop_status = 0, resume_status;" in ppp_stop
          assert "stop_status = invalidate_wan_ppp_callback_session();" in ppp_stop
          assert "stop_status = stop_vpn_client_under_lifecycle_lock();" in ppp_stop
          assert "stop_status = kill_services(svcs_ppp, 6, 1);" in ppp_stop
          assert ppp_stop.index("stop_status = invalidate_wan_ppp_callback_session();") < ppp_stop.index("stop_status = stop_vpn_client_under_lifecycle_lock();") < ppp_stop.index("stop_status = kill_services(svcs_ppp, 6, 1);")
          assert "resume_status = notify_run_detect_internet(2);" in ppp_stop
          assert "Internet monitor resume failed after aborted WAN PPP teardown" in ppp_stop
          assert "return wan_teardown_abort_status(stop_status, resume_status);" in ppp_stop

          assert "int pause_status, eapol_stop_status, kabinet_stop_status, resume_status;" in stop
          assert "resume_status = notify_run_detect_internet(2);" in stop
          assert "Internet monitor resume failed after aborted WAN teardown" in stop
          assert "return wan_teardown_abort_status(stop_status, resume_status);" in stop
          assert "stop_status = invalidate_wan_ppp_callback_session();" in stop
          assert "stop_status = stop_vpn_client_under_lifecycle_lock();" in stop
          assert "stop_status = kill_services(svcs_ppp, 6, 1);" in stop
          assert "if (stop_status != 0)" in stop
          assert stop.index("stop_status = invalidate_wan_ppp_callback_session();") < stop.index("stop_status = stop_vpn_client_under_lifecycle_lock();") < stop.index("stop_status = kill_services(svcs_ppp, 6, 1);")

          policy = (rc / "wan_teardown_policy.h").read_text()
          abort_status = function_body(policy, "wan_teardown_abort_status(")
          assert "if (operation_status != 0)" in abort_status
          assert "return operation_status;" in abort_status
          assert "if (resume_status != 0)" in abort_status
          assert "return resume_status;" in abort_status
          assert "return -1;" in abort_status

          paths = (
              ".github/workflows/wan-teardown-stability.yml",
              "trunk/user/rc/src/net_wan.c",
              "trunk/user/rc/src/usb_modem.c",
              "trunk/user/rc/src/wan_teardown_policy.h",
              "trunk/user/rc/src/tests/wan_teardown_policy.c",
          )
          filters = workflow.split("jobs:", 1)[0]
          push_filters, pr_filters = filters.split("  pull_request:", 1)
          for path in paths:
              assert push_filters.count(path) == 1, f"push path filter missing or duplicated: {path}"
              assert pr_filters.count(path) == 1, f"pull_request path filter missing or duplicated: {path}"

          print("WAN interface teardown status propagation contracts: PASS")
          PY

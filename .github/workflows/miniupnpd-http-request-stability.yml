name: miniupnpd HTTP request framing stability regression

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/miniupnpd-http-request-stability.yml"
      - "trunk/user/miniupnpd/miniupnpd-2.x/upnphttp.c"
      - "trunk/user/miniupnpd/miniupnpd-2.x/miniupnpd_http_request_policy.h"
      - "trunk/user/miniupnpd/miniupnpd-2.x/tests/miniupnpd_http_request_policy_test.c"
      - "scripts/check_miniupnpd_http_request.py"
  pull_request:
    paths:
      - ".github/workflows/miniupnpd-http-request-stability.yml"
      - "trunk/user/miniupnpd/miniupnpd-2.x/upnphttp.c"
      - "trunk/user/miniupnpd/miniupnpd-2.x/miniupnpd_http_request_policy.h"
      - "trunk/user/miniupnpd/miniupnpd-2.x/tests/miniupnpd_http_request_policy_test.c"
      - "scripts/check_miniupnpd_http_request.py"

permissions:
  contents: read

jobs:
  miniupnpd-http-request:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run GNU89 bounded HTTP request parsing regression
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer \
            -Itrunk/user/miniupnpd/miniupnpd-2.x \
            trunk/user/miniupnpd/miniupnpd-2.x/tests/miniupnpd_http_request_policy_test.c \
            -o /tmp/miniupnpd_http_request_policy_test
          ASAN_OPTIONS=detect_leaks=1 /tmp/miniupnpd_http_request_policy_test
      - name: Verify production HTTP parser uses strict framing and bounded growth
        run: python3 scripts/check_miniupnpd_http_request.py

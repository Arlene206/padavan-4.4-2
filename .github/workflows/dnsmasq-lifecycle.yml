      - "trunk/user/rc/src/ddns_restart_policy.h"
      - "trunk/user/rc/src/tests/ddns_restart_policy.c"
      - "trunk/user/rc/src/vpn_client.c"
      - "trunk/user/rc/src/vpn_server_lifecycle_lock.h"
      - "trunk/user/rc/src/rc.h"
      - "scripts/check_inadyn_lifecycle.py"
      - "trunk/user/rc/src/tests/inadyn_daemon_policy.c"
      - "trunk/user/rc/src/inadyn_daemon_policy.h"
      - ".github/workflows/inadyn-lifecycle-stability.yml"
      - "trunk/user/rc/src/dnsmasq_restart_policy.h"
      - "trunk/user/rc/src/tests/dnsmasq_restart_policy.c"
      - "trunk/user/shared/src/process_inventory.c"
      - "trunk/user/shared/src/process_inventory.h"
      - "trunk/user/rc/src/dnsmasq_dhcp_range_policy.h"
      - "trunk/user/rc/src/dnsmasq_static_host_policy.h"
      - "trunk/user/rc/src/tests/dnsmasq_domain_policy.c"
      - "trunk/user/rc/src/tests/dnsmasq_dhcp_range_policy.c"
      - "trunk/user/rc/src/tests/dnsmasq_static_host_policy.c"
      - "trunk/user/rc/src/dnsmasq_lifecycle_lock.h"
      - "trunk/user/rc/src/tests/dnsmasq_lifecycle_lock.c"
      - "trunk/user/rc/src/tests/rc_notify_batch_policy.c"
      - "trunk/user/rc/src/rc_notify_batch_policy.h"
  pull_request:
    paths:
      - ".github/workflows/dnsmasq-lifecycle.yml"
      - "trunk/user/rc/src/services_ex.c"
      - "trunk/user/rc/src/dnsmasq_reload_policy.h"
      - "trunk/user/rc/src/tests/dnsmasq_reload_policy.c"
      - "trunk/user/rc/src/net_wan.c"
      - "trunk/user/rc/src/net_lan.c"

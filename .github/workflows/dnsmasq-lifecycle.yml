name: DNSMasq lifecycle stability regression

on:
  push:
    paths:
      - ".github/workflows/dnsmasq-lifecycle.yml"
      - "trunk/user/rc/src/services_ex.c"
      - "trunk/user/rc/src/net_wan.c"
      - "trunk/user/rc/src/net_lan.c"
      - "trunk/user/rc/src/init.c"
      - "trunk/user/rc/src/inadyn_config_file.h"
      - "trunk/user/rc/src/tests/inadyn_config_file.c"
      - "trunk/user/rc/src/rc.c"
      - "trunk/user/rc/src/rc.h"
      - "trunk/user/rc/src/dnsmasq_restart_policy.h"
      - "trunk/user/rc/src/tests/dnsmasq_restart_policy.c"
      - "trunk/user/rc/src/dnsmasq_dhcp_range_policy.h"
      - "trunk/user/rc/src/tests/dnsmasq_dhcp_range_policy.c"
      - "trunk/user/rc/src/dnsmasq_lifecycle_lock.h"
      - "trunk/user/rc/src/tests/dnsmasq_lifecycle_lock.c"
      - "trunk/user/rc/src/tests/rc_notify_batch_policy.c"
      - "trunk/user/rc/src/rc_notify_batch_policy.h"
  pull_request:
    paths:
      - ".github/workflows/dnsmasq-lifecycle.yml"
      - "trunk/user/rc/src/services_ex.c"
      - "trunk/user/rc/src/net_wan.c"
      - "trunk/user/rc/src/net_lan.c"
      - "trunk/user/rc/src/init.c"
      - "trunk/user/rc/src/inadyn_config_file.h"
      - "trunk/user/rc/src/tests/inadyn_config_file.c"
      - "trunk/user/rc/src/rc.c"
      - "trunk/user/rc/src/rc.h"
      - "trunk/user/rc/src/dnsmasq_restart_policy.h"
      - "trunk/user/rc/src/tests/dnsmasq_restart_policy.c"
      - "trunk/user/rc/src/dnsmasq_dhcp_range_policy.h"
      - "trunk/user/rc/src/tests/dnsmasq_dhcp_range_policy.c"
      - "trunk/user/rc/src/dnsmasq_lifecycle_lock.h"
      - "trunk/user/rc/src/tests/dnsmasq_lifecycle_lock.c"
      - "trunk/user/rc/src/tests/rc_notify_batch_policy.c"
      - "trunk/user/rc/src/rc_notify_batch_policy.h"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dnsmasq-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run DNSMasq restart policy regression
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror             -I trunk/user/rc/src             trunk/user/rc/src/tests/dnsmasq_restart_policy.c             -o "$RUNNER_TEMP/dnsmasq-restart-policy"
          "$RUNNER_TEMP/dnsmasq-restart-policy"
      - name: Compile and run DNSMasq DHCP range conflict regression
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer \
            -I trunk/user/rc/src \
            trunk/user/rc/src/tests/dnsmasq_dhcp_range_policy.c \
            -o "$RUNNER_TEMP/dnsmasq-dhcp-range-policy"
          ASAN_OPTIONS=detect_leaks=1 "$RUNNER_TEMP/dnsmasq-dhcp-range-policy"
      - name: Compile and run DNSMasq cross-process lock regression
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror             -I trunk/user/rc/src             trunk/user/rc/src/tests/dnsmasq_lifecycle_lock.c             -o "$RUNNER_TEMP/dnsmasq-lifecycle-lock"
          "$RUNNER_TEMP/dnsmasq-lifecycle-lock"
      - name: Compile and run private atomic Inadyn configuration regression
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -I trunk/user/rc/src \
            trunk/user/rc/src/tests/inadyn_config_file.c \
            -o "$RUNNER_TEMP/inadyn-config-file"
          "$RUNNER_TEMP/inadyn-config-file"
      - name: Verify DDNS credential publication and failure gates
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path(".")
          rc_dir = root / "trunk/user/rc/src"
          services = (rc_dir / "services_ex.c").read_text()
          helper = (rc_dir / "inadyn_config_file.h").read_text()
          regression = (rc_dir / "tests/inadyn_config_file.c").read_text()
          init = (rc_dir / "init.c").read_text()
          rc = (rc_dir / "rc.c").read_text()
          workflow = Path(".github/workflows/dnsmasq-lifecycle.yml").read_text()

          def function_body(source, signature):
              start = source.index(signature)
              brace = source.index("{", start)
              depth = 0
              pos = brace
              state = "code"
              while pos < len(source):
                  ch = source[pos]
                  next_ch = source[pos + 1] if pos + 1 < len(source) else ""
                  if state == "code":
                      if ch == '"':
                          state = "string"
                      elif ch == "'":
                          state = "char"
                      elif ch == "/" and next_ch == "*":
                          state = "block_comment"
                          pos += 1
                      elif ch == "/" and next_ch == "/":
                          state = "line_comment"
                          pos += 1
                      elif ch == "{":
                          depth += 1
                      elif ch == "}":
                          depth -= 1
                          if depth == 0:
                              return source[brace + 1:pos]
                  elif state == "string" or state == "char":
                      if ch == "\\":
                          pos += 1
                      elif state == "string" and ch == '"':
                          state = "code"
                      elif state == "char" and ch == "'":
                          state = "code"
                  elif state == "block_comment":
                      if ch == "*" and next_ch == "/":
                          state = "code"
                          pos += 1
                  elif state == "line_comment" and ch == "\n":
                      state = "code"
                  pos += 1
              raise AssertionError("unterminated function: " + signature)

          parser_fixture = r'''
          int parser_fixture(void) {
              const char *config = "provider sample {";
              /* Braces in comments are not syntax: { } */
              if (config) { return '}'; } // nor is this {
              return 0;
          }
          '''
          parser_body = function_body(parser_fixture, "parser_fixture(void)")
          assert 'const char *config = "provider sample {";' in parser_body
          assert "if (config) { return '}'; }" in parser_body

          writer = function_body(services, "write_inadyn_conf(const char *conf_file)")
          assert "inadyn_config_file_open(conf_file, staged_path, sizeof(staged_path))" in writer
          assert "inadyn_config_file_publish(fp, staged_path, conf_file)" in writer
          assert 'fopen(conf_file, "w")' not in writer
          assert 'load_user_config(fp, INADYN_USER_DIR, "inadyn.conf", NULL)' in writer
          assert writer.index("load_user_config(") < writer.index("inadyn_config_file_publish(")

          start = function_body(services, "start_ddns(int clear_cache)")
          assert "if (!write_inadyn_conf(DDNS_CONF_FILE))" in start
          assert start.index("write_inadyn_conf(DDNS_CONF_FILE)") < start.index('eval("/bin/inadyn"')
          update = function_body(services, "notify_ddns_update(void)")
          assert "if (!write_inadyn_conf(DDNS_CONF_FILE))" in update
          assert update.index("write_inadyn_conf(DDNS_CONF_FILE)") < update.index('"-SIGHUP"')

          init_loop = function_body(init, "init_main_loop(void)")
          assert "umask(0000);" in init_loop
          assert init_loop.index("umask(0000);") < init_loop.index("init_router()")
          notifications = function_body(rc, "handle_notifications(void)")
          assert 'strcmp(entry->d_name, RCN_RESTART_DDNS)' in notifications
          assert "start_ddns(1);" in notifications

          for token in (
              "mkstemp(staged_path)", "fchmod(fd, S_IRUSR | S_IWUSR)",
              "st.st_uid != geteuid()", "st.st_nlink != 1",
              "fflush(fp)", "ferror(fp)", "fsync(fileno(fp))",
              "fclose(fp)", "rename(staged_path, destination)",
          ):
              assert token in helper, token
          for token in (
              "(before.st_mode & 0777) == 0666",
              "(after.st_mode & 0777) == 0600",
              "S_ISREG(after.st_mode)",
              'read_exact(victim, "keep-victim\\n")',
              "inadyn_config_file_discard(fp, staged_path)",
              "inadyn_config_file_publish(fp, staged_path, blocked) == -1",
              "Inadyn private atomic configuration publication: PASS",
          ):
              assert token in regression, token

          paths = (
              ".github/workflows/dnsmasq-lifecycle.yml",
              "trunk/user/rc/src/services_ex.c",
              "trunk/user/rc/src/init.c",
              "trunk/user/rc/src/inadyn_config_file.h",
              "trunk/user/rc/src/tests/inadyn_config_file.c",
              "trunk/user/rc/src/rc.c",
              "trunk/user/rc/src/rc.h",
              "trunk/user/rc/src/dnsmasq_restart_policy.h",
              "trunk/user/rc/src/tests/dnsmasq_restart_policy.c",
              "trunk/user/rc/src/dnsmasq_dhcp_range_policy.h",
              "trunk/user/rc/src/tests/dnsmasq_dhcp_range_policy.c",
              "trunk/user/rc/src/dnsmasq_lifecycle_lock.h",
              "trunk/user/rc/src/tests/dnsmasq_lifecycle_lock.c",
              "trunk/user/rc/src/rc_notify_batch_policy.h",
              "trunk/user/rc/src/tests/rc_notify_batch_policy.c",
          )
          filters = workflow.split("jobs:", 1)[0]
          push_filters, pr_filters = filters.split("  pull_request:", 1)
          for path in paths:
              assert push_filters.count(path) == 1, "push: " + path
              assert pr_filters.count(path) == 1, "pull_request: " + path

          print("Inadyn credential confidentiality, atomic publication and DDNS start/reload gates: PASS")
          PY
      - name: Verify daemon start postconditions and RC exit status propagation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          services = Path("trunk/user/rc/src/services_ex.c").read_text()
          net_wan = Path("trunk/user/rc/src/net_wan.c").read_text()
          net_lan = Path("trunk/user/rc/src/net_lan.c").read_text()
          policy = Path("trunk/user/rc/src/dnsmasq_restart_policy.h").read_text()
          rc = Path("trunk/user/rc/src/rc.c").read_text()
          restart_test = Path("trunk/user/rc/src/tests/dnsmasq_restart_policy.c").read_text()
          notify_policy = Path("trunk/user/rc/src/rc_notify_batch_policy.h").read_text()
          notify_test = Path("trunk/user/rc/src/tests/rc_notify_batch_policy.c").read_text()
          workflow = Path(".github/workflows/dnsmasq-lifecycle.yml").read_text()
          range_policy = Path("trunk/user/rc/src/dnsmasq_dhcp_range_policy.h").read_text()
          range_test = Path("trunk/user/rc/src/tests/dnsmasq_dhcp_range_policy.c").read_text()

          def function_body(source, signature):
              start = source.index(signature)
              brace = source.index("{", start)
              depth = 0
              pos = brace
              state = "code"
              while pos < len(source):
                  ch = source[pos]
                  next_ch = source[pos + 1] if pos + 1 < len(source) else ""
                  if state == "code":
                      if ch == '"':
                          state = "string"
                      elif ch == "'":
                          state = "char"
                      elif ch == "/" and next_ch == "*":
                          state = "block_comment"
                          pos += 1
                      elif ch == "/" and next_ch == "/":
                          state = "line_comment"
                          pos += 1
                      elif ch == "{":
                          depth += 1
                      elif ch == "}":
                          depth -= 1
                          if depth == 0:
                              return source[brace + 1:pos]
                  elif state == "string" or state == "char":
                      if ch == "\\":
                          pos += 1
                      elif state == "string" and ch == '"':
                          state = "code"
                      elif state == "char" and ch == "'":
                          state = "code"
                  elif state == "block_comment":
                      if ch == "*" and next_ch == "/":
                          state = "code"
                          pos += 1
                  elif state == "line_comment" and ch == "\n":
                      state = "code"
                  pos += 1
              raise AssertionError("unterminated function: " + signature)

          start = function_body(services, "start_dns_dhcpd_locked(int is_ap_mode)")
          restart = function_body(services, "restart_dhcpd_locked(void)")
          confirm = function_body(services, "dnsmasq_confirm_started(int launch_status)")
          servers_writer = function_body(services, "fill_dnsmasq_servers(void)")
          lock_acquire = servers_writer.index('lock = file_lock("dservers");')
          lock_failure = servers_writer.index("if (lock < 0)", lock_acquire)
          stage_open = servers_writer.index("fp = dnsmasq_file_open(servers_path);")
          assert lock_acquire < lock_failure < stage_open
          failure_guard = servers_writer[lock_failure:stage_open]
          assert "saved_errno = errno ? errno : EIO;" in failure_guard
          assert "refusing publication" in failure_guard
          assert "errno = saved_errno;" in failure_guard
          assert "return -1;" in failure_guard
          assert "file_unlock(lock)" not in failure_guard
          publish_call = servers_writer.index("dnsmasq_file_publish(")
          assert servers_writer.index("file_unlock(lock);", publish_call) > publish_call
          assert servers_writer.count("file_unlock(lock);") == 3

          wan_resolver = function_body(net_wan, "update_resolvconf(int is_first_run, int do_not_notify)")
          wan_lock = wan_resolver.index('lock = file_lock("resolv");')
          wan_failure = wan_resolver.index("if (lock < 0)", wan_lock)
          wan_open = wan_resolver.index("fp = dnsmasq_file_open(resolv_temp);")
          assert wan_lock < wan_failure < wan_open
          wan_guard = wan_resolver[wan_failure:wan_open]
          assert "saved_errno = errno ? errno : EIO;" in wan_guard
          assert "errno = saved_errno;" in wan_guard
          assert "return saved_errno;" in wan_guard
          assert "file_unlock(lock)" not in wan_guard

          lan_manual = function_body(net_lan, "lan_up_manual(char *lan_ifname, char *lan_dname)")
          lan_lock = lan_manual.index('lock = file_lock("resolv");')
          lan_failure = lan_manual.index("if (lock < 0)", lan_lock)
          lan_route = lan_manual.index("route_add(")
          lan_open = lan_manual.index('fopen(DNS_RESOLV_CONF, "w+")')
          assert lan_lock < lan_failure < lan_route < lan_open
          lan_guard = lan_manual[lan_failure:lan_route]
          assert "saved_errno = errno ? errno : EIO;" in lan_guard
          assert "errno = saved_errno;" in lan_guard
          assert "return;" in lan_guard
          assert "file_unlock(lock)" not in lan_guard

          lan_auto = function_body(net_lan, "lan_publish_resolver_auto(")
          assert lan_auto.index('lock = file_lock("resolv");') < lan_auto.index("if (lock < 0)")
          assert lan_auto.index("if (lock < 0)") < lan_auto.index("dnsmasq_file_open(resolv_temp)")
          assert "dnsmasq_confirm_started(launch_status)" in start
          assert "dnsmasq_confirm_started(launch_status)" in restart
          assert "eval(\"/usr/sbin/dnsmasq\")" in start
          assert "eval(\"/usr/sbin/dnsmasq\")" in restart
          assert "DNSMASQ_START_WAIT_ATTEMPTS" in confirm
          assert "is_dns_dhcpd_run()" in confirm
          assert "sleep(1)" in confirm
          assert "dnsmasq_start_policy_status(launch_status, daemon_running)" in confirm
          assert "return daemon_running ? 0 : ESRCH;" in policy
          assert "dnsmasq_start_policy_status(0, 0) == ESRCH" in restart_test
          rc_header = Path("trunk/user/rc/src/rc.h").read_text()
          assert "int start_ddns(int clear_cache);" in rc_header
          assert 'ret = start_ddns(1);' in rc
          assert 'ret = restart_dhcpd();' in rc
          assert "return ret;" in rc

          lan_restart = function_body(net_lan, "full_restart_lan(void)")
          assert "dnsmasq_status = stop_dns_dhcpd_locked();" in lan_restart
          assert "dnsmasq_status = dnsmasq_start_status;" in lan_restart
          assert "return dnsmasq_status;" in lan_restart
          assert "if (dnsmasq_status == 0)" in lan_restart
          assert "if (dnsmasq_status == 0)" in lan_restart[
              lan_restart.index("dnsmasq_lifecycle_lock_release"): ]
          assert "int full_restart_lan(void);" in rc_header
          notification = function_body(rc, "handle_notifications(void)")
          assert "rc_notify_merge_action_result(action_result, full_restart_lan())" in notification
          assert notification.count("rc_notify_merge_action_result(action_result, restart_dhcpd())") == 4
          assert notification.count("rc_notify_merge_action_result(action_result, restart_nmbd())") == 2
          assert "restart_dhcpd();" not in notification
          assert "restart_nmbd();" not in notification
          assert "operation_status != 0" in notify_policy
          assert "rc_notify_merge_action_result(0, EBUSY) == -1" in notify_test

          simple_range = function_body(services, "simple_dhcp_range(")
          pool_check = function_body(services, "chk_valid_subnet_pool(")
          prepare = function_body(services, "prepare_dns_dhcpd(int is_ap_mode, int *service_enabled)")
          assert '#include "dnsmasq_dhcp_range_policy.h"' in services
          assert "dnsmasq_dhcp_range_default_pool" in simple_range
          assert "dnsmasq_dhcp_range_pool_is_valid" in pool_check
          assert "simple_dhcp_range(ip, dip1, dip2, mask) ? 1 : -1" in pool_check
          assert prepare.index("chk_valid_subnet_pool") < prepare.index("fill_static_ethers")
          assert "pool_status < 0" in prepare and "return EINVAL;" in prepare
          assert "pool_status > 0" in prepare
          assert 'nvram_set("dhcp_start", dhcp_start)' in prepare
          assert "hostmask >= 3U" in range_policy
          assert "lan_ip >= pool_start && lan_ip <= pool_end" in range_policy
          for test_case in ("test_configured_pool_conflicts", "test_default_pool_excludes_router", "test_invalid_subnets_fail_closed"):
              assert test_case in range_test
          print("DNSMasq DHCP pool/router-address exclusion source contract: PASS")

          paths = (
              ".github/workflows/dnsmasq-lifecycle.yml",
              "trunk/user/rc/src/services_ex.c",
              "trunk/user/rc/src/net_wan.c",
              "trunk/user/rc/src/net_lan.c",
              "trunk/user/rc/src/rc.c",
              "trunk/user/rc/src/dnsmasq_restart_policy.h",
              "trunk/user/rc/src/tests/dnsmasq_restart_policy.c",
              "trunk/user/rc/src/dnsmasq_dhcp_range_policy.h",
              "trunk/user/rc/src/tests/dnsmasq_dhcp_range_policy.c",
              "trunk/user/rc/src/dnsmasq_lifecycle_lock.h",
              "trunk/user/rc/src/tests/dnsmasq_lifecycle_lock.c",
              "trunk/user/rc/src/rc_notify_batch_policy.h",
              "trunk/user/rc/src/tests/rc_notify_batch_policy.c",
          )
          filters = workflow.split("jobs:", 1)[0]
          push_filters, pr_filters = filters.split("  pull_request:", 1)
          for path in paths:
              assert push_filters.count(path) == 1, path
              assert pr_filters.count(path) == 1, path
          print("DNSMasq postconditions and RC service status propagation contract: PASS")
          PY


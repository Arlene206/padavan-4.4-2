name: BusyBox DHCPv6 Reply script failure retry regression

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/dhcp6c-script-retry-stability.yml"
      - "scripts/check_dhcp6c_script_retry.py"
      - "trunk/user/busybox/busybox-1.24.x/networking/udhcp/dhcp6c.c"
      - "trunk/user/busybox/busybox-1.24.x/networking/udhcp/dhcp6c_script.c"
      - "trunk/user/busybox/busybox-1.24.x/networking/udhcp/dhcp6c_common.c"
      - "trunk/user/busybox/busybox-1.24.x/networking/udhcp/dhcp6c_script_retry_policy.h"
      - "trunk/user/busybox/busybox-1.24.x/networking/udhcp/dhcp_script_env_policy.h"
      - "trunk/user/busybox/busybox-1.24.x/networking/udhcp/dhcpc.c"
      - "trunk/user/busybox/busybox-1.24.x/networking/udhcp/tests/dhcp6c_script_retry_policy.c"
  pull_request:
    paths:
      - ".github/workflows/dhcp6c-script-retry-stability.yml"
      - "scripts/check_dhcp6c_script_retry.py"
      - "trunk/user/busybox/busybox-1.24.x/networking/udhcp/dhcp6c.c"
      - "trunk/user/busybox/busybox-1.24.x/networking/udhcp/dhcp6c_script.c"
      - "trunk/user/busybox/busybox-1.24.x/networking/udhcp/dhcp6c_common.c"
      - "trunk/user/busybox/busybox-1.24.x/networking/udhcp/dhcp6c_script_retry_policy.h"
      - "trunk/user/busybox/busybox-1.24.x/networking/udhcp/dhcp_script_env_policy.h"
      - "trunk/user/busybox/busybox-1.24.x/networking/udhcp/dhcpc.c"
      - "trunk/user/busybox/busybox-1.24.x/networking/udhcp/tests/dhcp6c_script_retry_policy.c"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dhcp6c-script-retry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run GNU89 DHCPv6 callback retry policy regression
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -fno-omit-frame-pointer -I trunk/user/busybox/busybox-1.24.x/networking/udhcp \
            trunk/user/busybox/busybox-1.24.x/networking/udhcp/tests/dhcp6c_script_retry_policy.c \
            -o /tmp/dhcp6c-script-retry-policy
          ASAN_OPTIONS=detect_leaks=1 /tmp/dhcp6c-script-retry-policy
      - name: Verify DHCPv6 script-result propagation and event retry integration
        run: python3 scripts/check_dhcp6c_script_retry.py

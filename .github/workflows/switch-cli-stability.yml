name: Switch CLI ioctl failure-status regression

on:
  push:
    paths:
      - "trunk/user/utils/src/switch/switch_gsw.c"
      - "trunk/user/utils/src/switch/switch_ipv4_parse_policy.h"
      - "trunk/user/utils/src/switch/tests/switch_ipv4_parse_policy.c"
      - "trunk/user/utils/src/switch/switch_wait_policy.h"
      - "trunk/user/utils/src/switch/tests/switch_wait_policy.c"
      - "trunk/user/utils/src/switch/Makefile"
      - "trunk/user/utils/src/switch/mii_mgr_cl45.c"
      - "trunk/user/utils/src/switch/tests/mii_mgr_cl45_cli.c"
      - "trunk/user/utils/src/switch/mii_mgr.c"
      - "trunk/user/utils/src/switch/tests/mii_mgr_cli.c"
      - "trunk/linux-4.4.x/drivers/net/ethernet/raeth/raether.c"
      - ".github/workflows/switch-cli-stability.yml"
  pull_request:
    paths:
      - "trunk/user/utils/src/switch/switch_gsw.c"
      - "trunk/user/utils/src/switch/switch_ipv4_parse_policy.h"
      - "trunk/user/utils/src/switch/tests/switch_ipv4_parse_policy.c"
      - "trunk/user/utils/src/switch/switch_wait_policy.h"
      - "trunk/user/utils/src/switch/tests/switch_wait_policy.c"
      - "trunk/user/utils/src/switch/Makefile"
      - "trunk/user/utils/src/switch/mii_mgr_cl45.c"
      - "trunk/user/utils/src/switch/tests/mii_mgr_cl45_cli.c"
      - "trunk/user/utils/src/switch/mii_mgr.c"
      - "trunk/user/utils/src/switch/tests/mii_mgr_cli.c"
      - "trunk/linux-4.4.x/drivers/net/ethernet/raeth/raether.c"
      - ".github/workflows/switch-cli-stability.yml"
  workflow_dispatch:

jobs:
  switch-cli-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check built switch CLI reports operational failures
        run: |
          python3 - <<'PY'
          from pathlib import Path

          makefile = Path("trunk/user/utils/src/switch/Makefile").read_text()
          source = Path("trunk/user/utils/src/switch/switch_gsw.c").read_text()
          lines = source.splitlines()

          # The MT7621 switch_gsw.c translation unit is wired into this target;
          # the legacy switch.c is not the production source.
          assert "SRC = switch_gsw.c" in makefile

          socket_failures = [
              i for i, line in enumerate(lines) if 'perror("socket");' in line
          ]
          assert len(socket_failures) == 1
          assert lines[socket_failures[0] + 1].strip() == "exit(EXIT_FAILURE);"

          ioctl_failures = [
              i for i, line in enumerate(lines) if 'perror("ioctl");' in line
          ]
          assert len(ioctl_failures) == 7, (
              f"expected 7 ioctl failure branches, got {len(ioctl_failures)}"
          )
          for index in ioctl_failures:
              assert lines[index + 1].strip() == "close(esw_fd);"
              assert lines[index + 2].strip() == "exit(EXIT_FAILURE);"

          # Operational failures, malformed arguments and unknown commands fail closed.
          # One socket + seven ioctl + bounded wait + IPv4 parse + usage failure.
          assert source.count("exit(EXIT_FAILURE);") == 11
          assert source.count("exit(0);") == 0
          usage = source.split("void usage(char *cmd)", 1)[1].split("\n}", 1)[0]
          assert "switch_fini();" in usage
          assert "exit(EXIT_FAILURE);" in usage
          assert "exit(0);" not in usage

          acl_dispatch = source.split(
              'else if (!strncmp(argv[1], "acl", 4)) {', 1
          )[1].split("\n\t}\n#endif", 1)[0]
          assert "if (argc < 4)" in acl_dispatch
          assert "if (argc < 3)" not in acl_dispatch
          assert acl_dispatch.index("if (argc < 4)") < acl_dispatch.index("argv[3]")
          print("switch_gsw invalid usage and truncated ACL commands fail safely: PASS")
          PY

      - name: Compile and verify strict switch IPv4 argument parsing
        run: |
          set -eu
          SWITCH_DIR=trunk/user/utils/src/switch
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -fno-omit-frame-pointer -I "$SWITCH_DIR" \
            "$SWITCH_DIR/tests/switch_ipv4_parse_policy.c" \
            -o /tmp/switch_ipv4_parse_policy
          ASAN_OPTIONS=detect_leaks=1 /tmp/switch_ipv4_parse_policy
          python3 - <<'PY'
          from pathlib import Path

          source = Path("trunk/user/utils/src/switch/switch_gsw.c").read_text()
          workflow = Path(".github/workflows/switch-cli-stability.yml").read_text()

          assert "switch_parse_ipv4_address(text, &address)" in source
          assert "str_to_ip(" not in source
          assert "getnext(" not in source
          assert source.count("parse_ipv4_argument(argv[4])") == 7
          assert source.count("parse_ipv4_argument(argv[3])") == 4

          for name in ("sip_add", "sip_del"):
              body = source.split("void " + name + "(int argc, char *argv[])", 1)[1]
              body = body.split("\nvoid ", 1)[0]
              assert body.index("parse_ipv4_argument(argv[3])") < body.index("reg_write(")
              assert body.index("parse_ipv4_argument(argv[4])") < body.index("reg_write(")

          filters = workflow.split("jobs:", 1)[0]
          push, pull_request = filters.split("  pull_request:", 1)
          for path in (
              "trunk/user/utils/src/switch/switch_ipv4_parse_policy.h",
              "trunk/user/utils/src/switch/tests/switch_ipv4_parse_policy.c",
          ):
              assert push.count('"' + path + '"') == 1
              assert pull_request.count('"' + path + '"') == 1
          print("All switch IPv4 inputs are strictly parsed before register writes: PASS")
          PY
      - name: Compile and verify bounded switch table waits
        run: |
          set -eu
          SWITCH_DIR=trunk/user/utils/src/switch
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -fno-omit-frame-pointer -I "$SWITCH_DIR" \
            "$SWITCH_DIR/tests/switch_wait_policy.c" -o /tmp/switch_wait_policy
          ASAN_OPTIONS=detect_leaks=1 /tmp/switch_wait_policy
          python3 - <<'PY'
          from pathlib import Path

          source = Path("trunk/user/utils/src/switch/switch_gsw.c").read_text()
          policy = Path("trunk/user/utils/src/switch/switch_wait_policy.h").read_text()
          test = Path("trunk/user/utils/src/switch/tests/switch_wait_policy.c").read_text()
          workflow = Path(".github/workflows/switch-cli-stability.yml").read_text()

          def function_body(text, signature):
              start = text.index(signature)
              brace = text.index("{", start + len(signature))
              depth = 0
              state = "code"
              index = brace
              while index < len(text):
                  char = text[index]
                  nxt = text[index + 1] if index + 1 < len(text) else ""
                  if state == "code":
                      if char == "/" and nxt == "*":
                          state = "block"
                          index += 1
                      elif char == "/" and nxt == "/":
                          state = "line"
                          index += 1
                      elif char == '"':
                          state = "string"
                      elif char == "'":
                          state = "char"
                      elif char == "{":
                          depth += 1
                      elif char == "}":
                          depth -= 1
                          if depth == 0:
                              return text[brace + 1:index]
                  elif state in ("string", "char"):
                      if char == "\\":
                          index += 1
                      elif (state == "string" and char == '"') or (state == "char" and char == "'"):
                          state = "code"
                  elif state == "block" and char == "*" and nxt == "/":
                      state = "code"
                      index += 1
                  elif state == "line" and char == "\n":
                      state = "code"
                  index += 1
              raise AssertionError("unterminated function: " + signature)

          assert '#include "switch_wait_policy.h"' in source
          vtcr = function_body(source, "wait_vtcr(void)")
          mac = function_body(source, "wait_mac_atc(void)")
          search = function_body(source, "wait_search_ready(int *value, const char *table_name)")
          failure = function_body(source, "switch_wait_failure(")
          assert "switch_wait_until_clear(" in vtcr and "0x80000000U" in vtcr
          assert "20U" in vtcr and "1000U" in vtcr
          assert "switch_wait_until_clear(" in mac and "0x8000U" in mac
          assert "20U" in mac and "1000U" in mac
          assert "switch_wait_for_table_result(" in search
          assert "0x8000U" in search and "0x6000U" in search
          assert "20U" in search and "5000U" in search
          assert "ETIMEDOUT" in failure and "switch_fini();" in failure
          assert "exit(EXIT_FAILURE);" in failure
          for signature in ("void dip_dump(void)", "void sip_dump(void)", "void table_dump(void)"):
              body = function_body(source, signature)
              assert "wait_search_ready(&value" in body, signature
              assert "while(1)" not in body and "while (1)" not in body
          for signature in ("void table_clear(void)", "void dip_clear(void)", "void sip_clear(void)"):
              body = function_body(source, signature)
              assert body.index("reg_write(REG_ESW_WT_MAC_ATC,") < body.index("wait_mac_atc();")
              assert body.index("wait_mac_atc();") < body.index("reg_read(REG_ESW_WT_MAC_ATC, &value)")
              assert "usleep(5000)" not in body, signature
              assert r'printf("REG_ESW_WT_MAC_ATC is 0x%x\n\r", value);' in body
          assert "return ETIMEDOUT;" in policy
          assert "return EINVAL;" in policy
          for marker in (
              "test_busy_timeout_is_reported",
              "test_register_read_error_is_propagated",
              "test_search_waits_for_idle_and_ready_or_end",
              "test_search_timeout_is_bounded",
              "test_invalid_wait_inputs_fail",
              "switch table-engine bounded wait policy: PASS",
          ):
              assert marker in test, marker
          filters = workflow.split("jobs:", 1)[0]
          push, pull_request = filters.split("  pull_request:", 1)
          for path in (
              "trunk/user/utils/src/switch/switch_wait_policy.h",
              "trunk/user/utils/src/switch/tests/switch_wait_policy.c",
          ):
              assert push.count('"' + path + '"') == 1
              assert pull_request.count('"' + path + '"') == 1
          print("switch VLAN/MAC table busy waits and bounded DIP/SIP/MAC searches: PASS")
          PY

      - name: Check Clause 45 argument handling and source contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path("trunk/user/utils/src/switch/mii_mgr_cl45.c").read_text()
          workflow = Path(".github/workflows/switch-cli-stability.yml").read_text()
          assert "static int parse_hex_argument(" in source
          assert "static int parse_arguments(" in source
          assert "case 'd':" in source and "case 'r':" in source
          assert source.index("parse_arguments(argc, argv, &mii, &method)") < source.index("socket(AF_INET")
          assert "if (close(sk) < 0 && status == EXIT_SUCCESS)" in source
          assert "parsed > max_value" in source
          assert source.count("case 'd':") == 1
          assert source.count("case 'r':") == 1
          filters = workflow.split("jobs:", 1)[0]
          assert filters.count("trunk/user/utils/src/switch/mii_mgr_cl45.c") == 2
          assert filters.count("trunk/user/utils/src/switch/tests/mii_mgr_cl45_cli.c") == 2
          test_path = Path("trunk/user/utils/src/switch/tests/mii_mgr_cl45_cli.c")
          assert test_path.is_file()
          print("Clause 45 parser, validation-before-socket, cleanup and CI path contracts: OK")
          PY
      - name: Build Clause 45 CLI and run host argument regression
        run: |
          SWITCH_DIR=trunk/user/utils/src/switch
          RAETH_INCLUDE=trunk/linux-4.4.x/drivers/net/ethernet/raeth
          cc -std=gnu89 -Wall -Wextra -Werror -I "$RAETH_INCLUDE" \
            -c "$SWITCH_DIR/mii_mgr_cl45.c" -o /tmp/mii_mgr_cl45.o
          cc -std=gnu89 -Wall -Wextra -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -I "$RAETH_INCLUDE" "$SWITCH_DIR/tests/mii_mgr_cl45_cli.c" \
            -o /tmp/mii_mgr_cl45_cli
          ASAN_OPTIONS=detect_leaks=1 /tmp/mii_mgr_cl45_cli

      - name: Check Clause 22 MDIO ioctl failure propagation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          driver = Path("trunk/linux-4.4.x/drivers/net/ethernet/raeth/raether.c").read_text()
          cli = Path("trunk/user/utils/src/switch/mii_mgr.c").read_text()
          makefile = Path("trunk/user/utils/src/switch/Makefile").read_text()

          assert "mii_mgr: invalid or incomplete arguments" in cli
          assert "parse_arguments(argc, argv, &options)" in cli
          main = cli.split("int main(", 1)[1]
          assert main.index("parse_arguments(") < main.index("socket(AF_INET")
          assert "errno == ERANGE" in cli and "parsed > maximum" in cli
          assert "if (close(sk) < 0)" in cli
          assert "SRC = switch_gsw.c" in makefile and "mii_mgr: mii_mgr.c" in makefile

          virtual = driver.split("int virtualif_ioctl(", 1)[1].split("static int ei_change_mtu", 1)[0]
          real = driver.split("int ei_ioctl(", 1)[1].split("static const struct net_device_ops ei_netdev_ops", 1)[0]
          assert "if (!mii_mgr_read(mii.phy_id, mii.reg_num, &mii.val_out))\n\t\t\treturn -EIO;" in virtual
          assert "if (!mii_mgr_write(mii.phy_id, mii.reg_num, mii.val_in))\n\t\t\treturn -EIO;" in virtual
          assert "if (!mii_mgr_read(mii.phy_id, mii.reg_num, &mii.val_out)) {\n\t\t\tret = -EIO;\n\t\t\tbreak;\n\t\t}" in real
          assert "if (!mii_mgr_write(mii.phy_id, mii.reg_num, mii.val_in))\n\t\t\tret = -EIO;" in real
          assert virtual.index("if (!mii_mgr_read(") < virtual.index("copy_to_user(ifr->ifr_data, &mii, sizeof(mii))")
          assert real.index("if (!mii_mgr_read(") < real.index("copy_to_user(ifr->ifr_data, &mii, sizeof(mii))")
          print("Clause 22 MDIO timeout/error results reach both ioctl handlers: OK")
          PY
      - name: Build MII manager and run host argument regression
        run: |
          SWITCH_DIR=trunk/user/utils/src/switch
          RAETH_INCLUDE=trunk/linux-4.4.x/drivers/net/ethernet/raeth
          cc -std=gnu89 -Wall -Wextra -Werror -DCONFIG_RALINK_MT7621 \
            -I "$RAETH_INCLUDE" -c "$SWITCH_DIR/mii_mgr.c" -o /tmp/mii_mgr.o
          cc -std=gnu89 -Wall -Wextra -Werror -DCONFIG_RALINK_MT7621 \
            -I "$RAETH_INCLUDE" -fsanitize=address,undefined \
            -fno-omit-frame-pointer "$SWITCH_DIR/tests/mii_mgr_cli.c" \
            -o /tmp/mii_mgr_cli
          ASAN_OPTIONS=detect_leaks=1 /tmp/mii_mgr_cli

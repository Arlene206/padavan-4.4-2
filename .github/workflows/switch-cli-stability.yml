          mib_status = source.split("static int esw_status_mib_port_uapi(", 1)[1].split(
              "static int esw_status_bytes_port_uapi(", 1
          )[0]
          assert '#include "mib_snapshot_policy.h"' in source
          assert "mtk_esw_mib_snapshot_read(" in mib_status
          assert "test_mib_snapshot_propagates_each_register_failure_without_publishing" in test
          assert "counter_offsets[]" in mib_policy

          cl45_read = mdio_driver.split("u32 mii_mgr_read_cl45", 1)[1].split(
              "u32 mii_mgr_write_cl45", 1
          )[0]
          cl45_write = mdio_driver.split("u32 mii_mgr_write_cl45", 1)[1]
          for function_start, function_end in (
              ("u32 mii_mgr_write(", "EXPORT_SYMBOL(mii_mgr_write)"),
              ("u32 mii_mgr_write_cl45(", "")
          ):
              function = mdio_driver.split(function_start, 1)[1]
              if function_end:
                  function = function.split(function_end, 1)[0]
              assert "if (!dev_raether)" in function
              assert function.index("if (!dev_raether)") < function.index("netdev_priv(dev_raether)")
          normal_read = mdio_driver.split("u32 mii_mgr_read(", 1)[1].split(
              "EXPORT_SYMBOL(mii_mgr_read)", 1
          )[0]
          assert "if (!read_data)" in normal_read and "if (!read_data)" in cl45_read
          for read_fn in (normal_read, cl45_read):
              null_guard = read_fn.index("if (!read_data)")
              clear_output = read_fn.index("*read_data = 0;")
              device_guard = read_fn.index("if (!dev_raether)")
              priv_access = read_fn.index("netdev_priv(dev_raether)")
              assert null_guard < clear_output < device_guard < priv_access
          for cl45_fn in (cl45_read, cl45_write):
              addr_check = cl45_fn.index(
                  "if (!mii_mgr_cl45_set_address(port_num, dev_addr, reg_addr))"
              )
              addr_failure = cl45_fn.index("goto out;", addr_check)
              timer_reset = cl45_fn.index("t_start_ns = ktime_get_ns();", addr_check)
              assert addr_check < addr_failure < timer_reset
          assert "mii_mgr_cl45_set_address(port_num, dev_addr, reg_addr);" not in cl45_read
          assert "mii_mgr_cl45_set_address(port_num, dev_addr, reg_addr);" not in cl45_write
          timeout_policy = Path("trunk/linux-4.4.x/drivers/net/ethernet/raeth/mii_mgr_timeout_policy.h").read_text()
          assert "#include <linux/ktime.h>" in mdio_driver
          assert '#include "mii_mgr_timeout_policy.h"' in mdio_driver
          assert mdio_driver.count("mii_mgr_busy_timeout_expired(t_start_ns, ktime_get_ns())") == 10
          assert "time_after(jiffies" not in mdio_driver
          assert "MDIO_BUSY_TIMEOUT_NS" in timeout_policy
          assert "100000000ULL" in timeout_policy
          print("RAETH Clause 45 MDIO address-phase error propagation: PASS")
          read_policy = policy.split("mtk_esw_register_read(", 1)[1].split(
              "mtk_esw_register_update_bits", 1
          )[0]
          assert read_policy.index("if (!value)") < read_policy.index("*value = 0U;")
          assert read_policy.index("*value = 0U;") < read_policy.index("if (!io || !io->read)")
          print("MTK ESW link/MIB checked reads and ioctl error propagation: PASS")
          print("MTK ESW IGMP/MLD checked writes and ioctl error propagation: PASS")
          print("MTK ESW link-mode policy, pre-MDIO guard and XY-C1 trigger contract: PASS")
          PY

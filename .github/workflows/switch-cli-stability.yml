name: Switch CLI ioctl failure-status regression

on:
  push:
    paths:
      - "trunk/user/utils/src/switch/switch_gsw.c"
      - "trunk/user/utils/src/switch/switch_ipv4_parse_policy.h"
      - "trunk/user/utils/src/switch/tests/switch_ipv4_parse_policy.c"
      - "trunk/user/utils/src/switch/switch_wait_policy.h"
      - "trunk/user/utils/src/switch/tests/switch_wait_policy.c"
      - "trunk/user/utils/src/switch/Makefile"
      - "trunk/user/utils/src/switch/mii_mgr_cl45.c"
      - "trunk/user/utils/src/switch/tests/mii_mgr_cl45_cli.c"
      - "trunk/user/utils/src/switch/mii_mgr.c"
      - "trunk/user/utils/src/switch/tests/mii_mgr_cli.c"
      - "trunk/linux-4.4.x/drivers/net/ethernet/raeth/raether.c"
      - "trunk/linux-4.4.x/drivers/net/ethernet/raeth/mtk_esw/ioctl.c"
      - "trunk/linux-4.4.x/drivers/net/ethernet/raeth/mtk_esw/ioctl_mt762x.c"
      - "trunk/linux-4.4.x/drivers/net/ethernet/raeth/mii_mgr.c"
      - "trunk/linux-4.4.x/drivers/net/ethernet/raeth/tests/ra_switch_mdio_policy.c"
      - "trunk/linux-4.4.x/drivers/net/ethernet/raeth/ra_switch_mdio_policy.h"
      - "trunk/linux-4.4.x/drivers/net/ethernet/raeth/ra_switch.c"
      - "trunk/linux-4.4.x/drivers/net/ethernet/raeth/ra_switch.h"
      - "trunk/linux-4.4.x/drivers/net/ethernet/raeth/mii_mgr_timeout_policy.h"
      - "trunk/linux-4.4.x/drivers/net/ethernet/raeth/tests/mii_mgr_timeout_policy.c"
      - "trunk/linux-4.4.x/drivers/net/ethernet/raeth/mtk_esw/ioctl_mt762x.h"
      - "trunk/linux-4.4.x/drivers/net/ethernet/raeth/mtk_esw/link_mode_policy.h"
      - "trunk/linux-4.4.x/drivers/net/ethernet/raeth/mtk_esw/mib_snapshot_policy.h"
      - "trunk/linux-4.4.x/drivers/net/ethernet/raeth/mtk_esw/tests/link_mode_policy.c"
      - ".github/workflows/switch-cli-stability.yml"
      - "trunk/user/rc/src/switch_rtl8367.c"
      - "trunk/user/rc/src/switch_mtk_esw.c"
      - "trunk/user/rc/src/switch_cli_parse_policy.h"
      - "trunk/user/rc/src/tests/switch_cli_parse_policy.c"
  pull_request:
    paths:
      - "trunk/user/utils/src/switch/switch_gsw.c"
      - "trunk/user/utils/src/switch/switch_ipv4_parse_policy.h"
      - "trunk/user/utils/src/switch/tests/switch_ipv4_parse_policy.c"
      - "trunk/user/utils/src/switch/switch_wait_policy.h"
      - "trunk/user/utils/src/switch/tests/switch_wait_policy.c"
      - "trunk/user/utils/src/switch/Makefile"
      - "trunk/user/utils/src/switch/mii_mgr_cl45.c"
      - "trunk/user/utils/src/switch/tests/mii_mgr_cl45_cli.c"
      - "trunk/user/utils/src/switch/mii_mgr.c"
      - "trunk/user/utils/src/switch/tests/mii_mgr_cli.c"
      - "trunk/linux-4.4.x/drivers/net/ethernet/raeth/raether.c"
      - "trunk/linux-4.4.x/drivers/net/ethernet/raeth/mtk_esw/ioctl.c"
      - "trunk/linux-4.4.x/drivers/net/ethernet/raeth/mtk_esw/ioctl_mt762x.c"
      - "trunk/linux-4.4.x/drivers/net/ethernet/raeth/mii_mgr.c"
      - "trunk/linux-4.4.x/drivers/net/ethernet/raeth/tests/ra_switch_mdio_policy.c"
      - "trunk/linux-4.4.x/drivers/net/ethernet/raeth/ra_switch_mdio_policy.h"
      - "trunk/linux-4.4.x/drivers/net/ethernet/raeth/ra_switch.c"
      - "trunk/linux-4.4.x/drivers/net/ethernet/raeth/ra_switch.h"
      - "trunk/linux-4.4.x/drivers/net/ethernet/raeth/mii_mgr_timeout_policy.h"
      - "trunk/linux-4.4.x/drivers/net/ethernet/raeth/tests/mii_mgr_timeout_policy.c"
      - "trunk/linux-4.4.x/drivers/net/ethernet/raeth/mtk_esw/ioctl_mt762x.h"
      - "trunk/linux-4.4.x/drivers/net/ethernet/raeth/mtk_esw/link_mode_policy.h"
      - "trunk/linux-4.4.x/drivers/net/ethernet/raeth/mtk_esw/mib_snapshot_policy.h"
      - "trunk/linux-4.4.x/drivers/net/ethernet/raeth/mtk_esw/tests/link_mode_policy.c"
      - ".github/workflows/switch-cli-stability.yml"
      - "trunk/user/rc/src/switch_rtl8367.c"
      - "trunk/user/rc/src/switch_mtk_esw.c"
      - "trunk/user/rc/src/switch_cli_parse_policy.h"
      - "trunk/user/rc/src/tests/switch_cli_parse_policy.c"
  workflow_dispatch:

jobs:
  switch-cli-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check built switch CLI reports operational failures
        run: |
          python3 - <<'PY'
          from pathlib import Path

          makefile = Path("trunk/user/utils/src/switch/Makefile").read_text()
          source = Path("trunk/user/utils/src/switch/switch_gsw.c").read_text()
          lines = source.splitlines()

          # The MT7621 switch_gsw.c translation unit is wired into this target;
          # the legacy switch.c is not the production source.
          assert "SRC = switch_gsw.c" in makefile

          socket_failures = [
              i for i, line in enumerate(lines) if 'perror("socket");' in line
          ]
          assert len(socket_failures) == 1
          assert lines[socket_failures[0] + 1].strip() == "exit(EXIT_FAILURE);"

          ioctl_failures = [
              i for i, line in enumerate(lines) if 'perror("ioctl");' in line
          ]
          assert len(ioctl_failures) == 7, (
              f"expected 7 ioctl failure branches, got {len(ioctl_failures)}"
          )
          for index in ioctl_failures:
              assert lines[index + 1].strip() == "close(esw_fd);"
              assert lines[index + 2].strip() == "exit(EXIT_FAILURE);"

          # Operational failures, malformed arguments and unknown commands fail closed.
          # One socket + seven ioctl + bounded wait + IPv4 + port-map + numeric parse + usage.
          assert source.count("exit(EXIT_FAILURE);") == 13
          assert source.count("exit(0);") == 0
          usage = source.split("void usage(char *cmd)", 1)[1].split("\n}", 1)[0]
          assert "switch_fini();" in usage
          assert "exit(EXIT_FAILURE);" in usage
          assert "exit(0);" not in usage

          def function_body(signature):
              start = source.index(signature)
              opening = source.index("{", start)
              depth = 0
              for position in range(opening, len(source)):
                  if source[position] == "{":
                      depth += 1
                  elif source[position] == "}":
                      depth -= 1
                      if depth == 0:
                          return source[opening + 1:position]
              raise AssertionError(f"unterminated function: {signature}")

          numeric_parser = function_body("parse_uint_range_argument(")
          assert "switch_parse_uint_range(text, 0U, maximum, &value)" in numeric_parser
          assert "switch_fini();" in numeric_parser
          assert numeric_parser.index("switch_fini();") < numeric_parser.index("exit(EXIT_FAILURE);")

          acl_dispatch = source.split(
              'else if (!strncmp(argv[1], "acl", 4)) {', 1
          )[1].split("\n\t}\n#endif", 1)[0]
          assert "if (argc < 4)" in acl_dispatch
          assert "if (argc < 3)" not in acl_dispatch
          assert acl_dispatch.index("if (argc < 4)") < acl_dispatch.index("argv[3]")

          for signature, guard, first_arg in (
              ("set_mirror_to(int argc, char *argv[])", "if (argc != 4 ||", "argv[3]"),
              ("set_mirror_from(int argc, char *argv[])", "if (argc != 5 ||", "argv[3]"),
              ("acl_dip_trtcm(int argc, char *argv[])", "if (argc != 10)", "argv[4]"),
              ("void dip_add(int argc, char *argv[])", "if (argc < 5)", "argv[3]"),
              ("void dip_del(int argc, char *argv[])", "if (argc < 4)", "argv[3]"),
              ("void sip_add(int argc, char *argv[])", "if (argc < 6)", "argv[3]"),
              ("void sip_del(int argc, char *argv[])", "if (argc < 5)", "argv[3]"),
          ):
              body = function_body(signature)
              assert guard in body, signature
              assert body.index(guard) < body.index(first_arg), signature
              if signature.startswith("set_mirror_"):
                  parse_call = body.index("switch_parse_uint_range(")
                  assert body.index(guard) < parse_call, signature
                  assert body.index("usage(argv[0]);") > parse_call, signature
              else:
                  assert "usage(argv[0]);" in body[:body.index(first_arg)], signature
          for signature in ("void set_mirror_to(int argc, char *argv[])", "void set_mirror_from(int argc, char *argv[])"):
              body = function_body(signature)
              assert "switch_parse_uint_range(" in body
              assert "strtoul(" not in body
          main = function_body("int main(int argc, char *argv[])")
          for command, token, maximum in (
              ('!strncmp(argv[1], "ingress-rate", 6)', "argv[3]", "4U"),
              ('!strncmp(argv[1], "egress-rate", 6)', "argv[3]", "4U"),
              ('!strncmp(argv[1], "tag", 4)', "argv[3]", "MAX_PORT"),
              ('!strncmp(argv[1], "pvid", 5)', "argv[2]", "MAX_PORT"),
          ):
              start = main.index(command)
              ends = [main.find('else if (!strncmp(argv[1]', start + len(command)),
                       main.find('if (!strncmp(argv[1]', start + len(command))]
              ends = [position for position in ends if position >= 0]
              end = min(ends) if ends else len(main)
              block = main[start:end]
              assert "switch_parse_uint_range(" + token in block
              assert maximum in block
              assert " & 0x7" not in block
          assert 'strcmp(argv[2], "on") == 0' in main
          assert 'strcmp(argv[2], "off") == 0' in main
          for command in ('!strncmp(argv[1], "ingress-rate", 6)',
                          '!strncmp(argv[1], "egress-rate", 6)'):
              start = main.index(command)
              subcommand = main.index("if (argc < 3)", start)
              selector = main.index('strcmp(argv[2], "on")', start)
              assert subcommand < selector
          assert "argv[2][1]" not in main
          meter = function_body("void acl_dip_meter(int argc, char *argv[])")
          trtcm = function_body("void acl_dip_trtcm(int argc, char *argv[])")
          for body, guard in ((meter, "argc != 7"), (trtcm, "argc != 10")):
              assert guard in body
              assert "parse_portmap_argument(argv[5])" in body
              assert "parse_ipv4_argument(argv[4])" in body
              assert "strtoul(" not in body
              assert body.index("parse_portmap_argument(argv[5])") < body.index("reg_write(")
              assert body.index("parse_ipv4_argument(argv[4])") < body.index("reg_write(")
              assert body.index("parse_uint_range_argument(") < body.index("reg_write(")
          assert "0x1fffc0U" in meter
          assert "0x3fffc0U" in trtcm
          assert "0xffffU" in trtcm
          print("switch command port indices and numeric selectors reject invalid or aliased inputs: PASS")
          print("DIP meter/TrTCM fields are validated before the first MMIO write: PASS")
          print("switch_gsw invalid usage and truncated ACL/mirror/TrTCM/DIP/SIP commands fail safely: PASS")
          PY

      - name: Compile and verify strict switch IPv4 argument parsing
        run: |
          set -eu
          SWITCH_DIR=trunk/user/utils/src/switch
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -fno-omit-frame-pointer -I "$SWITCH_DIR" \
            "$SWITCH_DIR/tests/switch_ipv4_parse_policy.c" \
            -o /tmp/switch_ipv4_parse_policy
          ASAN_OPTIONS=detect_leaks=1 /tmp/switch_ipv4_parse_policy
          python3 - <<'PY'
          from pathlib import Path

          source = Path("trunk/user/utils/src/switch/switch_gsw.c").read_text()
          workflow = Path(".github/workflows/switch-cli-stability.yml").read_text()

          assert "switch_parse_ipv4_address(text, &address)" in source
          assert "str_to_ip(" not in source
          assert "getnext(" not in source
          assert source.count("parse_ipv4_argument(argv[4])") == 7
          assert source.count("parse_ipv4_argument(argv[3])") == 4

          for name in ("sip_add", "sip_del", "dip_add", "dip_del"):
              body = source.split("void " + name + "(int argc, char *argv[])", 1)[1]
              body = body.split("\nvoid ", 1)[0]
              assert body.index("if (argc < ") < body.index("argv[3]")
              assert body.index("parse_ipv4_argument(argv[3])") < body.index("reg_write(")

          for name in ("sip_add", "sip_del"):
              body = source.split("void " + name + "(int argc, char *argv[])", 1)[1]
              body = body.split("\nvoid ", 1)[0]
              assert body.index("parse_ipv4_argument(argv[4])") < body.index("reg_write(")

          for name, portmap_arg in (("dip_add", "argv[4]"), ("sip_add", "argv[5]")):
              body = source.split("void " + name + "(int argc, char *argv[])", 1)[1]
              body = body.split("\nvoid ", 1)[0]
              assert body.index("parse_portmap_argument(" + portmap_arg + ")") < body.index("reg_write(")
          assert "switch_parse_portmap(text, &portmap)" in source
          assert "switch_parse_portmap" in Path(
              "trunk/user/utils/src/switch/switch_ipv4_parse_policy.h"
          ).read_text()
          tests = Path("trunk/user/utils/src/switch/tests/switch_ipv4_parse_policy.c").read_text()
          policy = Path("trunk/user/utils/src/switch/switch_ipv4_parse_policy.h").read_text()
          assert "test_invalid_portmaps" in tests
          assert "test_mac_parser" in tests
          assert "test_uint_range_parser" in tests
          assert "test_table_portmap_parser" in tests
          assert "test_switch_command_numeric_boundaries" in tests
          assert "switch_parse_mac_address" in policy
          mt_vlan = source.split("void vlan_set(int argc, char *argv[])", 1)[1].split("\n#else\nvoid vlan_set", 1)[0]
          legacy_vlan = source.split("\n#else\nvoid vlan_set(int argc, char *argv[])", 1)[1].split("\n#endif", 1)[0]
          for vlan_body, count_guard in ((mt_vlan, "argc < 5 || argc > 8"),
                                         (legacy_vlan, "argc < 6 || argc > 9")):
              assert count_guard in vlan_body
              assert "strtoul(" not in vlan_body
              assert vlan_body.index("switch_parse_uint_range(") < vlan_body.index("reg_write(")
          assert "switch_parse_uint_range(argv[3], 0U, 4095U, &cvid)" in mt_vlan
          assert "switch_parse_uint_range(argv[3], 0U, 15U, &idx)" in legacy_vlan
          assert "switch_parse_uint_range(argv[4], 0U, 4095U, &cvid)" in legacy_vlan
          assert "switch_parse_uint_range" in policy
          assert "switch_parse_table_portmap" in policy

          table_add = source.split("void table_add(int argc, char *argv[])", 1)[1].split("\n}", 1)[0]
          first_add_write = table_add.index("reg_write(")
          for expression in ("switch_parse_mac_address(argv[2]", "switch_parse_table_portmap(argv[3]",
                            "switch_parse_uint_range(argv[4]", "switch_parse_uint_range(argv[5]",
                            "switch_parse_uint_range(argv[6]"):
              assert table_add.index(expression) < first_add_write
          assert "argc < 3 || argc > 7" in table_add
          assert "strtoul(" not in table_add

          table_del = source.split("void table_del(int argc, char *argv[])", 1)[1].split("void table_clear", 1)[0]
          first_del_write = table_del.index("reg_write(")
          assert table_del.index("switch_parse_mac_address(argv[2]") < first_del_write
          assert table_del.index("switch_parse_uint_range(argv[3], 0U, 7U") < first_del_write
          assert "argc < 3 || argc > 4" in table_del
          assert "strtoul(" not in table_del

          filters = workflow.split("jobs:", 1)[0]
          push, pull_request = filters.split("  pull_request:", 1)
          for path in (
              "trunk/user/utils/src/switch/switch_ipv4_parse_policy.h",
              "trunk/user/utils/src/switch/tests/switch_ipv4_parse_policy.c",
          ):
              assert push.count('"' + path + '"') == 1
              assert pull_request.count('"' + path + '"') == 1
          print("All switch IPv4 inputs are strictly parsed before register writes: PASS")
          PY
      - name: Validate ACL arguments before switch register writes
        run: |
          set -eu
          python3 - <<'PY'
          from pathlib import Path

          source = Path("trunk/user/utils/src/switch/switch_gsw.c").read_text()
          parser = Path("trunk/user/utils/src/switch/switch_ipv4_parse_policy.h").read_text()
          tests = Path("trunk/user/utils/src/switch/tests/switch_ipv4_parse_policy.c").read_text()

          def function_body(signature):
              start = source.index(signature)
              opening = source.index("{", start)
              depth = 0
              for position in range(opening, len(source)):
                  if source[position] == "{":
                      depth += 1
                  elif source[position] == "}":
                      depth -= 1
                      if depth == 0:
                          return source[opening + 1:position]
              raise AssertionError("unterminated function: " + signature)

          contracts = (
              ("void acl_ethertype(int argc, char *argv[])",
               "switch_parse_hex_range(argv[4], 0xffffU, &ethertype)"),
              ("void acl_l4_add(int argc, char *argv[])",
               "switch_parse_hex_range(argv[4], 0xffffU, &value)"),
              ("void acl_sp_add(int argc, char *argv[])",
               "switch_parse_uint_range(argv[4], 0U, 0xffffU, &value)"),
          )
          for signature, parser_call in contracts:
              body = function_body(signature)
              assert "if (argc != 6)" in body, signature
              assert "usage(argv[0]);" in body and "return;" in body, signature
              assert parser_call in body, signature
              parser_guard = "if (" + parser_call + " != 0)"
              assert parser_guard in body, signature
              first_write = body.index("reg_write(")
              assert body.index(parser_guard) < body.index("usage(argv[0]);", body.index(parser_guard)) < first_write
              assert body.index("parse_portmap_argument(argv[5])") < first_write, signature
              assert "strtoul(" not in body, signature

          assert "switch_parse_hex_range" in parser
          assert "test_hex_range_parser" in tests
          assert "test_invalid_portmaps" in tests
          assert "switch_parse_portmap(text, &portmap)" in source
          print("EtherType, L4 payload and source-port ACL inputs validate before MMIO writes: PASS")
          PY
      - name: Validate PHY, VLAN dump and raw register numeric arguments
        run: |
          set -eu
          python3 - <<'PY'
          from pathlib import Path

          source = Path("trunk/user/utils/src/switch/switch_gsw.c").read_text()
          policy = Path("trunk/user/utils/src/switch/switch_ipv4_parse_policy.h").read_text()
          tests = Path("trunk/user/utils/src/switch/tests/switch_ipv4_parse_policy.c").read_text()
          main_start = source.index("int main(int argc, char *argv[])")
          main = source[main_start:]

          phy_start = main.index('else if (!strncmp(argv[1], "phy", 4))')
          phy_end = main.index('else if (!strncmp(argv[1], "sip", 5))', phy_start)
          phy = " ".join(main[phy_start:phy_end].split())
          assert "argc == 3" in phy and "argc == 2" in phy
          assert "switch_parse_decimal_range(argv[2], 0U, 31U, &phy_addr)" in phy
          assert "strtoul(" not in phy

          vlan_start = main.index('else if (!strncmp(argv[1], "vlan", 5))')
          vlan_end = main.index('else if (!strncmp(argv[1], "reg", 4))', vlan_start)
          vlan = " ".join(main[vlan_start:vlan_end].split())
          assert "switch_parse_decimal_range(argv[3], 0U, 0x7fffffffU, &max_vid)" in vlan
          assert "argc != 3" in vlan and "argc == 4" in vlan
          assert "strtoul(" not in vlan

          reg_start = main.index('else if (!strncmp(argv[1], "reg", 4))')
          reg_end = main.index('else if (!strncmp(argv[1], "ingress-rate", 6))', reg_start)
          reg = " ".join(main[reg_start:reg_end].split())
          for mode in ('"r"', '"w"', '"d"'):
              assert "strcmp(argv[2], " + mode + ")" in reg
          assert "switch_parse_hex_range(argv[3], 0x7fffffffU, &parsed)" in reg
          assert "switch_parse_hex_range(argv[3], 0x7fffff03U, &parsed)" in reg
          assert "switch_parse_hex_range(argv[4], 0xffffffffU, &parsed)" in reg
          assert "strtoul(" not in reg
          assert "off = (int)parsed;" in reg
          assert "val = (int)parsed;" in reg

          assert "switch_parse_decimal_range" in policy
          assert "test_decimal_range_parser" in tests
          assert "reg d" in source and "vlan dump" in source and "phy [phy_addr]" in source
          print("PHY, VLAN dump and raw switch register commands reject incomplete numeric input: PASS")
          PY
      - name: Compile and verify bounded switch table waits
        run: |
          set -eu
          SWITCH_DIR=trunk/user/utils/src/switch
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -fno-omit-frame-pointer -I "$SWITCH_DIR" \
            "$SWITCH_DIR/tests/switch_wait_policy.c" -o /tmp/switch_wait_policy
          ASAN_OPTIONS=detect_leaks=1 /tmp/switch_wait_policy
          python3 - <<'PY'
          from pathlib import Path

          source = Path("trunk/user/utils/src/switch/switch_gsw.c").read_text()
          policy = Path("trunk/user/utils/src/switch/switch_wait_policy.h").read_text()
          test = Path("trunk/user/utils/src/switch/tests/switch_wait_policy.c").read_text()
          workflow = Path(".github/workflows/switch-cli-stability.yml").read_text()

          def function_body(text, signature):
              start = text.index(signature)
              brace = text.index("{", start + len(signature))
              depth = 0
              state = "code"
              index = brace
              while index < len(text):
                  char = text[index]
                  nxt = text[index + 1] if index + 1 < len(text) else ""
                  if state == "code":
                      if char == "/" and nxt == "*":
                          state = "block"
                          index += 1
                      elif char == "/" and nxt == "/":
                          state = "line"
                          index += 1
                      elif char == '"':
                          state = "string"
                      elif char == "'":
                          state = "char"
                      elif char == "{":
                          depth += 1
                      elif char == "}":
                          depth -= 1
                          if depth == 0:
                              return text[brace + 1:index]
                  elif state in ("string", "char"):
                      if char == "\\":
                          index += 1
                      elif (state == "string" and char == '"') or (state == "char" and char == "'"):
                          state = "code"
                  elif state == "block" and char == "*" and nxt == "/":
                      state = "code"
                      index += 1
                  elif state == "line" and char == "\n":
                      state = "code"
                  index += 1
              raise AssertionError("unterminated function: " + signature)

          assert '#include "switch_wait_policy.h"' in source
          vtcr = function_body(source, "wait_vtcr(void)")
          mac = function_body(source, "wait_mac_atc(void)")
          search = function_body(source, "wait_search_ready(int *value, const char *table_name)")
          failure = function_body(source, "switch_wait_failure(")
          assert "switch_wait_until_clear(" in vtcr and "0x80000000U" in vtcr
          assert "20U" in vtcr and "1000U" in vtcr

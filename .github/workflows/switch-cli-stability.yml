      - name: Validate strict numeric parsing in RC switch front-ends
        run: |
          set -eu
          RC_DIR=trunk/user/rc/src
          cc -std=gnu89 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -fno-omit-frame-pointer -I "$RC_DIR" \
            "$RC_DIR/tests/switch_cli_parse_policy.c" \
            -o /tmp/rc-switch-cli-parse
          ASAN_OPTIONS=detect_leaks=1 /tmp/rc-switch-cli-parse
          python3 - <<'PY'
          from pathlib import Path

          rc = Path("trunk/user/rc/src")
          policy = (rc / "switch_cli_parse_policy.h").read_text()
          test = (rc / "tests/switch_cli_parse_policy.c").read_text()
          workflow = Path(".github/workflows/switch-cli-stability.yml").read_text()

          def function_body(source, signature):
              start = source.find(signature)
              assert start >= 0, f"missing function: {signature}"
              opening = source.find("{", start + len(signature))
              assert opening >= 0, f"missing function body: {signature}"
              depth = 0
              for position in range(opening, len(source)):
                  if source[position] == "{":
                      depth += 1
                  elif source[position] == "}":
                      depth -= 1
                      if depth == 0:
                          return source[opening + 1:position]
              raise AssertionError(f"unterminated function: {signature}")

          assert "UINT_MAX" in policy and "return ERANGE;" in policy
          assert "return EINVAL;" in policy
          assert "parsed > (UINT_MAX - digit) / base" in policy
          assert "test_malformed_values_are_rejected_without_output_changes" in test
          assert "test_overflow_is_rejected_without_output_changes" in test
          assert "test_ioctl_fields_must_fit_packed_request" in test
          assert "UINT_MAX>>command_bits" in "".join(policy.split())

          for path, signature in (
              ("switch_rtl8367.c", "rtl8367_main(int argc, char **argv)"),
              ("switch_mtk_esw.c", "mtk_esw_main(int argc, char **argv)"),
          ):
              source = (rc / path).read_text()
              assert '#include "switch_cli_parse_policy.h"' in source
              main = function_body(source, signature)
              assert "argc < 2 || argc > 4" in main
              main_compact = "".join(main.split())
              if path == "switch_rtl8367.c":
                  command_bits = "RTL8367_IOCTL_CMD_LENGTH_BITS"
              else:
                  command_bits = "MTK_ESW_IOCTL_CMD_LENGTH_BITS"
              assert "switch_cli_parse_ioctl_command(argv[1]," + command_bits + ",&cmd)" in main_compact
              assert "switch_cli_parse_ioctl_parameter(argv[2]," + command_bits + ",1,&arg)" in main_compact
              assert "switch_cli_parse_uint(argv[2], 1, &arg)" in main
              if path == "switch_rtl8367.c":
                  arg_policy = function_body(source, "rtl8367_command_uses_packed_argument(unsigned int cmd)")
                  for command in ("RTL8367_IOCTL_STATUS_LINK_PORT", "RTL8367_IOCTL_STATUS_SPEED_PORT", "RTL8367_IOCTL_STATUS_MIB_PORT", "RTL8367_IOCTL_REG_GET", "RTL8367_IOCTL_PHY_REG_GET", "RTL8367_IOCTL_REG_SET", "RTL8367_IOCTL_PHY_REG_SET"):
                      assert "case " + command + ":" in arg_policy
                  assert "cmd == RTL8367_IOCTL_REG_SET || cmd == RTL8367_IOCTL_PHY_REG_SET" in main
                  assert "switch_cli_parse_uint(argv[3], 1, &par)" in main
                  assert "switch_cli_parse_ioctl_parameter(argv[3], RTL8367_IOCTL_CMD_LENGTH_BITS, 1, &par)" in main
              else:
                  arg_policy = function_body(source, "mtk_esw_command_uses_packed_argument(unsigned int cmd)")
                  for command in ("MTK_ESW_IOCTL_STATUS_LINK_PORT", "MTK_ESW_IOCTL_STATUS_LINK_PORTS_WAN", "MTK_ESW_IOCTL_STATUS_LINK_PORTS_LAN", "MTK_ESW_IOCTL_STATUS_SPEED_PORT", "MTK_ESW_IOCTL_STATUS_MIB_PORT"):
                      assert "case " + command + ":" in arg_policy
                  assert "switch_cli_parse_ioctl_parameter(argv[2], MTK_ESW_IOCTL_CMD_LENGTH_BITS, 1, &arg)" in main
                  assert "switch_cli_parse_ioctl_parameter(argv[3], MTK_ESW_IOCTL_CMD_LENGTH_BITS, 1, &par)" in main
              assert "switch_cli_parse_uint(argv[1], 0, &cmd)" not in main
              assert "atoi(argv[1])" not in main
              assert "get_param_int_hex(argv[" not in main

          filters = workflow.split("jobs:", 1)[0]
          push, pull_request = filters.split("  pull_request:", 1)
          for path in (
              "trunk/user/rc/src/switch_rtl8367.c",
              "trunk/user/rc/src/switch_mtk_esw.c",
              "trunk/user/rc/src/switch_cli_parse_policy.h",
              "trunk/user/rc/src/tests/switch_cli_parse_policy.c",
          ):
              assert push.count('"' + path + '"') == 1, path
              assert pull_request.count('"' + path + '"') == 1, path
          print("RC RTL8367/MTK switch commands reject malformed, partial and overflowing numeric input: PASS")
          PY


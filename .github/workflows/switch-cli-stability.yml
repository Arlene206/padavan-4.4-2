name: Switch CLI ioctl failure-status regression

on:
  push:
    paths:
      - "trunk/user/utils/src/switch/switch_gsw.c"
      - "trunk/user/utils/src/switch/Makefile"
      - "trunk/user/utils/src/switch/mii_mgr_cl45.c"
      - "trunk/user/utils/src/switch/tests/mii_mgr_cl45_cli.c"
      - ".github/workflows/switch-cli-stability.yml"
  pull_request:
    paths:
      - "trunk/user/utils/src/switch/switch_gsw.c"
      - "trunk/user/utils/src/switch/Makefile"
      - "trunk/user/utils/src/switch/mii_mgr_cl45.c"
      - "trunk/user/utils/src/switch/tests/mii_mgr_cl45_cli.c"
      - ".github/workflows/switch-cli-stability.yml"
  workflow_dispatch:

jobs:
  switch-cli-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check built switch CLI reports operational failures
        run: |
          python3 - <<'PY'
          from pathlib import Path

          makefile = Path("trunk/user/utils/src/switch/Makefile").read_text()
          source = Path("trunk/user/utils/src/switch/switch_gsw.c").read_text()
          lines = source.splitlines()

          # The MT7621 switch_gsw.c translation unit is wired into this target;
          # the legacy switch.c is not the production source.
          assert "SRC = switch_gsw.c" in makefile

          socket_failures = [
              i for i, line in enumerate(lines) if 'perror("socket");' in line
          ]
          assert len(socket_failures) == 1
          assert lines[socket_failures[0] + 1].strip() == "exit(EXIT_FAILURE);"

          ioctl_failures = [
              i for i, line in enumerate(lines) if 'perror("ioctl");' in line
          ]
          assert len(ioctl_failures) == 7, (
              f"expected 7 ioctl failure branches, got {len(ioctl_failures)}"
          )
          for index in ioctl_failures:
              assert lines[index + 1].strip() == "close(esw_fd);"
              assert lines[index + 2].strip() == "exit(EXIT_FAILURE);"

          # Operational errors fail the process; ordinary usage/help remains 0.
          assert source.count("exit(EXIT_FAILURE);") == 8
          assert source.count("exit(0);") == 1
          assert "switch_fini();\n\texit(0);" in source
          print("switch_gsw operational socket/ioctl failures return failure status: OK")
          PY
      - name: Check Clause 45 argument handling and source contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path("trunk/user/utils/src/switch/mii_mgr_cl45.c").read_text()
          workflow = Path(".github/workflows/switch-cli-stability.yml").read_text()
          assert "static int parse_hex_argument(" in source
          assert "static int parse_arguments(" in source
          assert "case 'd':" in source and "case 'r':" in source
          assert source.index("parse_arguments(argc, argv, &mii, &method)") < source.index("socket(AF_INET")
          assert "if (close(sk) < 0 && status == EXIT_SUCCESS)" in source
          assert "parsed > max_value" in source
          assert source.count("case 'd':") == 1
          assert source.count("case 'r':") == 1
          filters = workflow.split("jobs:", 1)[0]
          assert filters.count("trunk/user/utils/src/switch/mii_mgr_cl45.c") == 2
          assert filters.count("trunk/user/utils/src/switch/tests/mii_mgr_cl45_cli.c") == 2
          test_path = Path("trunk/user/utils/src/switch/tests/mii_mgr_cl45_cli.c")
          assert test_path.is_file()
          print("Clause 45 parser, validation-before-socket, cleanup and CI path contracts: OK")
          PY
      - name: Build Clause 45 CLI and run host argument regression
        run: |
          SWITCH_DIR=trunk/user/utils/src/switch
          RAETH_INCLUDE=trunk/linux-4.4.x/drivers/net/ethernet/raeth
          cc -std=gnu89 -Wall -Wextra -Werror -I "$RAETH_INCLUDE" \
            -c "$SWITCH_DIR/mii_mgr_cl45.c" -o /tmp/mii_mgr_cl45.o
          cc -std=gnu89 -Wall -Wextra -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -I "$RAETH_INCLUDE" "$SWITCH_DIR/tests/mii_mgr_cl45_cli.c" \
            -o /tmp/mii_mgr_cl45_cli
          ASAN_OPTIONS=detect_leaks=1 /tmp/mii_mgr_cl45_cli

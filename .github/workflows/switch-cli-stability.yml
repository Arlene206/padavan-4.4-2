jobs:
  switch-cli-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate RAETH HW-IOC PMU proc bounds and MMIO failures
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror -g \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -I trunk/linux-4.4.x/drivers/net/ethernet/raeth \
            trunk/linux-4.4.x/drivers/net/ethernet/raeth/tests/ra_dbg_hwioc_policy.c \
            -o "$RUNNER_TEMP/ra_dbg_hwioc_policy"
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 \
            "$RUNNER_TEMP/ra_dbg_hwioc_policy"
          python3 scripts/check_raeth_hwioc_pmu.py

      - name: Validate RAETH descriptor count and allocation policy
        run: |
          set -eu
          cc -std=gnu89 -Wall -Wextra -Werror -g \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            -I trunk/linux-4.4.x/drivers/net/ethernet/raeth \
            trunk/linux-4.4.x/drivers/net/ethernet/raeth/tests/raeth_desc_policy.c \
            -o "$RUNNER_TEMP/raeth_desc_policy"
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 \
            "$RUNNER_TEMP/raeth_desc_policy"

      - name: Verify RAETH source declarations and definitions are unique
        run: python3 scripts/check_raeth_compile_integrity.py

      - name: Verify PDMA RX allocation rollback is complete
        run: python3 scripts/check_raeth_rx_ring_cleanup.py

      - name: Verify QDMA TX staged allocation rollback is complete
        run: python3 scripts/check_raeth_qdma_tx_cleanup.py

      - name: Compile and verify RAETH ESW rate ioctl bounds
        run: |
          set -eu
          RAETH=trunk/linux-4.4.x/drivers/net/ethernet/raeth
          cc -std=gnu89 -Wall -Wextra -Werror -g \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            "$RAETH/tests/raeth_esw_rate_ioctl_policy.c" \
            -o "$RUNNER_TEMP/raeth_esw_rate_ioctl_policy"
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 \
            "$RUNNER_TEMP/raeth_esw_rate_ioctl_policy"
          python3 - <<'PY'
          from pathlib import Path

          root = Path("trunk/linux-4.4.x/drivers/net/ethernet/raeth")
          source = (root / "raether.c").read_text()
          policy = (root / "raeth_esw_rate_ioctl_policy.h").read_text()
          cli = Path("trunk/user/utils/src/switch/switch_gsw.c").read_text()

          def case_body(start, end):
              start_at = source.index(start)
              end_at = source.index(end, start_at + len(start))
              return " ".join(source[start_at + len(start):end_at].split())

          ingress = case_body(
              "case RAETH_ESW_INGRESS_RATE:", "case RAETH_ESW_EGRESS_RATE:"
          )
          egress = case_body(
              "case RAETH_ESW_EGRESS_RATE:", "case RAETH_SET_LAN_IP:"
          )
          for name, body, offset in (
              ("ingress", ingress, "offset = 0x1800"),
              ("egress", egress, "offset = 0x1040"),
          ):
              check = body.index("raeth_esw_rate_ioctl_status(")
              reject = body.index("if (ret != 0)", check)
              offset_calc = body.index(offset, reject)
              mmio_read = body.index(
                  "sys_reg_read(RALINK_ETH_SW_BASE + offset)", offset_calc
              )
              mdio_write = body.index(
                  "mii_mgr_write(0x1f, offset, value)", mmio_read
              )
              assert check < reject < offset_calc < mmio_read < mdio_write, name

          assert "RAETH_ESW_RATE_MAX_PORT 4U" in policy
          assert "RAETH_ESW_RATE_MAX_BANDWIDTH_MBPS (255U * 10000U)" in policy
          assert cli.count(
              "switch_parse_uint_range(argv[4], 0U, 2550000U,"
          ) == 2
          assert "2147483647U" not in cli
          print("RAETH ingress/egress rate inputs are validated before MMIO/MDIO access: PASS")
          PY

      - name: Verify switch ioctl reports unsupported subcommands
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path("trunk/linux-4.4.x/drivers/net/ethernet/raeth")
          switch = (root / "ra_switch.c").read_text()
          header = (root / "ra_switch.h").read_text()
          driver = (root / "raether.c").read_text()
          handler = switch.split(
              "int sw_ioctl(struct ra_switch_ioctl_data *ioctl_data)", 1
          )[1].split("int ephy_ioctl(", 1)[0]
          unsupported = handler.split("default:", 1)[1].split("break;", 1)[0]
          assert "ret = -EOPNOTSUPP;" in unsupported
          assert "void sw_ioctl(" not in header
          assert "int sw_ioctl(struct ra_switch_ioctl_data *ioctl_data);" in header
          dispatch = driver.split("case RAETH_SW_IOCTL:", 1)[1].split(
              "case RAETH_QDMA_IOCTL:", 1
          )[0]
          assert "ret = sw_ioctl(&ioctl_data);" in dispatch
          trunk = handler.split("case SW_IOCTL_SET_PORT_TRUNK:", 1)[1]
          assert trunk.index("rtk_hal_set_port_trunk(ioctl_data);") < trunk.index("break;")
          assert trunk.index("break;") < trunk.index("default:")
          print("Unsupported switch ioctl commands propagate -EOPNOTSUPP; trunk command does not fall through: PASS")
          PY

      - name: Verify EPHY ioctl rejects unsupported commands
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path("trunk/linux-4.4.x/drivers/net/ethernet/raeth")
          switch = (root / "ra_switch.c").read_text()
          driver = (root / "raether.c").read_text()
          handler = switch.split("int ephy_ioctl(", 1)[1].split(
              "static const struct of_device_id mediatek_gsw_match[]", 1
          )[0]
          unsupported = handler.split("default:", 1)[1].split("break;", 1)[0]
          assert "ret = -EOPNOTSUPP;" in unsupported
          assert "ret = 1;" not in unsupported
          for command in (
              "RAETH_VBG_IEXT_CALIBRATION",
              "RAETH_TXG_R50_CALIBRATION",
              "RAETH_TXG_OFFSET_CALIBRATION",
              "RAETH_TXG_AMP_CALIBRATION",
              "GE_TXG_R50_CALIBRATION",
              "GE_TXG_OFFSET_CALIBRATION",
              "GE_TXG_AMP_CALIBRATION",
          ):
              assert "case " + command + ":" in handler, command
          dispatch = driver.split("case RAETH_EPHY_IOCTL:", 1)[1].split(
              "default:", 1
          )[0]
          assert "ret = ephy_ioctl(dev, ifr, &ephy_data);" in dispatch
          print("Unknown EPHY ioctl commands return -EOPNOTSUPP to userspace: PASS")
          PY

      - name: Verify QDMA ioctl errors propagate to userspace
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path("trunk/linux-4.4.x/drivers/net/ethernet/raeth")
          driver = (root / "raether.c").read_text()
          qdma = (root / "raether_qdma.c").read_text()

          caller = driver.split("case RAETH_QDMA_IOCTL:", 1)[1].split(
              "case RAETH_EPHY_IOCTL:", 1
          )[0]
          assert "ret = ei_qdma_ioctl(dev, ifr, &qdma_data);" in caller
          assert "ei_qdma_ioctl(dev, ifr, &qdma_data);" not in caller.replace(
              "ret = ei_qdma_ioctl(dev, ifr, &qdma_data);", ""
          )

          handler = qdma.split("int ei_qdma_ioctl(", 1)[1]
          default = handler.split("default:", 1)[1].split("break;", 1)[0]
          assert "ret = -EOPNOTSUPP;" in default
          assert "ret = 1;" not in default
          assert "return ret;" in handler
          print("QDMA ioctl operation errors and unsupported commands reach userspace: PASS")
          PY

      - name: Compile and verify Clause 22 PHY address bounds
        run: |
          set -eu
          RAETH=trunk/linux-4.4.x/drivers/net/ethernet/raeth
          cc -std=gnu89 -Wall -Wextra -Werror -g \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            "$RAETH/tests/mii_mgr_phy_address_policy.c" \
            -o "$RUNNER_TEMP/mii_mgr_phy_address_policy"
          ASAN_OPTIONS=detect_leaks=1 UBSAN_OPTIONS=halt_on_error=1 \
            "$RUNNER_TEMP/mii_mgr_phy_address_policy"
          python3 - <<'PY'
          from pathlib import Path

          source = Path(
              "trunk/linux-4.4.x/drivers/net/ethernet/raeth/mii_mgr.c"
          ).read_text()
          policy = Path(
              "trunk/linux-4.4.x/drivers/net/ethernet/raeth/"
              "mii_mgr_phy_address_policy.h"
          ).read_text()
          test = Path(
              "trunk/linux-4.4.x/drivers/net/ethernet/raeth/tests/"
              "mii_mgr_phy_address_policy.c"
          ).read_text()

          read = source.split("u32 mii_mgr_read(u32 phy_addr", 1)[1].split(
              "EXPORT_SYMBOL(mii_mgr_read)", 1
          )[0]
          write = source.split("u32 mii_mgr_write(u32 phy_addr", 1)[1].split(
              "EXPORT_SYMBOL(mii_mgr_write)", 1
          )[0]
          read_address_guard = read.index(
              "if (mii_mgr_phy_address_status(phy_addr) != 0)"
          )
          read_indirect = read.index("if ((ei_local->architecture")
          read_indirect_reg = read.index(
              "mii_mgr_indirect_register_status(phy_register) != 0",

name: Switch CLI ioctl failure-status regression

on:
  push:
    paths:
      - "trunk/user/utils/src/switch/switch_gsw.c"
      - "trunk/user/utils/src/switch/Makefile"
      - ".github/workflows/switch-cli-stability.yml"
  pull_request:
    paths:
      - "trunk/user/utils/src/switch/switch_gsw.c"
      - "trunk/user/utils/src/switch/Makefile"
      - ".github/workflows/switch-cli-stability.yml"
  workflow_dispatch:

jobs:
  switch-cli-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check built switch CLI reports operational failures
        run: |
          python3 - <<'PY'
          from pathlib import Path

          makefile = Path("trunk/user/utils/src/switch/Makefile").read_text()
          source = Path("trunk/user/utils/src/switch/switch_gsw.c").read_text()
          lines = source.splitlines()

          # The MT7621 switch_gsw.c translation unit is wired into this target;
          # the legacy switch.c is not the production source.
          assert "SRC = switch_gsw.c" in makefile

          socket_failures = [
              i for i, line in enumerate(lines) if 'perror("socket");' in line
          ]
          assert len(socket_failures) == 1
          assert lines[socket_failures[0] + 1].strip() == "exit(EXIT_FAILURE);"

          ioctl_failures = [
              i for i, line in enumerate(lines) if 'perror("ioctl");' in line
          ]
          assert len(ioctl_failures) == 7, (
              f"expected 7 ioctl failure branches, got {len(ioctl_failures)}"
          )
          for index in ioctl_failures:
              assert lines[index + 1].strip() == "close(esw_fd);"
              assert lines[index + 2].strip() == "exit(EXIT_FAILURE);"

          # Operational errors fail the process; ordinary usage/help remains 0.
          assert source.count("exit(EXIT_FAILURE);") == 8
          assert source.count("exit(0);") == 1
          assert "switch_fini();\n\texit(0);" in source
          print("switch_gsw operational socket/ioctl failures return failure status: OK")
          PY

name: wsdd2 bounded HTTP framing regression

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/wsdd2-http-framing-regression.yml"
      - "trunk/user/wsdd2/src/wsd.c"
      - "trunk/user/wsdd2/src/wsd_http_header_policy.h"
      - "trunk/user/wsdd2/src/tests/wsd_http_header_policy_test.c"
      - "scripts/test_wsdd2_http_framing.sh"
      - "scripts/check_wsdd2_http_framing.py"
  pull_request:
    paths:
      - ".github/workflows/wsdd2-http-framing-regression.yml"
      - "trunk/user/wsdd2/src/wsd.c"
      - "trunk/user/wsdd2/src/wsd_http_header_policy.h"
      - "trunk/user/wsdd2/src/tests/wsd_http_header_policy_test.c"
      - "scripts/test_wsdd2_http_framing.sh"
      - "scripts/check_wsdd2_http_framing.py"

permissions:
  contents: read

jobs:
  http-framing:
    name: WSD HTTP request framing and bounded reads
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run GNU99 ASan/UBSan socket regression and source contract
        run: sh scripts/test_wsdd2_http_framing.sh
